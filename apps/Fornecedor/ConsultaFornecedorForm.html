<!DOCTYPE html>
<html>
  <head>
    <?!=Chamar("ConsultaFornecedorFormCSS") ?>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Fornecedor</title>  
  </head>

    <main class="main-container">
      <section class="card">

        <form autocomplete="off" onsubmit="return false;">

            <!-- FILTRO CNPJ -->
            <div class="field">
              <label class="field__label">CNPJ</label>
              <div class="search-wrapper" id="CNPJWrapper">
                <span class="search-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                </span>
                <input class="search-input" type="text" id="CNPJSearch" placeholder="Digite o CNPJ..." autocomplete="off">
                <div class="search-dropdown" id="CNPJDropdown"></div>
              </div>
            </div>

            <!-- FILTRO RAZÃO SOCIAL -->
            <div class="field">
              <label class="field__label">Razão Social</label>
              <div class="search-wrapper" id="razaoSocialWrapper">
                <span class="search-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                </span>
                <input class="search-input" type="text" id="razaoSocialSearch" placeholder="Digite a Razão Social..." autocomplete="off">
                <div class="search-dropdown" id="razaoSocialDropdown"></div>

              </div>
            </div>

            <!-- FILTRO NOME FANTASIA -->
            <div class="field">
              <label class="field__label">Nome Fantasia</label>
              <div class="search-wrapper" id="nomeFantasiaWrapper">
                <span class="search-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                </span>
                <input class="search-input" type="text" id="nomeFantasiaSearch" placeholder="Digite o Nome Fantasia..." autocomplete="off">
                <div class="search-dropdown" id="nomeFantasiaDropdown"></div>  
              </div>
            </div>

            <!-- FILTRO CIDADE -->
            <div class="field">
              <label class="field__label">Cidade</label>
              <div class="search-wrapper" id="cidadeWrapper">
                <span class="search-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                </span>
                <input class="search-input" type="text" id="cidadeSearch" placeholder="Selecione a Cidade..." autocomplete="off">
                <div class="search-dropdown" id="cidadeDropdown"></div>
              </div>
            </div>

          </div> <!-- FIM DO .filters-primary -->
        
          <!-- BOTÕES DE AÇÃO -->
          <div class="actions-bar">
            <button type="button" class="btn-secondary" onclick="limparFiltros()">Limpar</button>
            <button type="button" class="btn-success" onclick="adicionarFornecedor()">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              Adicionar
            </button>
            <button type="button" class="btn-primary" onclick="consultar()">

                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              Consultar
            </button>
          </div> 
        </form>

        <!-- TABELA -->
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th onclick="ordenar('cnpj')">CNPJ <span class="sort-arrow"></span></th>
                <th onclick="ordenar('razaoSocial')">RAZÃO SOCIAL <span class="sort-arrow"></span></th>
                <th onclick="ordenar('nomeFantasia')">NOME FANTASIA <span class="sort-arrow"></span></th>
                <th onclick="ordenar('cidade')">CIDADE <span class="sort-arrow"></span></th>

        <h3>Confirmar Exclusão</h3>
        <p>Tem certeza que deseja excluir este fornecedor? Esta ação não pode ser desfeita.</p>
        <div class="modal-actions">
          <button class="btn-secondary" onclick="fecharModalExclusao()" style="width:auto;">Cancelar</button>
          <button class="btn-danger" onclick="executarExclusao()">Sim, Excluir</button>
        </div>
      </div>
    </div>
