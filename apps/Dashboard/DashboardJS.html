// Gera preventivas mensais — cada equipamento tem UM evento por mês
function gerarPreventivasMensais() {
  const hoje = new Date();
  const ano = hoje.getFullYear();
  const mes = hoje.getMonth();
  const eventos = [];

  equipamentosMock.forEach(eq => {
    const dia = (eq.id * 7 % 20) + 1;
    const data = new Date(ano, mes, dia);
    const diff = Math.floor((data - hoje) / (1000 * 60 * 60 * 24));
    
    let status, statusClass;
    if (diff < 0) {
      status = 'Vencida';
      statusClass = 'pill-red';
    } else if (diff <= 5) {
      status = 'Programada';
      statusClass = 'pill-amber';
    } else {
      status = 'Agendada';
      statusClass = 'pill-green';
    }

    eventos.push({
      equipamento: eq.nome,
      patrimonio: eq.patrimonio,
      data: data,
      dataStr: data.toLocaleDateString('pt-BR'),
      status: status,
      statusClass: statusClass,
      diasRestantes: diff,
      equipamentoId: eq.id
    });
  });

  eventos.sort((a, b) => a.data - b.data);
  return eventos;
}

// Gera preventivas anuais — cada equipamento uma vez no ano
function gerarAnuais() {
  const hoje = new Date();
  const ano = hoje.getFullYear();
  const eventos = [];
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                 'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  equipamentosMock.forEach(eq => {
    const mes = ((eq.id * 3) % 12);
    const dia = ((eq.id * 11) % 28) + 1;
    let data = new Date(ano, mes, dia);
    if (data < hoje) data = new Date(ano + 1, mes, dia);

    const diff = Math.floor((data - hoje) / (1000 * 60 * 60 * 24));
    let status, statusClass;
    if (diff <= 30) { status = 'Urgente'; statusClass = 'pill-red'; }
    else if (diff <= 90) { status = 'Próximo'; statusClass = 'pill-amber'; }
    else { status = 'Programado'; statusClass = 'pill-green'; }

    eventos.push({
      equipamento: eq.nome,
      patrimonio: eq.patrimonio,
      data: data,
      dataStr: data.toLocaleDateString('pt-BR'),
      mes: meses[mes],
      status: status,
      statusClass: statusClass,
      diasRestantes: diff,
      equipamentoId: eq.id
    });
  });

  eventos.sort((a, b) => a.data - b.data);
  return eventos;
}

        </div>
        <span class="metric-label">Total Equipamentos</span>
      </div>
      <div class="metric-value">${totalEquip}</div>
      <div class="metric-sub">cadastrados</div>
    </div>

    <div class="metric-card">
      <div class="metric-header">
        <div class="metric-icon icon-amber">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <span class="metric-label">Preventivas Mensais</span>
      </div>
      <div class="metric-value">${programadas}</div>
      <div class="metric-sub ${vencidas > 0 ? 'alerta' : 'ok'}">${vencidas} vencida(s) este mês</div>
    </div>

    <div class="metric-card">
      <div class="metric-header">
        <div class="metric-icon icon-red">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <span class="metric-label">Anuais Urgentes</span>
      </div>
      <div class="metric-value">${anuaisAgora}</div>
      <div class="metric-sub atencao">${anuaisPendentes} pendentes no total</div>
    </div>

    <div class="metric-card">
      <div class="metric-header">
        <div class="metric-icon icon-green">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
        <span class="metric-label">Equipamentos OK</span>
      </div>
      <div class="metric-value">${totalEquip - vencidas}</div>
      <div class="metric-sub ${vencidas > 0 ? 'alerta' : 'ok'}">${vencidas} com pendência</div>
    </div>
  `;

  // ---- Tabela Mensais ----
  document.getElementById('badgeMensal').textContent = `${programadas} pendentes`;

  const bodyMensais = document.getElementById('bodyMensais');
  if (mensais.length === 0) {
    bodyMensais.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:2rem;">Nenhuma preventiva mensal encontrada.</td></tr>';
  } else {
    bodyMensais.innerHTML = mensais.map(m => `
      <tr>
        <td><strong>${m.equipamento}</strong></td>
        <td>${m.patrimonio}</td>
        <td>${m.dataStr}</td>
        <td><span class="status-pill ${m.statusClass}"><span class="dot ${m.statusClass.replace('pill-','dot-')}"></span>${m.status}</span></td>
        <td>
          <button class="btn-small" onclick="verDetalhes(${m.equipamentoId})">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:0.75rem;height:0.75rem;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Detalhes
          </button>
        </td>
      </tr>
    `).join('');
  }

  // ---- Lista Anuais Pendentes ----
  const anuaisProximos = anuais.filter(a => a.diasRestantes <= 365);
  document.getElementById('badgeAnuais').textContent = `${anuaisProximos.length} equipamentos`;

  const listaAnuais = document.getElementById('listaAnuais');
  if (anuaisProximos.length === 0) {
    listaAnuais.innerHTML = `
      <div class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        <p>Nenhuma manutenção anual pendente.</p>
      </div>`;
  } else {
    listaAnuais.innerHTML = anuaisProximos.slice(0, 8).map(a => {
      const dataClass = a.diasRestantes <= 30 ? '' : a.diasRestantes <= 90 ? 'atencao' : 'ok';
      return `
        <div class="equip-item">
          <div class="equip-item-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          </div>
          <div class="equip-item-info">
            <div class="equip-item-name">${a.equipamento}</div>
            <div class="equip-item-detail">${a.patrimonio} · ${a.mes}</div>
          </div>
          <div class="equip-item-date ${dataClass}">${a.dataStr}</div>
        </div>
      `;
    }).join('');

    if (anuaisProximos.length > 8) {
      listaAnuais.innerHTML += `<div style="text-align:center;padding-top:0.75rem;font-size:0.8125rem;font-weight:600;color:#3b82f6;cursor:pointer;" onclick="verTodasAnuais()">+${anuaisProximos.length - 8} equipamentos</div>`;
    }
  }

  // ---- Próximas 30 dias ----
  const proximas30 = mensais.filter(m => m.diasRestantes >= 0 && m.diasRestantes <= 30)
    .concat(anuais.filter(a => a.diasRestantes >= 0 && a.diasRestantes <= 30))

    .slice(0, 10);

  } else {

      <tr>
        <td><strong>${p.dataStr}</strong></td>
        <td>${p.equipamento}</td>
        <td>${p.data.getFullYear ? 'Mensal' : 'Anual'}</td>
        <td>${p.status === 'Agendada' || p.status === 'Programado' ? 'Técnico Responsável' : '—'}</td>
      </tr>

  }

  // ---- Resumo por Status ----
  const emDia = mensais.filter(m => m.status === 'Agendada').length +
    anuais.filter(a => a.diasRestantes > 90).length;

  const atencao = mensais.filter(m => m.status === 'Programada').length +
    anuais.filter(a => a.diasRestantes <= 90 && a.diasRestantes > 30).length;

  const urgente = mensais.filter(m => m.status === 'Vencida').length +
    anuais.filter(a => a.diasRestantes > 0 && a.diasRestantes <= 30).length;

  const total = emDia + atencao + urgente;

  document.getElementById('badgeStatus').textContent = `total: ${total}`;

  const pct = (v) => total > 0 ? ((v / total) * 100).toFixed(0) + '%' : '0%';

  document.getElementById('bodyStatus').innerHTML = `
    <tr><td><span class="status-pill pill-green"><span class="dot dot-green"></span>Em Dia</span></td><td><strong>${emDia}</strong></td><td>${pct(emDia)}</td></tr>
    <tr><td><span class="status-pill pill-amber"><span class="dot dot-amber"></span>Atenção</span></td><td><strong>${atencao}</strong></td><td>${pct(atencao)}</td></tr>
    <tr><td><span class="status-pill pill-red"><span class="dot dot-red"></span>Urgente/Vencido</span></td><td><strong>${urgente}</strong></td><td>${pct(urgente)}</td></tr>
  `;

  // Mini gráfico de barras
  const maxVal = Math.max(emDia, atencao, urgente, 1);
  document.getElementById('miniChart').innerHTML = `
    <div class="mini-bar bar-green" style="height:${(emDia/maxVal)*100}%;" title="Em Dia: ${emDia}"></div>
    <div class="mini-bar bar-amber" style="height:${(atencao/maxVal)*100}%;" title="Atenção: ${atencao}"></div>
    <div class="mini-bar bar-red" style="height:${(urgente/maxVal)*100}%;" title="Urgente: ${urgente}"></div>
  `;
}

function verDetalhes(id) {
  const eq = equipamentosMock.find(e => e.id === id);
  if (!eq) return;

  document.getElementById('modalTitulo').textContent = eq.nome;

  const mensais = gerarPreventivasMensais().filter(m => m.equipamentoId === id);
  const anuais = gerarAnuais().filter(a => a.equipamentoId === id);

  document.getElementById('modalBody').innerHTML = `
    <div style="margin-bottom:1rem;">
      <p style="margin-bottom:0.25rem;"><strong>Patrimônio:</strong> ${eq.patrimonio}</p>
      <p style="margin-bottom:0.25rem;"><strong>Marca:</strong> ${eq.marca}</p>
      <p style="margin-bottom:0.25rem;"><strong>Localização:</strong> ${eq.localizacao}</p>
    </div>
    <h4 style="font-size:0.875rem;font-weight:700;margin-bottom:0.5rem;color:#334155;">Últimas Preventivas Mensais</h4>
    <table>
      <thead><tr><th>Data</th><th>Status</th></tr></thead>
      <tbody>
        ${mensais.slice(0, 5).map(m => `
          <tr><td>${m.dataStr}</td><td><span class="status-pill ${m.statusClass}"><span class="dot ${m.statusClass.replace('pill-','dot-')}"></span>${m.status}</span></td></tr>
        `).join('')}
      </tbody>
    </table>
    <h4 style="font-size:0.875rem;font-weight:700;margin:1rem 0 0.5rem;color:#334155;">Anual</h4>
    <table>
      <thead><tr><th>Data</th><th>Status</th></tr></thead>
      <tbody>
        ${anuais.slice(0, 3).map(a => `
          <tr><td>${a.dataStr}</td><td><span class="status-pill ${a.statusClass}"><span class="dot ${a.statusClass.replace('pill-','dot-')}"></span>${a.status}</span></td></tr>
        `).join('')}
      </tbody>
    </table>
  `;

  document.getElementById('modalDetalhes').classList.add('aberto');
}

function fecharModal() {
  document.getElementById('modalDetalhes').classList.remove('aberto');
}

function verTodasAnuais() {
  const anuais = gerarAnuais().filter(a => a.diasRestantes <= 365);
  document.getElementById('modalTitulo').textContent = 'Todas as Anuais Pendentes';

  document.getElementById('modalBody').innerHTML = `
    <table>
      <thead><tr><th>Equipamento</th><th>Pat.</th><th>Data</th><th>Status</th></tr></thead>
      <tbody>
        ${anuais.slice(0, 20).map(a => `
          <tr><td>${a.equipamento}</td><td>${a.patrimonio}</td><td>${a.dataStr}</td><td><span class="status-pill ${a.statusClass}"><span class="dot ${a.statusClass.replace('pill-','dot-')}"></span>${a.status}</span></td></tr>
        `).join('')}
      </tbody>
    </table>
    ${anuais.length > 20 ? `<p style="margin-top:0.75rem;text-align:center;color:#94a3b8;font-size:0.8125rem;">Mostrando 20 de ${anuais.length} equipamentos</p>` : ''}
  `;

  document.getElementById('modalDetalhes').classList.add('aberto');
}

document.addEventListener('click', (e) => {

});

  if (e.key === 'Escape') document.getElementById('modalDetalhes').classList.remove('aberto');
});
