<script>
// Ligada pelo Cadastro (salvarChamado) logo antes de voltar pra essa tela
// depois de criar/editar um chamado -- assim, só nesse caso específico, a
// consulta roda sozinha de novo (pra já mostrar o resultado atualizado),
// sem voltar a carregar sozinha sempre que alguém só navega pra essa tela.
let forcarConsultaAoAbrirChamados = false;

async function renderConsultaChamados() {
    const motivos = await carregarMotivosChamado();
    initSearchChamado('motivoChamadoSearch', 'motivoChamadoDropdown', 'motivoChamadoWrapper', motivos);

    if (forcarConsultaAoAbrirChamados) {
        forcarConsultaAoAbrirChamados = false;
        consultarChamados();
        return;
    }

    const resumo = document.getElementById('resumoChamados');
    if (resumo) resumo.textContent = '';
}

async function carregarMotivosChamado() {
try {
    const res = await runServerFunction('buscarMotivosUnicosChamado');
    return Array.isArray(res) ? res : [];
} catch (error) {
    console.error('Erro ao buscar motivos de chamado:', error);
    return [];
}
}

function consultarChamados() {
    const equipamento = document.getElementById('filtro-chamado-equipamento').value.trim();
    const motivo = document.getElementById('motivoChamadoSearch').value.trim();
    const tipo = document.getElementById('filtro-chamado-tipo').value.trim();
    const prioridade = document.getElementById('filtro-chamado-prioridade').value.trim();
    const status = document.getElementById('filtro-chamado-status').value.trim();
    
    const criterios = {
        equipamento: equipamento,
        motivo: motivo,
        tipo: tipo,
        prioridade: prioridade,
        status: status
    };

    console.log('Criterios de busca:', criterios);

    mostrarCarregandoChamados(true);

    google.script.run
        .withSuccessHandler((objChamados) => {
            mostrarCarregandoChamados(false);
            console.log('Resposta bruta do servidor:', objChamados);
            console.log('Quantidade de chamados recebidos:', Array.isArray(objChamados) ? objChamados.length : 'não é array');
            ReturnChamados(objChamados);
        })
        .withFailureHandler((error) => {
            mostrarCarregandoChamados(false);
            console.error('Erro ao consultar chamados:', error);
            alert('Erro ao consultar chamados: ' + (error.message || error));
        })
        .filtrarChamados(criterios);
}

function mostrarCarregandoChamados(carregando) {
    const btn = document.getElementById('btnConsultarChamados');
    if (btn) btn.disabled = carregando;

    if (carregando) {
        const tbody = document.getElementById('chamadosTableBody');
        if (tbody) {
            tbody.innerHTML = '<tr class="loading-row"><td colspan="10"><span class="spinner"></span>Buscando chamados...</td></tr>';
        }
    }
}

let chamados = [];
let sortStateChamado = { coluna: null, direcao: 'asc' };

function ReturnChamados(objChamados) {
    chamados = Array.isArray(objChamados) ? objChamados : [];
    renderTabelaChamados(aplicarOrdenacaoChamado(chamados));
    atualizarResumoChamados(chamados);
}

// ===== RESUMO DA BUSCA (total + por status) =====
function atualizarResumoChamados(lista) {
    const resumo = document.getElementById('resumoChamados');
    if (!resumo) return;

    if (!Array.isArray(lista) || lista.length === 0) {
        resumo.textContent = 'Nenhum chamado encontrado.';
        return;
    }

    let abertos = 0, emAndamento = 0, fechados = 0;
    lista.forEach(f => {
        const status = String(f.status || '').trim().toLowerCase();
        if (status === 'aberto') abertos++;
        else if (status === 'em andamento') emAndamento++;
        else if (f.desativado) fechados++;
    });

    resumo.textContent = `${lista.length} chamado${lista.length === 1 ? '' : 's'} encontrado${lista.length === 1 ? '' : 's'} — ${abertos} aberto${abertos === 1 ? '' : 's'}, ${emAndamento} em andamento, ${fechados} fechado${fechados === 1 ? '' : 's'}/cancelado${fechados === 1 ? '' : 's'}`;
}

// ===== ORDENAÇÃO POR COLUNA (clicar no cabeçalho) =====
function ordenarChamado(coluna) {
    if (sortStateChamado.coluna === coluna) {
        sortStateChamado.direcao = sortStateChamado.direcao === 'asc' ? 'desc' : 'asc';
    } else {
        sortStateChamado.coluna = coluna;
        sortStateChamado.direcao = 'asc';
    }
    atualizarIndicadoresChamado();
    renderTabelaChamados(aplicarOrdenacaoChamado(chamados));
}

function atualizarIndicadoresChamado() {
    const ths = document.querySelectorAll('#page-chamado-view .data-table th');
    ths.forEach(th => {
        th.classList.remove('sorted');
        const span = th.querySelector('.sort-arrow');
        if (span) span.textContent = '';
    });

    const indices = { equipamento: 1, localizacao: 2, motivo: 3, tipo: 4, prioridade: 5, status: 6, atribuidoA: 7, dataAbertura: 8 };
    const idx = indices[sortStateChamado.coluna];
    if (idx !== undefined && ths[idx]) {
        ths[idx].classList.add('sorted');
        const span = ths[idx].querySelector('.sort-arrow');
        if (span) span.textContent = sortStateChamado.direcao === 'asc' ? '▲' : '▼';
    }
}

// Prioridade não ordena por alfabeto (Alta, Baixa, Média, Urgente) -- ordena
// pela gravidade de verdade (Baixa < Média < Alta < Urgente).
const CHAMADO_PRIORIDADE_RANK = { baixa: 1, media: 2, alta: 3, urgente: 4 };

function aplicarOrdenacaoChamado(lista) {
    if (!sortStateChamado.coluna || !Array.isArray(lista)) return lista;
    const col = sortStateChamado.coluna;
    const dir = sortStateChamado.direcao === 'asc' ? 1 : -1;
    const arr = lista.slice();
    arr.sort((a, b) => {
        let va, vb;
        if (col === 'prioridade') {
            va = CHAMADO_PRIORIDADE_RANK[String(a[col] || '').trim().toLowerCase()] || 0;
            vb = CHAMADO_PRIORIDADE_RANK[String(b[col] || '').trim().toLowerCase()] || 0;
        } else {
            va = String(a[col] || '').toLowerCase();
            vb = String(b[col] || '').toLowerCase();
        }
        return va < vb ? -1 * dir : va > vb ? 1 * dir : 0;
    });
    return arr;
}

function limparFiltrosChamado() {
    document.getElementById('filtro-chamado-equipamento').value = '';
    document.getElementById('motivoChamadoSearch').value = '';
    document.getElementById('filtro-chamado-tipo').value = '';
    document.getElementById('filtro-chamado-prioridade').value = '';
    document.getElementById('filtro-chamado-status').value = '';
    sortStateChamado = { coluna: null, direcao: 'asc' };
    consultarChamados();
}

function renderTabelaChamados(lista) {
    const tbody = document.getElementById('chamadosTableBody');
    if (!tbody) return;

    tbody.innerHTML = '';

    if(!lista || lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;">Nenhum chamado encontrado.</td></tr>';
        return;
    }

    lista.forEach(f => {
        const tr = document.createElement('tr');
        if (f.desativado) tr.classList.add('linha-desativada');

        const btnEditar = f.desativado 
        ? '<button class="btn-acao btn-editar-linha" title="Editar" disabled style="opacity:0.3; cursor:not-allowed;">✏️</button>'
        : `<button class="btn-acao btn-editar-linha" title="Editar" onclick="editarChamado('${f.id}')">✏️</button>`;

        const btnExcluir = f.desativado
        ? `<button class="btn-acao btn-reativar-linha" title="Reativar" onclick="reativarChamadoUI('${f.id}')">♻️</button>`
        : `<button class="btn-acao btn-excluir-linha" title="Desativar" onclick="confirmarExclusaoChamado('${f.id}')">🗑️</button>`;
        
        const btnVer = `<button class="btn-acao btn-ver-linha" title="Ver detalhes" onclick="abrirDetalhesChamado('${f.id}')">👁️</button>`;

        tr.innerHTML = `
        <td class="acao-cell">${btnVer}</td>
        <td>${f.equipamento ? escapeHtml(f.equipamento) : '--'}</td>
        <td>${f.localizacao ? escapeHtml(f.localizacao) : '--'}</td>
        <td>${escapeHtml(f.motivo)}</td>
        <td>${escapeHtml(f.tipo)}</td>
        <td>${montarBadgePrioridadeChamado(f.prioridade)}</td>
        <td>${escapeHtml(f.status)}</td>
        <td>${escapeHtml(f.atribuidoA)}</td>
        <td>${escapeHtml(f.dataAbertura)}</td>
        <td class="acao-cell">
            ${btnEditar}
            ${btnExcluir}
        </td>
        `;
        tbody.appendChild(tr);
    });
}

// ===== BADGE COLORIDO DE PRIORIDADE (mesmo padrão do garantia-badge de Peças) =====
function montarBadgePrioridadeChamado(prioridade) {
    const chave = String(prioridade || '').trim().toLowerCase();
    const rotulos = { baixa: 'Baixa', media: 'Média', alta: 'Alta', urgente: 'Urgente' };
    const texto = rotulos[chave] || (prioridade || '--');
    if (!chave) return '--';
    return `<span class="prioridade-badge ${chave}">${escapeHtml(texto)}</span>`;
}

// ===== DETALHES DO CHAMADO (botão "olho" -- abre modal com abas
// "Informações do Chamado" (todas as colunas de tbl_chamados, incluindo
// Relatório/Nota Fiscal quando existirem) e "Histórico" (linha do tempo de
// tbl_chamado_historico + adicionar anotação) =====
let chamadoIdAtualModal = null;
let anotacaoEditandoId = null;
let historicoChamadoAtual = [];

async function abrirDetalhesChamado(chamadoId) {
    chamadoIdAtualModal = chamadoId;

    const conteudo = document.getElementById('detalheChamadoConteudo');
    if (conteudo) conteudo.innerHTML = '<p>Carregando...</p>';

    const tituloEl = document.getElementById('detalheChamadoIdTitulo');
    if (tituloEl) tituloEl.textContent = '#' + chamadoId;

    const novaAnotacaoEl = document.getElementById('novaAnotacaoChamado');
    if (novaAnotacaoEl) novaAnotacaoEl.value = '';
    
    anotacaoEditandoId = null;
    const textoBotaoEl = document.getElementById('textoBotaoSalvarAnotacao');
    if (textoBotaoEl) textoBotaoEl.textContent = 'Adicionar';
    const btnDescartarEl = document.getElementById('descatarEdicaoAnotacao');
    if (btnDescartarEl) btnDescartarEl.style.display = 'none';

    ajustarTamanhoModalChamado();
    trocarAbaModalChamado('info');
    if (typeof exibirModal === 'function') exibirModal('modalDetalheChamado');

    try {
        const resposta = await runServerFunction('buscarChamadoDetalhado', chamadoId);
        if (!resposta || resposta.sucesso === false) {
            if (conteudo) conteudo.innerHTML = `<p>${escapeHtml(resposta ? resposta.mensagem : 'Chamado não encontrado.')}</p>`;
            return;
        }
        if (conteudo) conteudo.innerHTML = montarDetalheChamadoHtml(resposta.chamado);

        const botoesStatus = document.getElementById('detalheChamadoStatusBotoes');
        if (botoesStatus) botoesStatus.innerHTML = montarBotoesStatusChamado(resposta.chamado.status);
    } catch (error) {
        console.error('[detalhe] ERRO ao buscar detalhes do chamado:', error);
        if (conteudo) conteudo.innerHTML = '<p>Erro ao buscar detalhes do chamado.</p>';
    }

    carregarHistoricoChamadoUI(chamadoId);
}

// Alterna entre as abas "Informações do Chamado" e "Histórico" dentro do
// modal. A visibilidade é controlada por style inline (painelX.style.display),
// não por classe CSS -- isso porque esse projeto tem várias cópias
// conflitantes de ".modal"/".tab-panel" espalhadas em vários arquivos CSS
// (uma delas ganhava a disputa de especificidade e escondia tudo, mesmo com
// a classe "active" certa). style inline sempre vence qualquer CSS externo,
// então essa parte não depende mais de qual arquivo CSS foi colado por
// último no Apps Script.
function trocarAbaModalChamado(aba) {
    const btnInfo = document.getElementById('tabBtnInfoChamado');
    const btnHistorico = document.getElementById('tabBtnHistoricoChamado');
    const painelInfo = document.getElementById('tabPanelInfoChamado');
    const painelHistorico = document.getElementById('tabPanelHistoricoChamado');

    const mostrarInfo = aba === 'info';

    if (btnInfo) btnInfo.classList.toggle('active', mostrarInfo);
    if (btnHistorico) btnHistorico.classList.toggle('active', !mostrarInfo);

    // Reaplica TODO o estilo do painel a cada troca (não só a primeira vez)
    // -- assim não existe um estado anterior "certo" que dependa de nunca
    // ter sido tocado; toda troca de aba deixa tudo do jeito certo de novo.
    aplicarEstiloPainelModalChamado(painelInfo, mostrarInfo);
    aplicarEstiloPainelModalChamado(painelHistorico, !mostrarInfo);

    const conteudoInfo = document.getElementById('detalheChamadoConteudo');
    if (conteudoInfo) {
        conteudoInfo.style.flex = '1 1 auto';
        conteudoInfo.style.minHeight = '0';
        conteudoInfo.style.overflowY = 'auto';
    }
    const botoesStatus = document.getElementById('detalheChamadoStatusBotoes');
    if (botoesStatus) botoesStatus.style.flexShrink = '0';

    const formNovaAnotacao = document.querySelector('.chamado-historico-nova');
    if (formNovaAnotacao) formNovaAnotacao.style.flexShrink = '0';
    const listaHistorico = document.getElementById('historicoChamadoLista');
    if (listaHistorico) {
        listaHistorico.style.flex = '1 1 auto';
        listaHistorico.style.minHeight = '0';
        listaHistorico.style.overflowY = 'auto';
    }
}

// Um painel de aba (Informações ou Histórico) é, ele mesmo, um flex-item
// dentro do modal E um flex-container pro que tem dentro dele (conteúdo
// rolável + parte fixa embaixo/em cima). "flex: 1 1 auto" nele mesmo é o
// que garante que ele ocupa o espaço que sobra no modal de forma
// previsível -- sem isso, o navegador decide o tamanho dele só pelo
// conteúdo, o que gerava o efeito de "perder o tamanho certo" ao voltar
// pra essa aba.
function aplicarEstiloPainelModalChamado(painel, visivel) {
    if (!painel) return;
    painel.classList.toggle('active', visivel);
    painel.style.display = visivel ? 'flex' : 'none';
    painel.style.flexDirection = 'column';
    painel.style.flex = '1 1 auto';
    painel.style.minHeight = '0';
    painel.style.overflow = 'hidden';
}

// Trava a largura/altura do modal via style inline (mesma razão do
// trocarAbaModalChamado acima) -- assim ele sempre abre largo e com altura
// fixa, sem depender do CSS externo carregar certo.
function ajustarTamanhoModalChamado() {
    const caixa = document.getElementById('modalDetalheChamadoBox');
    if (!caixa) return;

    caixa.style.width = '92vw';
    caixa.style.maxWidth = '75rem';
    caixa.style.height = '85vh';
    caixa.style.maxHeight = '85vh';
    caixa.style.display = 'flex';
    caixa.style.flexDirection = 'column';
    caixa.style.overflow = 'hidden';

    const cabecalho = caixa.querySelector('.detalhe-chamado-cabecalho');
    if (cabecalho) cabecalho.style.flexShrink = '0';

    const abasNav = caixa.querySelector('.tabs-nav');
    if (abasNav) abasNav.style.flexShrink = '0';
}

async function carregarHistoricoChamadoUI(chamadoId) {
    const lista = document.getElementById('historicoChamadoLista');
    if (lista) lista.innerHTML = '<p>Carregando...</p>';

    try {
        const historico = await runServerFunction('buscarHistoricoChamado', chamadoId);
        historicoChamadoAtual = historico;
        if (lista) lista.innerHTML = montarHistoricoChamadoHtml(historico);
    } catch (error) {
        console.error('Erro ao buscar histórico do chamado:', error);
        if (lista) lista.innerHTML = '<p>Erro ao buscar histórico.</p>';
    }
}

// Cores por tipo -- inline de propósito (não em CSS externo), já que esse
// projeto tem vários arquivos CSS duplicados/conflitantes que já causaram
// bug de estilo não aplicar antes. 'anotacao' (manual) = azulado + botão de
// excluir; 'sistema' (automático, imutável) = neutro; 'alerta' (chamado
// desativado) = vermelho.
function montarHistoricoChamadoHtml(lista) {
    if (!Array.isArray(lista) || lista.length === 0) {
        return '<p>Nenhuma movimentação registrada ainda.</p>';
    }

    return lista.map(item => {
        let corFundo = 'var(--color-slate-50, #f8fafc)';
        let corBorda = 'var(--color-slate-200, #e2e8f0)';
        if (item.tipo === 'anotacao') {
            corFundo = '#eef2ff';
            corBorda = '#c7d2fe';
        } else if (item.tipo === 'alerta') {
            corFundo = '#fee2e2';
            corBorda = '#fca5a5';
        }

        const botaoExcluir = item.tipo === 'anotacao'
            ? `<button type="button" title="Excluir anotação" onclick="excluirAnotacaoChamadoUI(${item.id})"
                style="border:none; background:transparent; cursor:pointer; color:#dc2626; font-size:0.8rem; padding:0;">✕</button>`
            : '';

        const botaoEditar = item.tipo === 'anotacao'
            ? `<button type="button" title="Editar anotação" onclick="iniciarEdicaoAnotacao(${item.id})"
                style="border:none; background:transparent; cursor:pointer; color:#2563eb; font-size:0.8rem; padding:0;">✎</button>`
            : '';

        return `
            <div class="chamado-historico-item" style="background:${corFundo}; border-color:${corBorda};">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem;">
                    <div class="chamado-historico-item-data">${escapeHtml(item.data)}</div>
                    <div style="display:flex; align-items:center; gap:0.5rem;">
                        ${botaoEditar}
                        ${botaoExcluir}
                    </div>
                </div>
                <div class="chamado-historico-item-texto">${escapeHtml(item.texto)}</div>
            </div>
        `;
    }).join('');
}

async function excluirAnotacaoChamadoUI(historicoId) {
    if (!confirm('Excluir essa anotação?')) return;

    try {
        const resposta = await runServerFunction('excluirAnotacaoChamado', historicoId);
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        carregarHistoricoChamadoUI(chamadoIdAtualModal);
    } catch (error) {
        console.error('Erro ao excluir anotação:', error);
        alert('Erro ao excluir anotação.');
    }
}

async function adicionarAnotacaoChamadoUI() {
    if (!chamadoIdAtualModal) return;

    const textoEl = document.getElementById('novaAnotacaoChamado');
    const texto = textoEl ? textoEl.value.trim() : '';
    if (!texto) {
        alert('Escreva algo antes de adicionar.');
        return;
    }

    try {
        const resposta = await runServerFunction('adicionarAnotacaoChamado', chamadoIdAtualModal, texto);
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        const textoBotaoEl = document.getElementById('textoBotaoSalvarAnotacao');
        if (textoBotaoEl) textoBotaoEl.textContent = 'Adicionar';

        if (textoEl) textoEl.value = '';
        carregarHistoricoChamadoUI(chamadoIdAtualModal);
    } catch (error) {
        console.error('Erro ao adicionar anotação:', error);
        alert('Erro ao adicionar anotação.');
    }
}

async function editarAnotacaoChamadoUI(historicoId) {
    if (!historicoId) return;

    const textoEl = document.getElementById('novaAnotacaoChamado');
    const novoTexto = textoEl ? textoEl.value.trim() : '';
    if (!novoTexto) {
        alert('Escreva algo antes de salvar.');
        return;
    }

    try {
        const resposta = await runServerFunction('editarAnotacaoChamado', historicoId, novoTexto);
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        anotacaoEditandoId = null;
        const textoBotaoEl = document.getElementById('textoBotaoSalvarAnotacao');
        if (textoBotaoEl) textoBotaoEl.textContent = 'Adicionar';
        const btnDescartarEl = document.getElementById('descatarEdicaoAnotacao');
        if (btnDescartarEl) btnDescartarEl.style.display = 'none';

        if (textoEl) textoEl.value = '';
        carregarHistoricoChamadoUI(chamadoIdAtualModal);
    } catch (error) {
        console.error('Erro ao editar anotação:', error);
        alert('Erro ao editar anotação.');
    }
}

function iniciarEdicaoAnotacao(historicoId) {
    anotacaoEditandoId = historicoId;
    const item = historicoChamadoAtual.find(h => Number(h.id) === Number(historicoId));
    const textoEl = document.getElementById('novaAnotacaoChamado');
    if (textoEl && item) textoEl.value = item.texto;

    const textoBotaoEl = document.getElementById('textoBotaoSalvarAnotacao');
    if (textoBotaoEl) {
        textoBotaoEl.textContent = 'Salvar edição';
        textoBotaoEl.style.display = 'inline-block';
    }
    const btnDescartarEl = document.getElementById('descatarEdicaoAnotacao');
    if (btnDescartarEl) btnDescartarEl.style.display = 'inline-block';
}

async function salvarAnotacaoChamadoUI() {
    if (anotacaoEditandoId) {
        await editarAnotacaoChamadoUI(anotacaoEditandoId);
    } else {
        adicionarAnotacaoChamadoUI();
    }
    return
}

function cancelarEdicaoAnotacaoUI() {
    anotacaoEditandoId = null;
    const textoEl = document.getElementById('novaAnotacaoChamado');
    if (textoEl) textoEl.value = '';

    const textoBotaoEl = document.getElementById('textoBotaoSalvarAnotacao');
    if (textoBotaoEl) textoBotaoEl.textContent = 'Adicionar';
    const btnDescartarEl = document.getElementById('descatarEdicaoAnotacao');
    if (btnDescartarEl) btnDescartarEl.style.display = 'none';
}

function montarDetalheChamadoHtml(c) {
    const linha = (rotulo, valor) => `
        <div class="detalhe-chamado-linha">
            <span class="detalhe-chamado-rotulo">${rotulo}</span>
            <span class="detalhe-chamado-valor">${valor && String(valor).trim() ? escapeHtml(valor) : '--'}</span>
        </div>`;

    const linhaLink = (rotulo, url, texto) => `
        <div class="detalhe-chamado-linha">
            <span class="detalhe-chamado-rotulo">${rotulo}</span>
            <span class="detalhe-chamado-valor">${url ? `<a href="${url}" target="_blank" rel="noopener">${texto}</a>` : '--'}</span>
        </div>`;

    return `
        ${linha('Motivo', c.motivo)}
        ${linha('Tipo', c.tipo)}
        ${linha('Prioridade', c.prioridade)}
        ${linha('Status', c.status === 'Concluido' ? 'Concluído' : c.status)}
        ${linha('Equipamento', c.equipamento)}
        ${linha('Aberto por', c.abertoPor)}
        ${linha('Atribuído a', c.atribuidoA)}
        ${linha('Data de Abertura', c.dataAbertura)}
        ${linha('Data de Início do Atendimento', c.dataInicioAndamento)}
        ${linha('Data de Finalização', c.dataFinalizacao)}
        ${linha('Observação', c.observacao)}
        ${linhaLink('Relatório', c.relatorioUrl, 'Abrir relatório')}
        ${linhaLink('Nota Fiscal', c.notaFiscalUrl, 'Abrir nota fiscal')}
        ${linha('Última Alteração', c.dataAlteracao)}
    `;
}

// ===== STATUS DO CHAMADO (Aberto / Em Andamento / Concluído) =====
// "valor" é o que fica salvo na planilha e usado nas comparações (sem
// acento em "Concluido" de propósito, pra bater com o value="concluido" do
// filtro de Status e com o "=== 'concluido'" de filtrarChamados). "rotulo"
// é só o texto bonito mostrado pro usuário.
const CHAMADO_STATUS_OPCOES = [
    { valor: 'Aberto', rotulo: 'Aberto' },
    { valor: 'Em Andamento', rotulo: 'Em Andamento' },
    { valor: 'Concluido', rotulo: 'Concluído' }
];

// Cada status tem sua própria cor (mesma ideia dos badges de prioridade),
// em vez de todos ficarem cinza/roxo genérico -- fica mais fácil bater o
// olho e reconhecer o status sem precisar ler o texto do botão.
const CHAMADO_STATUS_CORES = {
    'Aberto': { bg: '#dbeafe', cor: '#1d4ed8', bgAtual: '#1d4ed8', borda: '#1d4ed8' },
    'Em Andamento': { bg: '#fef3c7', cor: '#92400e', bgAtual: '#b45309', borda: '#b45309' },
    'Concluido': { bg: '#dcfce7', cor: '#166534', bgAtual: '#15803d', borda: '#15803d' }
};

function montarBotoesStatusChamado(statusAtual) {
    const statusNormalizado = String(statusAtual || '').trim().toLowerCase();
    const estiloBase = 'width:auto; padding:0.625rem 1.25rem; border-radius:0.5rem; font-family:inherit; font-weight:600; font-size:0.875rem; cursor:pointer; border-width:0.0625rem; border-style:solid;';

    return `
        <div style="display:flex; gap:0.75rem; padding-top:1rem; margin-top:1rem; border-top:0.0625rem solid var(--color-slate-100, #f1f5f9);">
            ${CHAMADO_STATUS_OPCOES.map(opcao => {
                const ehAtual = opcao.valor.toLowerCase() === statusNormalizado;
                const cores = CHAMADO_STATUS_CORES[opcao.valor];
                const estilo = ehAtual
                    ? estiloBase + `background:${cores.bgAtual}; color:#fff; border-color:${cores.borda}; cursor:not-allowed; box-shadow: inset 0 0.1875rem 0.3rem rgba(0,0,0,0.4), inset 0 0.0625rem 0.125rem rgba(0,0,0,0.3); transform: translateY(0.0625rem);`
                    : estiloBase + `background:${cores.bg}; color:${cores.cor}; border-color:${cores.bg};`;
                return `<button type="button" style="${estilo}" ${ehAtual ? 'disabled' : ''}
                    onclick="alterarStatusChamadoUI('${opcao.valor}')">${opcao.rotulo}</button>`;
            }).join('')}
        </div>
    `;
}

async function alterarStatusChamadoUI(novoStatus) {
    if (!chamadoIdAtualModal) return;

    try {
        const resposta = await runServerFunction('alterarStatusChamado', chamadoIdAtualModal, novoStatus);
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        abrirDetalhesChamado(chamadoIdAtualModal);
        consultarChamados();
    } catch (error) {
        console.error('Erro ao alterar status do chamado:', error);
        alert('Erro ao alterar status do chamado.');
    }
}

// DESATIVAR / REATIVAR
let idChamadoExclusao = null;

function confirmarExclusaoChamado(id) {
    idChamadoExclusao = id;
    if (typeof exibirModal === 'function') exibirModal('modalExclusaoChamado');
}

async function executarExclusaoChamado() {
    if (!idChamadoExclusao) return;
    try {
        const resposta = await runServerFunction('desativarChamado', idChamadoExclusao);
        if (typeof fecharModal === 'function') fecharModal('modalExclusaoChamado');
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        consultarChamados();
    } catch (error) {
        console.error('Erro ao desativar chamado:', error);
        alert('Erro ao desativar chamado.');
    }
}

async function reativarChamadoUI(id) {
    try {
        const resposta = await runServerFunction('reativarChamado', id);
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        consultarChamados();
    } catch (error) {
        console.error('Erro ao reativar chamado:', error);
        alert('Erro ao reativar chamado.');
    }
}

// Leva pro Cadastro em modo edição (ele já sabe distinguir edição de
// criação pelo "id" recebido -- ver renderChamadoForm em CadastroChamadoFormJS).
function editarChamado(id) {
    if (typeof trocarPagina === 'function') {
        trocarPagina('chamado-form', id);
    }
}
