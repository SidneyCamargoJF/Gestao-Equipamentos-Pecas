<script>
// false na primeira visualização da tela (não dispara busca sozinha);
// vira true depois disso, então voltar de um salvar/editar já busca os
// dados atualizados automaticamente.
let chamadosJaVisualizado = false;

async function renderConsultaChamados() {
    mostrarBotaoGerarPreventivas();
    carregarContratosFiltroChamado();
    const motivos = await carregarMotivosChamado();
    initSearchChamado('motivoChamadoSearch', 'motivoChamadoDropdown', 'motivoChamadoWrapper', motivos);
    if (chamadosJaVisualizado) {
      consultarChamados();
    } else {
      chamadosJaVisualizado = true;
    }
}

// ===== FILTRO POR CONTRATO =====
async function carregarContratosFiltroChamado() {
    const select = document.getElementById('filtro-chamado-contrato');
    if (!select) return;
    try {
        const contratos = await runServerFunction('listarContratosParaFiltro');
        const atual = select.value;
        select.innerHTML = '<option value="">Todos</option>' + (contratos || []).map(c =>
            `<option value="${escapeHtml(String(c.id))}">${escapeHtml(c.numero)}${c.empresa ? ' — ' + escapeHtml(c.empresa) : ''}</option>`
        ).join('');
        select.value = atual;
    } catch (error) {
        console.error('Erro ao carregar contratos para o filtro:', error);
    }
}

// ===== GERAR PREVENTIVAS DO MÊS (admin) =====
async function mostrarBotaoGerarPreventivas() {
    const btn = document.getElementById('btnGerarPreventivas');
    if (!btn) return;
    try {
        btn.style.display = (await runServerFunction('usuarioEhAdmin')) ? '' : 'none';
    } catch (e) {
        btn.style.display = 'none';
    }
}

async function gerarPreventivasDoMesUI() {
    const hoje = new Date();
    const padrao = hoje.getFullYear() + '-' + String(hoje.getMonth() + 1).padStart(2, '0');
    const competencia = prompt('Gerar as preventivas de qual mês? (AAAA-MM)\nContratos que já têm o chamado do mês são pulados.', padrao);
    if (competencia === null) return;
    if (!/^\d{4}-\d{2}$/.test(competencia.trim())) {
        alert('Informe o mês no formato AAAA-MM (ex.: ' + padrao + ').');
        return;
    }

    const btn = document.getElementById('btnGerarPreventivas');
    if (btn) btn.disabled = true;
    if (typeof exibirModal === 'function') exibirModal('processando');
    try {
        const r = await runServerFunction('gerarPreventivasDoMesManual', competencia.trim());
        if (!r || r.sucesso === false) {
            alert((r && r.mensagem) || 'Não foi possível gerar as preventivas.');
            return;
        }
        const pulados = (r.detalhes || []).filter(d => d.situacao.indexOf('gerada:') !== 0);
        alert(r.mensagem + (pulados.length
            ? '\n\nContratos sem chamado novo:\n' + pulados.map(d => '• ' + d.numero + ': ' + d.situacao).join('\n')
            : ''));
        consultarChamados();
    } catch (error) {
        console.error('Erro ao gerar preventivas:', error);
        alert('Erro ao gerar preventivas: ' + (error.message || error));
    } finally {
        if (btn) btn.disabled = false;
        if (typeof fecharModal === 'function') fecharModal('processando');
    }
}

async function carregarMotivosChamado() {
try {
    const res = await runServerFunction('buscarMotivosUnicosChamado');
    return Array.isArray(res) ? res : [];
} catch (error) {
    console.error('Erro ao buscar motivos de chamado:', error);
    return [];
}
}

function consultarChamados() {
    const equipamento = document.getElementById('filtro-chamado-equipamento').value.trim();
    const motivo = document.getElementById('motivoChamadoSearch').value.trim();
    const tipo = document.getElementById('filtro-chamado-tipo').value.trim();
    const prioridade = document.getElementById('filtro-chamado-prioridade').value.trim();
    const status = document.getElementById('filtro-chamado-status').value.trim();

    const criterios = {
        equipamento: equipamento,
        motivo: motivo,
        tipo: tipo,
        prioridade: prioridade,
        status: status,
        contratoId: document.getElementById('filtro-chamado-contrato')?.value || '',
        origem: document.getElementById('filtro-chamado-origem')?.value || '',
        atrasados: document.getElementById('filtro-chamado-atrasados')?.value === '1'
    };

    mostrarCarregandoChamados(true);

    google.script.run
        .withSuccessHandler((objChamados) => {
            mostrarCarregandoChamados(false);
            ReturnChamados(objChamados);
        })
        .withFailureHandler((error) => {
            mostrarCarregandoChamados(false);
            console.error('Erro ao consultar chamados:', error);
            alert('Erro ao consultar chamados: ' + (error.message || error));
        })
        .filtrarChamados(criterios);
}

function mostrarCarregandoChamados(carregando) {
    const btn = document.getElementById('btnConsultarChamados');
    if (btn) btn.disabled = carregando;

    if (carregando) {
        const tbody = document.getElementById('chamadosTableBody');
        if (tbody) {
            tbody.innerHTML = '<div class="gtable-row gtable-loading-row" role="row"><div class="gtable-cell gtable-cell-full" role="cell"><span class="spinner"></span>Buscando chamados...</div></div>';
        }
    }
}

let chamados = [];
let sortStateChamado = { coluna: null, direcao: 'asc' };

function ReturnChamados(objChamados) {
    chamados = Array.isArray(objChamados) ? objChamados : [];
    renderTabelaChamados(aplicarOrdenacaoChamado(chamados));
    atualizarResumoChamados(chamados);
}

// ===== RESUMO DA BUSCA (total + por status) =====
function atualizarResumoChamados(lista) {
    const resumo = document.getElementById('resumoChamados');
    if (!resumo) return;

    if (!Array.isArray(lista) || lista.length === 0) {
        resumo.textContent = 'Nenhum chamado encontrado.';
        return;
    }

    let abertos = 0, emAndamento = 0, fechados = 0;
    lista.forEach(f => {
        const status = String(f.status || '').trim().toLowerCase();
        if (status === 'aberto') abertos++;
        else if (status === 'em andamento') emAndamento++;
        else if (f.desativado) fechados++;
    });

    resumo.textContent = `${lista.length} chamado${lista.length === 1 ? '' : 's'} encontrado${lista.length === 1 ? '' : 's'} — ${abertos} aberto${abertos === 1 ? '' : 's'}, ${emAndamento} em andamento, ${fechados} fechado${fechados === 1 ? '' : 's'}/cancelado${fechados === 1 ? '' : 's'}`;
}

// ===== ORDENAÇÃO POR COLUNA (clicar no cabeçalho) =====
function ordenarChamado(coluna) {
    if (sortStateChamado.coluna === coluna) {
        sortStateChamado.direcao = sortStateChamado.direcao === 'asc' ? 'desc' : 'asc';
    } else {
        sortStateChamado.coluna = coluna;
        sortStateChamado.direcao = 'asc';
    }
    atualizarIndicadoresChamado();
    renderTabelaChamados(aplicarOrdenacaoChamado(chamados));
}

function atualizarIndicadoresChamado() {
    const ths = document.querySelectorAll('#page-chamado-view .gtable-head .gtable-cell');
    ths.forEach(th => {
        th.classList.remove('sorted');
        const span = th.querySelector('.sort-arrow');
        if (span) span.textContent = '';
    });

    const indices = { id: 0, equipamento: 1, localizacao: 2, motivo: 3, tipo: 4, prioridade: 5, status: 6, atribuidoA: 7, dataAbertura: 8 };
    const idx = indices[sortStateChamado.coluna];
    if (idx !== undefined && ths[idx]) {
        ths[idx].classList.add('sorted');
        const span = ths[idx].querySelector('.sort-arrow');
        if (span) span.textContent = sortStateChamado.direcao === 'asc' ? '▲' : '▼';
    }
}

// Prioridade não ordena por alfabeto (Alta, Baixa, Média, Urgente) -- ordena
// pela gravidade de verdade (Baixa < Média < Alta < Urgente).
const CHAMADO_PRIORIDADE_RANK = { baixa: 1, media: 2, alta: 3, urgente: 4 };

function aplicarOrdenacaoChamado(lista) {
    if (!sortStateChamado.coluna || !Array.isArray(lista)) return lista;
    const col = sortStateChamado.coluna;
    const dir = sortStateChamado.direcao === 'asc' ? 1 : -1;
    const arr = lista.slice();
    arr.sort((a, b) => {
        let va, vb;
        if (col === 'prioridade') {
            va = CHAMADO_PRIORIDADE_RANK[String(a[col] || '').trim().toLowerCase()] || 0;
            vb = CHAMADO_PRIORIDADE_RANK[String(b[col] || '').trim().toLowerCase()] || 0;
        } else if (col === 'id') {
            va = Number(a[col]) || 0;
            vb = Number(b[col]) || 0;
        } else {
            va = String(a[col] || '').toLowerCase();
            vb = String(b[col] || '').toLowerCase();
        }
        return va < vb ? -1 * dir : va > vb ? 1 * dir : 0;
    });
    return arr;
}

function limparFiltrosChamado() {
    document.getElementById('filtro-chamado-equipamento').value = '';
    document.getElementById('motivoChamadoSearch').value = '';
    document.getElementById('filtro-chamado-tipo').value = '';
    document.getElementById('filtro-chamado-prioridade').value = '';
    document.getElementById('filtro-chamado-status').value = '';
    ['filtro-chamado-contrato', 'filtro-chamado-origem', 'filtro-chamado-atrasados'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
    });
    sortStateChamado = { coluna: null, direcao: 'asc' };
    consultarChamados();
}

function renderTabelaChamados(lista) {
    const tbody = document.getElementById('chamadosTableBody');
    if (!tbody) return;

    tbody.innerHTML = '';

    if(!lista || lista.length === 0) {
        tbody.innerHTML = '<div class="gtable-row gtable-empty-row" role="row"><div class="gtable-cell gtable-cell-full" role="cell">Nenhum chamado encontrado.</div></div>';
        return;
    }

    lista.forEach(f => {
        const tr = document.createElement('div');
        tr.setAttribute('role', 'row');
        tr.className = 'gtable-row';
        if (f.desativado) tr.classList.add('linha-desativada');
        if (f.concluido) tr.classList.add('linha-chamado-concluido');

        const btnEditar = f.desativado
        ? '<button class="btn-acao btn-editar-linha" title="Editar" disabled style="opacity:0.3; cursor:not-allowed;">✏️</button>'
        : `<button class="btn-acao btn-editar-linha" title="Editar" onclick="editarChamado('${f.id}')">✏️</button>`;

        const btnExcluir = f.desativado
        ? `<button class="btn-acao btn-reativar-linha" title="Reativar" onclick="reativarChamadoUI('${f.id}')">♻️</button>`
        : `<button class="btn-acao btn-excluir-linha" title="Desativar" onclick="confirmarExclusaoChamado('${f.id}')">🗑️</button>`;

        const btnVer = `
            <span class="chamado-ver-wrapper">
                <button class="btn-acao btn-ver-linha" title="Ver detalhes" onclick="abrirDetalhesChamado('${f.id}')">👁️</button>
                ${f.temAnexo ? '<span class="chamado-anexo-selo" title="Tem anexo">📁</span>' : ''}
            </span>`;

        tr.innerHTML = `
        <div class="gtable-cell" role="cell">${f.id}</div>
        <div class="gtable-cell" role="cell">${escapeHtml(f.motivo)}${f.contrato
            ? `<br><small class="chamado-contrato-tag" title="Contrato">📄 ${escapeHtml(f.contrato)}${f.origem === 'automatica' ? ' · automática' : ''}</small>`
            : ''}</div>
        <div class="gtable-cell" role="cell">${f.equipamento ? escapeHtml(f.equipamento) : '--'}</div>
        <div class="gtable-cell" role="cell">${f.localizacao ? escapeHtml(f.localizacao) : '--'}</div>
        <div class="gtable-cell" role="cell">${escapeHtml(f.tipo)}</div>
        <div class="gtable-cell" role="cell">${montarBadgePrioridadeChamado(f.prioridade)}</div>
        <div class="gtable-cell" role="cell">${montarBadgeStatusChamado(f.status)}${f.atrasado
            ? ` <span class="status-badge atrasado" title="${escapeHtml(f.motivoAtraso)}">Atrasado</span>`
            : ''}</div>
        <div class="gtable-cell" role="cell">${escapeHtml(f.atribuidoA)}</div>
        <div class="gtable-cell" role="cell">${escapeHtml(f.dataAbertura)}</div>
        <div class="gtable-cell gtable-cell-end" role="cell">
            ${btnVer}
            ${btnEditar}
            ${btnExcluir}
        </div>
        `;
        tbody.appendChild(tr);
    });
}

function montarBadgePrioridadeChamado(prioridade) {
    const chave = String(prioridade || '').trim().toLowerCase();
    const rotulos = { baixa: 'Baixa', media: 'Média', alta: 'Alta', urgente: 'Urgente' };
    const texto = rotulos[chave] || (prioridade || '--');
    if (!chave) return '--';
    return `<span class="prioridade-badge ${chave}">${escapeHtml(texto)}</span>`;
}

// Status também virou badge (igual a prioridade) -- "concluido" vem
// destacado/brilhante de propósito, pra não parecer "apagado" igual um
// chamado cancelado (ver .status-badge.concluido em ConsultaChamadoFormCSS.html).
function montarBadgeStatusChamado(status) {
    const chave = String(status || '').trim().toLowerCase().replace(/\s+/g, '-');
    const rotulos = { aberto: 'Aberto', 'em-andamento': 'Em Andamento', concluido: 'Concluído', cancelado: 'Cancelado' };
    const texto = rotulos[chave] || (status || '--');
    if (!chave) return '--';
    return `<span class="status-badge ${chave}">${escapeHtml(texto)}</span>`;
}

// EXCLUIR, REATIVAR, EDITAR CHAMADOS
let idChamadoExclusao = null;

function confirmarExclusaoChamado(id) {
    idChamadoExclusao = id;
    //sistema faz uma checagem de segurança, verificando se a variável chamada é uma função
    if (typeof exibirModal === 'function') exibirModal('modalExclusaoChamado');
}

async function executarExclusaoChamado() {
    if (!idChamadoExclusao) return;
    try {
        const resposta = await runServerFunction('desativarChamado', idChamadoExclusao);
        if (typeof fecharModal === 'function') fecharModal('modalExclusaoChamado');
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        consultarChamados();
    } catch (error) {
        console.error('Erro ao desativar chamado:', error);
        alert('Erro ao desativar chamado.');
    }
}

async function reativarChamadoUI(id) {
    try {
        const resposta = await runServerFunction('reativarChamado', id);
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        consultarChamados();
    } catch (error) {
        console.error('Erro ao reativar chamado:', error);
        alert('Erro ao reativar chamado.');
    }
}

// Leva pro Cadastro em modo edição (ele já sabe distinguir edição de
// criação pelo "id" recebido -- ver renderChamadoForm em CadastroChamadoFormJS).
function editarChamado(id) {
    if (typeof trocarPagina === 'function') {
        trocarPagina('chamado-form', id);
    }
}
</script>
