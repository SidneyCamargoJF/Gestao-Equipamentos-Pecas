<style>

/* ===== MODAL ===== */
.modal-overlay {

  justify-content: center;
  z-index: 100;
}

.modal-overlay.aberto { display: flex; }

.modal {
  background: #fff;
  border-radius: 0.75rem;
  padding: 1.5rem;
  width: 90%;
  max-width: 420px;
  box-shadow: 0 1.25rem 3.75rem rgba(0, 0, 0, 0.25);
}


.modal h3 {
  font-size: 1.125rem;
  margin-bottom: 0.5rem;
  color: var(--color-slate-700);
}

}

/* modal quase tela cheia -- detalhe do chamado, com abas Informações/Histórico.

   arquivo, e com a mesma força de CSS (uma classe) quem carrega por último

}
