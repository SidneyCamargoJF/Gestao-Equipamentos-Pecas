<script> // DashboardJS

function renderDashboard() {
  document.querySelectorAll('.data-hoje').forEach(el => {
    el.textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  });

  renderDashboardChamados();
  renderDashboardContratos();
  renderDashboardEquipamentos();
  renderDashboardPecas();
  renderDashboardFornecedores();
}

// ===== FORNECEDORES =====
async function renderDashboardFornecedores() {
  try {
    const dados = await runServerFunction('buscarIndicadoresFornecedor');

    document.getElementById('dashFornecedorTotal').textContent = dados.totalAtivos;

    document.getElementById('dashFornecedorTipos').innerHTML = desenharRosca([
      { label: 'Prestador de Serviço', valor: dados.tipos.prestador, cor: '#2563eb' },
      { label: 'Distribuidor de Produtos', valor: dados.tipos.distribuidor, cor: '#f59e0b' },
      { label: 'Ambos', valor: dados.tipos.ambos, cor: '#16a34a' },
      { label: 'Nenhum definido', valor: dados.tipos.nenhum, cor: '#94a3b8' }
    ]);
    registrarExportDash('dashFornecedorTipos', ['Tipo', 'Quantidade'], [
      ['Prestador de Serviço', dados.tipos.prestador],
      ['Distribuidor de Produtos', dados.tipos.distribuidor],
      ['Ambos', dados.tipos.ambos],
      ['Nenhum definido', dados.tipos.nenhum]
    ]);

    document.getElementById('dashFornecedorTopPecas').innerHTML = desenharRankingBarras(
      dados.topPecas.map(f => ({ label: f.nome, valor: f.pecas })),
      'Nenhum fornecedor com peça vinculada.'
    );
    registrarExportDash('dashFornecedorTopPecas', ['Fornecedor', 'Peças vinculadas'], dados.topPecas.map(f => [f.nome, f.pecas]));

    const semVinculoEl = document.getElementById('dashFornecedorSemVinculo');
    if (!dados.semVinculo.length) {
      semVinculoEl.innerHTML = '<p class="dash-vazio">Todos os fornecedores ativos têm peça ou contrato vinculado.</p>';
    } else {
      semVinculoEl.innerHTML = '<ul class="dash-lista-simples">' +
        dados.semVinculo.map(f => `<li onclick="irParaFornecedor('${escapeHtml(f.nome)}')">${escapeHtml(f.nome)}</li>`).join('') +
        '</ul>';
    }
    registrarExportDash('dashFornecedorSemVinculo', ['Fornecedor'], dados.semVinculo.map(f => [f.nome]));
  } catch (error) {
    console.error('Erro ao buscar indicadores de fornecedores:', error);
    document.getElementById('dashFornecedorTipos').innerHTML = '<p class="dash-vazio">Erro ao carregar.</p>';
  }
}

// Clicar num fornecedor sem vínculo leva pra Consulta de Fornecedores já
// filtrada pelo nome -- mesmo padrão usado no resto do sistema pra "ver na
// consulta" a partir de um resumo.
function irParaFornecedor(nome) {
  trocarPagina('fornecedor-view');
  const campoNome = document.getElementById('filtro-fornecedor-nome');
  if (campoNome) {
    campoNome.value = nome;
    if (typeof consultarFornecedores === 'function') consultarFornecedores();
  }
}

      { label: 'Vencida', valor: dados.garantia.vencida, cor: '#dc2626' }

    registrarExportDash('dashPecasGarantia', ['Garantia', 'Quantidade'], [
      ['Ativa', dados.garantia.ativa],
      ['Vencendo (≤7 dias)', dados.garantia.vencendo],

    document.getElementById('dashPecasPorMarca').innerHTML = desenharRankingBarras(

    registrarExportDash('dashPecasPorMarca', ['Marca', 'Quantidade'], dados.porMarca.map(d => [d.label, d.valor]));

    document.getElementById('dashPecasPorLocalizacao').innerHTML = desenharRankingBarras(

    registrarExportDash('dashPecasPorLocalizacao', ['Localização', 'Quantidade'], dados.porLocalizacao.map(d => [d.label, d.valor]));

      vencendoEl.innerHTML = '<p class="dash-vazio">Nenhuma garantia vencendo nos próximos 7 dias.</p>';
    } else {

  } catch (error) {
    console.error('Erro ao buscar indicadores de peças:', error);

// ===== EXPORTAÇÃO CSV (genérica, usada pelo botão de cada panel-header) =====

// Guarda cabeçalho + linhas de cada painel assim que ele é renderizado, pra
// o botão "CSV" ler na hora do clique sem precisar buscar os dados de novo.
const DASH_DADOS_EXPORT = {};

function registrarExportDash(painelId, cabecalho, linhas) {
  DASH_DADOS_EXPORT[painelId] = { cabecalho, linhas };
}

// Ponto e vírgula como separador porque é o que o Excel em pt-BR espera
// (vírgula já é separador decimal nesse locale).
function exportarPainelCSV(painelId, nomeArquivo) {
  const dados = DASH_DADOS_EXPORT[painelId];
  if (!dados || !dados.linhas.length) {
    alert('Não há dados para exportar neste painel.');
    return;
  }

  const paraCelulaCSV = valor => {
    const texto = String(valor ?? '');
    return /[;"\n]/.test(texto) ? '"' + texto.replace(/"/g, '""') + '"' : texto;
  };

  const linhasCSV = [dados.cabecalho, ...dados.linhas]
    .map(linha => linha.map(paraCelulaCSV).join(';'))
    .join('\r\n');

  const blob = new Blob(['﻿' + linhasCSV], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = nomeArquivo || (painelId + '.csv');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// ===== COMPONENTES DE GRÁFICO (SVG puro, sem biblioteca externa) =====

// Gráfico de rosca a partir de [{label, valor, cor}]. Técnica clássica:
// círculo com raio 15.9155 tem circunferência ~100, então cada % do total
// vira diretamente um valor de stroke-dasharray (sem conta de arco).
function desenharRosca(dados) {
  const total = dados.reduce((s, d) => s + d.valor, 0);
  if (total === 0) return '<p class="dash-vazio">Sem dados.</p>';

  const comValor = dados.filter(d => d.valor > 0);
  let acumulado = 0;
  const segmentos = comValor.map(d => {
    const pct = (d.valor / total) * 100;
    const dashoffset = 25 - acumulado; // 25 = começa no topo (12h), sentido horário
    acumulado += pct;
    return `<circle cx="21" cy="21" r="15.9155" fill="transparent" stroke="${d.cor}" stroke-width="6" stroke-dasharray="${pct} ${100 - pct}" stroke-dashoffset="${dashoffset}"></circle>`;
  }).join('');

  const legenda = comValor.map(d => `
    <div class="dash-legenda-item">
      <span class="dash-legenda-cor" style="background:${d.cor};"></span>
      ${escapeHtml(d.label)} <strong>${d.valor}</strong>
    </div>
  `).join('');

  return `
    <div class="dash-rosca-wrap">
      <svg viewBox="0 0 42 42" class="dash-rosca-svg">${segmentos}</svg>
      <div class="dash-legenda">${legenda}</div>
    </div>
  `;
}

// Ranking em barras horizontais a partir de [{label, valor}], já ordenado
// por quem chama. Se `onClickNomeFuncao` for passado, cada linha vira
// clicável e chama essa função global com o label (drill-down pra consulta).
function desenharRankingBarras(dados, textoVazio, onClickNomeFuncao) {
  if (!dados.length) return `<p class="dash-vazio">${textoVazio}</p>`;

  const max = Math.max(1, ...dados.map(d => d.valor));
  return '<div class="dash-ranking">' + dados.map(d => {
    const clicavel = onClickNomeFuncao
      ? ` onclick="${onClickNomeFuncao}('${String(d.label).replace(/'/g, "\\'")}')" style="cursor:pointer;"`
      : '';
    return `
    <div class="dash-ranking-linha"${clicavel}>
      <span class="dash-ranking-label">${escapeHtml(d.label)}</span>
      <div class="dash-ranking-trilho">
        <div class="dash-ranking-fill" style="width:${(d.valor / max) * 100}%"></div>
      </div>
      <span class="dash-ranking-valor">${d.valor}</span>
    </div>`;
  }).join('') + '</div>';
}
