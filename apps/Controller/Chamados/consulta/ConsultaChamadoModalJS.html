<script>
// ===== MODAL "VER DETALHES" DO CHAMADO =====
// Separado de ConsultaChamadoFormJS.html de propósito -- arquivo menor,
// isolado do resto do JS de Chamados.

let chamadoIdAtualModal = null;
let anotacaoEditandoId = null;
let historicoChamadoAtual = [];
// Guarda o último chamado carregado no modal (motivo, contrato, prazos...)
// pra montar o e-mail sem precisar buscar tudo de novo no servidor.
let chamadoDetalheAtualModal = null;

async function abrirDetalhesChamado(chamadoId) {
    chamadoIdAtualModal = chamadoId;

    const conteudo = document.getElementById('detalheChamadoConteudo');
    if (conteudo) conteudo.innerHTML = '<p>Carregando...</p>';

    const tituloEl = document.getElementById('detalheChamadoIdTitulo');
    if (tituloEl) tituloEl.textContent = '#' + chamadoId;

    cancelarCaixaTextoChamado();
    checklistChamadoAtual = null;
    chamadoStatusAtualModal = '';
    const btnAbaChecklist = document.getElementById('tabBtnChecklistChamado');
    if (btnAbaChecklist) btnAbaChecklist.style.display = 'none';
    const conteudoEquip = document.getElementById('detalheChamadoEquipamentos');
    if (conteudoEquip) conteudoEquip.innerHTML = '<p>Carregando...</p>';
    const btnAbaEquip = document.getElementById('tabBtnEquipChamado');
    if (btnAbaEquip) btnAbaEquip.textContent = 'Equipamento';

    ajustarTamanhoModalChamado();
    trocarAbaModalChamado('historico');
    if (typeof exibirModal === 'function') exibirModal('modalDetalheChamado');

    try {
        const resposta = await runServerFunction('buscarChamadoDetalhado', chamadoId);
        if (!resposta || resposta.sucesso === false) {
            if (conteudo) conteudo.innerHTML = `<p>${escapeHtml(resposta ? resposta.mensagem : 'Chamado não encontrado.')}</p>`;
            return;
        }
        chamadoDetalheAtualModal = resposta.chamado;

        const fixo = document.getElementById('detalheChamadoFixo');
        if (fixo) fixo.innerHTML = montarInfoFixaChamado(resposta.chamado);

        if (conteudo) conteudo.innerHTML = montarDetalheChamadoHtml(resposta.chamado);
        if (conteudoEquip) conteudoEquip.innerHTML = montarEquipamentosChamadoHtml(resposta.chamado);
        if (btnAbaEquip) btnAbaEquip.textContent = rotuloAbaEquipamentosChamado(resposta.chamado);
        carregarAnexosChamadoUI(chamadoId);

        chamadoStatusAtualModal = String(resposta.chamado.status || '').trim();
        carregarChecklistChamadoUI(chamadoId);

        const botoesStatus = document.getElementById('detalheChamadoStatusBotoes');
        if (botoesStatus) botoesStatus.innerHTML = montarBotoesStatusChamado(resposta.chamado.status);

        const acaoStatus = document.getElementById('chamadoAcaoStatus');
        if (acaoStatus) acaoStatus.innerHTML = montarBotaoAcaoStatusChamado(resposta.chamado.status);
    } catch (error) {
        console.error('[detalhe] ERRO ao buscar detalhes do chamado:', error);
        if (conteudo) conteudo.innerHTML = '<p>Erro ao buscar detalhes do chamado.</p>';
    }

    carregarHistoricoChamadoUI(chamadoId);
}

function trocarAbaModalChamado(aba) {
    const btnInfo = document.getElementById('tabBtnInfoChamado');
    const btnHistorico = document.getElementById('tabBtnHistoricoChamado');
    const btnChecklist = document.getElementById('tabBtnChecklistChamado');
    const painelInfo = document.getElementById('tabPanelInfoChamado');
    const painelHistorico = document.getElementById('tabPanelHistoricoChamado');
    const painelChecklist = document.getElementById('tabPanelChecklistChamado');
    const btnEquip = document.getElementById('tabBtnEquipChamado');
    const painelEquip = document.getElementById('tabPanelEquipChamado');

    const mostrarInfo = aba === 'info';
    const mostrarChecklist = aba === 'checklist';
    const mostrarEquip = aba === 'equipamentos';
    const mostrarHistorico = !mostrarInfo && !mostrarChecklist && !mostrarEquip;

    if (btnInfo) btnInfo.classList.toggle('active', mostrarInfo);
    if (btnHistorico) btnHistorico.classList.toggle('active', mostrarHistorico);
    if (btnChecklist) btnChecklist.classList.toggle('active', mostrarChecklist);
    if (btnEquip) btnEquip.classList.toggle('active', mostrarEquip);

    aplicarEstiloPainelModalChamado(painelInfo, mostrarInfo);
    aplicarEstiloPainelModalChamado(painelHistorico, mostrarHistorico);
    aplicarEstiloPainelModalChamado(painelChecklist, mostrarChecklist);
    aplicarEstiloPainelModalChamado(painelEquip, mostrarEquip);
    const conteudoEquip = document.getElementById('detalheChamadoEquipamentos');
    if (conteudoEquip) {
        conteudoEquip.style.flex = '1 1 auto';
        conteudoEquip.style.minHeight = '0';
        conteudoEquip.style.overflowY = 'auto';
    }
    const conteudoChecklist = document.getElementById('chamadoChecklistConteudo');
    if (conteudoChecklist) {
        conteudoChecklist.style.flex = '1 1 auto';
        conteudoChecklist.style.minHeight = '0';
        conteudoChecklist.style.overflowY = 'auto';
    }

    const conteudoInfo = document.getElementById('detalheChamadoConteudo');
    if (conteudoInfo) {
        conteudoInfo.style.flex = '1 1 auto';
        conteudoInfo.style.minHeight = '0';
        conteudoInfo.style.overflowY = 'auto';
    }
    const botoesStatus = document.getElementById('detalheChamadoStatusBotoes');
    if (botoesStatus) botoesStatus.style.flexShrink = '0';

    const acoesFixas = document.getElementById('chamadoAcoesFixas');
    if (acoesFixas) acoesFixas.style.flexShrink = '0';
    const caixaTexto = document.getElementById('chamadoCaixaTexto');
    if (caixaTexto) caixaTexto.style.flexShrink = '0';
    const listaHistorico = document.getElementById('historicoChamadoLista');
    if (listaHistorico) {
        listaHistorico.style.flex = '1 1 auto';
        listaHistorico.style.minHeight = '0';
        listaHistorico.style.overflowY = 'auto';
    }

    if (mostrarHistorico && chamadoIdAtualModal) {
        carregarHistoricoChamadoUI(chamadoIdAtualModal);
    }
}

function aplicarEstiloPainelModalChamado(painel, visivel) {
    if (!painel) return;
    painel.classList.toggle('active', visivel);
    painel.style.display = visivel ? 'flex' : 'none';
    painel.style.flexDirection = 'column';
    painel.style.flex = '1 1 auto';
    painel.style.minHeight = '0';
    painel.style.overflow = 'hidden';
}

function ajustarTamanhoModalChamado() {
    const caixa = document.getElementById('modalDetalheChamadoBox');
    if (!caixa) return;

    caixa.style.width = '92vw';
    caixa.style.maxWidth = '75rem';
    caixa.style.height = '85vh';
    caixa.style.maxHeight = '85vh';
    caixa.style.display = 'flex';
    caixa.style.flexDirection = 'column';
    caixa.style.overflow = 'hidden';

    const cabecalho = caixa.querySelector('.detalhe-chamado-cabecalho');
    if (cabecalho) cabecalho.style.flexShrink = '0';

    const fixo = caixa.querySelector('.detalhe-chamado-fixo');
    if (fixo) fixo.style.flexShrink = '0';

    const abasNav = caixa.querySelector('.tabs-nav');
    if (abasNav) abasNav.style.flexShrink = '0';
}

async function carregarHistoricoChamadoUI(chamadoId) {
    const lista = document.getElementById('historicoChamadoLista');
    if (lista) lista.innerHTML = '<p>Carregando...</p>';

    try {
        const historico = await runServerFunction('buscarHistoricoChamado', chamadoId);
        historicoChamadoAtual = historico;
        if (lista) lista.innerHTML = montarHistoricoChamadoHtml(historico);
    } catch (error) {
        console.error('Erro ao buscar histórico do chamado:', error);
        if (lista) lista.innerHTML = '<p>Erro ao buscar histórico.</p>';
    }
}

function montarHistoricoChamadoHtml(lista) {
    if (!Array.isArray(lista) || lista.length === 0) {
        return '<p>Nenhuma movimentação registrada ainda.</p>';
    }

    return lista.map(item => {
        let corFundo = 'var(--color-slate-50, #f8fafc)';
        let corBorda = 'var(--color-slate-200, #e2e8f0)';
        if (item.tipo === 'anotacao') {
            corFundo = '#eef2ff';
            corBorda = '#c7d2fe';
        } else if (item.tipo === 'alerta') {
            corFundo = '#fee2e2';
            corBorda = '#fca5a5';
        }

        const botaoExcluir = item.tipo === 'anotacao'
            ? `<button type="button" title="Excluir anotação" onclick="excluirAnotacaoChamadoUI(${item.id})"
                style="border:none; background:transparent; cursor:pointer; color:#dc2626; font-size:0.8rem; padding:0;">✕</button>`
            : '';

        const botaoEditar = item.tipo === 'anotacao'
            ? `<button type="button" title="Editar anotação" onclick="iniciarEdicaoAnotacao(${item.id})"
                style="border:none; background:transparent; cursor:pointer; color:#2563eb; font-size:0.8rem; padding:0;">✎</button>`
            : '';

        return `
            <div class="chamado-historico-item" style="background:${corFundo}; border-color:${corBorda};">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem;">
                    <div class="chamado-historico-item-data">${escapeHtml(item.data)}</div>
                    <div style="display:flex; align-items:center; gap:0.5rem;">
                        ${botaoEditar}
                        ${botaoExcluir}
                    </div>
                </div>
                <div class="chamado-historico-item-texto">${escapeHtml(item.texto)}</div>
            </div>
        `;
    }).join('');
}

// ===== CAIXA DE TEXTO ÚNICA (escondida por padrão) =====
let chamadoCaixaTextoModo = null; // 'anotacao' | 'resolver'

function abrirCaixaTextoChamado(modo) {
    chamadoCaixaTextoModo = modo;
    anotacaoEditandoId = null;

    const caixa = document.getElementById('chamadoCaixaTexto');
    const textoEl = document.getElementById('novaAnotacaoChamado');
    const rotuloEl = document.getElementById('chamadoCaixaTextoRotulo');
    const textoBotaoEl = document.getElementById('textoBotaoSalvarAnotacao');

    if (textoEl) textoEl.value = '';
    esconderObsEquipamentosEncerramento();

    if (modo === 'resolver') {
        if (rotuloEl) rotuloEl.textContent = 'Motivo do encerramento';
        if (textoEl) textoEl.placeholder = 'Descreva o que foi feito para resolver o chamado...';
        if (textoBotaoEl) textoBotaoEl.textContent = 'Confirmar encerramento';
    } else if (modo === 'reabrir') {
        if (rotuloEl) rotuloEl.textContent = 'Motivo da reabertura';
        if (textoEl) textoEl.placeholder = 'Descreva por que esse chamado está sendo reaberto...';
        if (textoBotaoEl) textoBotaoEl.textContent = 'Confirmar reabertura';
    } else {
        if (rotuloEl) rotuloEl.textContent = 'Nova anotação';
        if (textoEl) textoEl.placeholder = 'Ex: "Serviço no período da manhã"...';
        if (textoBotaoEl) textoBotaoEl.textContent = 'Adicionar';
    }

    aplicarModoResolverCaixaTexto(modo === 'resolver');
    if (caixa) caixa.style.display = 'flex';
    if (textoEl) textoEl.focus();
}

// Resolver: some com os botões de cima (Resolver / Adicionar anotação), o
// motivo fica menor e Cancelar/Confirmar encerramento vão para a direita
// dele -- assim os botões não ficam lá embaixo, depois da lista de
// observações por patrimônio.
function aplicarModoResolverCaixaTexto(ativo) {
    const caixa = document.getElementById('chamadoCaixaTexto');
    const acoesFixas = document.getElementById('chamadoAcoesFixas');
    const textoEl = document.getElementById('novaAnotacaoChamado');
    if (caixa) caixa.classList.toggle('chamado-caixa-texto--resolver', !!ativo);
    if (acoesFixas) acoesFixas.style.display = ativo ? 'none' : '';
    if (textoEl) textoEl.rows = ativo ? 2 : 3;
}

function cancelarCaixaTextoChamado() {
    chamadoCaixaTextoModo = null;
    anotacaoEditandoId = null;

    const caixa = document.getElementById('chamadoCaixaTexto');
    const textoEl = document.getElementById('novaAnotacaoChamado');
    if (textoEl) textoEl.value = '';
    if (caixa) caixa.style.display = 'none';
    aplicarModoResolverCaixaTexto(false);
    esconderObsEquipamentosEncerramento();
}

// ===== OBSERVAÇÃO POR PATRIMÔNIO NO ENCERRAMENTO (preventiva) =====
// O usuário digita o patrimônio, confere os dados do equipamento, digita a
// observação e clica em Incluir. Abaixo fica a lista do que foi incluído,
// com Alterar e Excluir em cada linha. Só aceita equipamentos da OS.
let obsEquipOs = [];             // equipamentos da OS (do servidor)
let obsEquipIncluidas = [];      // [{ id, observacao }] na ordem de inclusão
let obsEquipEditandoId = null;   // id em alteração (null = inclusão nova)
let obsEquipConferido = null;    // equipamento encontrado pelo patrimônio digitado

function esconderObsEquipamentosEncerramento() {
    const bloco = document.getElementById('chamadoObsEquip');
    if (bloco) bloco.style.display = 'none';
    obsEquipOs = [];
    obsEquipIncluidas = [];
    limparFormObsEquip();
    renderizarListaObsEquip();
}

function obsEquipPorId(id) {
    return obsEquipOs.find(e => Number(e.id) === Number(id)) || null;
}

function rotuloObsEquip(e) {
    return (e.patrimonio ? 'Patrimônio ' + e.patrimonio : e.nome) +
        (e.patrimonio && e.nome ? ' — ' + e.nome + (e.modelo ? '/' + e.modelo : '') : '') +
        (e.localizacao ? ' (' + e.localizacao + ')' : '');
}

function definirStatusObsEquip(texto) {
    const el = document.getElementById('chamadoObsEquipStatus');
    if (!el) return;
    el.innerHTML = texto || '';
    el.style.display = texto ? '' : 'none';
}

async function carregarObsEquipamentosEncerramento(chamadoId) {
    const bloco = document.getElementById('chamadoObsEquip');
    if (!bloco) return;
    obsEquipOs = [];
    obsEquipIncluidas = [];
    limparFormObsEquip();
    renderizarListaObsEquip();
    bloco.style.display = '';
    habilitarFormObsEquip(false);
    definirStatusObsEquip('<span class="spinner"></span>Carregando equipamentos da OS...');
    try {
        const resposta = await runServerFunction('listarEquipamentosEncerramentoChamado', chamadoId);
        if (chamadoCaixaTextoModo !== 'resolver' || chamadoIdAtualModal !== chamadoId) return; // fechou/trocou no meio
        const equipamentos = (resposta && resposta.equipamentos) || [];
        if (!resposta || resposta.sucesso === false || !equipamentos.length) {
            definirStatusObsEquip(escapeHtml(resposta && resposta.sucesso === false ? resposta.mensagem : 'Nenhum equipamento nesta OS.'));
            return;
        }
        obsEquipOs = equipamentos;
        // observações já gravadas (chamado reaberto) entram na lista
        obsEquipIncluidas = equipamentos.filter(e => e.observacao).map(e => ({ id: Number(e.id), observacao: e.observacao }));
        definirStatusObsEquip('');
        habilitarFormObsEquip(true);
        renderizarListaObsEquip();
    } catch (error) {
        console.error('Erro ao carregar equipamentos para o encerramento:', error);
        definirStatusObsEquip('Não foi possível carregar os equipamentos.');
    }
}

function habilitarFormObsEquip(habilitar) {
    const pat = document.getElementById('chamadoObsEquipPatrimonio');
    if (pat) pat.disabled = !habilitar;
    atualizarBotoesFormObsEquip();
}

function atualizarBotoesFormObsEquip() {
    const texto = document.getElementById('chamadoObsEquipTexto');
    const btn = document.getElementById('chamadoObsEquipBtnIncluir');
    const btnCancelar = document.getElementById('chamadoObsEquipBtnCancelar');
    if (texto) texto.disabled = !obsEquipConferido;
    if (btn) {
        btn.disabled = !obsEquipConferido;
        btn.textContent = obsEquipEditandoId ? 'Salvar alteração' : 'Incluir';
    }
    if (btnCancelar) btnCancelar.style.display = obsEquipEditandoId ? '' : 'none';
}

function limparFormObsEquip() {
    const pat = document.getElementById('chamadoObsEquipPatrimonio');
    const texto = document.getElementById('chamadoObsEquipTexto');
    if (pat) { pat.value = ''; pat.readOnly = false; }
    if (texto) texto.value = '';
    obsEquipEditandoId = null;
    obsEquipConferido = null;
    mostrarConferenciaObsEquip(null, '');
    atualizarBotoesFormObsEquip();
}

// Busca o patrimônio digitado entre os equipamentos da OS e mostra os dados
function conferirPatrimonioObsEquip() {
    const pat = document.getElementById('chamadoObsEquipPatrimonio');
    const digitado = String(pat ? pat.value : '').trim().toLowerCase();
    obsEquipConferido = null;
    if (!digitado) {
        mostrarConferenciaObsEquip(null, '');
    } else {
        const achado = obsEquipOs.find(e => String(e.patrimonio || '').trim().toLowerCase() === digitado);
        if (achado) {
            obsEquipConferido = achado;
            mostrarConferenciaObsEquip(achado, '');
        } else {
            mostrarConferenciaObsEquip(null, 'Patrimônio não encontrado entre os equipamentos desta OS.');
        }
    }
    atualizarBotoesFormObsEquip();
}

function mostrarConferenciaObsEquip(e, aviso) {
    const el = document.getElementById('chamadoObsEquipConferencia');
    if (!el) return;
    if (!e) {
        el.title = '';
        el.innerHTML = aviso ? '<span class="chamado-obs-equip-aviso">' + escapeHtml(aviso) + '</span>' : '';
        el.style.display = aviso ? '' : 'none';
        return;
    }
    // descrição numa linha, na frente do campo de patrimônio
    const partes = [
        (e.nome || '') + (e.modelo ? ' / ' + e.modelo : ''),
        e.marca ? 'Marca ' + e.marca : '',
        e.capacidade || '',
        e.localizacao || '',
        e.estado ? 'Estado ' + e.estado : ''
    ].filter(p => String(p).trim());
    el.innerHTML = '<span class="chamado-obs-equip-desc">' + escapeHtml(partes.join(' · ')) + '</span>';
    el.title = partes.join(' · ');
    el.style.display = '';
}

function teclaPatrimonioObsEquip(event) {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    conferirPatrimonioObsEquip();
    const texto = document.getElementById('chamadoObsEquipTexto');
    if (obsEquipConferido && texto) texto.focus();
}

function teclaTextoObsEquip(event) {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    incluirObsEquipUI();
}

function incluirObsEquipUI() {
    const textoEl = document.getElementById('chamadoObsEquipTexto');
    const observacao = String(textoEl ? textoEl.value : '').trim();
    if (!obsEquipConferido) {
        mostrarMensagem('Digite um patrimônio desta OS.', 'aviso');
        return;
    }
    if (!observacao) {
        mostrarMensagem('Digite a observação do equipamento.', 'aviso');
        if (textoEl) textoEl.focus();
        return;
    }
    const id = Number(obsEquipConferido.id);
    const existente = obsEquipIncluidas.find(o => o.id === id);
    if (existente && obsEquipEditandoId !== id) {
        mostrarMensagem('Este patrimônio já foi incluído. Use o botão Alterar na lista.', 'aviso');
        return;
    }
    if (existente) existente.observacao = observacao;
    else obsEquipIncluidas.push({ id: id, observacao: observacao });
    limparFormObsEquip();
    renderizarListaObsEquip();
    const pat = document.getElementById('chamadoObsEquipPatrimonio');
    if (pat) pat.focus();
}

function alterarObsEquipUI(id) {
    const item = obsEquipIncluidas.find(o => o.id === Number(id));
    const e = obsEquipPorId(id);
    if (!item || !e) return;
    const pat = document.getElementById('chamadoObsEquipPatrimonio');
    const texto = document.getElementById('chamadoObsEquipTexto');
    if (pat) { pat.value = e.patrimonio || ''; pat.readOnly = true; }
    obsEquipEditandoId = Number(id);
    obsEquipConferido = e;
    mostrarConferenciaObsEquip(e, '');
    if (texto) { texto.value = item.observacao; }
    atualizarBotoesFormObsEquip();
    renderizarListaObsEquip();
    if (texto) texto.focus();
}

function excluirObsEquipUI(id) {
    obsEquipIncluidas = obsEquipIncluidas.filter(o => o.id !== Number(id));
    if (obsEquipEditandoId === Number(id)) limparFormObsEquip();
    renderizarListaObsEquip();
}

function cancelarAlteracaoObsEquipUI() {
    limparFormObsEquip();
    renderizarListaObsEquip();
}

function renderizarListaObsEquip() {
    const lista = document.getElementById('chamadoObsEquipLista');
    if (!lista) return;
    if (!obsEquipIncluidas.length) {
        lista.innerHTML = '';
        lista.style.display = 'none';
        return;
    }
    lista.style.display = '';
    lista.innerHTML = obsEquipIncluidas.map(o => {
        const e = obsEquipPorId(o.id) || { nome: 'Equipamento #' + o.id };
        return '<div class="chamado-obs-equip-item' + (obsEquipEditandoId === o.id ? ' editando' : '') + '">' +
            '<div class="chamado-obs-equip-item-texto">' +
                '<span class="chamado-obs-equip-rotulo">' + escapeHtml(rotuloObsEquip(e)) + '</span>' +
                '<span class="chamado-obs-equip-obs">' + escapeHtml(o.observacao) + '</span>' +
            '</div>' +
            '<div class="chamado-obs-equip-item-acoes">' +
                '<button type="button" class="btn-mini" title="Alterar observação" onclick="alterarObsEquipUI(' + o.id + ')">✏️ Alterar</button>' +
                '<button type="button" class="btn-mini btn-mini-perigo" title="Excluir observação" onclick="excluirObsEquipUI(' + o.id + ')">🗑️ Excluir</button>' +
            '</div>' +
        '</div>';
    }).join('');
}

// Para o servidor vão todos os equipamentos da OS: os incluídos com a
// observação e os demais vazios (assim uma observação excluída é apagada).
function lerObsEquipamentosEncerramento() {
    return obsEquipOs.map(e => {
        const item = obsEquipIncluidas.find(o => o.id === Number(e.id));
        return { equipamentoId: Number(e.id), observacao: item ? item.observacao : '' };
    });
}

// Patrimônio/observação digitados mas não incluídos na lista
function obsEquipPendenteSemIncluir() {
    const bloco = document.getElementById('chamadoObsEquip');
    if (!bloco || bloco.style.display === 'none') return false;
    const pat = document.getElementById('chamadoObsEquipPatrimonio');
    const texto = document.getElementById('chamadoObsEquipTexto');
    return !!((pat && pat.value.trim()) || (texto && texto.value.trim()));
}

async function confirmarCaixaTextoChamado() {
    if (chamadoCaixaTextoModo === 'resolver') {
        const textoEl = document.getElementById('novaAnotacaoChamado');
        const motivo = textoEl ? textoEl.value.trim() : '';
        if (!motivo) {
            alert('Informe o motivo do encerramento.');
            return;
        }
        if (obsEquipPendenteSemIncluir()) {
            mostrarMensagem('Há um patrimônio/observação digitado que não foi incluído na lista. Clique em Incluir (ou Salvar alteração) ou limpe os campos antes de confirmar.', 'aviso');
            return;
        }
        await alterarStatusChamadoUI('Concluido', motivo, lerObsEquipamentosEncerramento());
        return;
    }

    if (chamadoCaixaTextoModo === 'reabrir') {
        const textoEl = document.getElementById('novaAnotacaoChamado');
        const motivo = textoEl ? textoEl.value.trim() : '' ;
        if(!motivo) {
            alert('Informe o motivo da reabertura.');
            return;
        }
        await reabrirChamadoComMotivoUI(motivo);
        return;
    }

    if (anotacaoEditandoId) {
        await editarAnotacaoChamadoUI(anotacaoEditandoId);
    } else {
        await adicionarAnotacaoChamadoUI();
    }
}

// Preventiva: tabela com todos os equipamentos da OS (lista + checklist).
// Demais tipos: só o equipamento do chamado, em linhas de detalhe.
function chamadoEhPreventiva(c) {
    return String((c && c.tipo) || '').trim().toLowerCase() === 'preventiva';
}

function rotuloAbaEquipamentosChamado(c) {
    if (!chamadoEhPreventiva(c)) return 'Equipamento';
    return 'Equipamentos (' + ((c.equipamentos || []).length) + ')';
}

function montarEquipamentosChamadoHtml(c) {
    const lista = (c && c.equipamentos) || [];
    if (!lista.length) return '<p class="chamado-equip-vazio">Nenhum equipamento vinculado a este chamado.</p>';

    if (!chamadoEhPreventiva(c)) {
        const e = lista[0];
        return `
            <div class="detalhe-chamado-secao">
                ${linhaDetalheChamado('Patrimônio', e.patrimonio)}
                ${linhaDetalheChamado('Equipamento', e.nome)}
                ${linhaDetalheChamado('Marca', e.marca)}
                ${linhaDetalheChamado('Modelo', e.modelo)}
                ${linhaDetalheChamado('Capacidade', e.capacidade)}
                ${linhaDetalheChamado('Localização', e.localizacao)}
                ${linhaDetalheChamado('Estado', e.estado)}
            </div>`;
    }

    const celula = v => (v && String(v).trim()) ? escapeHtml(v) : '--';
    const temObs = lista.some(e => e.observacao);
    const linhas = lista.map(e => `
        <tr>
            <td>${celula(e.patrimonio)}</td>
            <td>${celula(e.nome)}${e.modelo ? ' / ' + escapeHtml(e.modelo) : ''}</td>
            <td>${celula(e.capacidade)}</td>
            <td>${celula(e.localizacao)}</td>
            <td>${celula(e.estado)}</td>
            ${temObs ? `<td>${celula(e.observacao)}</td>` : ''}
        </tr>`).join('');
    return `
        <table class="chamado-equip-tabela">
            <thead>
                <tr>
                    <th>Patrimônio</th><th>Equipamento</th><th>Capacidade</th><th>Localização</th><th>Estado</th>
                    ${temObs ? '<th>Observação no encerramento</th>' : ''}
                </tr>
            </thead>
            <tbody>${linhas}</tbody>
        </table>`;
}

const CHAMADO_STATUS_OPCOES = [
    { valor: 'Aberto', rotulo: 'Aberto' },
    { valor: 'Em Andamento', rotulo: 'Em Andamento' },
    { valor: 'Concluido', rotulo: 'Concluído' }
];

const CHAMADO_STATUS_CORES = {
    'Aberto': { bg: '#dbeafe', cor: '#1d4ed8', bgAtual: '#1d4ed8', borda: '#1d4ed8' },
    'Em Andamento': { bg: '#fef3c7', cor: '#92400e', bgAtual: '#F7D602', borda: '#F0A531' },
    'Concluido': { bg: '#dcfce7', cor: '#166534', bgAtual: '#15803d', borda: '#15803d' }
};

function montarBotoesStatusChamado(statusAtual) {
    const statusNormalizado = String(statusAtual || '').trim().toLowerCase();
    const indiceAtual = CHAMADO_STATUS_OPCOES.findIndex(o => o.valor.toLowerCase() === statusNormalizado);

    return `
        <div class="chamado-status-stepper">
            ${CHAMADO_STATUS_OPCOES.map((opcao, idx) => {
                const cores = CHAMADO_STATUS_CORES[opcao.valor];
                let estado = 'futuro';
                if (idx < indiceAtual) estado = 'concluido';
                if (idx === indiceAtual) estado = 'atual';

                const circuloConteudo = estado === 'concluido' ? '✓' : String(idx + 1);

                const linhaAntes = idx > 0
                    ? `<div class="chamado-status-linha${idx <= indiceAtual ? ' chamado-status-linha--preenchida' : ''}" style="${idx <= indiceAtual ? `background:${cores.borda};` : ''}"></div>`
                    : '';

                return `
                    ${linhaAntes}
                    <div class="chamado-status-step chamado-status-step--${estado}" style="--cor-status:${cores.bgAtual};">
                        <div class="chamado-status-step-circulo">${circuloConteudo}</div>
                        <span class="chamado-status-step-rotulo">${opcao.rotulo}</span>
                    </div>
                `;
            }).join('')}
        </div>
    `;
}

function montarBotaoAcaoStatusChamado(statusAtual) {
    const status = String(statusAtual || '').trim();

    if (status === 'Aberto') {
        return '<button type="button" class="chamado-btn-acao chamado-btn-acao--atender" onclick="atenderChamadoUI()">Atender</button>';
    }
    if (status === 'Em Andamento') {
        return '<button type="button" class="chamado-btn-acao chamado-btn-acao--resolver" onclick="resolverChamadoUI()">Resolver</button>';
    }
    if (status === 'Concluido') {
        return '<button type="button" class="chamado-btn-acao chamado-btn-acao--reabrir" onclick="reabrirChamadoUI()">Reabrir</button>';
    }
    return '';
}

function nomeArquivoSemData(nome) {
    return String(nome || '').replace(/^\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2}\s*_\s*/, '');
}

function montarAnexosChamadoHtml(lista) {
    const grupos = { 'Relatório': [], 'Nota Fiscal': [], 'Outro': [] };
    (Array.isArray(lista) ? lista : []).forEach(item => {
        const chave = grupos[item.tipo] ? item.tipo : 'Outro';
        grupos[chave].push(item);
    });

    const cardAnexo = (item) => {
        const nomeExibido = escapeHtml(nomeArquivoSemData(item.nomeArquivo));
        return `
        <div class="anexo-card-wrapper">
            <a href="${item.url}" target="_blank" rel="noopener" title="${nomeExibido}" class="anexo-card">
                <div class="anexo-card-icone">📄</div>
                <span class="anexo-card-nome">${nomeExibido}</span>
            </a>
            <button type="button" class="anexo-card-excluir" title="Excluir anexo" onclick="confirmarExclusaoAnexo(${item.id})">✕</button>
        </div>`;
    };

    const cardAdicionar = (tipo, rotulo) => `
        <button type="button" class="anexo-card anexo-card-add" onclick="iniciarUploadAnexo('${tipo}')" title="Adicionar ${rotulo}">
            <div class="anexo-card-icone">+</div>
            <span class="anexo-card-nome">Adicionar</span>
        </button>`;

    const fileira = (titulo, tipo, itens) => `
        <div class="anexo-secao">
            <span class="anexo-secao-titulo">${titulo}</span>
            <div class="anexo-lista">
                ${itens.map(cardAnexo).join('')}
                ${cardAdicionar(tipo, titulo.toLowerCase())}
            </div>
        </div>`;

    return fileira('Relatórios', 'Relatório', grupos['Relatório'])
        + fileira('Notas Fiscais', 'Nota Fiscal', grupos['Nota Fiscal'])
        + (grupos['Outro'].length ? fileira('Outros', 'Outro', grupos['Outro']) : '');
}

        const anexos = await runServerFunction('buscarAnexosChamado', chamadoId);
        if (lista) lista.innerHTML = montarAnexosChamadoHtml(anexos);

        console.error('Erro ao buscar anexos do chamado:', error);
        if (lista) lista.innerHTML = '<p>Erro ao buscar anexos.</p>';

let tipoAnexoNovo = '';

function iniciarUploadAnexo(tipo) {
    tipoAnexoNovo = tipo;
    const inputEl = document.getElementById('inputAnexoOculto');
    if (inputEl) inputEl.click();
}

async function onArquivoAnexoSelecionado() {
    if (!chamadoIdAtualModal) return;
    const inputEl = document.getElementById('inputAnexoOculto');

    let arquivo;
    try {
        arquivo = await lerArquivoComoBase64(inputEl);
    } catch (erroArquivo) {
        alert(erroArquivo.message);
        if (inputEl) inputEl.value = '';
        return;
    }
    if (!arquivo) return;

    try {
        const resposta = await runServerFunction('adicionarAnexoChamado', chamadoIdAtualModal, tipoAnexoNovo, arquivo);
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        if(resposta && resposta.duplicado) {
            exibirAvisoAnexoDuplicado('Já existe um anexo com esse mesmo conteúdo neste chamado.');
        }
        carregarAnexosChamadoUI(chamadoIdAtualModal);
    } catch (error) {
        console.error('Erro ao adicionar anexo:', error);
        alert('Erro ao adicionar anexo.');
    } finally {
        if (inputEl) inputEl.value = '';
    }
}

// ===== CHECKLIST DA OS =====
let checklistChamadoAtual = null;   // { grupos, resumo } como veio do servidor
let chamadoStatusAtualModal = '';

const CHECKLIST_RESULTADOS_UI = [
    { valor: 'pendente', rotulo: 'Pendente' },
    { valor: 'ok', rotulo: 'OK' },
    { valor: 'nao_conforme', rotulo: 'Não conforme' },
    { valor: 'nao_aplicavel', rotulo: 'N/A' }
];

function checklistChamadoSomenteLeitura() {
    const s = chamadoStatusAtualModal.toLowerCase();
    return s === 'concluido' || s === 'cancelado';
}

async function carregarChecklistChamadoUI(chamadoId) {
    const btnAba = document.getElementById('tabBtnChecklistChamado');
    try {
        const resposta = await runServerFunction('buscarChecklistChamado', chamadoId);
        if (String(chamadoId) !== String(chamadoIdAtualModal)) return; // trocou de chamado no meio
        if (!resposta || resposta.sucesso === false || !resposta.grupos.length) {
            checklistChamadoAtual = null;
            if (btnAba) btnAba.style.display = 'none';
            return;
        }
        checklistChamadoAtual = resposta;
        if (btnAba) btnAba.style.display = '';
        renderizarChecklistChamado();
    } catch (error) {
        console.error('Erro ao buscar checklist do chamado:', error);
        if (btnAba) btnAba.style.display = 'none';
    }
}

function renderizarChecklistChamado() {
    const conteudo = document.getElementById('chamadoChecklistConteudo');
    const resumoEl = document.getElementById('chamadoChecklistResumo');
    const btnSalvar = document.getElementById('btnSalvarChecklistChamado');
    if (!conteudo || !checklistChamadoAtual) return;

    const r = checklistChamadoAtual.resumo;
    if (resumoEl) {
        resumoEl.textContent = r.total + ' itens — ' + r.ok + ' ok, ' + r.nao_conforme + ' não conformes, ' +
            r.pendente + ' pendentes' + (r.nao_aplicavel ? ', ' + r.nao_aplicavel + ' N/A' : '');
    }
    const leitura = checklistChamadoSomenteLeitura();
    if (btnSalvar) btnSalvar.style.display = leitura ? 'none' : '';

    conteudo.innerHTML = (leitura ? '<p class="chamado-checklist-aviso">Chamado ' +
        (chamadoStatusAtualModal.toLowerCase() === 'concluido' ? 'concluído' : 'cancelado') +
        ': checklist somente leitura.</p>' : '') +
        checklistChamadoAtual.grupos.map((g, gi) => `
        <div class="chamado-checklist-grupo">
            <div class="chamado-checklist-grupo-cabecalho">
                <strong>${g.patrimonio ? 'Patrimônio ' + escapeHtml(g.patrimonio) : 'Equipamento #' + escapeHtml(String(g.equipamentoId))}</strong>
                <span>${escapeHtml(g.nome)}${g.localizacao ? ' — ' + escapeHtml(g.localizacao) : ''}</span>
                ${leitura ? '' : `<button type="button" class="btn-secondary chamado-checklist-todos-ok" onclick="marcarTodosOkChecklistChamado(${gi})">Marcar todos OK</button>`}
            </div>
            <table class="data-table chamado-checklist-tabela">
                <thead><tr><th>Item</th><th>Resultado</th><th>Observação</th><th>Execução</th><th></th></tr></thead>
                <tbody>
                ${g.itens.map(it => `
                    <tr data-item-id="${escapeHtml(String(it.id))}" class="chamado-checklist-item resultado-${escapeHtml(it.resultado)}">
                        <td>${escapeHtml(it.descricao)} <em class="chamado-checklist-periodo">(${escapeHtml(it.periodicidade)})</em></td>
                        <td>
                            <select class="field__select chamado-checklist-resultado" ${leitura ? 'disabled' : ''}>
                                ${CHECKLIST_RESULTADOS_UI.map(o => `<option value="${o.valor}"${o.valor === it.resultado ? ' selected' : ''}>${o.rotulo}</option>`).join('')}
                            </select>
                        </td>
                        <td><input type="text" class="field__input chamado-checklist-obs" maxlength="500" value="${escapeHtml(it.observacao)}" ${leitura ? 'disabled' : ''} placeholder="Observação..."></td>
                        <td class="chamado-checklist-execucao">${it.executadoEm ? escapeHtml(it.executadoEm) + '<br>' + escapeHtml(it.registradoPor) : '--'}</td>
                        <td>${it.resultado === 'nao_conforme'
                            ? `<button type="button" class="btn-secondary chamado-checklist-corretiva" title="Abrir chamado corretivo para este equipamento" onclick="abrirCorretivaItemChecklistUI('${escapeHtml(String(it.id))}')">Abrir corretiva</button>`
                            : ''}</td>
                    </tr>`).join('')}
                </tbody>
            </table>
        </div>`).join('');
}

function marcarTodosOkChecklistChamado(indiceGrupo) {
    const grupos = document.querySelectorAll('#chamadoChecklistConteudo .chamado-checklist-grupo');
    const grupo = grupos[indiceGrupo];
    if (!grupo) return;
    grupo.querySelectorAll('select.chamado-checklist-resultado').forEach(sel => { sel.value = 'ok'; });
}

function lerChecklistChamadoDaTela() {
    return Array.from(document.querySelectorAll('#chamadoChecklistConteudo tr.chamado-checklist-item')).map(tr => ({
        id: tr.getAttribute('data-item-id'),
        resultado: tr.querySelector('select.chamado-checklist-resultado').value,
        observacao: tr.querySelector('input.chamado-checklist-obs').value.trim()
    }));
}

async function salvarChecklistChamadoUI() {
    if (!chamadoIdAtualModal || !checklistChamadoAtual) return;
    const btn = document.getElementById('btnSalvarChecklistChamado');
    if (btn) btn.disabled = true;
    try {
        const resposta = await runServerFunction('salvarChecklistChamado', chamadoIdAtualModal, lerChecklistChamadoDaTela());
        if (!resposta || resposta.sucesso === false) {
            alert((resposta && resposta.mensagem) || 'Não foi possível salvar o checklist.');
            return;
        }
        await carregarChecklistChamadoUI(chamadoIdAtualModal);
        if (resposta.alterados) alert(resposta.mensagem);
    } catch (error) {
        console.error('Erro ao salvar checklist:', error);
        alert('Erro ao salvar checklist.');
    } finally {
        if (btn) btn.disabled = false;
    }
}

async function abrirCorretivaItemChecklistUI(itemId) {
    if (!confirm('Abrir um chamado corretivo para este equipamento, ligado ao mesmo contrato desta OS?')) return;
    try {
        const resposta = await runServerFunction('abrirCorretivaItemChecklist', itemId);
        alert(resposta ? resposta.mensagem : 'Sem resposta do servidor.');
        if (resposta && resposta.sucesso) consultarChamados();
    } catch (error) {
        console.error('Erro ao abrir corretiva:', error);
        alert('Erro ao abrir corretiva.');
    }
}

let idAnexoExclusao = null;

function confirmarExclusaoAnexo(idAnexo) {
    idAnexoExclusao = idAnexo;
    if (typeof exibirModal === 'function') exibirModal('modalExclusaoAnexo');
}

async function executarExclusaoAnexo() {
    if (!idAnexoExclusao) return;
    try {
        const resposta = await runServerFunction('excluirAnexoChamado', idAnexoExclusao);
        if (typeof fecharModal === 'function') fecharModal('modalExclusaoAnexo');
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        carregarAnexosChamadoUI(chamadoIdAtualModal);
    } catch (e) {
        console.error('Erro ao excluir anexo: ', e);
        alert('Erro ao excluir anexo.');
    }
}
</script>
