<script> // DashboardJS

function renderDashboard() {

// ===== FORNECEDORES =====
async function renderDashboardFornecedores() {

    const dados = await runServerFunction('buscarIndicadoresFornecedor');

    document.getElementById('dashFornecedorTotal').textContent = dados.totalAtivos;

    document.getElementById('dashFornecedorTipos').innerHTML = desenharRosca([
      { label: 'Prestador de Serviço', valor: dados.tipos.prestador, cor: '#2563eb' },
      { label: 'Distribuidor de Produtos', valor: dados.tipos.distribuidor, cor: '#f59e0b' },
      { label: 'Ambos', valor: dados.tipos.ambos, cor: '#16a34a' },
      { label: 'Nenhum definido', valor: dados.tipos.nenhum, cor: '#94a3b8' }
    ]);
    registrarExportDash('dashFornecedorTipos', ['Tipo', 'Quantidade'], [
      ['Prestador de Serviço', dados.tipos.prestador],
      ['Distribuidor de Produtos', dados.tipos.distribuidor],
      ['Ambos', dados.tipos.ambos],
      ['Nenhum definido', dados.tipos.nenhum]
    ]);

    document.getElementById('dashFornecedorTopPecas').innerHTML = desenharRankingBarras(
      dados.topPecas.map(f => ({ label: f.nome, valor: f.pecas })),
      'Nenhum fornecedor com peça vinculada.'
    );
    registrarExportDash('dashFornecedorTopPecas', ['Fornecedor', 'Peças vinculadas'], dados.topPecas.map(f => [f.nome, f.pecas]));

    const semVinculoEl = document.getElementById('dashFornecedorSemVinculo');
    if (!dados.semVinculo.length) {
      semVinculoEl.innerHTML = '<p class="dash-vazio">Todos os fornecedores ativos têm peça ou contrato vinculado.</p>';
    } else {
      semVinculoEl.innerHTML = '<ul class="dash-lista-simples">' +
        dados.semVinculo.map(f => `<li onclick="irParaFornecedor('${escapeHtml(f.nome)}')">${escapeHtml(f.nome)}</li>`).join('') +
        '</ul>';
    }
    registrarExportDash('dashFornecedorSemVinculo', ['Fornecedor'], dados.semVinculo.map(f => [f.nome]));
  } catch (error) {
    console.error('Erro ao buscar indicadores de fornecedores:', error);
    document.getElementById('dashFornecedorTipos').innerHTML = '<p class="dash-vazio">Erro ao carregar.</p>';
  }
}

// Clicar num fornecedor sem vínculo leva pra Consulta de Fornecedores já
// filtrada pelo nome -- mesmo padrão usado no resto do sistema pra "ver na
// consulta" a partir de um resumo.
function irParaFornecedor(nome) {
  trocarPagina('fornecedor-view');
  const campoNome = document.getElementById('filtro-fornecedor-nome');
  if (campoNome) {
    campoNome.value = nome;
    if (typeof consultarFornecedores === 'function') consultarFornecedores();
  }
}

async function renderDashboardPecas() {
  try {
    const dados = await runServerFunction('buscarIndicadoresPecas');

    document.getElementById('dashPecasCadastradas30').textContent = dados.cadastradas30Dias;

      { label: 'Vencendo (≤7 dias)', valor: dados.garantia.vencendo, cor: '#f59e0b' },
      { label: 'Vencida', valor: dados.garantia.vencida, cor: '#dc2626' }
    ]);
    registrarExportDash('dashPecasGarantia', ['Garantia', 'Quantidade'], [
      ['Ativa', dados.garantia.ativa],
      ['Vencendo (≤7 dias)', dados.garantia.vencendo],
      ['Vencida', dados.garantia.vencida]
    ]);

    document.getElementById('dashPecasPorMarca').innerHTML = desenharRankingBarras(
      dados.porMarca, 'Nenhuma peça com marca cadastrada.', 'irParaPecasPorMarca'
    );
    registrarExportDash('dashPecasPorMarca', ['Marca', 'Quantidade'], dados.porMarca.map(d => [d.label, d.valor]));

    document.getElementById('dashPecasPorLocalizacao').innerHTML = desenharRankingBarras(
      dados.porLocalizacao, 'Nenhuma peça com localização cadastrada.', 'irParaPecasPorLocalizacao'
    );
    registrarExportDash('dashPecasPorLocalizacao', ['Localização', 'Quantidade'], dados.porLocalizacao.map(d => [d.label, d.valor]));

    const vencendoEl = document.getElementById('dashPecasVencendo');
    if (!dados.vencendoLista.length) {
      vencendoEl.innerHTML = '<p class="dash-vazio">Nenhuma garantia vencendo nos próximos 7 dias.</p>';
    } else {
      vencendoEl.innerHTML = '<ul class="dash-lista-simples">' +
        dados.vencendoLista.map(p => `<li onclick="irParaPecasPorGarantiaVencendo()">${escapeHtml(p.nome)} — vence em ${p.dias} dia${p.dias === 1 ? '' : 's'}</li>`).join('') +
        '</ul>';
    }
    registrarExportDash('dashPecasVencendo', ['Peça', 'Dias até vencer'], dados.vencendoLista.map(p => [p.nome, p.dias]));

    // Estoque abaixo do mínimo
    const elEst = document.getElementById('dashEstoqueAbaixo');
    if (elEst) elEst.textContent = (dados.estoque && dados.estoque.abaixo) || 0;

    // Acionamentos de garantia em andamento
    const ac = dados.acionamentos || { andamento: 0, atrasadas: 0, lista: [] };
    document.getElementById('dashGarantiasAndamento').textContent = ac.andamento;
    document.getElementById('dashGarantiasAtrasadas').textContent = ac.atrasadas;
    const garantiasEl = document.getElementById('dashGarantiasLista');
    garantiasEl.innerHTML = ac.lista.length
      ? '<ul class="dash-lista-simples">' + ac.lista.map(g => `<li onclick="trocarPagina('garantias-view'); abrirDetalhesGarantia(${Number(g.id)})">Nº ${Number(g.id)} — ${escapeHtml(g.item)} — ${escapeHtml(g.status)}${g.prazoResposta ? ' (resposta até ' + escapeHtml(g.prazoResposta) + ')' : ''}${g.atrasada ? ' ⚠️ atrasada' : ''}</li>`).join('') + '</ul>'
      : '<p class="dash-vazio">Nenhuma garantia em andamento.</p>';
    registrarExportDash('dashGarantiasLista', ['Nº', 'Item', 'Status', 'Prazo de resposta', 'Atrasada'],
      ac.lista.map(g => [g.id, g.item, g.status, g.prazoResposta, g.atrasada ? 'Sim' : 'Não']));
  } catch (error) {
    console.error('Erro ao buscar indicadores de peças:', error);
    document.getElementById('dashPecasGarantia').innerHTML = '<p class="dash-vazio">Erro ao carregar.</p>';
  }
}

// ===== MANUTENÇÃO DO MÊS =====
async function renderDashboardManutencao() {
  try {
    const dados = await runServerFunction('buscarIndicadoresManutencao');
    const p = dados.preventivas;
    const [ano, mes] = String(dados.competencia).split('-');
    document.getElementById('dashManutCompetencia').textContent = mes && ano ? '(' + mes + '/' + ano + ')' : '';
    document.getElementById('dashManutPreventivas').textContent = p.total;
    document.getElementById('dashManutItens').textContent = dados.itens.total
      ? dados.itens.percentual + '% (' + dados.itens.executados + '/' + dados.itens.total + ')'
      : '—';
    document.getElementById('dashManutAtrasadas').textContent = p.atrasadas;
    document.getElementById('dashManutCorretivasForaPrazo').textContent = dados.corretivasForaPrazo;

    const situacao = [
      { label: 'Concluídas', valor: p.concluidas, cor: '#16a34a' },
      { label: 'Em andamento', valor: p.andamento, cor: '#f59e0b' },
      { label: 'Pendentes', valor: p.pendentes, cor: '#2563eb' }
    ];
    document.getElementById('dashManutSituacao').innerHTML = desenharRosca(situacao) +
      (p.atrasadas ? '<p class="dash-vazio" style="color:#b91c1c;">' + p.atrasadas + ' atrasada(s): data prevista já passou.</p>' : '');
    registrarExportDash('dashManutSituacao', ['Situação', 'Quantidade'],
      situacao.map(s => [s.label, s.valor]).concat([['Atrasadas', p.atrasadas]]));

    const corretivasEl = document.getElementById('dashManutCorretivas');
    if (!dados.corretivasForaPrazoLista.length) {
      corretivasEl.innerHTML = '<p class="dash-vazio">Nenhuma corretiva com prazo vencido.</p>';
    } else {
      corretivasEl.innerHTML = '<ul class="dash-lista-simples">' +
        dados.corretivasForaPrazoLista.map(c => '<li onclick="irParaChamadoDash(' + Number(c.id) + ')">#' + escapeHtml(String(c.id)) + ' — ' + escapeHtml(c.motivo) + ' — ' + escapeHtml(c.situacao) + '</li>').join('') +
        '</ul>' + (dados.corretivasForaPrazo > dados.corretivasForaPrazoLista.length
          ? '<p class="dash-vazio">e mais ' + (dados.corretivasForaPrazo - dados.corretivasForaPrazoLista.length) + '…</p>' : '');
    }
    registrarExportDash('dashManutCorretivas', ['Chamado', 'Assunto', 'Atribuído a', 'Situação'],
      dados.corretivasForaPrazoLista.map(c => [c.id, c.motivo, c.atribuidoA, c.situacao]));

    document.getElementById('dashManutRanking').innerHTML = desenharRankingBarras(
      dados.rankingEquipamentos.map(r => ({ label: r.label, valor: r.valor })),
      'Nenhuma corretiva nos últimos 12 meses.'
    );
    registrarExportDash('dashManutRanking', ['Equipamento', 'Corretivas'],
      dados.rankingEquipamentos.map(r => [r.label, r.valor]));
  } catch (error) {
    console.error('Erro ao buscar indicadores de manutenção:', error);
    document.getElementById('dashManutSituacao').innerHTML = '<p class="dash-vazio">Erro ao carregar.</p>';
  }
}

// ===== PRÓXIMAS MANUTENÇÕES =====
function competenciaTextoDash(c) { const [a, m] = String(c || '').split('-'); return m && a ? m + '/' + a : c; }

async function renderDashboardProximasManutencoes() {
  const abrirEl = document.getElementById('dashProxAbrir');
  const agendarEl = document.getElementById('dashProxAgendar');
  if (!abrirEl || !agendarEl) return;
  try {
    const d = await runServerFunction('buscarProximasManutencoes');
    if (!d || d.sucesso === false) throw new Error(d ? d.mensagem : 'sem resposta');
    const comps = d.competencias || [];
    const sub = document.getElementById('dashProxCompetencias');
    if (sub) sub.textContent = comps.length ? '(' + comps.map(competenciaTextoDash).join(' e ') + ')' : '';

    // abrir chamado: agrupado por competência, com o botão de gerar
    abrirEl.innerHTML = d.abrir.length ? comps.map(comp => {
      const lista = d.abrir.filter(p => p.competencia === comp);
      if (!lista.length) return '';
      return '<div class="dash-prox-grupo"><div class="dash-prox-grupo-cab"><strong>' + competenciaTextoDash(comp) + '</strong> — ' +
        lista.length + ' contrato' + (lista.length === 1 ? '' : 's') +
        (d.admin ? ' <button type="button" class="btn-secondary dash-prox-btn" onclick="gerarPreventivasDash(\'' + comp + '\')">Gerar chamados</button>' : '') +
        '</div><ul class="dash-lista-simples">' + lista.map(p =>
          '<li>Contrato <strong>' + escapeHtml(p.numero) + '</strong> — ' + escapeHtml(p.empresa) + ' · ' + p.equipamentos + ' equipamento' +
          (p.equipamentos === 1 ? '' : 's') + ' · prevista até ' + escapeHtml(p.dataPrevista) + '</li>').join('') + '</ul></div>';
    }).join('') : '<p class="dash-vazio">Nenhuma preventiva prevista sem chamado.</p>';
    registrarExportDash('dashProximas', ['Ação', 'Competência / Chamado', 'Contrato', 'Empresa', 'Data prevista', 'Situação'],
      d.abrir.map(p => ['Abrir chamado', competenciaTextoDash(p.competencia), p.numero, p.empresa, p.dataPrevista, p.equipamentos + ' equipamento(s)'])
        .concat(d.agendar.map(c => ['Agendar com a empresa', '#' + c.id, c.contrato, c.empresa, c.dataPrevista,
          (c.atrasado ? 'Atrasada; ' : '') + (c.ultimoEmail ? 'e-mail enviado em ' + c.ultimoEmail.enviadoEm : 'sem contato')])));

    // agendar: cada chamado aberto, com o último contato e os botões
    agendarEl.innerHTML = d.agendar.length ? '<ul class="dash-lista-simples dash-prox-lista">' + d.agendar.map(c =>
      '<li class="' + (c.atrasado ? 'dash-prox-atrasado' : '') + '">' +
        '<span class="dash-prox-texto"><strong>#' + Number(c.id) + '</strong> ' + escapeHtml(c.assunto) +
        (c.empresa ? ' — ' + escapeHtml(c.empresa) : '') + '<br><small>' +
        (c.dataPrevista ? 'Prevista até ' + escapeHtml(c.dataPrevista) + (c.atrasado ? ' <strong class="dash-prox-alerta">atrasada</strong>' : '') : 'Sem data prevista') +
        ' · ' + (c.ultimoEmail ? '📧 e-mail enviado em ' + escapeHtml(c.ultimoEmail.enviadoEm) : '<span class="dash-prox-alerta">sem contato com a empresa</span>') +
        '</small></span>' +
        '<span class="dash-prox-acoes">' +
          '<button type="button" class="btn-acao" title="E-mail de agendamento para a empresa" onclick="agendarManutencaoDash(' + Number(c.id) + ')">📧</button>' +
          '<button type="button" class="btn-acao" title="Ver o chamado" onclick="irParaChamadoDash(' + Number(c.id) + ')">👁️</button>' +
        '</span></li>').join('') + '</ul>'
      : '<p class="dash-vazio">Nenhuma preventiva aberta aguardando agendamento.</p>';
  } catch (error) {
    console.error('Erro ao buscar as próximas manutenções:', error);
    abrirEl.innerHTML = agendarEl.innerHTML = '<p class="dash-vazio">Erro ao carregar.</p>';
  }
}

// Gera as OS de preventiva da competência (mesma rotina do botão da consulta de chamados)
async function gerarPreventivasDash(competencia) {
  if (!confirm('Gerar os chamados de preventiva de ' + competenciaTextoDash(competencia) + ' para os contratos previstos?')) return;
  try {
    const r = await runServerFunction('gerarPreventivasDoMesManual', competencia);
    alert((r && r.mensagem) || 'Concluído.');
  } catch (e) {
    alert('Erro ao conectar com o servidor.');
  }
  renderDashboardManutencao();
  renderDashboardProximasManutencoes();
}

// ===== EXPORTAÇÃO CSV (genérica, usada pelo botão de cada panel-header) =====

// Guarda cabeçalho + linhas de cada painel assim que ele é renderizado, pra
// o botão "CSV" ler na hora do clique sem precisar buscar os dados de novo.
const DASH_DADOS_EXPORT = {};

function registrarExportDash(painelId, cabecalho, linhas) {
  DASH_DADOS_EXPORT[painelId] = { cabecalho, linhas };
}

// Ponto e vírgula como separador porque é o que o Excel em pt-BR espera
// (vírgula já é separador decimal nesse locale).
function exportarPainelCSV(painelId, nomeArquivo) {
  const dados = DASH_DADOS_EXPORT[painelId];
  if (!dados || !dados.linhas.length) {
    alert('Não há dados para exportar neste painel.');
    return;
  }

  const paraCelulaCSV = valor => {
    const texto = String(valor ?? '');
    return /[;"\n]/.test(texto) ? '"' + texto.replace(/"/g, '""') + '"' : texto;
  };

  const linhasCSV = [dados.cabecalho, ...dados.linhas]
    .map(linha => linha.map(paraCelulaCSV).join(';'))
    .join('\r\n');

  const blob = new Blob(['﻿' + linhasCSV], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = nomeArquivo || (painelId + '.csv');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// ===== COMPONENTES DE GRÁFICO (SVG puro, sem biblioteca externa) =====

// Gráfico de rosca a partir de [{label, valor, cor}]. Técnica clássica:
// círculo com raio 15.9155 tem circunferência ~100, então cada % do total
// vira diretamente um valor de stroke-dasharray (sem conta de arco).
function desenharRosca(dados) {
  const total = dados.reduce((s, d) => s + d.valor, 0);
  if (total === 0) return '<p class="dash-vazio">Sem dados.</p>';

  const comValor = dados.filter(d => d.valor > 0);
  let acumulado = 0;
  const segmentos = comValor.map(d => {
    const pct = (d.valor / total) * 100;
    const dashoffset = 25 - acumulado; // 25 = começa no topo (12h), sentido horário
    acumulado += pct;
    return `<circle cx="21" cy="21" r="15.9155" fill="transparent" stroke="${d.cor}" stroke-width="6" stroke-dasharray="${pct} ${100 - pct}" stroke-dashoffset="${dashoffset}"></circle>`;
  }).join('');

  const legenda = comValor.map(d => `
    <div class="dash-legenda-item">
      <span class="dash-legenda-cor" style="background:${d.cor};"></span>
      ${escapeHtml(d.label)} <strong>${d.valor}</strong>
    </div>
  `).join('');

  return `
    <div class="dash-rosca-wrap">
      <svg viewBox="0 0 42 42" class="dash-rosca-svg">${segmentos}</svg>
      <div class="dash-legenda">${legenda}</div>
    </div>
  `;
}

// Ranking em barras horizontais a partir de [{label, valor}], já ordenado
// por quem chama. Se `onClickNomeFuncao` for passado, cada linha vira
// clicável e chama essa função global com o label (drill-down pra consulta).
function desenharRankingBarras(dados, textoVazio, onClickNomeFuncao) {
  if (!dados.length) return `<p class="dash-vazio">${textoVazio}</p>`;

  const max = Math.max(1, ...dados.map(d => d.valor));
  return '<div class="dash-ranking">' + dados.map(d => {
    const clicavel = onClickNomeFuncao
      ? ` onclick="${onClickNomeFuncao}('${String(d.label).replace(/'/g, "\\'")}')" style="cursor:pointer;"`
      : '';
    return `
    <div class="dash-ranking-linha"${clicavel}>
      <span class="dash-ranking-label">${escapeHtml(d.label)}</span>
      <div class="dash-ranking-trilho">
        <div class="dash-ranking-fill" style="width:${(d.valor / max) * 100}%"></div>
      </div>
      <span class="dash-ranking-valor">${d.valor}</span>
    </div>`;
  }).join('') + '</div>';
}
