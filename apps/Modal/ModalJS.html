<script>

  // ===== GENÉRICO / SISTEMA =====
  // O modal "processando" funciona com contador: cada exibirModal soma,
  // cada fecharModal subtrai, e ele só fecha quando zera. Assim várias
  // operações ao mesmo tempo (ou uma dentro da outra -- ex.: a tela abre o
  // Processando e runServerFunction abre de novo numa gravação) não fecham
  // o modal antes da hora.
  let contadorProcessando = 0;

  function exibirModal(id) {
    if (id === 'processando') contadorProcessando++;
    const modal = document.getElementById(id);
    if (modal) modal.classList.add('aberto');
  }

  function fecharModal(id) {
    if (id === 'processando') {
      contadorProcessando = Math.max(0, contadorProcessando - 1);
      if (contadorProcessando > 0) return;
    }
    const modal = document.getElementById(id);
    if (modal) modal.classList.remove('aberto');
  }

  // ===== MODAL DE MENSAGEM (substitui o alert do navegador) =====
  // mostrarMensagem(texto, tipo) abre #modalMensagem; tipo: 'sucesso' |
  // 'erro' | 'aviso' | 'info' (sem tipo, deduz pelo texto). Mensagens em
  // sequência entram numa fila e aparecem uma de cada vez. Devolve uma
  // Promise resolvida quando a pessoa fecha (pra quem quiser esperar com
  // await). window.alert é redirecionado pra cá, então todas as telas
  // passam a usar o modal sem mudar cada chamada; window.alertNativo
  // guarda o original.
  const TIPOS_MENSAGEM = {
    sucesso: { titulo: 'Sucesso', icone: '✔' },
    erro: { titulo: 'Erro', icone: '✖' },
    aviso: { titulo: 'Atenção', icone: '!' },
    info: { titulo: 'Informação', icone: 'i' }
  };
  const filaMensagens = [];
  let mensagemAtual = null;
  let mensagemAbertaEm = 0;

  function deduzirTipoMensagem(texto) {
    const t = String(texto || '').toLowerCase();
    if (/erro|falh|não foi possível|nao foi possivel|inválid|invalid|não encontrad/.test(t)) return 'erro';
    if (/sucesso|salv[oa] com|cadastrad[oa] com|atualizad[oa]|removid[oa] com|excluíd[oa] com|desativad[oa] com|reativad[oa] com|gerad[oa]s? com/.test(t)) return 'sucesso';
    if (/informe|preencha|selecione|escolha|adicione|obrigat|já existe|já está/.test(t)) return 'aviso';
    return 'info';
  }

  function mostrarMensagem(texto, tipo) {
    return new Promise(resolve => {
      filaMensagens.push({ texto: String(texto === undefined || texto === null ? '' : texto), tipo: tipo, resolve: resolve });
      if (!mensagemAtual) exibirProximaMensagem_();
    });
  }

  function exibirProximaMensagem_() {
    mensagemAtual = filaMensagens.shift() || null;
    const modal = document.getElementById('modalMensagem');
    if (!mensagemAtual) { if (modal) modal.classList.remove('aberto'); return; }
    if (!modal) { // sem o markup (não deveria acontecer): cai no alert original
      window.alertNativo(mensagemAtual.texto);
      const m = mensagemAtual; mensagemAtual = null; m.resolve(); exibirProximaMensagem_();
      return;
    }
    const tipo = TIPOS_MENSAGEM[mensagemAtual.tipo] ? mensagemAtual.tipo : deduzirTipoMensagem(mensagemAtual.texto);
    const cfg = TIPOS_MENSAGEM[tipo];
    modal.querySelector('.modal-mensagem').className = 'modal modal-mensagem modal-mensagem--' + tipo;
    document.getElementById('modalMensagemIcone').textContent = cfg.icone;
    document.getElementById('modalMensagemTitulo').textContent = cfg.titulo;
    document.getElementById('modalMensagemTexto').textContent = mensagemAtual.texto;
    modal.classList.add('aberto');
    mensagemAbertaEm = Date.now();
    const btn = document.getElementById('modalMensagemOk');
    if (btn) setTimeout(() => btn.focus(), 0);
  }

  function fecharMensagem() {
    const m = mensagemAtual;
    mensagemAtual = null;
    if (m) m.resolve();
    exibirProximaMensagem_();
  }

  // ===== MODAL DE CONFIRMAÇÃO (substitui o confirm do navegador) =====
  // confirmarModal(texto, { titulo, confirmar, cancelar }) abre
  // #modalConfirmacao e devolve uma Promise<boolean>: true em Confirmar
  // (ou Enter), false em Cancelar, Esc ou clique fora. Uso:
  //   if (!(await confirmarModal('Excluir?'))) return;
  let confirmacaoAtual = null;
  let confirmacaoAbertaEm = 0;

  // Campo de texto da confirmação (pedirTextoModal); null = sem campo
  let confirmacaoCampo = null;

  function confirmarModal(texto, opcoes) {
    const op = opcoes || {};
    const modal = document.getElementById('modalConfirmacao');
    if (!modal) return Promise.resolve(window.confirm(String(texto || '')));   // sem o markup: nativo
    if (confirmacaoAtual) confirmacaoAtual(false);   // uma por vez: a anterior conta como cancelada
    const campo = document.getElementById('modalConfirmacaoCampo');
    if (campo) campo.style.display = op.campo ? '' : 'none';
    confirmacaoCampo = op.campo || null;
    if (op.campo) {
      document.getElementById('modalConfirmacaoRotulo').textContent = op.campo.rotulo || '';
      const resp = document.getElementById('modalConfirmacaoResposta');
      resp.value = op.campo.valor || '';
      resp.classList.remove('is-invalid');
      document.getElementById('modalConfirmacaoErro').textContent = '';
    }
    document.getElementById('modalConfirmacaoTitulo').textContent = op.titulo || 'Confirmar';
    document.getElementById('modalConfirmacaoTexto').textContent = String(texto === undefined || texto === null ? '' : texto);
    document.getElementById('modalConfirmacaoOk').textContent = op.confirmar || 'Confirmar';
    document.getElementById('modalConfirmacaoCancelar').textContent = op.cancelar || 'Cancelar';
    modal.classList.add('aberto');
    confirmacaoAbertaEm = Date.now();
    setTimeout(() => { const b = document.getElementById(op.campo ? 'modalConfirmacaoResposta' : 'modalConfirmacaoOk'); if (b) b.focus(); }, 0);
    return new Promise(resolve => { confirmacaoAtual = resolve; });
  }

  // Como o prompt do navegador, mas no modal do sistema: devolve o texto
  // digitado ou null (cancelou). opcoes: { titulo, confirmar, cancelar,
  // rotulo, valor, obrigatorio }.
  async function pedirTextoModal(texto, opcoes) {
    const op = opcoes || {};
    if (!document.getElementById('modalConfirmacaoCampo')) {   // sem o markup: nativo
      const v = window.prompt(String(texto || ''), op.valor || '');
      return v === null ? null : String(v);
    }
    const ok = await confirmarModal(texto, Object.assign({}, op, { campo: { rotulo: op.rotulo || '', valor: op.valor || '', obrigatorio: !!op.obrigatorio } }));
    const resp = document.getElementById('modalConfirmacaoResposta');
    return ok ? String(resp ? resp.value : '').trim() : null;
  }

  function responderConfirmacao(sim) {
    // campo obrigatório vazio: não fecha
    if (sim && confirmacaoCampo && confirmacaoCampo.obrigatorio) {
      const resp = document.getElementById('modalConfirmacaoResposta');
      if (resp && !resp.value.trim()) {
        resp.classList.add('is-invalid');
        document.getElementById('modalConfirmacaoErro').textContent = 'Preencha este campo.';
        resp.focus();
        return;
      }
    }
    confirmacaoCampo = null;
    const resolver = confirmacaoAtual;
    confirmacaoAtual = null;
    const modal = document.getElementById('modalConfirmacao');
    if (modal) modal.classList.remove('aberto');
    if (resolver) resolver(!!sim);
  }

  document.addEventListener('keydown', (e) => {
    if (!confirmacaoAtual || mensagemAtual) return;
    if (e.key === 'Enter' && e.target && e.target.id === 'modalConfirmacaoResposta') return;
    if (e.key === 'Escape' || e.key === 'Enter') {
      e.preventDefault();
      e.stopPropagation();
      if (Date.now() - confirmacaoAbertaEm > 250) responderConfirmacao(e.key === 'Enter');
    }
  }, true);
  document.addEventListener('click', (e) => {
    if (confirmacaoAtual && e.target && e.target.id === 'modalConfirmacao') responderConfirmacao(false);
  });

  window.alertNativo = window.alert.bind(window);
  window.alert = function (texto) { mostrarMensagem(texto); };

  // Fase de captura: com a mensagem aberta, Enter/Esc fecham e não chegam
  // ao formulário por trás. Ignora a própria tecla que abriu a mensagem.
  document.addEventListener('keydown', (e) => {
    if (!mensagemAtual) return;
    if (e.key === 'Escape' || e.key === 'Enter') {
      e.preventDefault();
      e.stopPropagation();
      if (Date.now() - mensagemAbertaEm > 250) fecharMensagem();
    }
  }, true);
  document.addEventListener('click', (e) => {
    if (mensagemAtual && e.target && e.target.id === 'modalMensagem') fecharMensagem();
  });


  function fecharModalCadastroLocalizacao() {
    const modal = document.getElementById('modalCadastroLocalizacao');
    if (modal) modal.classList.remove('aberto');
  }

  // ===== FORNECEDOR =====
  function fecharModalCadastroFornecedor() {
    const modal = document.getElementById('modalCadastroFornecedor');
    if (modal) modal.classList.remove('aberto');
  }

  // Fecha os modais de cadastro rápido / exclusão de Fornecedor ao clicar fora ou apertar Escape.
  document.addEventListener('DOMContentLoaded', () => {
    ['modalCadastroFornecedor', 'modalCadastroLocalizacao', 'modalExclusaoFornecedor'].forEach(idModal => {
      const elModal = document.getElementById(idModal);
      if (elModal) {
        elModal.addEventListener('click', (e) => {
          if (e.target.classList.contains('modal-overlay')) elModal.classList.remove('aberto');
        });
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        fecharModalCadastroFornecedor();
        fecharModalCadastroLocalizacao();
        fecharModal('modalExclusaoFornecedor');
      }
    });
  });

</script>
