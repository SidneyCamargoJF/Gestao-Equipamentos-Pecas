<!-- JAVASCRIPT ORIENTADO A OBJETOS -->
<script>
class EquipmentController {
  constructor() {
    this.equipments = [];
    this.listaFiltrada = [];
    this.idExclusao = null;
    this.sortState = { coluna: null, direcao: 'asc' };
  }

  // ===== INICIALIZAÇÃO =====
  init() {
    this.bindEvents();
    this.consultar();
  }

  bindEvents() {
    const inputEquipment = document.getElementById('equipmentSearch');
    if (inputEquipment) inputEquipment.focus();

    // Eventos de overlay e esc
    const modais = ['modalExclusaoEquipment', 'modalEdicaoEquipment', 'modalCadastroEquipment'];
    modais.forEach(idModal => {
      const elModal = document.getElementById(idModal);
      if (elModal) {
        elModal.addEventListener('click', (e) => {
          if (e.target.classList.contains('modal-overlay')) {
            this.fecharTodosModais();
          }
        });
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        this.fecharTodosModais();
      }
    });
  }

  fecharTodosModais() {
    if (typeof fecharModal === 'function') {
      fecharModal('modalCadastroEquipment');
      fecharModal('modalEdicaoEquipment');
      fecharModal('modalExclusaoEquipment');
    }
  }

  // ===== CONSULTA E FILTROS =====
  consultar() {
    const equipmentInput = document.getElementById('equipmentSearch');
    const equipment = equipmentInput ? equipmentInput.value.trim().toLowerCase() : '';
    const criterios = { equipment };

    google.script.run
      .withSuccessHandler(objEquipments => this.retornoEquipments(objEquipments))
      .withFailureHandler(err => console.error('Erro ao consultar: ', err))
      .filtrarEquipments(criterios);
  }

  retornoEquipments(objEquipments) {
    this.Equipments = Array.isArray(objEquipments) ? objEquipments : [];
    this.listaFiltrada = typeof aplicarOrdenacao === 'function' ? aplicarOrdenacao(this.Equipments) : this.Equipments;

    const opcoesEquipment = [...new Set(this.Equipments.map(m => m.Equipment).filter(Boolean))];
    if (typeof initSearch === 'function') {
      initSearch('equipmentSearch', 'equipmentDropdown', 'equipmentWrapper', opcoesEquipment);
    }

    this.renderTabelaEquipment(this.listaFiltrada);
  }

  filtrarEquipment() {
    const equipmentInput = document.getElementById('equipmentSearch');
    const equipment = equipmentInput ? equipmentInput.value.trim().toLowerCase() : '';

    this.listaFiltrada = this.equipments.filter(m => {
      if (equipment && !(m.equipment || '').toLowerCase().includes(equipment)) return false;
      return true;
    });

    if (typeof aplicarOrdenacao === 'function') {
      this.listaFiltrada = aplicarOrdenacao(this.listaFiltrada);
    }
    this.renderTabelaEquipment(this.listaFiltrada);
  }

  limparFiltrosEquipment() {
    const inputEquipment = document.getElementById('equipmentSearch');
    if (inputEquipment) inputEquipment.value = '';

    this.sortState = { coluna: null, direcao: 'asc' };
    if (typeof atualizarIndicadores === 'function') atualizarIndicadores();
    this.consultar();

    if (inputEquipment) inputEquipment.focus();
  }

  // ===== RENDERIZAÇÃO DE TABELA =====
  renderTabelaEquipment(lista) {
    const tbody = document.getElementById('tabelaBodyEquipment');
    if (!tbody) return;

    tbody.innerHTML = '';

    if (!lista || lista.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="2">Nenhum registro encontrado.</td></tr>';
      return;
    }

    lista.forEach(m => {
      const tr = document.createElement('tr');
      if (m.desativada) tr.classList.add('linha-desativada');

      const btnEditar = document.createElement('button');
      btnEditar.className = 'btn-acao btn-editar-linha';
      btnEditar.title = 'Editar';
      btnEditar.innerText = '✏️';

      const btnExcluir = document.createElement('button');
      btnExcluir.className = 'btn-acao btn-excluir-linha';
      btnExcluir.title = 'Desativar';
      btnExcluir.innerText = '🗑️';

      if (m.desativada) {
        btnEditar.disabled = true;
        btnEditar.style.cssText = 'opacity:0.3; cursor:not-allowed;';
        btnExcluir.disabled = true;
        btnExcluir.style.cssText = 'opacity:0.3; cursor:not-allowed;';
      } else {
        btnEditar.addEventListener('click', () => this.abrirModalEdicao(m.id));
        btnExcluir.addEventListener('click', () => this.confirmaExclusao(m.id));
      }

      const tdConteudo = document.createElement('td');
      const textEscaped = typeof escapeHtml === 'function' ? escapeHtml(m.equipment) : m.equipment;
      tdConteudo.innerHTML = `${textEscaped} ${m.desativada ? '<span class="status-desativado">(Desativado)</span>' : ''}`;

      const tdAcoes = document.createElement('td');
      tdAcoes.appendChild(btnEditar);
      tdAcoes.appendChild(btnExcluir);

      tr.appendChild(tdConteudo);
      tr.appendChild(tdAcoes);
      tbody.appendChild(tr);
    });
  }

  // ===== MODAL DE CADASTRO =====
  abrirModalCadastroEquipment() {
    const input = document.getElementById('novoEquipmentNome');
    if (input) input.value = '';

    const modal = document.getElementById('modalCadastroEquipment');
    if (modal) {
      modal.classList.add('aberto');
      setTimeout(() => input && input.focus(), 100);
    }
  }

  salvarNovoEquipment() {
    const input = document.getElementById('novoEquipmentNome');
    const nomeEquipment = input ? input.value.trim() : '';

    if (!nomeEquipment) {
      alert('Por favor, digite o nome do Equipamento.');
      return;
    }

    google.script.run
      .withSuccessHandler((resposta) => {
        if (resposta && resposta.sucesso) {
          this.consultar();
          if (typeof fecharModal === 'function') fecharModal('modalCadastroEquipment');
        } else {
          alert(resposta ? resposta.mensagem : 'Erro ao cadastrar.');
        }
      })
      .withFailureHandler((err) => {
        console.error('Erro ao cadastrar:', err);
        alert('Ocorreu um erro no script: ' + (err.message || err));
      })
      .cadastrarEquipment(nomeEquipment);
  }

  // ===== MODAL DE EDIÇÃO =====
  abrirModalEdicao(id) {
    const equipmentEncontrada = this.equipments.find(m => String(m.id) === String(id));

    document.getElementById('editEquipmentId').value = id;
    document.getElementById('editEquipmentNome').value = equipmentEncontrada ? equipmentEncontrada.equipment : '';

    const modal = document.getElementById('modalEdicaoEquipment');
    if (modal) modal.classList.add('aberto');
  }

  executarEdicao() {
    const id = document.getElementById('editEquipmentId').value;
    const novoNome = document.getElementById('editEquipmentNome').value;

    if (!novoNome || !novoNome.trim()) {
      alert("Por favor, digite o nome do equipamento.");
      return;
    }

    google.script.run
      .withSuccessHandler((resposta) => {
        if (resposta && resposta.sucesso) {
          if (typeof fecharModal === 'function') fecharModal('modalEdicaoEquipment');
          this.consultar();
        } else {
          alert(resposta ? resposta.mensagem : "Erro ao atualizar.");
        }
      })
      .withFailureHandler((err) => {
        console.error('Erro ao edita: ', err);
        alert('Erro de comunicação com o servidor.');
      })
      .editarEquipment(id, novoNome.trim());
  }

  // ===== MODAL DE EXCLUSÃO =====
  confirmaExclusao(id) {
    if (!id) {
      alert("Erro: Nenhum registro selecionado.");
      return;
    }
    this.idExclusao = id;
    if (typeof exibirModal === 'function') {
      exibirModal('modalExclusaoEquipment');
    } else {
      const modal = document.getElementById('modalExclusaoEquipment');
      if (modal) modal.classList.add('aberto');
    }
  }

  async executarExclusao() {
    if (typeof executarExclusao === 'function') {
      await executarExclusao('tbl_equipment', this.idExclusao);
    }
    this.idExclusao = null;
    this.consultar();
    if (typeof fecharModal === 'function') fecharModal('modalExclusaoEquipment');
  }
}

// Instanciação da Controller
const equipmentController = new EquipmentController();

document.addEventListener('DOMContentLoaded', () => {
  equipmentController.init();
});

</script>
