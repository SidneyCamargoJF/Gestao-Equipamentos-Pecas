    <!-- PAGE 6: AGENDA -->
    <section id="page-agenda" class="spa-page">
      <div class="page-header">
        <h1>📅 Agenda</h1>
      </div>

      <div class="panel agenda-painel">
        <div class="agenda-controles">
          <div class="agenda-controles-nav">
            <button type="button" class="btn-secondary agenda-btn-nav" title="Período anterior" onclick="navegarAgenda(-1)">‹</button>
            <span id="agendaMesRotulo" class="agenda-mes-rotulo"></span>
            <select id="agendaAnoSelect" class="field__select agenda-ano-select" onchange="mudarAnoAgenda()"></select>
            <button type="button" class="btn-secondary agenda-btn-nav" title="Próximo período" onclick="navegarAgenda(1)">›</button>
          </div>
          <div class="agenda-controles-acoes">
            <!-- Período mostrado: só o dia, a semana, o mês ou o ano -->
            <div class="tabs-nav agenda-modo agenda-periodo">
              <!-- Hoje: volta para a data de hoje no período escolhido -->
              <button type="button" class="tab-btn agenda-btn-hoje" title="Voltar para hoje" onclick="irParaHojeAgenda()">Hoje</button>
              <button type="button" class="tab-btn" id="agendaPeriodo-dia" onclick="mudarPeriodoAgenda('dia')">Dia</button>
              <button type="button" class="tab-btn" id="agendaPeriodo-semana" onclick="mudarPeriodoAgenda('semana')">Semana</button>
              <button type="button" class="tab-btn active" id="agendaPeriodo-mes" onclick="mudarPeriodoAgenda('mes')">Mês</button>
              <button type="button" class="tab-btn" id="agendaPeriodo-ano" onclick="mudarPeriodoAgenda('ano')">Ano</button>
            </div>
            <div class="tabs-nav agenda-modo">
              <button type="button" class="tab-btn active" id="agendaModoCalendario" onclick="mudarModoAgenda('calendario')">📅 Calendário</button>
              <button type="button" class="tab-btn" id="agendaModoLista" onclick="mudarModoAgenda('lista')">📋 Lista por dia</button>
            </div>
          </div>
        </div>

        <div class="agenda-legenda">
          <span class="agenda-legenda-item"><span class="agenda-ponto agenda-cor-chamado"></span>Chamados</span>
          <span class="agenda-legenda-item"><span class="agenda-ponto agenda-cor-preventiva"></span>Preventivas previstas</span>
          <span class="agenda-legenda-item"><span class="agenda-ponto agenda-cor-contrato"></span>Contratos vencendo</span>
          <span class="agenda-legenda-item"><span class="agenda-ponto agenda-cor-peca"></span>Garantias de peças vencendo</span>
          <span class="agenda-legenda-item"><span class="agenda-ponto agenda-cor-garantia"></span>Prazos de resposta de garantias</span>
        </div>

        <div id="agendaVisaoCalendario">
        <div class="agenda-dias-semana" id="agendaDiasSemana">
          <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
        </div>

        <div id="agendaGrid" class="agenda-grid"><!-- preenchido via JS: desenharGradeAgenda() --></div>
        </div>

        <!-- Listagem corrida do período, quebrada por dia: desenharListaAgenda() -->
        <div id="agendaLista" class="agenda-lista" style="display:none;"></div>
      </div>
    </section>
