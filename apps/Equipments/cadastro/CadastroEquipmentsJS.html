      console.log('Já existe um Patrimônio com este número cadastrado.')
      this.btnEquipSave.style.display = 'none'

      return true
    }

    /**
     *  verifica se existe o patrimonio no bd quando for novo, para não deixar cadastrar repetido
     */
    buscaPatrimonio() {
      console.log('conferePatrimonio()')

      let patrimonio = this.equipPatrimonio.value;
      let dados = this.tblEquipment.readContext('patrimonio', '=', patrimonio );

      if (dados) return dados;

      return false
    }

    // 
    // VALIDAÇÃO DOS CAMPOS OBRIGATÓRIOS
    // 
    validarFormulario() {
      const CAMPOS_OBRIGATORIOS = [
        'patrimonio', 'nome', 'marca', 'localizacao'
      ];

      let primeiroInvalido = null;

      CAMPOS_OBRIGATORIOS.forEach(id => {
        const el = document.getElementById(id);
        if (!el.value.trim()) {
          el.classList.add('campo-invalido');
          if (!primeiroInvalido) primeiroInvalido = el;
        } else {
          el.classList.remove('campo-invalido');
        }
      });

      if (primeiroInvalido) {
        primeiroInvalido.focus();
        alert('ERRO: Faltam dados obrigatórios.');
        return false;
      }

      return true;
    }

    // 
    // UTILITÁRIOS
    // 
    escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    limpar() {
      document.querySelectorAll('.field__input, .field__select').forEach(el => {
        el.value = '';
      });

      document.getElementById('formTitulo').textContent = 'Novo';
      document.getElementById('formStatus').textContent = 'Rascunho';
    }

    // 
    // SALVAR FORNECEDOR (cria ou atualiza, conforme o CNPJ)
    // Chama salvarFornecedorBackend() no Fornecedor_Backend.gs
    // 
    salvar() {
      if (!this.validarFormulario()) return;

      const dados = this.coletarDados();
      const btn = document.querySelector('.btn-primary');
      btn.disabled = true;

      google.script.run
        .withSuccessHandler(function (resultado) {
          btn.disabled = false;
          if (!resultado.sucesso) {
            alert(resultado.mensagem);
            return;
          }
          alert(resultado.mensagem);
          this.limpar();
        })
        .withFailureHandler(function (erro) {
          btn.disabled = false;
          alert('Erro ao salvar fornecedor: ' + erro.message);
        })
        .saveEquipments(dados);
    }

    // RENDER / INICIALIZAÇÃO DA TELA
    // Chamada pelo sistema de navegação (SPA) logo depois de injetar o HTML
    // do CadastroFornecedorForm no container da página — igual o padrão do
    // renderContratosForm() do Contrato. Liga as máscaras e os eventos nos
    // campos, já que aqui não existe um "DOMContentLoaded" novo (o HTML foi
