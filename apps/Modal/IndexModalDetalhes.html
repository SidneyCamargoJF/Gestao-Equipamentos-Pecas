<script>

    // SPA View Switcher
    function trocarPagina(paginaId) {
      // Hide all SPA pages
      document.querySelectorAll('.spa-page').forEach(page => page.classList.remove('active'));

      // Deactivate all menu highlights
      document.querySelectorAll('.menu-item, .dropdown-item').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.menu-dropdown').forEach(el => el.classList.remove('active-parent'));

      // Activate target page
      const pageAlvo = document.getElementById(`page-${paginaId}`);
      if (pageAlvo) {
        pageAlvo.classList.add('active');
      }

      // Highlight active menu item
      const navItem = document.getElementById(`nav-${paginaId}`);
      if (navItem) {
        navItem.classList.add('active');
        if (navItem.classList.contains('dropdown-item')) {
          document.getElementById('nav-cadastros').classList.add('active-parent');
        }
      }

      // Render view dynamic content
      if (paginaId === 'dashboard') renderDashboard();
      if (paginaId === 'equipamentos') renderEquipamentos();

      if (paginaId === 'marcas-view') renderMarcasView(); // 06/08/2026

      if (paginaId === 'pecas-view') renderPecasView();
      if (paginaId === 'pecas-form') renderPecasForm();

      if (paginaId === 'contratos-form') renderContratosForm();
      
      if (paginaId === 'chamados') renderChamados();
      if (paginaId === 'ordens') renderOrdens();
      if (paginaId === 'agenda') renderAgenda();

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    

</script>
