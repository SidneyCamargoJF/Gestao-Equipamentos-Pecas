<script>

  async function renderMarcasView() {

    await inicializarMarcas()

    consultarMarcas()

    const inputMarcaSearch = document.getElementById('marcaSearch');
    if (inputMarcaSearch) inputMarcaSearch.focus();

  }

  // ===== CONSULTAR, FILTRAR E RENDERIZAR =====
  function consultarMarcas() {
    const marcaInput = document.getElementById('marcaSearch');
    const marca = marcaInput ? marcaInput.value.trim().toLowerCase() : '';

    const criterios = { marca: marca };

    google.script.run
      .withSuccessHandler(RetornoMarcas)
      .withFailureHandler(err => console.error('Erro ao consultar: ', err))
      .filtrarMarcas(criterios);
  }

  function RetornoMarcas(objmarcas) {
    marcas = Array.isArray(objmarcas) ? objmarcas : [];
    listaFiltrada = aplicarOrdenacao(marcas);

    // Atualiza opções do dropdown de busca
    const opcoesMarca = [...new Set(marcas.map(m => m.marca).filter(Boolean))];
    initSearchMarcas('marcaSearch', 'marcaDropdown', 'marcaWrapper', opcoesMarca);

    renderTabela(listaFiltrada);
  }

  // ===== COMPONENTE DE BUSCA COM DROPDOWN COMPLETO AO DAR FOCO =====
  // Função exclusiva desta tela para não colidir com o "initSearch" de outras páginas
  // (todo <script> do Apps Script cai no mesmo escopo global).
  function initSearchMarcas(inputId, dropdownId, wrapperId, opcoes) {
    const input = document.getElementById(inputId);
    const dropdown = document.getElementById(dropdownId);
    const wrapper = document.getElementById(wrapperId);

    if (!input || !dropdown || !wrapper) return;

    const listaOpcoes = Array.isArray(opcoes) ? opcoes : [];

    function renderLista(filtro) {
      const f = (filtro || '').toLowerCase().trim();
      const itens = (f === '') ? listaOpcoes : listaOpcoes.filter(o => String(o).toLowerCase().includes(f));

      dropdown.innerHTML = '';
      if (itens.length === 0) {
        dropdown.innerHTML = '<div class="search-no-result">Nenhum resultado</div>';
      } else {
        itens.forEach(o => {
          const div = document.createElement('div');
          div.className = 'search-option';
          div.textContent = o;
          div.addEventListener('mousedown', (e) => {
            e.preventDefault();
            input.value = o;
            dropdown.classList.remove('visible', 'active');
            filtrarMarca();
          });
          dropdown.appendChild(div);
        });
      }
    }

    input.addEventListener('focus', () => {
      renderLista(input.value);
      dropdown.classList.add('visible', 'active');
    });

    input.addEventListener('input', () => {
      renderLista(input.value);
      dropdown.classList.add('visible', 'active');
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); dropdown.classList.remove('visible', 'active'); filtrarMarca(); }
      if (e.key === 'Escape') dropdown.classList.remove('visible', 'active');
    });

    document.addEventListener('click', (e) => {
      if (!wrapper.contains(e.target)) dropdown.classList.remove('visible', 'active');
    });
  }

  function filtrarMarca() {
    const marcaInput = document.getElementById('marcaSearch');
    const marca = marcaInput ? marcaInput.value.trim().toLowerCase() : '';
    
    listaFiltrada = marcas.filter(m => {
      if (marca && !(m.marca || '').toLowerCase().includes(marca)) return false;
      return true;
    });

    listaFiltrada = aplicarOrdenacao(listaFiltrada);
    renderTabela(listaFiltrada);
  }

  function limparFiltrosMarca() {
    const inputMarca = document.getElementById('marcaSearch');
    if (inputMarca) inputMarca.value = '';
    
    sortState = { coluna: null, direcao: 'asc' };
    atualizarIndicadores();
    consultarMarcas();

    if (inputMarca) inputMarca.focus();
  }

  // ===== INICIALIZAÇÃO SEGURA =====
  // Só cuida dos modais (compartilhados por toda a SPA); os dados da tela de Marcas
  // em si são carregados por renderMarcasView() quando a página fica ativa.
  document.addEventListener('DOMContentLoaded', () => {
    // Eventos de clique fora para fechar os modais
    ['modalExclusao', 'modalEdicao', 'modalCadastro'].forEach(idModal => {
      const elModal = document.getElementById(idModal);
      if (elModal) {
        elModal.addEventListener('click', (e) => {
          if (e.target.classList.contains('modal-overlay')) {
            fecharModalExclusao();
            fecharModalEdicao();
            fecharModalCadastro();
          }
        });
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        fecharModalExclusao();
        fecharModalEdicao();
        fecharModalCadastro();
      }
    });
  });

  // === MODAL DE EDIÇÃO === 
  function abrirModalEdicao(id) {
    const marcaEncontrada = marcas ? marcas.find(m => String(m.id) === String(id)) : null;

    document.getElementById('editMarcaId').value = id;
    document.getElementById('editMarcaNome').value = marcaEncontrada ? marcaEncontrada.marca : '';

    const modal = document.getElementById('modalEdicao');
    if (modal) modal.classList.add('aberto');
  }

  function fecharModalEdicao() {
    document.getElementById('editMarcaId').value = '';
    document.getElementById('editMarcaNome').value = '';

    const modal = document.getElementById('modalEdicao');
    if (modal) modal.classList.remove('aberto');
  }

  function executarEdicao() {
    const id = document.getElementById('editMarcaId').value;
    const novoNome = document.getElementById('editMarcaNome').value;

    if (!novoNome || !novoNome.trim()) {
      alert("Por favor, digite o nome da marca.");
      return;
    }

    google.script.run
      .withSuccessHandler((resposta) => {
        if (resposta && resposta.sucesso) {
          fecharModalEdicao();
          consultarMarcas();
        } else {
          alert(resposta ? resposta.mensagem : "Erro ao atualizar a marca.");
        }
      })
      .withFailureHandler((err) => {
        console.error('Erro ao editar marca: ', err);
        alert('Erro de comunicação com o servidor.');
      })
      .editarMarca(id, novoNome.trim());
  }

  function executarExclusaoMarca() {
    if (!idExclusao) {
      alert("Nenhum registro selecionado.");
      return;
    }

    google.script.run
      .withSuccessHandler((resposta) => {
        if (resposta && resposta.sucesso === false) {
          alert(resposta.mensagem);
        } else {
          fecharModalExclusao();
          consultarMarcas();
        }
      })
      .withFailureHandler((err) => {
        console.error('Erro ao desativar marca:', err);
        alert('Erro ao conectar com o servidor.');
      })
      .desativarMarca(idExclusao);
  }

  // ==== MODAL DE CADASTRO DE MARCA ====
  // origem: 'marcas' (tela de Marcas) ou 'pecas' (botão + no Cadastro de Peças) --
  // define o que atualizar depois de salvar com sucesso.
  let origemModalCadastroMarca = 'marcas';

  function abrirModalCadastro(origem) {
    origemModalCadastroMarca = origem || 'marcas';

    const input = document.getElementById('novaMarcaNome');
    if (input) {
      input.value = '';
      input.classList.remove('is-invalid');
    }

    const modal = document.getElementById('modalCadastro');
    if (modal) {
      modal.classList.add('aberto');
      setTimeout(() => input && input.focus(), 100);
    }
  }

  function salvarNovaMarca() {
    const input = document.getElementById('novaMarcaNome');
    const nomeMarca = input ? input.value.trim() : '';

    if (!nomeMarca) {
      if (input) {
        input.classList.add('is-invalid');
        input.focus();
      }
      return;
    }

    if (input) input.classList.remove('is-invalid');

    google.script.run
      .withSuccessHandler((resposta) => {
        if (resposta && resposta.sucesso) {
          fecharModalCadastro();
          if (origemModalCadastroMarca === 'pecas' && typeof atualizarMarcaSelectPecas === 'function') {
            atualizarMarcaSelectPecas(nomeMarca);
          } else {
            consultarMarcas();
          }
        } else {
          alert(resposta ? resposta.mensagem : 'Erro ao cadastrar marca.');
        }
      })
      .withFailureHandler((err) => {
        console.error('Erro ao cadastrar marca:', err);
        alert('Ocorreu um erro no script: ' + (err.message || err));
      })
      .cadastrarMarca(nomeMarca);
  }

  // ===== INICIALIZAÇÃO =====

  // document.addEventListener('DOMContentLoaded', inicializarPagina)

  async function inicializarMarcas() {

    document.getElementById('modalExclusao').addEventListener('click', (e) => {
      if (e.target.classList.contains('modal-overlay')) fecharModalExclusao();
    });

    document.getElementById('novaMarcaNome').addEventListener('input', (e) => {
      e.target.classList.remove('is-invalid');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') fecharModalExclusao();
    });
  };

</script>
