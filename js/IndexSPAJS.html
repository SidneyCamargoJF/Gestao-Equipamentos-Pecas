<script>

  // Histórico de navegação pro botão "Voltar" global (#btnVoltarGlobal).
  // voltandoPagina evita empilhar de novo a página que a gente está
  // deixando quando a troca foi disparada pelo próprio botão de voltar.
  let paginaHistorico = [];
  let voltandoPagina = false;

  function voltarPagina() {
    if (paginaHistorico.length === 0) {
      trocarPagina('dashboard');
      return;
    }
    const anterior = paginaHistorico.pop();
    voltandoPagina = true;
    trocarPagina(anterior);
  }

  // SPA View Switcher
  function trocarPagina(paginaId, param) {
    const paginaAtivaAntes = document.querySelector('.spa-page.active');
    const idAtual = paginaAtivaAntes ? paginaAtivaAntes.id.replace('page-', '') : null;

    if (!voltandoPagina && idAtual && idAtual !== paginaId) {
      paginaHistorico.push(idAtual);
    }
    voltandoPagina = false;

    const btnVoltar = document.getElementById('btnVoltarGlobal');
    if (btnVoltar) btnVoltar.style.display = (paginaId === 'dashboard') ? 'none' : 'flex';

    // Hide all SPA pages
    document.querySelectorAll('.spa-page').forEach(page => page.classList.remove('active'));

    // Deactivate all menu highlights
    document.querySelectorAll('.menu-item, .dropdown-item').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.menu-dropdown').forEach(el => el.classList.remove('active-parent'));

    // Activate target page
    const pageAlvo = document.getElementById(`page-${paginaId}`);
    if (pageAlvo) {
      pageAlvo.classList.add('active');
    }

    // Highlight active menu item
    const navItem = document.getElementById(`nav-${paginaId}`);
    if (navItem) {
      navItem.classList.add('active');
      if (navItem.classList.contains('dropdown-item')) {
        document.getElementById('nav-cadastros').classList.add('active-parent');
      }
    }

    // Render view dynamic content
    if (paginaId === 'dashboard') renderDashboard();
    if (paginaId === 'equipments-view') equipmentsViewController.consultar();
    if (paginaId === 'equipments-form') equipmentsFormController.render(param);

    if (paginaId === 'pecas-view') renderPecas();
    if (paginaId === 'pecas-form') renderCadastroPecas(param);

    if (paginaId === 'contratos-form') renderContratosForm(param);

    if (paginaId === 'contratos-view') renderConsultaContratos();

    if (paginaId === 'fornecedor-view') renderFornecedorView();

    if (paginaId === 'fornecedor-form') renderFornecedorForm(param);

    if (paginaId === 'chamado-form') renderChamadoForm(param);

    if (paginaId === 'chamado-view') renderConsultaChamados();


    if (paginaId === 'ordens') renderOrdens();
    if (paginaId === 'agenda') renderAgenda();
    if (paginaId === 'relatorios') renderRelatorios();
    if (paginaId === 'configuracoes') renderConfiguracoes();

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }


</script>
