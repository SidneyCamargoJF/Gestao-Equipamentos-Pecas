<script> // CadastroContratosFormJS.html

  function renderContratosForm() {
    initTabs();
    initSearch('empresaSearch', 'empresaDropdown', 'empresaWrapper', opcoesEmpresa);
    initBuscaServicoNome();
    initBuscaProdutoNome();
    initBuscaChecklist();
    registrarCampoAnexoCadastro('contratoAnexoArquivo', 'contratoAnexoLista');
    initDataEncerramentoOpacidade();

    const telField = document.getElementById('telefone');
    if (telField) mascaraTelefone(telField);

    const patField = document.getElementById('eqBuscaPat');
    if (patField) {
      patField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); buscarEquipamentoBase(); }
      });
    }
    const nomeField = document.getElementById('eqBuscaNome');
    if (nomeField) {
      nomeField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); buscarEquipamentoBase(); }
      });
    }

    renderizarEquipamentos();
    renderizarServicos();
    renderizarProdutos();
    renderizarChecklist();
  }

  // Campo "Data Encerramento" fica opaco/esmaecido por padrão (classe
  // field-opcional-encerramento no CSS). Fica normal (classe campo-ativo)
  // enquanto a pessoa está com foco nele OU já preencheu uma data -- some
  // de novo só quando perde o foco COM o campo vazio.
  function atualizarOpacidadeDataEncerramento() {
    const input = document.getElementById('dataEncerramento');
    const campo = input ? input.closest('.field-opcional-encerramento') : null;
    if (!input || !campo) return;

    const ativo = (document.activeElement === input) || !!input.value;
    campo.classList.toggle('campo-ativo', ativo);
  }

  function initDataEncerramentoOpacidade() {
    const input = document.getElementById('dataEncerramento');
    if (!input) return;

    input.addEventListener('focus', atualizarOpacidadeDataEncerramento);
    input.addEventListener('blur', atualizarOpacidadeDataEncerramento);
    input.addEventListener('input', atualizarOpacidadeDataEncerramento);
    atualizarOpacidadeDataEncerramento();
  }


// CRUD arrays
let equipamentos = [];
let servicos = [];
let produtos = [];
let checklist = [];

// Edit indexes
let servicoEditIdx = -1;
let checklistEditIdx = -1;

// Variáveis globais para busca
let equipamentoSelecionado = null;
let servicoSelecionado = null;
let produtoSelecionado = null;
let checklistItemSelecionado = null;


// 
// BUSCA E VINCULAÇÃO DE EQUIPAMENTOS (BASE → CONTRATO)
// 

function initBuscaEquipNome() {
  const input = document.getElementById('eqBuscaNome');
  const dropdown = document.getElementById('eqBuscaNomeDropdown');
  const wrapper = document.getElementById('eqBuscaNomeWrapper');

  function renderLista(filtro) {
    const f = (filtro || '').toLowerCase();
    dropdown.innerHTML = '';
    if (f.length < 2) {
      dropdown.innerHTML = '<div class="search-no-result">Digite pelo menos 2 caracteres...</div>';
      return;
    }
    const itens = baseEquipamentos
      .filter(e => e.nome.toLowerCase().includes(f))
      .slice(0, 10)
      .map(e => ({ label: e.nome + ' | ' + e.patrimonio, value: e }));

    if (itens.length === 0) {
      dropdown.innerHTML = '<div class="search-no-result">Nenhum resultado</div>';
    } else {
      itens.forEach(item => {
        const div = document.createElement('div');
        div.className = 'search-option';
        div.textContent = item.label;
        div.addEventListener('click', () => {
          input.value = item.value.nome;
          dropdown.classList.remove('visible');
          equipamentoSelecionado = item.value;
          mostrarResultadoBusca(item.value);
        });
        dropdown.appendChild(div);
      });
    }
  }

  input.addEventListener('focus', () => {
    if (input.value.trim().length >= 2) {
      renderLista(input.value);
      dropdown.classList.add('visible');
    }
  });

  input.addEventListener('input', () => {
    if (input.value.trim().length >= 2) {
      renderLista(input.value);
      if (!dropdown.classList.contains('visible')) dropdown.classList.add('visible');
    } else {
      dropdown.classList.remove('visible');
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); dropdown.classList.remove('visible'); buscarEquipamentoBase(); }
    if (e.key === 'Escape') dropdown.classList.remove('visible');
  });

  document.addEventListener('click', (e) => {
    if (!wrapper.contains(e.target)) dropdown.classList.remove('visible');
  });
}

async function buscarEquipamentoBase() {
  const pat = document.getElementById('eqBuscaPat').value.trim();
  const nome = document.getElementById('eqBuscaNome').value.trim();

  if (!pat && !nome) {
    alert('Informe o patrimônio ou o nome para buscar.'); return;
  }

  // Patrimônio é uma chave única -- só pode achar um. Nome não é (ex: "ar
  // condicionado" pode bater em vários aparelhos diferentes), então usa
  // uma função e uma exibição diferente pra cada caso.
  if (pat) {
    await buscarEquipamentoPorPatrimonio(pat);
  } else {
    await buscarEquipamentosPorNomeUI(nome);
  }
}

async function buscarEquipamentoPorPatrimonio(pat) {
  document.getElementById('eqResultadoLista').style.display = 'none';

  try {
    const resultado = await runServerFunction('verificarPatrimonioEquipamento', pat);
    if (resultado && resultado.existe) {
      equipamentoSelecionado = {
        id: resultado.id,
        nome: resultado.nome,
        marca: resultado.marca,
        modelo: resultado.modelo,
        capacidade: resultado.capacidade,
        patrimonio: pat,
        localizacao: resultado.localizacao
      };
      mostrarResultadoBusca(equipamentoSelecionado);
    } else {
      equipamentoSelecionado = null;
      document.getElementById('eqResultado').style.display = 'none';
      document.getElementById('eqVazio').style.display = 'block';
    }
  } catch (error) {
    console.error('Erro ao buscar equipamento:', error);
    alert('Erro ao buscar equipamento.');
  }
}

// Guarda a última lista de resultados da busca por Nome, pra achar de novo
// pelo índice quando clica em "Adicionar" num deles.
let equipamentosEncontradosPorNome = [];

async function buscarEquipamentosPorNomeUI(nome) {
  document.getElementById('eqResultado').style.display = 'none';

  try {
    const resultados = await runServerFunction('buscarEquipamentosPorNome', nome);
    equipamentosEncontradosPorNome = Array.isArray(resultados) ? resultados : [];
    montarListaResultadosBuscaNome(equipamentosEncontradosPorNome);
  } catch (error) {
    console.error('Erro ao buscar equipamento:', error);
    alert('Erro ao buscar equipamento.');
  }
}

// Monta a lista por concatenação de string (com '+'), igual renderizarEquipamentos
// logo abaixo -- NÃO usar template literal (crase) aqui. Foi template
// literal com SVG dentro que causou o SyntaxError "linha 351" na forma como
// o Apps Script empacota a página inteira numa string só.
//
// Esconde da lista quem já está em "equipamentos" (vinculados ao
// contrato) -- por isso filtra ANTES de desenhar, mas guarda o índice
// ORIGINAL de equipamentosEncontradosPorNome em cada item (não o índice
// da lista já filtrada), senão adicionarEquipamentoDaListaBusca ia pegar
// o equipamento errado depois que algum item for escondido.
function montarListaResultadosBuscaNome(lista) {
  const container = document.getElementById('eqResultadoLista');
  const itensContainer = document.getElementById('eqResultadoListaItens');
  const vazio = document.getElementById('eqVazio');

  const itensVisiveis = [];
  (lista || []).forEach(function (eq, i) {
    const jaVinculado = equipamentos.some(function (e) { return e.patrimonio === eq.patrimonio; });
    if (!jaVinculado) itensVisiveis.push({ eq: eq, indiceOriginal: i });
  });

  if (itensVisiveis.length === 0) {
    container.style.display = 'none';
    vazio.style.display = 'block';
    return;
  }

  vazio.style.display = 'none';
  container.style.display = 'block';
  itensContainer.innerHTML = itensVisiveis.map(function (item) {
    const eq = item.eq;
    const detalhe = (eq.capacidade ? escapeHtml(eq.capacidade) + ' | ' : '') +
      escapeHtml(eq.marca) + ' | ' + escapeHtml(eq.modelo) + ' | Pat: ' + escapeHtml(eq.patrimonio) + ' | ' + escapeHtml(eq.localizacao);

    return '<div class="equip-result-card">' +
      '<div class="equip-result-info">' +
        '<span class="equip-result-nome">' + escapeHtml(eq.nome) + '</span>' +
        '<span class="equip-result-det">' + detalhe + '</span>' +
      '</div>' +
      '<button class="btn-success btn-equip-add" onclick="adicionarEquipamentoDaListaBusca(' + item.indiceOriginal + ')">' +
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
          '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>' +
        '</svg>' +
        'Adicionar ao Contrato' +
      '</button>' +
    '</div>';
  }).join('');
}

// Diferente do addEquipContrato (busca por Patrimônio) -- essa NÃO limpa a
// busca depois de adicionar, porque a pessoa pode querer clicar em vários
// da mesma lista (ex: todos os "ar condicionado" encontrados). O item some
// da lista sozinho porque montarListaResultadosBuscaNome filtra pelos que
// já estão em "equipamentos".
function adicionarEquipamentoDaListaBusca(indice) {
  const eq = equipamentosEncontradosPorNome[indice];
  if (!eq) return;
  if (equipamentos.some(e => e.patrimonio === eq.patrimonio)) { alert('Este equipamento já está vinculado ao contrato.'); return; }
  equipamentos.push({
    equipamento: eq.nome,
    capacidade: eq.capacidade,
    marca: eq.marca,
    modelo: eq.modelo,
    patrimonio: eq.patrimonio,
    localizacao: eq.localizacao
  });
  renderizarEquipamentos();
  montarListaResultadosBuscaNome(equipamentosEncontradosPorNome);
}

function mostrarResultadoBusca(eq) {
  document.getElementById('eqResultNome').textContent = eq.nome;
  document.getElementById('eqResultDet').textContent =
    (eq.capacidade ? eq.capacidade + ' | ' : '') +
    eq.marca + ' | ' + eq.modelo + ' | Pat: ' + eq.patrimonio + ' | ' + eq.localizacao;
  document.getElementById('eqResultado').style.display = 'block';
  document.getElementById('eqVazio').style.display = 'none';
}

function addEquipContrato() {
  if (!equipamentoSelecionado) { alert('Nenhum equipamento selecionado.'); return; }
  const eq = equipamentoSelecionado;
  if (equipamentos.some(e => e.patrimonio === eq.patrimonio)) { alert('Este equipamento já está vinculado ao contrato.'); return; }
  equipamentos.push({
    equipamento: eq.nome,
    capacidade: eq.capacidade,
    marca: eq.marca,
    modelo: eq.modelo,
    patrimonio: eq.patrimonio,
    localizacao: eq.localizacao
  });
  renderizarEquipamentos();
  montarListaResultadosBuscaNome(equipamentosEncontradosPorNome);
  limparBuscaEquipamento();
}

function limparBuscaEquipamento() {
  document.getElementById('eqBuscaPat').value = '';
  document.getElementById('eqBuscaNome').value = '';
  document.getElementById('eqResultado').style.display = 'none';
  document.getElementById('eqVazio').style.display = 'none';
  equipamentoSelecionado = null;
  document.getElementById('eqBuscaPat').focus();
}

// Remoção de item das listas em memória (equipamento/serviço/produto/
// checklist) -- nada disso foi salvo no servidor ainda, então não precisa
// chamar backend, só tirar da lista local. Modal customizado em vez do
// confirm() nativo, igual o resto do app.
let remocaoItemContratoPendente = null;

function confirmarRemocaoEquipamentoContrato(idx) {
  remocaoItemContratoPendente = { tipo: 'equipamento', idx: idx };
  if (typeof exibirModal === 'function') exibirModal('modalRemoverItemContrato');
}

function confirmarRemocaoServicoContrato(idx) {
  remocaoItemContratoPendente = { tipo: 'servico', idx: idx };
  if (typeof exibirModal === 'function') exibirModal('modalRemoverItemContrato');
}

function confirmarRemocaoProdutoContrato(idx) {
  remocaoItemContratoPendente = { tipo: 'produto', idx: idx };
  if (typeof exibirModal === 'function') exibirModal('modalRemoverItemContrato');
}

function confirmarRemocaoChecklistContrato(idx) {
  remocaoItemContratoPendente = { tipo: 'checklist', idx: idx };
  if (typeof exibirModal === 'function') exibirModal('modalRemoverItemContrato');
}

function executarRemocaoItemContrato() {
  if (!remocaoItemContratoPendente) return;
  const tipo = remocaoItemContratoPendente.tipo;
  const idx = remocaoItemContratoPendente.idx;

  if (tipo === 'equipamento') {
    equipamentos.splice(idx, 1);
    renderizarEquipamentos();
    // Se esse equipamento tinha vindo da busca por Nome, volta a aparecer
    // na lista de resultados agora que não está mais vinculado.
    montarListaResultadosBuscaNome(equipamentosEncontradosPorNome);
  } else if (tipo === 'servico') {
    servicos.splice(idx, 1);
    if (servicoEditIdx === idx) servicoEditIdx = -1;
    else if (servicoEditIdx > idx) servicoEditIdx--;
    renderizarServicos();
  } else if (tipo === 'produto') {
    produtos.splice(idx, 1);
    renderizarProdutos();
  } else if (tipo === 'checklist') {
    checklist.splice(idx, 1);
    if (checklistEditIdx === idx) checklistEditIdx = -1;
    else if (checklistEditIdx > idx) checklistEditIdx--;
    renderizarChecklist();
  }

  remocaoItemContratoPendente = null;
  if (typeof fecharModal === 'function') fecharModal('modalRemoverItemContrato');
}

function renderizarEquipamentos() {
  const tbody = document.getElementById('bodyEquipamentos');
  if (equipamentos.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="7">Nenhum equipamento vinculado ao contrato.</td></tr>';
    return;
  }
  tbody.innerHTML = equipamentos.map((e, i) => '<tr>' +
    '<td>' + escapeHtml(e.equipamento) + '</td>' +
    '<td>' + escapeHtml(e.capacidade || '—') + '</td>' +
    '<td>' + escapeHtml(e.marca) + '</td>' +
    '<td>' + escapeHtml(e.modelo) + '</td>' +
    '<td>' + escapeHtml(e.patrimonio) + '</td>' +
    '<td>' + escapeHtml(e.localizacao) + '</td>' +
    '<td class="acao-cell">' +
      '<button class="btn-acao btn-excluir-linha" title="Remover do contrato" onclick="confirmarRemocaoEquipamentoContrato(' + i + ')">' +
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>' +
        '</svg>' +
      '</button>' +
    '</td>' +
  '</tr>').join('');
}

// 
// BUSCA E VINCULAÇÃO DE SERVIÇOS (BASE → CONTRATO)
// 

function initBuscaServicoNome() {
  const input = document.getElementById('servicoBuscaNome');
  const dropdown = document.getElementById('servicoBuscaNomeDropdown');
  const wrapper = document.getElementById('servicoBuscaNomeWrapper');

  function renderLista(filtro) {
    const f = (filtro || '').toLowerCase();
    dropdown.innerHTML = '';
    if (f.length < 2) {
      dropdown.innerHTML = '<div class="search-no-result">Digite pelo menos 2 caracteres...</div>';
      return;
    }
    const itens = baseServicos.filter(s => s.nome.toLowerCase().includes(f)).slice(0, 10);
    if (itens.length === 0) {
      dropdown.innerHTML = '<div class="search-no-result">Nenhum resultado</div>';
    } else {
      itens.forEach(item => {
        const div = document.createElement('div');
        div.className = 'search-option';
        div.textContent = item.nome;
        div.addEventListener('click', () => {
          input.value = item.nome;
          dropdown.classList.remove('visible');
          servicoSelecionado = item;
          mostrarResultadoBuscaServico(item);
        });
        dropdown.appendChild(div);
      });
    }
  }

  input.addEventListener('focus', () => {
    if (input.value.trim().length >= 2) {
      renderLista(input.value);
      dropdown.classList.add('visible');
    }
  });

  input.addEventListener('input', () => {
    if (input.value.trim().length >= 2) {
      renderLista(input.value);
      if (!dropdown.classList.contains('visible')) dropdown.classList.add('visible');
    } else {
      dropdown.classList.remove('visible');
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); dropdown.classList.remove('visible'); buscarServicoBase(); }
    if (e.key === 'Escape') dropdown.classList.remove('visible');
  });

  document.addEventListener('click', (e) => {
    if (!wrapper.contains(e.target)) dropdown.classList.remove('visible');
  });
}

function buscarServicoBase() {
  const nome = document.getElementById('servicoBuscaNome').value.trim();
  if (!nome) { alert('Informe o nome do serviço para buscar.'); return; }
  if (nome.length < 2) { alert('Digite pelo menos 2 caracteres para buscar.'); return; }

  let encontrado = baseServicos.find(s => s.nome.toLowerCase() === nome.toLowerCase());
  if (!encontrado) encontrado = baseServicos.find(s => s.nome.toLowerCase().includes(nome.toLowerCase()));

  if (encontrado) {
    servicoSelecionado = encontrado;
    mostrarResultadoBuscaServico(encontrado);
  } else {
    servicoSelecionado = null;
    document.getElementById('servicoResultado').style.display = 'none';
    document.getElementById('servicoVazio').style.display = 'block';
  }
}

function mostrarResultadoBuscaServico(sv) {
  document.getElementById('servicoResultNome').textContent = sv.nome;
  document.getElementById('servicoResultDet').textContent = sv.nome;
  document.getElementById('servicoPeriodicidade').value = 'mensal';
  document.getElementById('servicoValor').value = '';
  document.getElementById('servicoResultado').style.display = 'block';
  document.getElementById('servicoVazio').style.display = 'none';
  document.getElementById('servicoPeriodicidade').focus();
}

function addServicoContrato() {
  if (!servicoSelecionado) { alert('Nenhum serviço selecionado.'); return; }

  const sv = servicoSelecionado;
  const periodicidade = document.getElementById('servicoPeriodicidade').value;
  const valorStr = document.getElementById('servicoValor').value.trim();
  const valor = parseFloat(valorStr.replace(/\./g, '').replace(',', '.')) || 0;

  if (!periodicidade) { alert('Selecione a periodicidade.'); return; }
  if (valor < 0) { alert('Informe um valor válido.'); return; }

  if (servicos.some(s => s.nome === sv.nome)) { alert('Este serviço já está vinculado ao contrato.'); return; }

  servicos.push({ servico: sv.nome, periodicidade: periodicidade, valor: valor });
  renderizarServicos();
  limparBuscaServico();
  alert('Serviço vinculado ao contrato com sucesso!');
}

function limparBuscaServico() {
  document.getElementById('servicoBuscaNome').value = '';
  document.getElementById('servicoResultado').style.display = 'none';
  document.getElementById('servicoVazio').style.display = 'none';
  servicoSelecionado = null;
  document.getElementById('servicoBuscaNome').focus();
}


function renderizarServicos() {
  const tbody = document.getElementById('bodyServicos');
  if (servicos.length === 0) {
    servicoEditIdx = -1;
    tbody.innerHTML = '<tr class="empty-row"><td colspan="4">Nenhum serviço vinculado ao contrato.</td></tr>';
    return;
  }
  tbody.innerHTML = servicos.map((s, i) => {
    const valorStr = s.valor ? s.valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : '—';

    if (servicoEditIdx === i) {
      return '<tr class="editing-row">' +
        '<td>' + escapeHtml(s.servico) + '</td>' +
        '<td>' +
          '<select class="field__select inline-edit-select" id="inlineEditServPer">' +
            '<option value="unica"' + (s.periodicidade === 'unica' ? ' selected' : '') + '>Única</option>' +
            '<option value="diaria"' + (s.periodicidade === 'diaria' ? ' selected' : '') + '>Diária</option>' +
            '<option value="semanal"' + (s.periodicidade === 'semanal' ? ' selected' : '') + '>Semanal</option>' +
            '<option value="quinzenal"' + (s.periodicidade === 'quinzenal' ? ' selected' : '') + '>Quinzenal</option>' +
            '<option value="mensal"' + (s.periodicidade === 'mensal' ? ' selected' : '') + '>Mensal</option>' +
            '<option value="bimestral"' + (s.periodicidade === 'bimestral' ? ' selected' : '') + '>Bimestral</option>' +
            '<option value="trimestral"' + (s.periodicidade === 'trimestral' ? ' selected' : '') + '>Trimestral</option>' +
            '<option value="semestral"' + (s.periodicidade === 'semestral' ? ' selected' : '') + '>Semestral</option>' +
            '<option value="anual"' + (s.periodicidade === 'anual' ? ' selected' : '') + '>Anual</option>' +
            '<option value="sob-demanda"' + (s.periodicidade === 'sob-demanda' ? ' selected' : '') + '>Sob Demanda</option>' +
          '</select>' +
        '</td>' +
        '<td><input class="field__input inline-edit-input" type="text" id="inlineEditServValor" value="' + s.valor.toFixed(2).replace('.', ',') + '"></td>' +
        '<td class="acao-cell">' +
          '<button class="btn-acao" title="Salvar" style="color:#10b981" onclick="salvarEdicaoServicoInline(' + i + ')">' +
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
          '</button>' +
          '<button class="btn-acao btn-excluir-linha" title="Cancelar" onclick="cancelarEdicaoServico()">' +
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
          '</button>' +
        '</td>' +
      '</tr>';
    }

    return '<tr>' +
      '<td>' + escapeHtml(s.servico) + '</td>' +
      '<td>' + formatarPeriodicidade(s.periodicidade) + '</td>' +
      '<td>' + valorStr + '</td>' +
      '<td class="acao-cell">' +
        '<button class="btn-acao btn-editar-linha" title="Editar" onclick="editarServicoContrato(' + i + ')">' +
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>' +
        '</button>' +
        '<button class="btn-acao btn-excluir-linha" title="Remover do contrato" onclick="confirmarRemocaoServicoContrato(' + i + ')">' +

          '</svg>' +
        '</button>' +

}

function editarServicoContrato(idx) {
  servicoEditIdx = idx;
  renderizarServicos();
}

function cancelarEdicaoServico() {
  servicoEditIdx = -1;
  renderizarServicos();
}

function salvarEdicaoServicoInline(idx) {
  const periodicidade = document.getElementById('inlineEditServPer').value;
  const valorStr = document.getElementById('inlineEditServValor').value.trim();
  const valor = parseFloat(valorStr.replace(/\./g, '').replace(',', '.'));

  if (!periodicidade) { alert('Selecione a periodicidade.'); return; }
  if (isNaN(valor) || valor < 0) { alert('Informe um valor válido.'); return; }

  servicos[idx].periodicidade = periodicidade;
  servicos[idx].valor = valor;
  servicoEditIdx = -1;
  renderizarServicos();
}

function formatarPeriodicidade(p) {
  const map = {
    unica:'Única', diaria:'Diária', semanal:'Semanal', quinzenal:'Quinzenal',
    mensal:'Mensal', bimestral:'Bimestral', trimestral:'Trimestral',
    semestral:'Semestral', anual:'Anual', 'sob-demanda':'Sob Demanda'
  };
  return map[p] || p;
}

// 
// BUSCA E VINCULAÇÃO DE PRODUTOS (BASE → CONTRATO)
// 

function initBuscaProdutoNome() {
  const input = document.getElementById('produtoBuscaNome');
  const dropdown = document.getElementById('produtoBuscaNomeDropdown');
  const wrapper = document.getElementById('produtoBuscaNomeWrapper');

  function renderLista(filtro) {
    const f = (filtro || '').toLowerCase();
    dropdown.innerHTML = '';
    if (f.length < 2) {
      dropdown.innerHTML = '<div class="search-no-result">Digite pelo menos 2 caracteres...</div>';
      return;
    }
    const itens = baseProdutos.filter(p => p.nome.toLowerCase().includes(f)).slice(0, 10);
    if (itens.length === 0) {
      dropdown.innerHTML = '<div class="search-no-result">Nenhum resultado</div>';
    } else {
      itens.forEach(item => {
        const div = document.createElement('div');
        div.className = 'search-option';
        div.textContent = item.nome;
        div.addEventListener('click', () => {
          input.value = item.nome;
          dropdown.classList.remove('visible');
          produtoSelecionado = item;
          mostrarResultadoBuscaProduto(item);
        });
        dropdown.appendChild(div);
      });
    }
  }

  input.addEventListener('focus', () => {
    if (input.value.trim().length >= 2) {
      renderLista(input.value);
      dropdown.classList.add('visible');
    }
  });

  input.addEventListener('input', () => {
    if (input.value.trim().length >= 2) {
      renderLista(input.value);
      if (!dropdown.classList.contains('visible')) dropdown.classList.add('visible');
    } else {
      dropdown.classList.remove('visible');
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); dropdown.classList.remove('visible'); buscarProdutoBase(); }
    if (e.key === 'Escape') dropdown.classList.remove('visible');
  });

  document.addEventListener('click', (e) => {
    if (!wrapper.contains(e.target)) dropdown.classList.remove('visible');
  });
}

function buscarProdutoBase() {
  const nome = document.getElementById('produtoBuscaNome').value.trim();
  if (!nome) { alert('Informe o nome do produto para buscar.'); return; }
  if (nome.length < 2) { alert('Digite pelo menos 2 caracteres para buscar.'); return; }

  let encontrado = baseProdutos.find(p => p.nome.toLowerCase() === nome.toLowerCase());
  if (!encontrado) encontrado = baseProdutos.find(p => p.nome.toLowerCase().includes(nome.toLowerCase()));

  if (encontrado) {
    produtoSelecionado = encontrado;
    mostrarResultadoBuscaProduto(encontrado);
  } else {
    produtoSelecionado = null;
    document.getElementById('produtoResultado').style.display = 'none';
    document.getElementById('produtoVazio').style.display = 'block';
  }
}

function mostrarResultadoBuscaProduto(pd) {
  document.getElementById('produtoResultNome').textContent = pd.nome;
  document.getElementById('produtoResultDet').textContent = pd.nome;
  document.getElementById('produtoResultado').style.display = 'block';
  document.getElementById('produtoVazio').style.display = 'none';
}

function addProdutoContrato() {
  if (!produtoSelecionado) { alert('Nenhum produto selecionado.'); return; }
  const pd = produtoSelecionado;
  if (produtos.some(p => p.nome === pd.nome)) { alert('Este produto já está vinculado ao contrato.'); return; }
  produtos.push({ nome: pd.nome });
  renderizarProdutos();
  limparBuscaProduto();
  alert('Produto vinculado ao contrato com sucesso!');
}

function limparBuscaProduto() {
  document.getElementById('produtoBuscaNome').value = '';
  document.getElementById('produtoResultado').style.display = 'none';
  document.getElementById('produtoVazio').style.display = 'none';
  produtoSelecionado = null;
  document.getElementById('produtoBuscaNome').focus();
}


function renderizarProdutos() {
  const tbody = document.getElementById('bodyProdutos');
  if (produtos.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="2">Nenhum produto vinculado ao contrato.</td></tr>';
    return;
  }
  tbody.innerHTML = produtos.map((p, i) => '<tr>' +
    '<td>' + escapeHtml(p.nome) + '</td>' +
    '<td class="acao-cell">' +
      '<button class="btn-acao btn-excluir-linha" title="Remover do contrato" onclick="confirmarRemocaoProdutoContrato(' + i + ')">' +
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>' +
        '</svg>' +
      '</button>' +
    '</td>' +
  '</tr>').join('');
}

function buscarItemChecklist() {

  let encontrado = baseChecklist.find(i => i.descricao.toLowerCase() === descricao.toLowerCase());
  if (!encontrado) encontrado = baseChecklist.find(i => i.descricao.toLowerCase().includes(descricao.toLowerCase()));

  if (encontrado) {
    checklistItemSelecionado = encontrado;
    mostrarResultadoBuscaChecklist(encontrado);
  } else {

    document.getElementById('checklistResultado').style.display = 'none';
    document.getElementById('checklistVazio').style.display = 'block';

function mostrarResultadoBuscaChecklist(item) {
  document.getElementById('checklistResultNome').textContent = item.descricao;

  document.getElementById('checklistItemPeriodicidade').value = 'mensal';
  document.getElementById('checklistResultado').style.display = 'block';
  document.getElementById('checklistVazio').style.display = 'none';
}

function addItemChecklistContrato() {
  if (!checklistItemSelecionado) { alert('Nenhum item selecionado.'); return; }

  const item = checklistItemSelecionado;
  const periodicidade = document.getElementById('checklistItemPeriodicidade').value;

  if (checklist.some(i => i.descricao === item.descricao)) {
    alert('Este item já está vinculado ao contrato.');

  limparBuscaChecklist();

function limparBuscaChecklist() {

  document.getElementById('checklistVazio').style.display = 'none';

  document.getElementById('checklistBusca').focus();
}


function editarItemChecklist(idx) {
  checklistEditIdx = idx;
  renderizarChecklist();
}

function cancelarEdicaoChecklist() {
  checklistEditIdx = -1;
  renderizarChecklist();
}

function salvarEdicaoInline(idx) {
  const desc = document.getElementById('inlineEditDesc').value.trim();
  const per = document.getElementById('inlineEditPer').value;
  if (!desc) { alert('Informe a descrição.'); return; }
  checklist[idx] = { descricao: desc, periodicidade: per };
  checklistEditIdx = -1;
  renderizarChecklist();
}

function renderizarChecklist() {
  const tbody = document.getElementById('bodyChecklist');
  if (checklist.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="3">Nenhum item vinculado ao contrato.</td></tr>';
    return;
  }
  tbody.innerHTML = checklist.map((item, i) => {
    if (checklistEditIdx === i) {
      return '<tr class="editing-row">' +
        '<td><input class="field__input inline-edit-input" type="text" id="inlineEditDesc" value="' + escapeHtml(item.descricao) + '"></td>' +
        '<td>' +
          '<select class="field__select inline-edit-select" id="inlineEditPer">' +
            '<option value="mensal"' + (item.periodicidade === 'mensal' ? ' selected' : '') + '>Mensal</option>' +
            '<option value="bimestral"' + (item.periodicidade === 'bimestral' ? ' selected' : '') + '>Bimestral</option>' +
            '<option value="trimestral"' + (item.periodicidade === 'trimestral' ? ' selected' : '') + '>Trimestral</option>' +
            '<option value="semestral"' + (item.periodicidade === 'semestral' ? ' selected' : '') + '>Semestral</option>' +
            '<option value="anual"' + (item.periodicidade === 'anual' ? ' selected' : '') + '>Anual</option>' +
          '</select>' +

        '<td class="acao-cell">' +
          '<button class="btn-acao" title="Salvar" style="color:#10b981" onclick="salvarEdicaoInline(' + i + ')">' +

          '</button>' +
          '<button class="btn-acao btn-excluir-linha" title="Cancelar" onclick="cancelarEdicaoChecklist()">' +
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
          '</button>' +
        '</td>' +

        '</button>' +
      '</td>' +
    '</tr>';
  }).join('');

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

    'Checklist: ' + checklist.length + ' itens');
}
