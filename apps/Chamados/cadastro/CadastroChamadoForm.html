<section id="page-chamado-form" class="spa-page">

  <div class="page-header">
    <div class="actions-bar">
      <h1>📩 Abrir Chamado</h1>
    </div>
  </div>

  <div class="card">

    <form autocomplete="off" onsubmit="return false;">

      <!-- ============================================= -->
      <!-- PARTE 1: DADOS GERAIS DO CHAMADO              -->
      <!-- ============================================= -->
      <fieldset class="fieldset-principal">
        <legend class="fieldset-legend">Dados do Chamado</legend>

        <div class="form-grid-3">
          <div class="field">
            <label class="field__label" for="chamadoMotivo">Motivo / Título *</label>
            <select class="field__select" id="chamadoMotivo" onchange="alterarMotivoOutro()">
              <option value="">Selecione...</option>
              <option value="Falta de Refrigeração">Falta de Refrigeração</option>
              <option value="Vazamento de água">Vazamento de água</option>
              <option value="Mal Cheiro">Mal Cheiro</option>
              <option value="Barulhos Anormais">Barulhos Anormais</option>
              <option value="Congelamento">Congelamento</option>
              <option value="Aparelho não liga">Aparelho não liga</option>
              <option value="outro">Outro</option>
            </select>
            <input class="field__input" type="text" id="chamadoMotivoOutro" placeholder="Descreva o motivo..." style="display:none; margin-top:0.5rem;">
          </div>

          <div class="field">
            <label class="field__label" for="chamadoTipo">Tipo *</label>
            <select class="field__select" id="chamadoTipo">
              <option value="">Selecione...</option>
              <option value="corretiva">Corretiva</option>
              <option value="preventiva">Preventiva</option>
              <option value="instalacao">Instalação</option>
              <option value="limpeza">Limpeza</option>
              <option value="outro">Outro</option>
            </select>
          </div>
        </div>

        <div class="form-grid-3">
          <div class="field">
            <label class="field__label" for="chamadoClassificacao">Classificação *</label>
            <select class="field__select" id="chamadoClassificacao">
              <option value="baixa">Baixa</option>
              <option value="media" selected>Média</option>
              <option value="alta">Alta</option>
              <option value="urgente">Urgente</option>
            </select>
          </div>

          <div class="field field-full-2">
            <label class="field__label">Atribuído a</label>
            <div class="search-wrapper" id="chamadoAtribuidoWrapper">
              <span class="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
              </span>
              <input class="search-input" type="text" id="chamadoAtribuidoA" placeholder="Técnico interno ou fornecedor prestador de serviço..." autocomplete="off">
              <div class="search-dropdown" id="chamadoAtribuidoDropdown"></div>
            </div>
          </div>
        </div>

        <div class="form-grid-3">
          <div class="field field-full-3">
            <label class="field__label" for="chamadoDescricao">Descrição do Chamado</label>
            <textarea class="field__input" id="chamadoDescricao" rows="3" maxlength="300" placeholder="Detalhes do problema, contexto, observações..."></textarea>
            <span class="chamado-contador-caracteres" id="chamadoDescricaoContador">300 caracteres restantes</span>
          </div>
        </div>
      </fieldset>

      <!-- ============================================= -->
      <!-- PARTE 2: EQUIPAMENTO (opcional, no máximo 1)  -->
      <!-- ============================================= -->
      <fieldset class="fieldset-principal">
        <legend class="fieldset-legend">Equipamento</legend>
        <p class="chamado-itens-ajuda">
          Obrigatório informar pelo menos o Patrimônio ou a Localização.
        </p>

        <div class="form-grid-3">
          <div class="field">
            <label class="field__label" for="chamadoEquipPatrimonio">Patrimônio</label>
            <input class="field__input" type="text" id="chamadoEquipPatrimonio" placeholder="Ex: 21384">
            <span class="chamado-patrimonio-status" id="chamadoPatrimonioStatus"></span>
          </div>
          <div class="field">
            <label class="field__label">Localização</label>
            <div class="search-wrapper" id="chamadoEquipLocalizacaoWrapper">
              <span class="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
              </span>
              <input class="search-input" type="text" id="chamadoEquipLocalizacao" placeholder="Selecione a localização..." autocomplete="off">
              <div class="search-dropdown" id="chamadoEquipLocalizacaoDropdown"></div>
            </div>
          </div>
          <div class="field">
            <label class="field__label" for="chamadoEquipMarca">Marca</label>
            <input class="field__input" type="text" id="chamadoEquipMarca" placeholder="Ex: Gree">
          </div>
        </div>
        <div class="form-grid-3">
          <div class="field">
            <label class="field__label" for="chamadoEquipModelo">Modelo</label>
            <input class="field__input" type="text" id="chamadoEquipModelo" placeholder="Ex: Split Hi-Wall">
          </div>
          <div class="field">
            <label class="field__label" for="chamadoEquipBtus">Capacidade (BTUs)</label>
            <input class="field__input" type="text" id="chamadoEquipBtus" placeholder="Ex: 36.000">
          </div>
        </div>
      </fieldset>

      <!-- ============================================= -->
      <!-- PARTE 3: PEÇA (opcional, no máximo 1)         -->
      <!-- ============================================= -->
      <fieldset class="fieldset-principal">
        <legend class="fieldset-legend">Peças</legend>
        <p class="chamado-itens-ajuda">
          Opcional. Pode adicionar mais de uma (ex: trocar 2 peças do mesmo equipamento). Por
          enquanto só o Nome é obrigatório por peça.
        </p>

        <div id="chamadoPecasBlocos" class="chamado-pecas-blocos">
          <!-- Preenchido via JS: renderPecasChamadoSelecionadas() -->
        </div>

        <button type="button" class="btn-secondary" onclick="adicionarBlocoPecaChamado()">+ Adicionar Peça</button>
      </fieldset>


      <!-- ============================================= -->
      <!-- BOTÕES DE AÇÃO                                -->
      <!-- ============================================= -->
      <div class="form-actions">
        <button type="button" class="btn-secondary" onclick="trocarPagina('chamados')">Cancelar</button>
        <button type="button" class="btn btn-danger" onclick="limparChamado()">Limpar</button>
        <button type="button" class="btn-success" onclick="salvarChamado()">Salvar Chamado</button>
      </div>

    </form>
  </div>

</section>
