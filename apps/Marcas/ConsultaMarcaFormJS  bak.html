<!-- JAVASCRIPT ORIENTADO A OBJETOS -->
<script>
class MarcaController {
  constructor() {
    this.marcas = [];
    this.listaFiltrada = [];
    this.idExclusao = null;
    this.sortState = { coluna: null, direcao: 'asc' };
  }

  // ===== INICIALIZAÇÃO =====
  init() {
    this.bindEvents();
    this.consultarMarcas();
  }

  bindEvents() {
    const inputMarca = document.getElementById('marcaSearch');
    if (inputMarca) inputMarca.focus();

    // Eventos de overlay e esc
    const modais = ['modalExclusaoMarca', 'modalEdicaoMarca', 'modalCadastroMarca'];
    modais.forEach(idModal => {
      const elModal = document.getElementById(idModal);
      if (elModal) {
        elModal.addEventListener('click', (e) => {
          if (e.target.classList.contains('modal-overlay')) {
            this.fecharTodosModais();
          }
        });
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        this.fecharTodosModais();
      }
    });
  }

  fecharTodosModais() {
    if (typeof fecharModal === 'function') {
      fecharModal('modalCadastroMarca');
      fecharModal('modalEdicaoMarca');
      fecharModal('modalExclusaoMarca');
    }
  }

  // ===== CONSULTA E FILTROS =====
  consultarMarcas() {
    const marcaInput = document.getElementById('marcaSearch');
    const marca = marcaInput ? marcaInput.value.trim().toLowerCase() : '';
    const criterios = { marca };

    google.script.run
      .withSuccessHandler(objmarcas => this.retornoMarcas(objmarcas))
      .withFailureHandler(err => console.error('Erro ao consultar: ', err))
      .filtrarMarcas(criterios);
  }

  retornoMarcas(objmarcas) {
    this.marcas = Array.isArray(objmarcas) ? objmarcas : [];
    this.listaFiltrada = typeof aplicarOrdenacao === 'function' ? aplicarOrdenacao(this.marcas) : this.marcas;

    const opcoesMarca = [...new Set(this.marcas.map(m => m.marca).filter(Boolean))];
    if (typeof initSearch === 'function') {
      initSearch('marcaSearch', 'marcaDropdown', 'marcaWrapper', opcoesMarca);
    }

    this.renderTabelaMarca(this.listaFiltrada);
  }

  filtrarMarca() {
    const marcaInput = document.getElementById('marcaSearch');
    const marca = marcaInput ? marcaInput.value.trim().toLowerCase() : '';

    this.listaFiltrada = this.marcas.filter(m => {
      if (marca && !(m.marca || '').toLowerCase().includes(marca)) return false;
      return true;
    });

    if (typeof aplicarOrdenacao === 'function') {
      this.listaFiltrada = aplicarOrdenacao(this.listaFiltrada);
    }
    this.renderTabelaMarca(this.listaFiltrada);
  }

  limparFiltrosMarca() {
    const inputMarca = document.getElementById('marcaSearch');
    if (inputMarca) inputMarca.value = '';

    this.sortState = { coluna: null, direcao: 'asc' };
    if (typeof atualizarIndicadores === 'function') atualizarIndicadores();
    this.consultarMarcas();

    if (inputMarca) inputMarca.focus();
  }

  // ===== RENDERIZAÇÃO DE TABELA =====
  renderTabelaMarca(lista) {
    const tbody = document.getElementById('tabelaBodyMarca');
    if (!tbody) return;

    tbody.innerHTML = '';

    if (!lista || lista.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="2">Nenhum registro encontrado.</td></tr>';
      return;
    }

    lista.forEach(m => {
      const tr = document.createElement('tr');
      if (m.desativada) tr.classList.add('linha-desativada');

      const btnEditar = document.createElement('button');
      btnEditar.className = 'btn-acao btn-editar-linha';
      btnEditar.title = 'Editar';
      btnEditar.innerText = '✏️';

      const btnExcluir = document.createElement('button');
      btnExcluir.className = 'btn-acao btn-excluir-linha';
      btnExcluir.title = 'Desativar';
      btnExcluir.innerText = '🗑️';

      if (m.desativada) {
        btnEditar.disabled = true;
        btnEditar.style.cssText = 'opacity:0.3; cursor:not-allowed;';
        btnExcluir.disabled = true;
        btnExcluir.style.cssText = 'opacity:0.3; cursor:not-allowed;';
      } else {
        btnEditar.addEventListener('click', () => this.abrirModalEdicaoMarca(m.id));
        btnExcluir.addEventListener('click', () => this.confirmaExclusaoMarca(m.id));
      }

      const tdConteudo = document.createElement('td');
      const textEscaped = typeof escapeHtml === 'function' ? escapeHtml(m.marca) : m.marca;
      tdConteudo.innerHTML = `${textEscaped} ${m.desativada ? '<span class="status-desativado">(Desativado)</span>' : ''}`;

      const tdAcoes = document.createElement('td');
      tdAcoes.appendChild(btnEditar);
      tdAcoes.appendChild(btnExcluir);

      tr.appendChild(tdConteudo);
      tr.appendChild(tdAcoes);
      tbody.appendChild(tr);
    });
  }

  // ===== MODAL DE CADASTRO =====
  abrirModalCadastroMarca() {
    const input = document.getElementById('novaMarcaNome');
    if (input) input.value = '';

    const modal = document.getElementById('modalCadastroMarca');
    if (modal) {
      modal.classList.add('aberto');
      setTimeout(() => input && input.focus(), 100);
    }
  }

  salvarNovaMarca() {
    const input = document.getElementById('novaMarcaNome');
    const nomeMarca = input ? input.value.trim() : '';

    if (!nomeMarca) {
      alert('Por favor, digite o nome da marca.');
      return;
    }

    google.script.run
      .withSuccessHandler((resposta) => {
        if (resposta && resposta.sucesso) {
          this.consultarMarcas();
          if (typeof fecharModal === 'function') fecharModal('modalCadastroMarca');
        } else {
          alert(resposta ? resposta.mensagem : 'Erro ao cadastrar marca.');
        }
      })
      .withFailureHandler((err) => {
        console.error('Erro ao cadastrar marca:', err);
        alert('Ocorreu um erro no script: ' + (err.message || err));
      })
      .cadastrarMarca(nomeMarca);
  }

  // ===== MODAL DE EDIÇÃO =====
  abrirModalEdicaoMarca(id) {
    const marcaEncontrada = this.marcas.find(m => String(m.id) === String(id));

    document.getElementById('editMarcaId').value = id;
    document.getElementById('editMarcaNome').value = marcaEncontrada ? marcaEncontrada.marca : '';

    const modal = document.getElementById('modalEdicaoMarca');
    if (modal) modal.classList.add('aberto');
  }

  executarEdicao() {
    const id = document.getElementById('editMarcaId').value;
    const novoNome = document.getElementById('editMarcaNome').value;

    if (!novoNome || !novoNome.trim()) {
      alert("Por favor, digite o nome da marca.");
      return;
    }

    google.script.run
      .withSuccessHandler((resposta) => {
        if (resposta && resposta.sucesso) {
          if (typeof fecharModal === 'function') fecharModal('modalEdicaoMarca');
          this.consultarMarcas();
        } else {
          alert(resposta ? resposta.mensagem : "Erro ao atualizar a marca.");
        }
      })
      .withFailureHandler((err) => {
        console.error('Erro ao editar marca: ', err);
        alert('Erro de comunicação com o servidor.');
      })
      .editarMarca(id, novoNome.trim());
  }

  // ===== MODAL DE EXCLUSÃO =====
  confirmaExclusaoMarca(id) {
    if (!id) {
      alert("Erro: Nenhum registro selecionado.");
      return;
    }
    this.idExclusao = id;
    if (typeof exibirModal === 'function') {
      exibirModal('modalExclusaoMarca');
    } else {
      const modal = document.getElementById('modalExclusaoMarca');
      if (modal) modal.classList.add('aberto');
    }
  }

  async executarExclusaoMarca() {
    if (typeof executarExclusao === 'function') {
      await executarExclusao('tbl_marca', this.idExclusao);
    }
    this.idExclusao = null;
    this.consultarMarcas();
    if (typeof fecharModal === 'function') fecharModal('modalExclusaoMarca');
  }
}

// Instanciação da Controller
const marcaController = new MarcaController();

document.addEventListener('DOMContentLoaded', () => {
  marcaController.init();
});
</script>
