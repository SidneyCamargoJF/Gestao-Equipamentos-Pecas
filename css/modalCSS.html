/* Dock de navegação entre as 5 seções do detalhe -- cada botão troca qual

  flex-wrap: wrap;

  cursor: pointer;
  transition: all 0.15s ease;
}

.dock-detalhe-btn:hover {

}

.dock-detalhe-btn-ativo {
  background: #4f46e5;
  border-color: #4f46e5;
  color: #fff;
}

/* Precisa ganhar do .dock-detalhe-btn:hover (mesma especificidade) --
   senão passar o mouse no botão já selecionado deixava o texto roxo
   igual ao fundo roxo, sumindo a palavra. */

  background: var(--color-indigo-hover, #4338ca);
  border-color: var(--color-indigo-hover, #4338ca);
  color: #fff;
}

/* ===== ABA HISTÓRICO DO CHAMADO ===== */

/* Barra sempre visível com os dois botões fixos ("Adicionar anotação" e o
   botão de estado Atender/Resolver/Reabrir) -- nenhum dos dois abre caixa
   de texto por padrão, só quando precisa (ver .chamado-caixa-texto). */
.chamado-acoes-fixas {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin-bottom: 1rem;
}

.chamado-acoes-fixas .chamado-acao-status {
  margin-top: 0;
}

/* Botão de transição de estado (Atender/Resolver/Reabrir) -- mais destaque
   que os outros botões da barra, e muda de cor conforme a ação: Atender
   (azul) -> Resolver (verde) -> Reabrir (amarelo). */
.chamado-btn-acao {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.625rem 1.5rem;
  font-size: 0.9375rem;
  font-weight: 700;
  font-family: inherit;
  border: none;
  border-radius: 0.5rem;
  cursor: pointer;
  box-shadow: 0 0.125rem 0.375rem rgba(0, 0, 0, 0.15);
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}

.chamado-btn-acao:hover {
  transform: translateY(-0.0625rem);
  box-shadow: 0 0.25rem 0.625rem rgba(0, 0, 0, 0.22);
}

.chamado-btn-acao--atender {
  background: #2563eb;
  color: #fff;
}
.chamado-btn-acao--atender:hover { background: #1d4ed8; }

.chamado-btn-acao--resolver {
  background: #16a34a;
  color: #fff;
}
.chamado-btn-acao--resolver:hover { background: #15803d; }

.chamado-btn-acao--reabrir {
  background: #eab308;
  color: #422006;
}
.chamado-btn-acao--reabrir:hover { background: #ca8a04; }

/* Caixa de texto única, escondida por padrão -- é mostrada (display:flex)
   via JS tanto pra nova anotação quanto pra editar uma anotação existente

  display: none;
  flex-direction: column;
  gap: 0.5rem;
  margin-bottom: 1.25rem;
  padding: 0.875rem 1rem;
