<section id="page-equipments-form" class="spa-page">


  <div class="page-header">
          <div class="actions-bar">
            <h1>🚚 Equipamentos</h1>
          </div>  
        </div>

  <div class="card">
      <!-- HEADER -->
      <div class="form-header">
        <h2 class="form-titulo" id="formTitulo">Novo</h2>
        <!-- <span class="form-status" id="formStatus">Rascunho</span> --> 
      </div>
 
      <form autocomplete="off" onsubmit="return false;">
        <input type="text" id="cadEquipId" hidden value="0">
 
        <!-- ============================================= -->
        <!-- PARTE 1: INFORMAÇÕES PRINCIPAIS               -->
        <!-- ============================================= -->
        <fieldset class="fieldset-principal">
          <legend class="fieldset-legend">Informações Principais</legend>
 
          <div class="form-grid-3">
 
            <div class="field">
              <label class="field__label" for="cadEquipPatrimonio">Patrimonio</label>
              <input class="field__input" type="text" id="cadEquipPatrimonio" placeholder="patrimonio" onchange="equipmentFormController.jaExistePatrimonio()" required>
            </div>
          </div>
 
          <div class="form-grid-3">
 
            <div class="field">
              <label class="field__label" for="cadEquipNome">Nome *</label>
              <input class="field__input" type="text" id="cadEquipNome" placeholder="Nome do equipamento" required> 
            </div>
 
            <div class="field">
              <label class="field__label" for="cadEquipMarca">Marca *</label>
              <input class="field__input" type="text" id="cadEquipMarca" placeholder="Marca" required>
            </div>
 
            <div class="field">
              <label class="field__label" for="cadEquipCapacidade">Capacidade</label>
              <input class="field__input" type="text" id="cadEquipCapacidade" placeholder="capacidade" required>
            </div>

          </div>
 
          <div class="form-grid-3">

            <div class="field">
              <label class="field__label" for="cadEquipModelo">Modelo</label>
              <input class="field__input" type="text" id="cadEquipModelo" placeholder="modelo" >
            </div>
 
            <div class="field">
              <label class="field__label" for="cadEquipSequencia">Sequencia</label>
              <input class="field__input" type="text" id="cadEquipSequencia" placeholder="55" >
            </div>
 
 
            <div class="field">
              <label class="field__label" for="cadEquipLocalizacao">Localização</label>
              <input class="field__input" type="text" id="cadEquipLocalizacao" placeholder="55" >
            </div>

          </div>
 
        </fieldset>
        <!-- ============================================= -->
        <!-- BOTÕES DE AÇÃO                                -->
        <!-- ============================================= -->
      <div class="form-actions">
        <button type="button" class="btn-secondary"  onclick="trocarPagina('equipments-view')">Cancelar</button>
        <button type="button" class="btn btn-danger" onclick="equipmentsController.limpar()">Limpar</button>
        <button type="button" class="btn-success"    onclick="equipmentsController.salvar()" id="cadEquipSave">Salvar</button>
      </div>
      </form>
    </div>
  </section>
