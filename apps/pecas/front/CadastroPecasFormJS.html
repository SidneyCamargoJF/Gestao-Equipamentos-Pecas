<script>
  // ===== 1. PROMISES AUXILIARES PARA BUSCAR DADOS DO BACKEND =====
  function loadBrands() {
    console.log("📡 [loadBrands] Solicitando marcas ao servidor...");
    return new Promise((resolve) => {
      google.script.run
        .withSuccessHandler(res => {
          console.log("✅ [loadBrands] Marcas recebidas:", res);
          resolve(res || []);
        })
        .withFailureHandler(err => {
          console.error("❌ [loadBrands] Erro no servidor:", err);
          resolve([]);
        })
        .ReadBrands(); // Ou .buscarMarcasAtivas() conforme seu .gs
    });
  }

  function loadLocations() {
    console.log("📡 [loadLocations] Solicitando localizações ao servidor...");
    return new Promise((resolve) => {
      google.script.run
        .withSuccessHandler(res => {
          console.log("✅ [loadLocations] Localizações recebidas:", res);
          resolve(res || []);
        })
        .withFailureHandler(err => {
          console.error("❌ [loadLocations] Erro no servidor:", err);
          resolve([]);
        })
        .ReadLocations();
    });
  }

  function loadSuppliers() {
    console.log("📡 [loadSuppliers] Solicitando fornecedores ao servidor...");
    return new Promise((resolve) => {
      google.script.run
        .withSuccessHandler(res => {
          console.log("✅ [loadSuppliers] Fornecedores recebidos:", res);
          resolve(res || []);
        })
        .withFailureHandler(err => {
          console.error("❌ [loadSuppliers] Erro no servidor:", err);
          resolve([]);
        })
        .ReadSuppliers();
    });
  }

  // ===== 2. PREENCHEDOR DE SELECTS =====
  function preencherSelect(elementId, listaBruta, labelPadrao) {
    console.log(`⚙️ [preencherSelect] Preenchendo "${elementId}"...`);
    const select = document.getElementById(elementId);
    
    if (!select) {
      console.warn(`⚠️ [preencherSelect] Elemento <select id="${elementId}"> não existe na DOM.`);
      return;
    }

    select.innerHTML = `<option value="">-- ${labelPadrao} --</option>`;

    // Trata caso venha matriz de colunas [ [id, nome], ... ] ou array simples [ "nome", ... ]
    let lista = Array.isArray(listaBruta) ? listaBruta : [];
    if (lista.length > 0 && Array.isArray(lista[0])) {
      lista = lista.map(item => item[1]).filter(Boolean);
    }

    // Remove duplicados e vazios
    const listaUnica = Array.from(new Set(lista)).filter(Boolean);

    if (listaUnica.length > 0) {
      listaUnica.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        opt.textContent = item;
        select.appendChild(opt);
      });
      console.log(`✅ [preencherSelect] ${listaUnica.length} opções adicionadas em "${elementId}".`);
    } else {
      select.innerHTML = `<option value="">Nenhum item encontrado</option>`;
      console.warn(`⚠️ [preencherSelect] Nenhuma opção disponível para "${elementId}".`);
    }
  }

  // ===== 2.1 CADASTRO RÁPIDO VIA BOTÃO "+" (Marca, Fornecedor, Localização) =====

  async function atualizarMarcaSelectPecas(nomeSelecionar) {
    const opcoesMarca = await loadBrands();
    preencherSelect('marcaSelect', opcoesMarca, 'Selecione a Marca');
    if (nomeSelecionar) {
      const select = document.getElementById('marcaSelect');
      if (select) select.value = nomeSelecionar;
    }
  }

  function abrirModalCadastroFornecedor() {
    ['novoFornecedorCnpj', 'novoFornecedorRazaoSocial', 'novoFornecedorNomeFantasia', 'novoFornecedorCidade', 'novoFornecedorEmail', 'novoFornecedorTelefoneFixo'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.value = '';
        el.classList.remove('is-invalid');
      }
    });

    const modal = document.getElementById('modalCadastroFornecedor');
    if (modal) {
      modal.classList.add('aberto');
      setTimeout(() => document.getElementById('novoFornecedorCnpj')?.focus(), 100);
    }
  }

  async function salvarNovoFornecedorRapido() {
    const campos = {
      cnpj: document.getElementById('novoFornecedorCnpj'),
      razaoSocial: document.getElementById('novoFornecedorRazaoSocial'),
      nomeFantasia: document.getElementById('novoFornecedorNomeFantasia'),
      cidade: document.getElementById('novoFornecedorCidade'),
      email: document.getElementById('novoFornecedorEmail'),
      telefoneFixo: document.getElementById('novoFornecedorTelefoneFixo')
    };

    let valido = true;
    Object.values(campos).forEach(input => {
      if (!input) return;
      if (!input.value.trim()) {
        input.classList.add('is-invalid');
        valido = false;
      } else {
        input.classList.remove('is-invalid');
      }
    });

    if (!valido) return;

    const dados = {
      cnpj: campos.cnpj.value.trim(),
      razaoSocial: campos.razaoSocial.value.trim(),
      nomeFantasia: campos.nomeFantasia.value.trim(),
      cidade: campos.cidade.value.trim(),
      email: campos.email.value.trim(),
      telefoneFixo: campos.telefoneFixo.value.trim()
    };

    google.script.run
      .withSuccessHandler(async (resposta) => {
        if (resposta && resposta.sucesso) {
          fecharModalCadastroFornecedor();
          const opcoesFornecedor = await loadSuppliers();
          preencherSelect('fornecedorSelect', opcoesFornecedor, 'Selecione o Fornecedor');
          const select = document.getElementById('fornecedorSelect');
          if (select) select.value = dados.razaoSocial;
        } else {
          alert(resposta ? resposta.mensagem : 'Erro ao cadastrar fornecedor.');
        }
      })
      .withFailureHandler((err) => {
        console.error('Erro ao cadastrar fornecedor:', err);
        alert('Ocorreu um erro no script: ' + (err.message || err));
      })
      .cadastrarFornecedorRapido(dados);
  }

  function abrirModalCadastroLocalizacao() {
    const input = document.getElementById('novaLocalizacaoNome');
    if (input) {
      input.value = '';
      input.classList.remove('is-invalid');
    }

    const modal = document.getElementById('modalCadastroLocalizacao');
    if (modal) {
      modal.classList.add('aberto');
      setTimeout(() => input && input.focus(), 100);
    }
  }

  async function salvarNovaLocalizacao() {
    const input = document.getElementById('novaLocalizacaoNome');
    const nomeLocalizacao = input ? input.value.trim() : '';

    if (!nomeLocalizacao) {
      if (input) {
        input.classList.add('is-invalid');
        input.focus();
      }
      return;
    }

    if (input) input.classList.remove('is-invalid');

    google.script.run
      .withSuccessHandler(async (resposta) => {
        if (resposta && resposta.sucesso) {
          fecharModalCadastroLocalizacao();
          const opcoesLocal = await loadLocations();
          preencherSelect('localSelect', opcoesLocal, 'Selecione a Localização');
          const select = document.getElementById('localSelect');
          if (select) select.value = nomeLocalizacao;
        } else {
          alert(resposta ? resposta.mensagem : 'Erro ao cadastrar localização.');
        }
      })
      .withFailureHandler((err) => {
        console.error('Erro ao cadastrar localização:', err);
        alert('Ocorreu um erro no script: ' + (err.message || err));
      })
      .cadastrarLocalizacao(nomeLocalizacao);
  }

  ['novoFornecedorCnpj', 'novoFornecedorRazaoSocial', 'novoFornecedorNomeFantasia', 'novoFornecedorCidade', 'novoFornecedorEmail', 'novoFornecedorTelefoneFixo', 'novaLocalizacaoNome'].forEach(id => {
    document.addEventListener('DOMContentLoaded', () => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', () => el.classList.remove('is-invalid'));
    });
  });

  // ===== 3. INICIALIZAÇÃO E RENDERIZAÇÃO DA PÁGINA =====
  async function renderCadastroPecas(id) {
    console.log("🚀 [renderCadastroPecas] Iniciando formulário. ID recebido:", id || "Novo Cadastro");

    // Validações com checagem de existência no DOM para evitar erros no F12
    const inputPecaId = document.getElementById('pecaId');
    if (inputPecaId) {
      inputPecaId.value = id || '';
    } else {
      console.warn("⚠️ [renderCadastroPecas] Elemento 'pecaId' não foi encontrado no HTML.");
    }

    const tituloForm = document.getElementById('formTituloPeca');
    if (tituloForm) {
      tituloForm.textContent = id ? 'Editar Peça' : 'Nova Peça';
    }

    try {
      console.log("⏳ [renderCadastroPecas] Aguardando respostas das 3 consultas (Marcas, Locais, Fornecedores)...");
      const [opcoesMarca, opcoesLocal, opcoesFornecedor] = await Promise.all([
        loadBrands(),
        loadLocations(),
        loadSuppliers()
      ]);

      preencherSelect('marcaSelect', opcoesMarca, 'Selecione a Marca');
      preencherSelect('localSelect', opcoesLocal, 'Selecione a Localização');
      preencherSelect('fornecedorSelect', opcoesFornecedor, 'Selecione o Fornecedor');

    } catch (err) {
      console.error("❌ [renderCadastroPecas] Erro fatal durante a renderização:", err);
    }

    if (id) {
      await preencherFormularioParaEdicao(id);
    } else {
      const nomeInput = document.getElementById('nomePeca');
      if (nomeInput) nomeInput.focus();
    }
  }

  // ===== 3.1 CARREGAR DADOS DE UMA PEÇA EXISTENTE PARA EDIÇÃO =====
  function preencherFormularioParaEdicao(id) {
    return new Promise((resolve) => {
      google.script.run
        .withSuccessHandler((peca) => {
          if (!peca) {
            alert('Não foi possível carregar os dados dessa peça para edição.');
            resolve();
            return;
          }

          const campos = {
            nomePeca: peca.nome,
            modelo: peca.modelo,
            capacidade: peca.capacidade,
            numeroSerie: peca.numero_serie,
            notaFiscal: peca.notaFiscal,
            dataNota: peca.dataNotaFiscal,
            garantia: peca.garantia,
            dtGarantia: peca.dtGarantia,
            modalidade: peca.modalidade,
            valor: peca.valor,
            seiNum: peca.seiNum
          };

          Object.keys(campos).forEach(elId => {
            const el = document.getElementById(elId);
            if (el) el.value = campos[elId] ?? '';
          });

          const marcaSelect = document.getElementById('marcaSelect');
          if (marcaSelect) marcaSelect.value = peca.marca || '';

          const localSelect = document.getElementById('localSelect');
          if (localSelect) localSelect.value = peca.local || '';

          const fornecedorSelect = document.getElementById('fornecedorSelect');
          if (fornecedorSelect) fornecedorSelect.value = peca.fornecedor || '';

          resolve();
        })
        .withFailureHandler((err) => {
          console.error('❌ [preencherFormularioParaEdicao] Erro ao carregar peça:', err);
          alert('Erro ao carregar peça: ' + (err.message || err));
          resolve();
        })
        .buscarPecaPorId(id);
    });
  }

  // ===== 4. ENVIAR DADOS AO SERVIDOR =====
  function salvarPeca() {
    console.log("💾 [salvarPeca] Coletando dados do formulário...");

    const dadosPeca = {
      id: document.getElementById('pecaId')?.value || '',
      nome: document.getElementById('nomePeca')?.value.trim() || '',
      marca: document.getElementById('marcaSelect')?.value || '',
      modelo: document.getElementById('modelo')?.value.trim() || '',
      capacidade: document.getElementById('capacidade')?.value.trim() || '',
      numero_serie: document.getElementById('numeroSerie')?.value.trim() || '',
      local: document.getElementById('localSelect')?.value || '',
      fornecedor: document.getElementById('fornecedorSelect')?.value || '',
      notaFiscal: document.getElementById('notaFiscal')?.value.trim() || '',
      dataNotaFiscal: document.getElementById('dataNota')?.value || '',
      garantia: document.getElementById('garantia')?.value || '',
      dtGarantia: document.getElementById('dtGarantia')?.value || '',
      modalidade: document.getElementById('modalidade')?.value || '',
      valor: document.getElementById('valor')?.value.trim() || '',
      seiNum: document.getElementById('seiNum')?.value.trim() || ''
    };

    console.log("📦 [salvarPeca] Objeto estruturado:", dadosPeca);

    // Validações no cliente
    if (!dadosPeca.nome) {
      alert('Por favor, informe o Nome da Peça.');
      console.warn("⚠️ [salvarPeca] Validação falhou: Nome da Peça vazio.");
      document.getElementById('nomePeca')?.focus();
      return;
    }

    if (!dadosPeca.marca) {
      alert('Por favor, selecione uma Marca da lista.');
      console.warn("⚠️ [salvarPeca] Validação falhou: Marca não selecionada.");
      document.getElementById('marcaSelect')?.focus();
      return;
    }

    if (!dadosPeca.local) {
      alert('Por favor, selecione uma Localização da lista.');
      console.warn("⚠️ [salvarPeca] Validação falhou: Localização não selecionada.");
      document.getElementById('localSelect')?.focus();
      return;
    }

    if (!dadosPeca.fornecedor) {
      alert('Por favor, selecione um Fornecedor da lista.');
      console.warn("⚠️ [salvarPeca] Validação falhou: Fornecedor não selecionado.");
      document.getElementById('fornecedorSelect')?.focus();
      return;
    }

    console.log("📤 [salvarPeca] Enviando dados para salvarPeca() no servidor Apps Script...");

    const btnSalvar = document.getElementById('btnSalvarPeca');
    if (btnSalvar) btnSalvar.disabled = true;
    if (typeof exibirModal === 'function') exibirModal('processando');

    google.script.run
      .withSuccessHandler((resposta) => {
        console.log("📥 [salvarPeca] Resposta do servidor:", resposta);
        if (btnSalvar) btnSalvar.disabled = false;
        if (typeof fecharModal === 'function') fecharModal('processando');

        if (resposta && resposta.sucesso) {
          alert(resposta.mensagem || 'Peça salva com sucesso!');
          limparPeca();
          if (typeof trocarPagina === 'function') {
            trocarPagina('pecas-view');
          }
        } else {
          alert(resposta ? resposta.mensagem : 'Erro ao salvar a peça.');
        }
      })
      .withFailureHandler((err) => {
        console.error("❌ [salvarPeca] Erro ao se comunicar com o servidor:", err);
        if (btnSalvar) btnSalvar.disabled = false;
        if (typeof fecharModal === 'function') fecharModal('processando');
        alert('Erro de comunicação com o servidor: ' + (err.message || err));
      })
      .salvarPeca(dadosPeca);
  }

  // ===== 5. LIMPAR FORMULÁRIO =====
  function limparPeca() {
    console.log("🧹 [limparPeca] Limpando formulário...");

    const form = document.getElementById('formPeca');

    if (form) {
      form.reset();
    }

    // Limpa também o ID oculto da peça
    const pecaId = document.getElementById('pecaId');
    if (pecaId) {
      pecaId.value = '';
    }

    // Garante que os selects fiquem sem seleção
    const selects = [
      'marcaSelect',
      'localSelect',
      'fornecedorSelect',
      'modalidade'
    ];

    selects.forEach(id => {
      const select = document.getElementById(id);
      if (select) {
        select.selectedIndex = 0;
      }
    });

    // Retorna o título para novo cadastro
    const titulo = document.getElementById('formTituloPeca');
    if (titulo) {
      titulo.textContent = 'Nova Peça';
    }

    const status = document.getElementById('formStatusPeca');
    if (status) {
      status.textContent = 'Rascunho';
    }

    // Coloca o cursor novamente no campo Nome
    const nomeInput = document.getElementById('nomePeca');
    if (nomeInput) {
      nomeInput.focus();
    }
  }

</script>
