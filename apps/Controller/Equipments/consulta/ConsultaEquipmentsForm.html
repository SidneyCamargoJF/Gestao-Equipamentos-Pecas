      <section id="page-equipments-view" class="spa-page">

        <div class="page-header">
          <div class="actions-bar">
            <h1>⚙️ Equipmentos</h1>
          </div>

          <!-- Botoes de limpar e adicionar -->

          <div class="actions-bar">
            <button type="button" class="btn-secondary" onclick="limparFiltrosEquipamento()">Limpar</button>
            <button type="button" class="btn-success" onclick="trocarPagina('equipments-form', 0)">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              Adicionar
            </button>
            <button type="button" class="btn-primary" onclick="consultarEquipamentos()">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              Consultar
            </button>
          </div>
        </div>

        <div class="panel">

          <!-- FILTRO -->
          <form autocomplete="off" onsubmit="return false;">
            <div class="filters-primary">
              <div class="field">
                <label class="field__label">Nome / Patrimônio</label>
                <div class="search-wrapper" id="equipmentWrapper">
                  <span class="search-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                  </span>
                  <input class="search-input" type="text" id="equipmentSearch" placeholder="Digite o nome ou o patrimônio..." autocomplete="off">
                  <div class="search-dropdown" id="equipmentDropdown"></div>
                </div>
              </div>

              <div class="field">
                <label class="field__label" for="filtroEquipCapacidade">Capacidade</label>
                <input class="field__input" type="text" id="filtroEquipCapacidade" placeholder="Ex: 12.000" inputmode="numeric" oninput="this.value = aplicarMascaraMilharEquip(this.value)">
              </div>

              <div class="field">
                <label class="field__label" for="filtroEquipMarca">Marca</label>
                <input class="field__input" type="text" id="filtroEquipMarca" placeholder="Digite a marca...">
              </div>

              <div class="field">
                <label class="field__label" for="filtroEquipLocalizacao">Localização</label>
                <input class="field__input" type="text" id="filtroEquipLocalizacao" placeholder="Digite a localização...">
              </div>

              <div class="field">
                <label class="field__label" for="filtroEquipSei">SEI</label>
                <input class="field__input" type="text" id="filtroEquipSei" placeholder="Digite o número do SEI...">
              </div>
            </div>
          </form>


          <!-- TABELA -->
          <div class="gtable-wrapper">
            <div class="gtable" id="tabelaEquipamentos" role="table">
              <div class="gtable-row gtable-head" role="row">
                <div class="gtable-cell" role="columnheader" onclick="ordenarEquipamento('patrimonio')">PATRIMONIO <span class="sort-arrow"></span></div>
                <div class="gtable-cell" role="columnheader" onclick="ordenarEquipamento('nome')">EQUIPAMENTO <span class="sort-arrow"></span></div>
                <div class="gtable-cell" role="columnheader" onclick="ordenarEquipamento('capacidade')">CAPACIDADE <span class="sort-arrow"></span></div>
                <div class="gtable-cell" role="columnheader" onclick="ordenarEquipamento('marca')">MARCA <span class="sort-arrow"></span></div>
                <div class="gtable-cell" role="columnheader" onclick="ordenarEquipamento('modelo')">MODELO <span class="sort-arrow"></span></div>
                <div class="gtable-cell" role="columnheader" onclick="ordenarEquipamento('localizacao')">LOCALIZAÇÃO <span class="sort-arrow"></span></div>
                <div class="gtable-cell" role="columnheader" onclick="ordenarEquipamento('sei')">SEI <span class="sort-arrow"></span></div>
                <div class="gtable-cell" role="columnheader" onclick="ordenarEquipamento('estado')">ESTADO <span class="sort-arrow"></span></div>
                <div class="gtable-cell" role="columnheader" onclick="ordenarEquipamento('garantia')">GARANTIA <span class="sort-arrow"></span></div>
                <div class="gtable-cell gtable-cell-end" role="columnheader">AÇÕES</div>
              </div>
              <div class="gtable-body" id="tabelaBodyEquipment" role="rowgroup">
                <!-- Linhas serão preenchidas dinamicamente via JavaScript -->
              </div>
            </div>
          </div>
        </div>

      </section>
