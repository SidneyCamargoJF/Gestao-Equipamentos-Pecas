<script>
  // ===== 1. PROMISES AUXILIARES PARA BUSCAR DADOS DO BACKEND =====
  function loadBrands() {
    return new Promise((resolve) => {
      google.script.run
        .withSuccessHandler(res => {
          resolve(res || []);
        })
        .withFailureHandler(err => {
          console.error("❌ [loadBrands] Erro no servidor:", err);
          resolve([]);
        })
        .ReadBrands();
    });
  }

  function loadLocations() {
    return new Promise((resolve) => {
      google.script.run
        .withSuccessHandler(res => {
          resolve(res || []);
        })
        .withFailureHandler(err => {
          console.error("❌ [loadLocations] Erro no servidor:", err);
          resolve([]);
        })
        .ReadLocations();
    });
  }

  function loadSuppliers() {
    return new Promise((resolve) => {
      google.script.run
        .withSuccessHandler(res => {
          resolve(res || []);
        })
        .withFailureHandler(err => {
          console.error("❌ [loadSuppliers] Erro no servidor:", err);
          resolve([]);
        })
        .ReadSuppliers();
    });
  }

  // ===== 2. PREENCHEDOR DE SELECTS =====
  function preencherSelect(elementId, listaBruta, labelPadrao) {
    const select = document.getElementById(elementId);
    
    if (!select) {
      console.warn(`⚠️ [preencherSelect] Elemento <select id="${elementId}"> não existe na DOM.`);
      return;
    }

    select.innerHTML = `<option value="">-- ${labelPadrao} --</option>`;

    // Trata caso venha matriz de colunas [ [id, nome], ... ] ou array simples [ "nome", ... ]
    let lista = Array.isArray(listaBruta) ? listaBruta : [];
    if (lista.length > 0 && Array.isArray(lista[0])) {
      lista = lista.map(item => item[1]).filter(Boolean);
    }

    // Remove duplicados e vazios
    const listaUnica = Array.from(new Set(lista)).filter(Boolean);

    if (listaUnica.length > 0) {
      listaUnica.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        opt.textContent = item;
        select.appendChild(opt);
      });
    } else {
      select.innerHTML = `<option value="">Nenhum item encontrado</option>`;
      console.warn(`⚠️ [preencherSelect] Nenhuma opção disponível para "${elementId}".`);
    }
  }

  let contextoCadastroRapido = 'pecas';

  const SELECTS_CADASTRO_RAPIDO = {
    marca: { pecas: 'marcaSelect', equipamentos: 'cadEquipMarca' },
    fornecedor: { pecas: 'fornecedorSelect', equipamentos: 'cadEquipFornecedor' },
    localizacao: { pecas: 'localSelect', equipamentos: 'cadEquipLocalizacao' }
  };

  async function atualizarMarcaSelectPecas(nomeSelecionar) {
    const opcoesMarca = await loadBrands();
    preencherSelect('marcaSelect', opcoesMarca, 'Selecione a Marca');
    if (nomeSelecionar) {
      const select = document.getElementById('marcaSelect');
      if (select) select.value = nomeSelecionar;
    }
  }

  function abrirModalCadastroMarca(contexto) {
    contextoCadastroRapido = contexto || 'pecas';
    const input = document.getElementById('novaMarcaRapidaNome');
    if (input) {
      input.value = '';
      input.classList.remove('is-invalid');
    }
    if (typeof exibirModal === 'function') exibirModal('modalCadastroMarcaRapida');
    setTimeout(() => input && input.focus(), 100);
  }

  async function salvarNovaMarcaRapida() {
    const input = document.getElementById('novaMarcaRapidaNome');
    const nome = input ? input.value.trim() : '';

    if (!nome) {
      if (input) { input.classList.add('is-invalid'); input.focus(); }
      return;
    }

    try {
      const resposta = await runServerFunction('cadastrarMarca', nome);
      if (resposta && resposta.sucesso === false) {
        alert(resposta.mensagem);
        return;
      }
      if (typeof fecharModal === 'function') fecharModal('modalCadastroMarcaRapida');

      const selectId = (SELECTS_CADASTRO_RAPIDO.marca[contextoCadastroRapido]) || 'marcaSelect';
      const opcoesMarca = await loadBrands();
      preencherSelect(selectId, opcoesMarca, 'Selecione a Marca');
      const select = document.getElementById(selectId);
      if (select) select.value = nome;
    } catch (error) {
      console.error('Erro ao cadastrar marca:', error);
      alert('Erro ao cadastrar marca.');
    }
  }

  function abrirModalCadastroFornecedor(contexto) {
    contextoCadastroRapido = contexto || 'pecas';
    ['novoFornecedorCnpj', 'novoFornecedorRazaoSocial', 'novoFornecedorNomeFantasia', 'novoFornecedorCidade', 'novoFornecedorEmail', 'novoFornecedorTelefoneFixo'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.value = '';
        el.classList.remove('is-invalid');
      }
    });

    const modal = document.getElementById('modalCadastroFornecedor');
    if (modal) {
      modal.classList.add('aberto');
      setTimeout(() => document.getElementById('novoFornecedorCnpj')?.focus(), 100);
    }
  }

  async function salvarNovoFornecedorRapido() {
    const campos = {
      cnpj: document.getElementById('novoFornecedorCnpj'),
      razaoSocial: document.getElementById('novoFornecedorRazaoSocial'),
      nomeFantasia: document.getElementById('novoFornecedorNomeFantasia'),
      cidade: document.getElementById('novoFornecedorCidade'),
      email: document.getElementById('novoFornecedorEmail'),
      telefoneFixo: document.getElementById('novoFornecedorTelefoneFixo')
    };

    let valido = true;
    Object.values(campos).forEach(input => {
      if (!input) return;
      if (!input.value.trim()) {
        input.classList.add('is-invalid');
        valido = false;
      } else {
        input.classList.remove('is-invalid');
      }
    });

    if (!valido) return;

    const dados = {
      cnpj: campos.cnpj.value.trim(),
      razaoSocial: campos.razaoSocial.value.trim(),
      nomeFantasia: campos.nomeFantasia.value.trim(),
      cidade: campos.cidade.value.trim(),
      email: campos.email.value.trim(),
      telefoneFixo: campos.telefoneFixo.value.trim()
    };

    if (typeof exibirModal === 'function') exibirModal('processando');
    google.script.run
      .withSuccessHandler(async (resposta) => {
        if (typeof fecharModal === 'function') fecharModal('processando');
        if (resposta && resposta.sucesso) {
          fecharModalCadastroFornecedor();
          // nota fiscal: campo com lista (datalist), não select
          if (contextoCadastroRapido === 'notas' && typeof nfFornecedorCadastradoRapido === 'function') {
            await nfFornecedorCadastradoRapido(dados);
            return;
          }
          const selectId = (SELECTS_CADASTRO_RAPIDO.fornecedor[contextoCadastroRapido]) || 'fornecedorSelect';
          const opcoesFornecedor = (await loadSuppliers()).map(linha => linha[3]).filter(Boolean);
          preencherSelect(selectId, opcoesFornecedor, 'Selecione o Fornecedor');
          const select = document.getElementById(selectId);
          if (select) select.value = dados.razaoSocial;
        } else {
          alert(resposta ? resposta.mensagem : 'Erro ao cadastrar fornecedor.');
        }
      })
      .withFailureHandler((err) => {
        if (typeof fecharModal === 'function') fecharModal('processando');
        console.error('Erro ao cadastrar fornecedor:', err);
        alert('Ocorreu um erro no script: ' + (err.message || err));
      })
      .cadastrarFornecedorRapido(dados);
  }

  function abrirModalCadastroLocalizacao(contexto) {
    contextoCadastroRapido = contexto || 'pecas';
    const input = document.getElementById('novaLocalizacaoNome');
    if (input) {
      input.value = '';
      input.classList.remove('is-invalid');
    }

    const modal = document.getElementById('modalCadastroLocalizacao');
    if (modal) {
      modal.classList.add('aberto');
      setTimeout(() => input && input.focus(), 100);
    }
  }

  async function salvarNovaLocalizacao() {
    const input = document.getElementById('novaLocalizacaoNome');
    const nomeLocalizacao = input ? input.value.trim() : '';

    if (!nomeLocalizacao) {
      if (input) {
        input.classList.add('is-invalid');
        input.focus();
      }
      return;
    }

    if (input) input.classList.remove('is-invalid');

    if (typeof exibirModal === 'function') exibirModal('processando');
    google.script.run
      .withSuccessHandler(async (resposta) => {
        if (typeof fecharModal === 'function') fecharModal('processando');
        if (resposta && resposta.sucesso) {
          fecharModalCadastroLocalizacao();
          const selectId = (SELECTS_CADASTRO_RAPIDO.localizacao[contextoCadastroRapido]) || 'localSelect';
          const opcoesLocal = await loadLocations();
          preencherSelect(selectId, opcoesLocal, 'Selecione a Localização');
          const select = document.getElementById(selectId);
          if (select) select.value = nomeLocalizacao;
        } else {
          alert(resposta ? resposta.mensagem : 'Erro ao cadastrar localização.');
        }
      })
      .withFailureHandler((err) => {
        if (typeof fecharModal === 'function') fecharModal('processando');
        console.error('Erro ao cadastrar localização:', err);
        alert('Ocorreu um erro no script: ' + (err.message || err));
      })
      .cadastrarLocalizacao(nomeLocalizacao);
  }

  ['novoFornecedorCnpj', 'novoFornecedorRazaoSocial', 'novoFornecedorNomeFantasia', 'novoFornecedorCidade', 'novoFornecedorEmail', 'novoFornecedorTelefoneFixo', 'novaLocalizacaoNome'].forEach(id => {
    document.addEventListener('DOMContentLoaded', () => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', () => el.classList.remove('is-invalid'));
    });
  });

  // ===== 3. INICIALIZAÇÃO E RENDERIZAÇÃO DA PÁGINA =====
  async function renderCadastroPecas(id) {
    // Validações com checagem de existência no DOM para evitar erros no F12
    const inputPecaId = document.getElementById('pecaId');
    if (inputPecaId) {
      inputPecaId.value = id || '';
    } else {
      console.warn("⚠️ [renderCadastroPecas] Elemento 'pecaId' não foi encontrado no HTML.");
    }

    const tituloForm = document.getElementById('formTituloPeca');
    if (tituloForm) {
      tituloForm.textContent = id ? 'Editar Peça / Produto' : 'Nova Peça / Produto';
    }

    try {
      const [opcoesMarca, opcoesLocal, opcoesFornecedor] = await Promise.all([
        loadBrands(),
        loadLocations(),
        loadSuppliers()
      ]);

      preencherSelect('marcaSelect', opcoesMarca, 'Selecione a Marca');
      preencherSelect('localSelect', opcoesLocal, 'Selecione a Localização');
      preencherSelect('fornecedorSelect', opcoesFornecedor.map(linha => linha[3]).filter(Boolean), 'Selecione o Fornecedor');

    } catch (err) {
      console.error("❌ [renderCadastroPecas] Erro fatal durante a renderização:", err);
    }

    if (id) {
      await preencherFormularioParaEdicao(id);
    } else {
      // Sem id = Nova Peça -- limpa os campos de texto, senão ficava com
      // os valores da última edição (os 3 selects já resetam sozinhos
      // porque preencherSelect reconstrói as options do zero).
      ['nomePeca', 'modelo', 'capacidade', 'numeroSerie', 'notaFiscal', 'dataNota',
        'garantia', 'dtGarantia', 'modalidade', 'valor', 'seiNum'].forEach(elId => {
        const el = document.getElementById(elId);
        if (el) el.value = '';
      });
      const tipoEl = document.getElementById('tipoItemPeca');
      if (tipoEl) tipoEl.value = 'peca';

      const nomeInput = document.getElementById('nomePeca');
      if (nomeInput) nomeInput.focus();
    }

    prepararAquisicoesPeca(id);
  }

  // ===== AQUISIÇÕES (notas fiscais do item) =====
  // Só com o item já salvo (edição): cada inclusão/exclusão grava na hora.
  let aquisicoesPecaId = null;

  function prepararAquisicoesPeca(id) {
    aquisicoesPecaId = id ? Number(id) : null;
    const form = document.getElementById('pecaAquisicoesForm');
    const aviso = document.getElementById('pecaAquisicoesAviso');
    if (form) form.style.display = aquisicoesPecaId ? '' : 'none';
    if (aviso) aviso.style.display = aquisicoesPecaId ? 'none' : '';
    limparFormAquisicaoPeca();
    // fornecedores: as mesmas opções do cadastro, já com o do item escolhido
    const origem = document.getElementById('fornecedorSelect');
    const destino = document.getElementById('aquisicaoFornecedor');
    if (origem && destino) {
      destino.innerHTML = origem.innerHTML;
      destino.value = origem.value || '';
    }
    renderAquisicoesPeca([]);
    if (aquisicoesPecaId) carregarAquisicoesPecaUI();
    // abas Aquisições / Fornecedores: sempre começa na primeira
    if (typeof initTabs === 'function') initTabs();
    if (typeof ativarAba === 'function') ativarAba('peca-aquisicoes');
    prepararFornecedoresPeca();
  }

  // ===== FORNECEDORES DO ITEM (relação produto x fornecedor) =====
  // Mesma tabela de Compras → Produtos x fornecedores; grava na hora.
  let fornecedoresPecaOpcoes = [];

  async function prepararFornecedoresPeca() {
    const form = document.getElementById('pecaFornecedoresForm');
    const aviso = document.getElementById('pecaFornecedoresAviso');
    if (form) form.style.display = aquisicoesPecaId ? '' : 'none';
    if (aviso) aviso.style.display = aquisicoesPecaId ? 'none' : '';
    ['pecaPfCodigo', 'pecaPfDescricao'].forEach(elId => { const el = document.getElementById(elId); if (el) el.value = ''; });
    renderFornecedoresPeca([]);
    if (!aquisicoesPecaId) return;
    const pecaId = aquisicoesPecaId;
    try { fornecedoresPecaOpcoes = await runServerFunction('listarFornecedoresNF') || []; } catch (e) { fornecedoresPecaOpcoes = []; }
    if (pecaId !== aquisicoesPecaId) return;   // trocou de item enquanto carregava
    const sel = document.getElementById('pecaPfFornecedor');
    if (sel) {
      const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
      sel.innerHTML = '<option value="">Selecione o fornecedor</option>' +
        fornecedoresPecaOpcoes.map((f, i) => '<option value="' + i + '">' + esc(f.nome) + (f.fantasia && f.fantasia !== f.nome ? ' (' + esc(f.fantasia) + ')' : '') + '</option>').join('');
      // já sugere o fornecedor do item
      const doItem = (document.getElementById('fornecedorSelect') || {}).value || '';
      const i = fornecedoresPecaOpcoes.findIndex(f => doItem && (f.nome === doItem || f.fantasia === doItem));
      sel.value = i >= 0 ? String(i) : '';
    }
    await carregarFornecedoresPecaUI();
  }

  async function carregarFornecedoresPecaUI() {
    const tbody = document.getElementById('pecaFornecedoresLista');
    if (tbody) tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;"><span class="spinner"></span>Carregando...</td></tr>';
    let r;
    try { r = await runServerFunction('listarProdutoFornecedor', { pecaId: aquisicoesPecaId }); } catch (e) { r = null; }
    renderFornecedoresPeca((r && r.relacoes) || []);
  }

  function renderFornecedoresPeca(lista) {
    const tbody = document.getElementById('pecaFornecedoresLista');
    const cont = document.getElementById('pecaFornecedoresContador');
    if (cont) cont.textContent = lista.length ? '(' + lista.length + ')' : '';
    if (!tbody) return;
    const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const cnpj = c => { const d = String(c || '').replace(/\D/g, ''); return d.length === 14 ? d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5') : d; };
    tbody.innerHTML = lista.length ? lista.map(x => `
      <tr>
        <td>${esc(x.fornecedor)}</td>
        <td>${esc(cnpj(x.cnpj))}</td>
        <td>${esc(x.codigo)}</td>
        <td>${esc(x.descricao)}</td>
        <td class="acao-cell"><button type="button" class="btn-acao" title="Excluir" onclick="excluirFornecedorPecaUI(${Number(x.id)})">🗑️</button></td>
      </tr>`).join('') : '<tr><td colspan="5" style="text-align:center;">Nenhum fornecedor.</td></tr>';
  }

  async function incluirFornecedorPecaUI() {
    if (!aquisicoesPecaId) return;
    const f = fornecedoresPecaOpcoes[Number((document.getElementById('pecaPfFornecedor') || {}).value)];
    const codigo = ((document.getElementById('pecaPfCodigo') || {}).value || '').trim();
    if (!f || (document.getElementById('pecaPfFornecedor') || {}).value === '') { alert('Escolha o fornecedor.'); return; }
    if (!codigo) { alert('Informe o código do item no fornecedor.'); return; }
    const dados = { pecaId: aquisicoesPecaId, fornecedor: f.nome, cnpj: f.cnpj, codigo: codigo,
      descricao: ((document.getElementById('pecaPfDescricao') || {}).value || '').trim() };
    if (typeof exibirModal === 'function') exibirModal('processando');
    try {
      const r = await runServerFunction('salvarProdutoFornecedor', dados);
      if (!r || r.sucesso === false) { alert(r ? r.mensagem : 'Erro ao incluir o fornecedor.'); return; }
      ['pecaPfCodigo', 'pecaPfDescricao'].forEach(elId => { const el = document.getElementById(elId); if (el) el.value = ''; });
      await carregarFornecedoresPecaUI();
    } catch (e) {
      alert('Erro ao conectar com o servidor.');
    } finally {
      if (typeof fecharModal === 'function') fecharModal('processando');
    }
  }

  async function excluirFornecedorPecaUI(id) {
    if (!(await confirmarModal('Excluir este fornecedor do item (a relação e o código)?', { titulo: 'Excluir fornecedor do item', confirmar: 'Excluir' }))) return;
    try {
      const r = await runServerFunction('excluirProdutoFornecedor', id);
      if (!r || r.sucesso === false) { alert(r ? r.mensagem : 'Erro ao excluir.'); return; }
      await carregarFornecedoresPecaUI();
    } catch (e) { alert('Erro ao conectar com o servidor.'); }
  }

  function limparFormAquisicaoPeca() {
    ['aquisicaoNF', 'aquisicaoData', 'aquisicaoArquivo'].forEach(elId => {
      const el = document.getElementById(elId);
      if (el) el.value = '';
    });
  }

  async function carregarAquisicoesPecaUI() {
    const tbody = document.getElementById('pecaAquisicoesLista');
    if (tbody) tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;"><span class="spinner"></span>Carregando...</td></tr>';
    let r;
    try { r = await runServerFunction('listarAquisicoesPeca', aquisicoesPecaId); } catch (e) { r = null; }
    renderAquisicoesPeca((r && r.aquisicoes) || []);
  }

  function renderAquisicoesPeca(lista) {
    const tbody = document.getElementById('pecaAquisicoesLista');
    const cont = document.getElementById('pecaAquisicoesContador');
    if (cont) cont.textContent = lista.length ? '(' + lista.length + ')' : '';
    if (!tbody) return;
    const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    tbody.innerHTML = lista.length ? lista.map(a => `
      <tr>
        <td>${esc(a.numeroNF)}</td>
        <td>${esc(a.fornecedor)}</td>
        <td>${esc(a.dataAquisicao)}</td>
        <td>${a.arquivoUrl ? `<a href="${esc(a.arquivoUrl)}" target="_blank" rel="noopener">📄 Ver nota</a>` : '<span style="color:#94a3b8;">sem arquivo</span>'}</td>
        <td class="acao-cell"><button type="button" class="btn-acao" title="Excluir" onclick="excluirAquisicaoPecaUI(${Number(a.id)})">🗑️</button></td>
      </tr>`).join('') : '<tr><td colspan="5" style="text-align:center;">Nenhuma aquisição.</td></tr>';
  }

  function lerArquivoAquisicao(input) {
    return new Promise((resolve, reject) => {
      const f = input && input.files && input.files[0];
      if (!f) { resolve(null); return; }
      const limite = typeof ANEXO_CADASTRO_TAMANHO_MAX !== 'undefined' ? ANEXO_CADASTRO_TAMANHO_MAX : 3 * 1024 * 1024;
      if (f.size > limite) { reject(new Error('O arquivo "' + f.name + '" passa de 3MB.')); return; }
      const leitor = new FileReader();
      leitor.onload = () => resolve({ nome: f.name, tipo: f.type || 'application/octet-stream', base64: String(leitor.result).split(',')[1] || '' });
      leitor.onerror = () => reject(new Error('Erro ao ler o arquivo "' + f.name + '".'));
      leitor.readAsDataURL(f);
    });
  }

  async function incluirAquisicaoPecaUI() {
    if (!aquisicoesPecaId) return;
    const dados = {
      pecaId: aquisicoesPecaId,
      numeroNF: (document.getElementById('aquisicaoNF')?.value || '').trim(),
      fornecedor: document.getElementById('aquisicaoFornecedor')?.value || '',
      dataAquisicao: document.getElementById('aquisicaoData')?.value || ''
    };
    if (!dados.numeroNF) { alert('Informe o número da nota.'); return; }
    if (!dados.fornecedor) { alert('Escolha o fornecedor.'); return; }
    if (!dados.dataAquisicao) { alert('Informe a data de aquisição.'); return; }
    try { dados.arquivo = await lerArquivoAquisicao(document.getElementById('aquisicaoArquivo')); }
    catch (e) { alert(e.message); return; }

    if (typeof exibirModal === 'function') exibirModal('processando');
    try {
      const r = await runServerFunction('salvarAquisicaoPeca', dados);
      if (!r || r.sucesso === false) { alert(r ? r.mensagem : 'Erro ao incluir a aquisição.'); return; }
      limparFormAquisicaoPeca();
      await carregarAquisicoesPecaUI();
    } catch (e) {
      alert('Erro ao conectar com o servidor.');
    } finally {
      if (typeof fecharModal === 'function') fecharModal('processando');
    }
  }

  async function excluirAquisicaoPecaUI(id) {
    if (!(await confirmarModal('Excluir esta aquisição?', { titulo: 'Excluir aquisição', confirmar: 'Excluir' }))) return;
    try {
      const r = await runServerFunction('excluirAquisicaoPeca', id);
      if (!r || r.sucesso === false) { alert(r ? r.mensagem : 'Erro ao excluir.'); return; }
      await carregarAquisicoesPecaUI();
    } catch (e) { alert('Erro ao conectar com o servidor.'); }
  }

  // ===== 3.1 CARREGAR DADOS DE UMA PEÇA EXISTENTE PARA EDIÇÃO =====
  function preencherFormularioParaEdicao(id) {
    return new Promise((resolve) => {
      google.script.run
        .withSuccessHandler((peca) => {
          if (!peca) {
            alert('Não foi possível carregar os dados dessa peça para edição.');
            resolve();
            return;
          }

          const campos = {
            nomePeca: peca.nome,
            modelo: peca.modelo,
            capacidade: peca.capacidade,
            numeroSerie: peca.numero_serie,
            notaFiscal: peca.notaFiscal,
            dataNota: peca.dataNotaFiscal,
            garantia: peca.garantia,
            dtGarantia: peca.dtGarantia,
            modalidade: peca.modalidade,
            seiNum: peca.seiNum,
            tipoItemPeca: peca.tipo || 'peca'
          };

          Object.keys(campos).forEach(elId => {
            const el = document.getElementById(elId);
            if (el) el.value = campos[elId] ?? '';
          });

          const valorField = document.getElementById('valor');
          if (valorField) valorField.value = formatarValorExibicaoMonetario(peca.valor);

          const marcaSelect = document.getElementById('marcaSelect');
          if (marcaSelect) marcaSelect.value = peca.marca || '';

          const localSelect = document.getElementById('localSelect');
          if (localSelect) localSelect.value = peca.local || '';

          const fornecedorSelect = document.getElementById('fornecedorSelect');
          if (fornecedorSelect) fornecedorSelect.value = peca.fornecedor || '';

          resolve();
        })
        .withFailureHandler((err) => {
          console.error('❌ [preencherFormularioParaEdicao] Erro ao carregar peça:', err);
          alert('Erro ao carregar peça: ' + (err.message || err));
          resolve();
        })
        .buscarPecaPorId(id);
    });
  }

  // ===== 4. ENVIAR DADOS AO SERVIDOR =====
  function salvarPeca() {
    const dadosPeca = {
      id: document.getElementById('pecaId')?.value || '',
      nome: document.getElementById('nomePeca')?.value.trim() || '',
      marca: document.getElementById('marcaSelect')?.value || '',
      modelo: document.getElementById('modelo')?.value.trim() || '',
      capacidade: document.getElementById('capacidade')?.value.trim() || '',
      numero_serie: document.getElementById('numeroSerie')?.value.trim() || '',
      local: document.getElementById('localSelect')?.value || '',
      fornecedor: document.getElementById('fornecedorSelect')?.value || '',
      notaFiscal: document.getElementById('notaFiscal')?.value.trim() || '',
      dataNotaFiscal: document.getElementById('dataNota')?.value || '',
      garantia: document.getElementById('garantia')?.value || '',
      dtGarantia: document.getElementById('dtGarantia')?.value || '',
      modalidade: document.getElementById('modalidade')?.value || '',
      valor: desmascararValorMonetario(document.getElementById('valor')?.value),
      seiNum: document.getElementById('seiNum')?.value.trim() || '',
      tipo: document.getElementById('tipoItemPeca')?.value || 'peca'
    };

    // Validações no cliente
    if (!dadosPeca.nome) {
      alert('Por favor, informe o Nome.');
      document.getElementById('nomePeca')?.focus();
      return;
    }

    if (!dadosPeca.marca) {
      alert('Por favor, selecione uma Marca da lista.');
      document.getElementById('marcaSelect')?.focus();
      return;
    }

    if (!dadosPeca.local) {
      alert('Por favor, selecione uma Localização da lista.');
      document.getElementById('localSelect')?.focus();
      return;
    }

    if (!dadosPeca.fornecedor) {
      alert('Por favor, selecione um Fornecedor da lista.');
      document.getElementById('fornecedorSelect')?.focus();
      return;
    }

    const btnSalvar = document.getElementById('btnSalvarPeca');
    if (btnSalvar) btnSalvar.disabled = true;
    if (typeof exibirModal === 'function') exibirModal('processando');

    google.script.run
      .withSuccessHandler((resposta) => {
        if (btnSalvar) btnSalvar.disabled = false;
        if (typeof fecharModal === 'function') fecharModal('processando');

        if (resposta && resposta.sucesso) {
          alert(resposta.mensagem || 'Peça salva com sucesso!');
          limparPeca();
          if (typeof marcarFormularioSalvo === 'function') marcarFormularioSalvo();
          if (typeof trocarPagina === 'function') {
            trocarPagina('pecas-view');
          }
        } else {
          alert(resposta ? resposta.mensagem : 'Erro ao salvar a peça.');
        }
      })
      .withFailureHandler((err) => {
        console.error("❌ [salvarPeca] Erro ao se comunicar com o servidor:", err);
        if (btnSalvar) btnSalvar.disabled = false;
        if (typeof fecharModal === 'function') fecharModal('processando');
        alert('Erro de comunicação com o servidor: ' + (err.message || err));
      })
      .salvarPeca(dadosPeca);
  }

  // ===== 5. LIMPAR FORMULÁRIO =====
  function limparPeca() {

    const form = document.getElementById('formPeca');

    if (form) {
      form.reset();
    }

    // Limpa também o ID oculto da peça
    const pecaId = document.getElementById('pecaId');
    if (pecaId) {
      pecaId.value = '';
    }

    // Garante que os selects fiquem sem seleção
    const selects = [
      'marcaSelect',
      'localSelect',
      'fornecedorSelect',
      'modalidade'
    ];

    selects.forEach(id => {
      const select = document.getElementById(id);
      if (select) {
        select.selectedIndex = 0;
      }
    });

    // Retorna o título para novo cadastro
    const titulo = document.getElementById('formTituloPeca');
    if (titulo) {
      titulo.textContent = 'Nova Peça';
    }

    const status = document.getElementById('formStatusPeca');
    if (status) {
      status.textContent = 'Rascunho';
    }

    // Coloca o cursor novamente no campo Nome
    const nomeInput = document.getElementById('nomePeca');
    if (nomeInput) {
      nomeInput.focus();
    }
  }

</script>
