<script>
// ===== MODAL "VER DETALHES" DO CHAMADO =====
// Separado de ConsultaChamadoFormJS.html de propósito -- arquivo menor,
// isolado do resto do JS de Chamados.

let chamadoIdAtualModal = null;
let anotacaoEditandoId = null;
let historicoChamadoAtual = [];

async function abrirDetalhesChamado(chamadoId) {
    chamadoIdAtualModal = chamadoId;

    const conteudo = document.getElementById('detalheChamadoConteudo');
    if (conteudo) conteudo.innerHTML = '<p>Carregando...</p>';

    const tituloEl = document.getElementById('detalheChamadoIdTitulo');
    if (tituloEl) tituloEl.textContent = '#' + chamadoId;

    cancelarCaixaTextoChamado();

    ajustarTamanhoModalChamado();
    trocarAbaModalChamado('historico');
    if (typeof exibirModal === 'function') exibirModal('modalDetalheChamado');

    try {
        const resposta = await runServerFunction('buscarChamadoDetalhado', chamadoId);
        if (!resposta || resposta.sucesso === false) {
            if (conteudo) conteudo.innerHTML = `<p>${escapeHtml(resposta ? resposta.mensagem : 'Chamado não encontrado.')}</p>`;
            return;
        }
        const fixo = document.getElementById('detalheChamadoFixo');
        if (fixo) fixo.innerHTML = montarInfoFixaChamado(resposta.chamado);

        if (conteudo) conteudo.innerHTML = montarDetalheChamadoHtml(resposta.chamado);
        carregarAnexosChamadoUI(chamadoId);

        const botoesStatus = document.getElementById('detalheChamadoStatusBotoes');
        if (botoesStatus) botoesStatus.innerHTML = montarBotoesStatusChamado(resposta.chamado.status);

        const acaoStatus = document.getElementById('chamadoAcaoStatus');
        if (acaoStatus) acaoStatus.innerHTML = montarBotaoAcaoStatusChamado(resposta.chamado.status);
    } catch (error) {
        console.error('[detalhe] ERRO ao buscar detalhes do chamado:', error);
        if (conteudo) conteudo.innerHTML = '<p>Erro ao buscar detalhes do chamado.</p>';
    }

    carregarHistoricoChamadoUI(chamadoId);
}

function trocarAbaModalChamado(aba) {
    const btnInfo = document.getElementById('tabBtnInfoChamado');
    const btnHistorico = document.getElementById('tabBtnHistoricoChamado');
    const painelInfo = document.getElementById('tabPanelInfoChamado');
    const painelHistorico = document.getElementById('tabPanelHistoricoChamado');

    const mostrarInfo = aba === 'info';

    if (btnInfo) btnInfo.classList.toggle('active', mostrarInfo);
    if (btnHistorico) btnHistorico.classList.toggle('active', !mostrarInfo);

    aplicarEstiloPainelModalChamado(painelInfo, mostrarInfo);
    aplicarEstiloPainelModalChamado(painelHistorico, !mostrarInfo);

    const conteudoInfo = document.getElementById('detalheChamadoConteudo');
    if (conteudoInfo) {
        conteudoInfo.style.flex = '1 1 auto';
        conteudoInfo.style.minHeight = '0';
        conteudoInfo.style.overflowY = 'auto';
    }
    const botoesStatus = document.getElementById('detalheChamadoStatusBotoes');
    if (botoesStatus) botoesStatus.style.flexShrink = '0';

    const acoesFixas = document.getElementById('chamadoAcoesFixas');
    if (acoesFixas) acoesFixas.style.flexShrink = '0';
    const caixaTexto = document.getElementById('chamadoCaixaTexto');
    if (caixaTexto) caixaTexto.style.flexShrink = '0';
    const listaHistorico = document.getElementById('historicoChamadoLista');
    if (listaHistorico) {
        listaHistorico.style.flex = '1 1 auto';
        listaHistorico.style.minHeight = '0';
        listaHistorico.style.overflowY = 'auto';
    }

    if (!mostrarInfo && chamadoIdAtualModal) {
        carregarHistoricoChamadoUI(chamadoIdAtualModal);
    }
}

function aplicarEstiloPainelModalChamado(painel, visivel) {
    if (!painel) return;
    painel.classList.toggle('active', visivel);
    painel.style.display = visivel ? 'flex' : 'none';
    painel.style.flexDirection = 'column';
    painel.style.flex = '1 1 auto';
    painel.style.minHeight = '0';
    painel.style.overflow = 'hidden';
}

function ajustarTamanhoModalChamado() {
    const caixa = document.getElementById('modalDetalheChamadoBox');
    if (!caixa) return;

    caixa.style.width = '92vw';
    caixa.style.maxWidth = '75rem';
    caixa.style.height = '85vh';
    caixa.style.maxHeight = '85vh';
    caixa.style.display = 'flex';
    caixa.style.flexDirection = 'column';
    caixa.style.overflow = 'hidden';

    const cabecalho = caixa.querySelector('.detalhe-chamado-cabecalho');
    if (cabecalho) cabecalho.style.flexShrink = '0';

    const fixo = caixa.querySelector('.detalhe-chamado-fixo');
    if (fixo) fixo.style.flexShrink = '0';

    const abasNav = caixa.querySelector('.tabs-nav');
    if (abasNav) abasNav.style.flexShrink = '0';
}

async function carregarHistoricoChamadoUI(chamadoId) {
    const lista = document.getElementById('historicoChamadoLista');
    if (lista) lista.innerHTML = '<p>Carregando...</p>';

    try {
        const historico = await runServerFunction('buscarHistoricoChamado', chamadoId);
        historicoChamadoAtual = historico;
        if (lista) lista.innerHTML = montarHistoricoChamadoHtml(historico);
    } catch (error) {
        console.error('Erro ao buscar histórico do chamado:', error);
        if (lista) lista.innerHTML = '<p>Erro ao buscar histórico.</p>';
    }
}

function montarHistoricoChamadoHtml(lista) {
    if (!Array.isArray(lista) || lista.length === 0) {
        return '<p>Nenhuma movimentação registrada ainda.</p>';
    }

    return lista.map(item => {
        let corFundo = 'var(--color-slate-50, #f8fafc)';
        let corBorda = 'var(--color-slate-200, #e2e8f0)';
        if (item.tipo === 'anotacao') {
            corFundo = '#eef2ff';
            corBorda = '#c7d2fe';
        } else if (item.tipo === 'alerta') {
            corFundo = '#fee2e2';
            corBorda = '#fca5a5';
        }

        const botaoExcluir = item.tipo === 'anotacao'
            ? `<button type="button" title="Excluir anotação" onclick="excluirAnotacaoChamadoUI(${item.id})"
                style="border:none; background:transparent; cursor:pointer; color:#dc2626; font-size:0.8rem; padding:0;">✕</button>`
            : '';

        const botaoEditar = item.tipo === 'anotacao'
            ? `<button type="button" title="Editar anotação" onclick="iniciarEdicaoAnotacao(${item.id})"
                style="border:none; background:transparent; cursor:pointer; color:#2563eb; font-size:0.8rem; padding:0;">✎</button>`
            : '';

        return `
            <div class="chamado-historico-item" style="background:${corFundo}; border-color:${corBorda};">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem;">
                    <div class="chamado-historico-item-data">${escapeHtml(item.data)}</div>
                    <div style="display:flex; align-items:center; gap:0.5rem;">
                        ${botaoEditar}
                        ${botaoExcluir}
                    </div>
                </div>
                <div class="chamado-historico-item-texto">${escapeHtml(item.texto)}</div>
            </div>
        `;
    }).join('');
}

// ===== CAIXA DE TEXTO ÚNICA (escondida por padrão) =====
let chamadoCaixaTextoModo = null; // 'anotacao' | 'resolver'

function abrirCaixaTextoChamado(modo) {
    chamadoCaixaTextoModo = modo;
    anotacaoEditandoId = null;

    const caixa = document.getElementById('chamadoCaixaTexto');
    const textoEl = document.getElementById('novaAnotacaoChamado');
    const rotuloEl = document.getElementById('chamadoCaixaTextoRotulo');
    const textoBotaoEl = document.getElementById('textoBotaoSalvarAnotacao');

    if (textoEl) textoEl.value = '';

    if (modo === 'resolver') {
        if (rotuloEl) rotuloEl.textContent = 'Motivo do encerramento';
        if (textoEl) textoEl.placeholder = 'Descreva o que foi feito para resolver o chamado...';
        if (textoBotaoEl) textoBotaoEl.textContent = 'Confirmar encerramento';
    } else if (modo === 'reabrir') {
        if (rotuloEl) rotuloEl.textContent = 'Motivo da reabertura';
        if (textoEl) textoEl.placeholder = 'Descreva por que esse chamado está sendo reaberto...';
        if (textoBotaoEl) textoBotaoEl.textContent = 'Confirmar reabertura';
    } else {
        if (rotuloEl) rotuloEl.textContent = 'Nova anotação';
        if (textoEl) textoEl.placeholder = 'Ex: "Serviço no período da manhã"...';
        if (textoBotaoEl) textoBotaoEl.textContent = 'Adicionar';
    }

    if (caixa) caixa.style.display = 'flex';
    if (textoEl) textoEl.focus();
}

function cancelarCaixaTextoChamado() {
    chamadoCaixaTextoModo = null;
    anotacaoEditandoId = null;

    const caixa = document.getElementById('chamadoCaixaTexto');
    const textoEl = document.getElementById('novaAnotacaoChamado');
    if (textoEl) textoEl.value = '';
    if (caixa) caixa.style.display = 'none';
}

async function confirmarCaixaTextoChamado() {
    if (chamadoCaixaTextoModo === 'resolver') {
        const textoEl = document.getElementById('novaAnotacaoChamado');
        const motivo = textoEl ? textoEl.value.trim() : '';
        if (!motivo) {
            alert('Informe o motivo do encerramento.');
            return;
        }
        await alterarStatusChamadoUI('Concluido', motivo);
        return;
    }

    if (chamadoCaixaTextoModo === 'reabrir') {
        const textoEl = document.getElementById('novaAnotacaoChamado');
        const motivo = textoEl ? textoEl.value.trim() : '' ;
        if(!motivo) {
            alert('Informe o motivo da reabertura.');
            return;
        }
        await reabrirChamadoComMotivoUI(motivo);
        return;
    }

    if (anotacaoEditandoId) {
        await editarAnotacaoChamadoUI(anotacaoEditandoId);
    } else {
        await adicionarAnotacaoChamadoUI();
    }
}

async function adicionarAnotacaoChamadoUI() {
    if (!chamadoIdAtualModal) return;

    const textoEl = document.getElementById('novaAnotacaoChamado');
    const texto = textoEl ? textoEl.value.trim() : '';
    if (!texto) {
        alert('Escreva algo antes de adicionar.');
        return;
    }

    try {
        const resposta = await runServerFunction('adicionarAnotacaoChamado', chamadoIdAtualModal, texto);
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        cancelarCaixaTextoChamado();
        carregarHistoricoChamadoUI(chamadoIdAtualModal);
    } catch (error) {
        console.error('Erro ao adicionar anotação:', error);
        alert('Erro ao adicionar anotação.');
    }
}

async function editarAnotacaoChamadoUI(historicoId) {
    if (!historicoId) return;

    const textoEl = document.getElementById('novaAnotacaoChamado');
    const novoTexto = textoEl ? textoEl.value.trim() : '';
    if (!novoTexto) {
        alert('Escreva algo antes de salvar.');
        return;
    }

    try {
        const resposta = await runServerFunction('editarAnotacaoChamado', historicoId, novoTexto);
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        cancelarCaixaTextoChamado();
        carregarHistoricoChamadoUI(chamadoIdAtualModal);
    } catch (error) {
        console.error('Erro ao editar anotação:', error);
        alert('Erro ao editar anotação.');
    }
}

function iniciarEdicaoAnotacao(historicoId) {
    const item = historicoChamadoAtual.find(h => Number(h.id) === Number(historicoId));
    if (!item) return;

    chamadoCaixaTextoModo = 'anotacao';
    anotacaoEditandoId = historicoId;

    const caixa = document.getElementById('chamadoCaixaTexto');
    const textoEl = document.getElementById('novaAnotacaoChamado');
    const rotuloEl = document.getElementById('chamadoCaixaTextoRotulo');
    const textoBotaoEl = document.getElementById('textoBotaoSalvarAnotacao');

    if (textoEl) textoEl.value = item.texto;
    if (rotuloEl) rotuloEl.textContent = 'Editar anotação';
    if (textoBotaoEl) textoBotaoEl.textContent = 'Salvar edição';

    if (caixa) caixa.style.display = 'flex';
    if (textoEl) textoEl.focus();
}

function linhaDetalheChamado(rotulo, valor) {
    return `
        <div class="detalhe-chamado-linha">
            <span class="detalhe-chamado-rotulo">${rotulo}</span>
            <span class="detalhe-chamado-valor">${valor && String(valor).trim() ? escapeHtml(valor) : '--'}</span>
        </div>`;
}

function montarInfoFixaChamado(c) {
    const item = (rotulo, valorHtml) => `
        <div class="detalhe-chamado-fixo-item">
            <span class="detalhe-chamado-fixo-rotulo">${rotulo}</span>
            <span class="detalhe-chamado-fixo-valor">${valorHtml}</span>
        </div>`;

    const valorOuPadrao = valor => valor && String(valor).trim() ? escapeHtml(valor) : '--';

    return `
        ${item('Motivo', valorOuPadrao(c.motivo))}
        ${item('Tipo', valorOuPadrao(c.tipo))}
        ${item('Prioridade', montarBadgePrioridadeChamado(c.prioridade))}
        ${item('Equipamento', valorOuPadrao(c.equipamento))}
    `;
}

function montarDetalheChamadoHtml(c) {
    const secao = (titulo, conteudoHtml) => `
        <div class="detalhe-chamado-secao">
            <h4 class="detalhe-chamado-secao-titulo">${titulo}</h4>
            ${conteudoHtml}
        </div>`;

    const infoChamado = `
        ${linhaDetalheChamado('Status', c.status === 'Concluido' ? 'Concluído' : c.status)}
        ${linhaDetalheChamado('Aberto por', c.abertoPor)}
        ${linhaDetalheChamado('Atribuído a', c.atribuidoA)}
    `;

    const infoObservacao = `
        ${linhaDetalheChamado('Observação', c.observacao)}
    `;

    const infoDatasAnexos = `
        ${linhaDetalheChamado('Data de Abertura', c.dataAbertura)}
        ${linhaDetalheChamado('Data de Início do Atendimento', c.dataInicioAndamento)}
        ${linhaDetalheChamado('Data de Finalização', c.dataFinalizacao)}
        ${linhaDetalheChamado('Última Alteração', c.dataAlteracao)}
        <div id="anexosChamadoLista"><p style="color:var(--color-slate-500,#64748b); font-size:0.875rem;">Carregando anexos...</p></div>
        <input type="file" id="inputAnexoOculto" accept="application/pdf,image/*" style="display:none;" onchange="onArquivoAnexoSelecionado()">
    `;

    return `
        ${secao('Informações do Chamado', infoChamado)}
        ${secao('Observações', infoObservacao)}
        ${secao('Datas e Anexos', infoDatasAnexos)}
    `;
}

// ===== STATUS DO CHAMADO =====
const CHAMADO_STATUS_OPCOES = [
    { valor: 'Aberto', rotulo: 'Aberto' },
    { valor: 'Em Andamento', rotulo: 'Em Andamento' },
    { valor: 'Concluido', rotulo: 'Concluído' }
];

const CHAMADO_STATUS_CORES = {
    'Aberto': { bg: '#dbeafe', cor: '#1d4ed8', bgAtual: '#1d4ed8', borda: '#1d4ed8' },
    'Em Andamento': { bg: '#fef3c7', cor: '#92400e', bgAtual: '#F7D602', borda: '#F0A531' },
    'Concluido': { bg: '#dcfce7', cor: '#166534', bgAtual: '#15803d', borda: '#15803d' }
};

function montarBotoesStatusChamado(statusAtual) {
    const statusNormalizado = String(statusAtual || '').trim().toLowerCase();
    const indiceAtual = CHAMADO_STATUS_OPCOES.findIndex(o => o.valor.toLowerCase() === statusNormalizado);

    return `
        <div class="chamado-status-stepper">
            ${CHAMADO_STATUS_OPCOES.map((opcao, idx) => {
                const cores = CHAMADO_STATUS_CORES[opcao.valor];
                let estado = 'futuro';
                if (idx < indiceAtual) estado = 'concluido';
                if (idx === indiceAtual) estado = 'atual';

                const circuloConteudo = estado === 'concluido' ? '✓' : String(idx + 1);

                const linhaAntes = idx > 0
                    ? `<div class="chamado-status-linha${idx <= indiceAtual ? ' chamado-status-linha--preenchida' : ''}" style="${idx <= indiceAtual ? `background:${cores.borda};` : ''}"></div>`
                    : '';

                return `
                    ${linhaAntes}
                    <div class="chamado-status-step chamado-status-step--${estado}" style="--cor-status:${cores.bgAtual};">
                        <div class="chamado-status-step-circulo">${circuloConteudo}</div>
                        <span class="chamado-status-step-rotulo">${opcao.rotulo}</span>
                    </div>
                `;
            }).join('')}
        </div>
    `;
}

function montarBotaoAcaoStatusChamado(statusAtual) {
    const status = String(statusAtual || '').trim();

    if (status === 'Aberto') {
        return '<button type="button" class="chamado-btn-acao chamado-btn-acao--atender" onclick="atenderChamadoUI()">Atender</button>';
    }
    if (status === 'Em Andamento') {
        return '<button type="button" class="chamado-btn-acao chamado-btn-acao--resolver" onclick="resolverChamadoUI()">Resolver</button>';
    }
    if (status === 'Concluido') {
        return '<button type="button" class="chamado-btn-acao chamado-btn-acao--reabrir" onclick="reabrirChamadoUI()">Reabrir</button>';
    }
    return '';
}

async function alterarStatusChamadoUI(novoStatus, motivo) {
    if (!chamadoIdAtualModal) return;

    try {
        const resposta = await runServerFunction('alterarStatusChamado', chamadoIdAtualModal, novoStatus, motivo);
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        abrirDetalhesChamado(chamadoIdAtualModal);
        consultarChamados();
    } catch (error) {
        console.error('Erro ao alterar status do chamado:', error);
        alert('Erro ao alterar status do chamado.');
    }
}

function atenderChamadoUI() {
    alterarStatusChamadoUI('Em Andamento');
}

function resolverChamadoUI() {
    abrirCaixaTextoChamado('resolver');
}

async function reabrirChamadoUI() {
    abrirCaixaTextoChamado('reabrir');
}

async function reabrirChamadoComMotivoUI(motivo) {
    if (!chamadoIdAtualModal) return;

    try {
        const resposta = await runServerFunction('reativarChamado', chamadoIdAtualModal, motivo);
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        cancelarCaixaTextoChamado();
        abrirDetalhesChamado(chamadoIdAtualModal);
        consultarChamados();
    } catch (error) {
        console.error('Erro ao reabrir chamado:', error);
        alert('Erro ao reabrir chamado.');
    }
}


async function excluirAnotacaoChamadoUI(historicoId) {
    if (!confirm('Excluir essa anotação?')) return;

    try {
        const resposta = await runServerFunction('excluirAnotacaoChamado', historicoId);
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        carregarHistoricoChamadoUI(chamadoIdAtualModal);
    } catch (error) {
        console.error('Erro ao excluir anotação:', error);
        alert('Erro ao excluir anotação.');
    }
}

function nomeArquivoSemData(nome) {
    return String(nome || '').replace(/^\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2}\s*_\s*/, '');
}

function montarAnexosChamadoHtml(lista) {
    const grupos = { 'Relatório': [], 'Nota Fiscal': [], 'Outro': [] };
    (Array.isArray(lista) ? lista : []).forEach(item => {
        const chave = grupos[item.tipo] ? item.tipo : 'Outro';
        grupos[chave].push(item);
    });

    const cardAnexo = (item) => {
        const nomeExibido = escapeHtml(nomeArquivoSemData(item.nomeArquivo));
        return `
        <div class="anexo-card-wrapper">
            <a href="${item.url}" target="_blank" rel="noopener" title="${nomeExibido}" class="anexo-card">
                <div class="anexo-card-icone">📄</div>
                <span class="anexo-card-nome">${nomeExibido}</span>
            </a>
            <button type="button" class="anexo-card-excluir" title="Excluir anexo" onclick="confirmarExclusaoAnexo(${item.id})">✕</button>
        </div>`;
    };

    const cardAdicionar = (tipo, rotulo) => `
        <button type="button" class="anexo-card anexo-card-add" onclick="iniciarUploadAnexo('${tipo}')" title="Adicionar ${rotulo}">
            <div class="anexo-card-icone">+</div>
            <span class="anexo-card-nome">Adicionar</span>
        </button>`;

    const fileira = (titulo, tipo, itens) => `
        <div class="anexo-secao">
            <span class="anexo-secao-titulo">${titulo}</span>
            <div class="anexo-lista">
                ${itens.map(cardAnexo).join('')}
                ${cardAdicionar(tipo, titulo.toLowerCase())}
            </div>
        </div>`;

    return fileira('Relatórios', 'Relatório', grupos['Relatório'])
        + fileira('Notas Fiscais', 'Nota Fiscal', grupos['Nota Fiscal'])
        + (grupos['Outro'].length ? fileira('Outros', 'Outro', grupos['Outro']) : '');
}

async function carregarAnexosChamadoUI(chamadoId) {
    const lista = document.getElementById('anexosChamadoLista');
    if (lista) lista.innerHTML = '<p>Carregando...</p>';

    try {
        const anexos = await runServerFunction('buscarAnexosChamado', chamadoId);
        if (lista) lista.innerHTML = montarAnexosChamadoHtml(anexos);
    } catch (error) {
        console.error('Erro ao buscar anexos do chamado:', error);
        if (lista) lista.innerHTML = '<p>Erro ao buscar anexos.</p>';
    }
}

function exibirAvisoAnexoDuplicado(mensagem) {
    const msgEl = document.getElementById('modalAnexoDuplicadoMensagem');
    if (msgEl) msgEl.textContent = mensagem;
    if (typeof exibirModal === 'function') exibirModal('modalAnexoDuplicado');
}

let tipoAnexoNovo = '';

function iniciarUploadAnexo(tipo) {
    tipoAnexoNovo = tipo;
    const inputEl = document.getElementById('inputAnexoOculto');
    if (inputEl) inputEl.click();
}

async function onArquivoAnexoSelecionado() {
    if (!chamadoIdAtualModal) return;
    const inputEl = document.getElementById('inputAnexoOculto');

    let arquivo;
    try {
        arquivo = await lerArquivoComoBase64(inputEl);
    } catch (erroArquivo) {
        alert(erroArquivo.message);
        if (inputEl) inputEl.value = '';
        return;
    }
    if (!arquivo) return;

    try {
        const resposta = await runServerFunction('adicionarAnexoChamado', chamadoIdAtualModal, tipoAnexoNovo, arquivo);
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        if(resposta && resposta.duplicado) {
            exibirAvisoAnexoDuplicado('Já existe um anexo com esse mesmo conteúdo neste chamado.');
        }
        carregarAnexosChamadoUI(chamadoIdAtualModal);
    } catch (error) {
        console.error('Erro ao adicionar anexo:', error);
        alert('Erro ao adicionar anexo.');
    } finally {
        if (inputEl) inputEl.value = '';
    }
}

let idAnexoExclusao = null;

function confirmarExclusaoAnexo(idAnexo) {
    idAnexoExclusao = idAnexo;
    if (typeof exibirModal === 'function') exibirModal('modalExclusaoAnexo');
}

async function executarExclusaoAnexo() {
    if (!idAnexoExclusao) return;
    try {
        const resposta = await runServerFunction('excluirAnexoChamado', idAnexoExclusao);
        if (typeof fecharModal === 'function') fecharModal('modalExclusaoAnexo');
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        carregarAnexosChamadoUI(chamadoIdAtualModal);
    } catch (e) {
        console.error('Erro ao excluir anexo: ', e);
        alert('Erro ao excluir anexo.');
    }
}
</script>
