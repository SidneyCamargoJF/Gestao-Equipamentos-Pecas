<script>

    // Calculations & Dynamic Rendering Functions
    function renderEquipamentos() {
      const tbody = document.getElementById('bodyEquipamentosView');
      tbody.innerHTML = equipamentosMock.map(eq => `
        <tr>
          <td><strong>${eq.patrimonio}</strong></td>
          <td>${eq.nome}</td>
          <td>${eq.marca}</td>
          <td>${eq.localizacao}</td>
          <td>
            <button class="btn btn-secondary btn-small" onclick="verDetalhes(${eq.id})">Ver Histórico</button>
          </td>
        </tr>
      `).join('');
    }

    // renderChamados() (mock) removido -- a Consulta de Chamados de verdade
    // está sendo construída em apps/Chamados/consulta/. Lembre de religar o
    // roteador (js/IndexSPAJS.html, "if (paginaId === 'chamados') ...")
    // pra a função nova quando ela estiver pronta.

    function renderOrdens() {
      const tbody = document.getElementById('bodyOrdensView');
      tbody.innerHTML = `
        <tr><td><strong>OS-2026-01</strong></td><td>Preventiva</td><td>Split Hi-Wall 9000 BTUs</td><td>Técnico João</td><td><span class="status-pill pill-amber">Em Execução</span></td></tr>
        <tr><td><strong>OS-2026-02</strong></td><td>Corretiva</td><td>VRF 60000 BTUs</td><td>Técnico Roberto</td><td><span class="status-pill pill-green">Finalizada</span></td></tr>
      `;
    }

    // renderAgenda() mock removido -- a Agenda de verdade está em
    // apps/AgendaJS.html agora.

    function filtrarEquipamentos() {
      const q = document.getElementById('searchEquip').value.toLowerCase();
      const rows = document.querySelectorAll('#bodyEquipamentosView tr');
      rows.forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(q) ? '' : 'none';
      });
    }

    // Modal Operations
    function verDetalhes(id) {
      const eq = equipamentosMock.find(e => e.id === id);
      if (!eq) return;

      document.getElementById('modalTitulo').textContent = `${eq.nome} (${eq.patrimonio})`;
      document.getElementById('modalBody').innerHTML = `
        <div style="margin-bottom: 1rem; line-height: 1.6;">
          <p><strong>Marca:</strong> ${eq.marca}</p>
          <p><strong>Localização:</strong> ${eq.localizacao}</p>
          <p><strong>Status Operacional:</strong> <span class="status-pill pill-green">Ativo / Operacional</span></p>
        </div>
        <h4 style="font-size:0.875rem; font-weight:700; margin-bottom:0.5rem; color:#0f172a;">Histórico de Manutenções</h4>
        <table>
          <thead><tr><th>Data</th><th>Tipo</th><th>Status</th></tr></thead>
          <tbody>
            <tr><td>15/06/2026</td><td>Preventiva Mensal</td><td><span class="status-pill pill-green">Concluída</span></td></tr>
            <tr><td>12/01/2026</td><td>Preventiva Anual</td><td><span class="status-pill pill-green">Concluída</span></td></tr>
          </tbody>
        </table>
      `;

      document.getElementById('modalDetalhes').classList.add('aberto');
    }

    function abrirModalNovoEquipamento() {
      document.getElementById('modalNovoEquipamento').classList.add('aberto');
    }

    function salvarNovoEquipamento(e) {
      e.preventDefault();
      const novo = {
        id: equipamentosMock.length + 1,
        nome: document.getElementById('inputNomeEq').value,
        patrimonio: document.getElementById('inputPatrimonioEq').value,
        marca: document.getElementById('inputMarcaEq').value,
        localizacao: document.getElementById('inputLocalEq').value
      };

      equipamentosMock.push(novo);
      fecharModal('modalNovoEquipamento');
      renderEquipamentos();
      renderDashboard();
    }

</script>
