<script>
  
  async function executarExclusao(table, id) {
    console.log('function executarExclusao em crudJS')
    if (!id) {
      alert("Nenhum registro selecionado.");
      return false;
    }

    if (!table) {
      alert("Tabela não definida");
      return false;
    }

    fecharModal('modalExclusao')
    exibirModal('processando')

    // google.script.run não é uma Promise de verdade -- "await" nele sozinho não
    // espera a resposta do servidor. runServerFunction() (HelperJS.html) resolve isso.
    try {
      const resposta = await runServerFunction('ExcluirRegistro', table, id);
      console.log('executarExclusao resposta de runServerFunction: ' + resposta)
      if (resposta && resposta.sucesso === false) {
        alert(resposta.mensagem);
        return false;
      }
      return true;
    } catch (err) {
      console.error('Erro ao desativar registro:', err);
      alert('Erro ao conectar com o servidor.');
      return false;
    } finally {
      fecharModal('processando');
    }
  }

  function consultar(table) {
    if (table === 'tbl_marca') marcaController.consultarMarcas();
  }


</script>
