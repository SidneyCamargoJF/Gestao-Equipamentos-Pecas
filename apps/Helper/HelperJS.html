<script>

  // Funções do servidor que gravam dados: enquanto rodam, a tela mostra o
  // modal "Processando" (ver exibirModal/fecharModal em ModalJS). Leituras
  // (buscar*, filtrar*, listar*, Read*...) não mostram.
  const PADRAO_FUNCAO_GRAVACAO = /^(salvar|cadastrar|desativar|reativar|excluir|editar|adicionar|alterar|gerar|abrir|instalar|remover|atualizar|migrar|preencher)/i;

  function funcaoGravaDados(nomeFuncao) {
    return PADRAO_FUNCAO_GRAVACAO.test(String(nomeFuncao || ''));
  }

  function runServerFunction(nomeFuncao, ...args) {
    const mostrarProcessando = funcaoGravaDados(nomeFuncao) && typeof exibirModal === 'function';
    if (mostrarProcessando) exibirModal('processando');
    const terminar = () => { if (mostrarProcessando && typeof fecharModal === 'function') fecharModal('processando'); };
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(valor => { terminar(); resolve(valor); }) // Sucesso retorna o valor
        .withFailureHandler(erro => { terminar(); reject(erro); })    // Erro rejeita a Promise
        [nomeFuncao](...args);
    });
  }

  function isEmpty(v) {
    if (v== "" || v === null) {
      return true
    }
    return false
  }

  function colorStatusGarantia (status) {
    if (status === "vencendo") 
       { return '#fff3cd' } // amarelo claro
    if (status === "vencida")  
       { return '#f8d7da'} // vermelho claro

    return '#d4edda' // verde claro
    
  }

  function montaStatusGarantia (data, status) {
    let color = colorStatusGarantia(status)
  }

    function showMsgBox(m,tipo) {
    document.getElementById('modalMsgBox').classList.add('aberto');
  }

  function closeMsgBox() {
    idExclusao = null;
    document.getElementById('modalMsgBox').classList.remove('aberto');
  }

  function caixaMsgBox(m) {
    CaixaMsg.style.display = "block";
    TituloMsg.innerHTML = "AVISO";
    CorpoMsg.innerHTML = m;

    RodapeMsg.innerHTML = BtnFechar;
  }

  // ===== ESCAPAR HTML =====
  function escapeHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // 
  // MÁSCARA DE TELEFONE
  // 
  function mascaraTelefone(input) {
    input.addEventListener('input', function() {
      let valor = this.value.replace(/\D/g, '');
      if (valor.length > 11) valor = valor.slice(0, 11);

      if (valor.length <= 10) {
        if (valor.length > 6) {
          this.value = '(' + valor.slice(0, 2) + ') ' + valor.slice(2, 6) + '-' + valor.slice(6);
        } else if (valor.length > 2) {
          this.value = '(' + valor.slice(0, 2) + ') ' + valor.slice(2);
        } else if (valor.length > 0) {
          this.value = '(' + valor;
        } else {
          this.value = '';
        }
      } else {
        if (valor.length > 7) {
          this.value = '(' + valor.slice(0, 2) + ') ' + valor.slice(2, 7) + '-' + valor.slice(7);
        } else if (valor.length > 2) {
          this.value = '(' + valor.slice(0, 2) + ') ' + valor.slice(2);
        } else if (valor.length > 0) {
          this.value = '(' + valor;
        } else {
          this.value = '';
        }
      }
    });
  }

  //
  // MÁSCARA DE SEI
  //
  function mascaraSEI(input) {
    input.addEventListener('input', function() {
      let valor = this.value.replace(/\D/g, '');
      if (valor.length > 17) valor = valor.slice(0, 17);

      let formatado = valor;
      if (valor.length > 5) {
        formatado = valor.slice(0, 5) + '.' + valor.slice(5);
      }
      if (valor.length > 11) {
        formatado = valor.slice(0, 5) + '.' + valor.slice(5, 11) + '/' + valor.slice(11);
      }
      if (valor.length > 15) {
        formatado = valor.slice(0, 5) + '.' + valor.slice(5, 11) + '/' + valor.slice(11, 15) + '-' + valor.slice(15);
      }
      this.value = formatado;
    });
  }

  //
  // VALOR (R$) -- exibição/desmascarar genéricos. A máscara de digitação
  // em si é aplicarMascaraMoedaEquip() (CadastroEquipmentsJS.html, apesar
  // do nome já reaproveitada em Contrato) -- aqui só as duas conversões
  // que telas com "valor" guardado como número puro no banco precisam:
  // número -> "1.500,50" pra mostrar no campo, e texto mascarado -> número
  // de volta, pra salvar.
  function formatarValorExibicaoMonetario(valor) {
    const n = Number(valor);
    if (valor === '' || valor === null || valor === undefined || isNaN(n)) return '';
    return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function desmascararValorMonetario(valorMascarado) {
    const limpo = String(valorMascarado || '').trim().replace(/\./g, '').replace(',', '.');
    const n = parseFloat(limpo);
    return isNaN(n) ? '' : n;
  }

</script>
