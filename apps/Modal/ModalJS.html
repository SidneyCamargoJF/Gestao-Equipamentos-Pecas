<script>

  // Modal de exclusão genérico -- hoje usado só pela tela de Peças (Marca tem seu
  // próprio modal/fluxo de exclusão dedicado, ver ConsultaMarcaFormJS.html).
  function abrirModalExclusao(id) {
    idExclusao = id;
    exibirModal('modalExclusao');
  }

  function fecharModalCadastroFornecedor() {
    const modal = document.getElementById('modalCadastroFornecedor');
    if (modal) modal.classList.remove('aberto');
  }

  function fecharModalCadastroLocalizacao() {
    const modal = document.getElementById('modalCadastroLocalizacao');
    if (modal) modal.classList.remove('aberto');
  }

  function exibirModal(id) {
    const modal = document.getElementById(id);
    if (modal) modal.classList.add('aberto');
  }

  function fecharModal(id) {
    const modal = document.getElementById(id);
    if (modal) modal.classList.remove('aberto');
  }

  // Fecha os modais de cadastro rápido / exclusão de Fornecedor ao clicar fora ou apertar Escape.
  document.addEventListener('DOMContentLoaded', () => {
    ['modalCadastroFornecedor', 'modalCadastroLocalizacao', 'modalExclusaoFornecedor'].forEach(idModal => {
      const elModal = document.getElementById(idModal);
      if (elModal) {
        elModal.addEventListener('click', (e) => {
          if (e.target.classList.contains('modal-overlay')) elModal.classList.remove('aberto');
        });
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        fecharModalCadastroFornecedor();
        fecharModalCadastroLocalizacao();
        fecharModal('modalExclusaoFornecedor');
      }
    });
  });

</script>
