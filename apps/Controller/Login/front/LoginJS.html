<script>
  // ===== LOGIN E PERMISSÕES NA TELA =====
  // iniciarSessaoUI() roda ao abrir o sistema (js/IndexJS): com sessão,
  // libera o sistema e aplica os menus do grupo; sem, mostra o login.
  // paginaPermitidaSessao() é conferida em trocarPagina (js/IndexSPAJS).
  let sessaoUsuario = null;
  let menusPermitidos = null;   // Set com os ids dos menus liberados
  let verificacaoSessao = null;
  const VERIFICAR_SESSAO_MS = 5 * 60 * 1000;

  // página -> item de menu que a libera (com parâmetro: o item do submenu)
  const MENU_DA_PAGINA = {
    'dashboard': 'nav-dashboard', 'chamado-view': 'nav-chamado-view', 'chamado-form': 'nav-chamado-view',
    'estoque-view': 'nav-estoque-view', 'estoque-movimentos-view': 'nav-estoque-movimentos-view',
    'garantias-view': 'nav-garantias-view', 'notas-view': 'nav-notas-view', 'notas-form': 'nav-notas-view',
    'produto-fornecedor-view': 'nav-produto-fornecedor-view', 'pedidos-view': 'nav-pedidos-view', 'pedido-form': 'nav-pedidos-view',
    'agenda': 'nav-agenda', 'equipments-view': 'nav-equipamentos', 'equipments-form': 'nav-equipamentos', 'equipamentos': 'nav-equipamentos',
    'pecas-view': 'nav-pecas', 'pecas-form': 'nav-pecas', 'contratos-view': 'nav-contratos-form', 'contratos-form': 'nav-contratos-form',
    'fornecedor-view': 'nav-fornecedores', 'fornecedor-form': 'nav-fornecedores'
  };
  const MENU_COM_PARAMETRO = { 'relatorios': ['nav-relatorios-', 'checklist'], 'marcas-view': ['nav-marcas-view-', 'marcas'], 'configuracoes': ['nav-configuracoes-', 'usuarios'] };

  // grupo de quem está logado (para as outras telas)
  function grupoSessaoUsuario() { return sessaoUsuario ? sessaoUsuario.grupo : null; }

  function menuDaPagina(paginaId, param) {
    if (MENU_COM_PARAMETRO[paginaId]) return MENU_COM_PARAMETRO[paginaId][0] + (param || MENU_COM_PARAMETRO[paginaId][1]);
    return MENU_DA_PAGINA[paginaId] || null;
  }

  function paginaPermitidaSessao(paginaId, param) {
    if (!menusPermitidos) return true;   // antes do login o sistema está escondido
    const menu = menuDaPagina(paginaId, param);
    return !menu || menusPermitidos.has(menu);
  }

  // ----- vistas e mensagens da tela de login
  const SUBTITULOS_LOGIN = {
    carregando: 'Aguarde...', entrar: 'Entre com seu usuário e senha', primeiro: 'Primeiro acesso',
    cadastro: 'Pedido de acesso', esqueci: 'Esqueci minha senha', redefinir: 'Definir nova senha'
  };

  function loginVista(nome, manterMensagem) {
    document.querySelectorAll('#telaLogin .login-vista').forEach(v => { v.hidden = v.getAttribute('data-vista') !== nome; });
    const sub = document.getElementById('loginSubtitulo');
    if (sub) sub.textContent = SUBTITULOS_LOGIN[nome] || '';
    if (!manterMensagem) loginMensagem('');
    // leva o usuário já digitado de uma vista para a outra
    const usuario = (document.getElementById('loginUsuario') || {}).value || (document.getElementById('esqUsuario') || {}).value || '';
    ['esqUsuario', 'redUsuario'].forEach(id => { const el = document.getElementById(id); if (el && !el.value) el.value = usuario; });
    const primeiro = document.querySelector('#telaLogin .login-vista[data-vista="' + nome + '"] input');
    if (primeiro) setTimeout(() => { if (!primeiro.value) primeiro.focus(); }, 0);
  }

  function loginMensagem(texto, tipo) {
    const el = document.getElementById('loginMensagem');
    if (!el) return;
    el.textContent = texto || '';
    el.className = 'login-mensagem' + (texto ? ' login-mensagem--' + (tipo || 'erro') : '');
  }

  function valorLogin(id) { return ((document.getElementById(id) || {}).value || '').trim(); }

  // usuário em forma de e-mail: repete no e-mail (enquanto o e-mail não foi mexido à parte)
  function loginCopiarEmail(prefixo) {
    const u = document.getElementById(prefixo + 'Usuario'), e = document.getElementById(prefixo + 'Email');
    if (!u || !e) return;
    const ehEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u.value.trim());
    if (ehEmail && (!e.value || e.dataset.copiado === '1')) { e.value = u.value.trim(); e.dataset.copiado = '1'; }
    else if (!ehEmail && e.dataset.copiado === '1') { e.value = ''; e.dataset.copiado = ''; }
  }

  // ----- abrir o sistema
  async function iniciarSessaoUI() {
    document.body.classList.add('sem-sessao');
    document.getElementById('telaLogin').hidden = false;
    loginVista('carregando');
    let r = null;
    try { r = await runServerFunction('obterSessao'); } catch (e) { r = null; }
    if (r && r.logado) { entrarNoSistemaUI(r.sessao); return; }
    loginVista(r && r.primeiroUso ? 'primeiro' : 'entrar');
    if (!r || r.sucesso === false) loginMensagem((r && r.mensagem) || 'Não foi possível conferir o acesso. Recarregue a página.');
  }

  function entrarNoSistemaUI(sessao) {
    sessaoUsuario = sessao;
    menusPermitidos = new Set(sessao.menus || []);
    aplicarPermissoesMenu();
    ['loginSenha', 'primSenha', 'primConfirmacao', 'cadSenha', 'cadConfirmacao', 'redSenha', 'redConfirmacao', 'redCodigo'].forEach(id => {
      const el = document.getElementById(id); if (el) el.value = '';
    });
    loginMensagem('');
    document.getElementById('telaLogin').hidden = true;
    document.body.classList.remove('sem-sessao');
    if (typeof trocarPagina === 'function') trocarPagina('dashboard');
    if (typeof carregarUsuarioMenu === 'function') carregarUsuarioMenu();
    clearInterval(verificacaoSessao);
    verificacaoSessao = setInterval(conferirSessaoUI, VERIFICAR_SESSAO_MS);
  }

  // Esconde os itens do menu que o grupo não tem (e o submenu que ficar vazio)
  function aplicarPermissoesMenu() {
    if (!menusPermitidos) return;
    document.querySelectorAll('.menu-items [id^="nav-"][onclick]').forEach(item => {
      item.style.display = menusPermitidos.has(item.id) ? '' : 'none';
    });
    document.querySelectorAll('.menu-items .menu-dropdown').forEach(grupo => {
      const visiveis = Array.from(grupo.querySelectorAll('.dropdown-item[id^="nav-"]')).filter(i => i.style.display !== 'none');
      grupo.style.display = visiveis.length ? '' : 'none';
    });
  }

  // A cada 5 minutos: sessão vencida (ou usuário bloqueado) volta para o login
  async function conferirSessaoUI() {
    let r = null;
    try { r = await runServerFunction('obterSessao'); } catch (e) { return; }
    if (r && r.sucesso !== false && !r.logado) voltarParaLoginUI('Sua sessão terminou. Entre de novo.', 'info');
    else if (r && r.logado) { menusPermitidos = new Set(r.sessao.menus || []); sessaoUsuario = r.sessao; aplicarPermissoesMenu(); }
  }

  function voltarParaLoginUI(mensagem, tipo) {
    clearInterval(verificacaoSessao);
    sessaoUsuario = null;
    menusPermitidos = null;
    document.querySelectorAll('.modal-overlay.aberto').forEach(m => m.classList.remove('aberto'));
    document.body.classList.add('sem-sessao');
    document.getElementById('telaLogin').hidden = false;
    loginVista('entrar');
    if (mensagem) loginMensagem(mensagem, tipo || 'info');
  }

  // ----- ações
  async function entrarSistemaUI() {
    const usuario = valorLogin('loginUsuario'), senha = (document.getElementById('loginSenha') || {}).value || '';
    if (!usuario || !senha) { loginMensagem('Informe o usuário e a senha.'); return; }
    const btn = document.getElementById('loginBtnEntrar');
    if (btn) btn.disabled = true;
    try {
      const r = await runServerFunction('entrarSistema', usuario, senha);
      if (r && r.logado) { entrarNoSistemaUI(r.sessao); return; }
      loginMensagem((r && r.mensagem) || 'Senha incorreta.');
      const s = document.getElementById('loginSenha'); if (s) { s.value = ''; s.focus(); }
    } catch (e) {
      loginMensagem('Erro ao conectar com o servidor.');
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  async function sairDoSistemaUI() {
    const sair = async () => {
      try { await runServerFunction('sairSistema'); } catch (e) { /* sai da tela mesmo assim */ }
      voltarParaLoginUI('Você saiu do sistema.', 'sucesso');
    };
    if (typeof formularioAlterado === 'function' && formularioAlterado() && typeof confirmarSaidaSemSalvar === 'function') {
      confirmarSaidaSemSalvar(sair);
      return;
    }
    await sair();
  }

  function dadosCadastroLogin(prefixo) {
    return {
      usuario: valorLogin(prefixo + 'Usuario'), nome: valorLogin(prefixo + 'Nome'), email: valorLogin(prefixo + 'Email'),
      matricula: valorLogin(prefixo + 'Matricula'), lotacao: valorLogin(prefixo + 'Lotacao'), setor: valorLogin(prefixo + 'Setor'),
      telefone: valorLogin(prefixo + 'Telefone'),
      senha: (document.getElementById(prefixo + 'Senha') || {}).value || '', confirmacao: (document.getElementById(prefixo + 'Confirmacao') || {}).value || ''
    };
  }

  function problemaCadastroLogin(d) {
    if (!d.usuario || !d.nome || !d.email) return 'Preencha usuário, nome e e-mail.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) return 'Informe um e-mail válido.';
    if (d.senha.length < 8 || !/[A-Za-zÀ-ÿ]/.test(d.senha) || !/\d/.test(d.senha)) return 'A senha precisa ter pelo menos 8 caracteres, com letras e números.';
    if (d.senha !== d.confirmacao) return 'A confirmação não confere com a senha.';
    return '';
  }

  async function cadastrarPrimeiroAdministradorUI() {
    const d = dadosCadastroLogin('prim');
    const erro = problemaCadastroLogin(d);
    if (erro) { loginMensagem(erro); return; }
    try {
      const r = await runServerFunction('cadastrarPrimeiroAdministrador', d);
      if (r && r.logado) { entrarNoSistemaUI(r.sessao); if (r.mensagem) mostrarMensagem(r.mensagem, 'sucesso'); return; }
      loginMensagem((r && r.mensagem) || 'Não foi possível cadastrar.');
    } catch (e) { loginMensagem('Erro ao conectar com o servidor.'); }
  }

  async function solicitarCadastroUI() {
    const d = dadosCadastroLogin('cad');
    const erro = problemaCadastroLogin(d);
    if (erro) { loginMensagem(erro); return; }
    try {
      const r = await runServerFunction('solicitarCadastroUsuario', d);
      if (!r || r.sucesso === false) { loginMensagem((r && r.mensagem) || 'Não foi possível enviar o cadastro.'); return; }
      ['cadUsuario', 'cadNome', 'cadEmail', 'cadMatricula', 'cadLotacao', 'cadSetor', 'cadTelefone', 'cadSenha', 'cadConfirmacao'].forEach(id => {
        const el = document.getElementById(id); if (el) { el.value = ''; el.dataset.copiado = ''; }
      });
      loginVista('entrar', true);
      loginMensagem(r.mensagem, 'sucesso');
    } catch (e) { loginMensagem('Erro ao conectar com o servidor.'); }
  }

  async function enviarCodigoSenhaUI() {
    const usuario = valorLogin('esqUsuario');
    if (!usuario) { loginMensagem('Informe o usuário.'); return; }
    try {
      const r = await runServerFunction('enviarCodigoSenha', usuario);
      if (!r || r.sucesso === false) { loginMensagem((r && r.mensagem) || 'Não foi possível enviar o código.'); return; }
      const red = document.getElementById('redUsuario'); if (red) red.value = usuario;
      loginVista('redefinir', true);
      loginMensagem(r.mensagem, 'info');
    } catch (e) { loginMensagem('Erro ao conectar com o servidor.'); }
  }

  async function redefinirSenhaUI() {
    const usuario = valorLogin('redUsuario'), codigo = valorLogin('redCodigo');
    const senha = (document.getElementById('redSenha') || {}).value || '', conf = (document.getElementById('redConfirmacao') || {}).value || '';
    if (!usuario || !codigo) { loginMensagem('Informe o usuário e o código recebido por e-mail.'); return; }
    if (senha.length < 8 || !/[A-Za-zÀ-ÿ]/.test(senha) || !/\d/.test(senha)) { loginMensagem('A senha precisa ter pelo menos 8 caracteres, com letras e números.'); return; }
    if (senha !== conf) { loginMensagem('A confirmação não confere com a senha.'); return; }
    try {
      const r = await runServerFunction('redefinirSenhaComCodigo', usuario, codigo, senha, conf);
      if (!r || r.sucesso === false) { loginMensagem((r && r.mensagem) || 'Não foi possível definir a senha.'); return; }
      ['redCodigo', 'redSenha', 'redConfirmacao'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
      const lu = document.getElementById('loginUsuario'); if (lu) lu.value = usuario;
      loginVista('entrar', true);
      loginMensagem(r.mensagem, 'sucesso');
    } catch (e) { loginMensagem('Erro ao conectar com o servidor.'); }
  }
</script>
