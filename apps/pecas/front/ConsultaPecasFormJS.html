<script>
      // ===== RENDERIZAÇÃO INICIAL DA PÁGINA =====
      async function renderPecas() {
        console.log('renderPecas')
        await inicializarPecas();
        consultarPecas();

        const inputNome = document.getElementById('filtro-nome');
        if (inputNome) {
          inputNome.focus();
        }
      }

      // ===== CARREGAR MARCAS =====
      async function loadBrandsPecasConsulta() {
        try {
          const res = await runServerFunction("ReadBrands");
          if (!Array.isArray(res)) return [];
          return res.map(line => line[1]).filter(Boolean);
        } catch (error) {
          return [];
        }
      }

      // ===== CARREGAR LOCALIZAÇÃO =====
      async function loadLocationsPecasConsulta() {
        try {
          const res = await runServerFunction("ReadLocations");
          if (!Array.isArray(res)) return [];
          return res.map(line => line[1]).filter(Boolean);
        } catch (error) {
          return [];
        }
      }

      // ===== CARREGAR FORNECEDORES =====
      async function loadSuppliersPecasConsulta() {
        try {
          const res = await runServerFunction("ReadSuppliers");
          if (!Array.isArray(res)) return [];
          return res.map(line => line[1]).filter(Boolean);
        } catch (error) {
          return [];
        }
      }

      // ===== COMPONENTE DE BUSCA COM DROPDOWN COMPLETO AO DAR FOCO =====
      function initSearchPecas(inputId, dropdownId, wrapperId, opcoes) {
        const input = document.getElementById(inputId);
        const dropdown = document.getElementById(dropdownId);
        const wrapper = document.getElementById(wrapperId);

        if (!input || !dropdown || !wrapper) return;

        const listaOpcoes = Array.isArray(opcoes) ? opcoes : [];

        function renderLista(filtro) {
          const f = (filtro || '').toLowerCase().trim();

          const itens = (f === '')
            ? listaOpcoes
            : listaOpcoes.filter(o => String(o).toLowerCase().includes(f));

          dropdown.innerHTML = '';

          if (itens.length === 0) {
            dropdown.innerHTML = '<div class="search-no-result" style="padding: 8px; color: #888;">Nenhum resultado</div>';
          } else {
            itens.forEach(o => {
              const div = document.createElement('div');
              div.className = 'search-option';
              div.textContent = o;

              div.addEventListener('mousedown', (e) => {
                e.preventDefault();
                input.value = o;
                dropdown.classList.remove('visible', 'active');
                consultarPecas();
              });
              dropdown.appendChild(div);
            });
          }
        }

        function abrirListaCompleta() {
          renderLista('');
          dropdown.classList.add('visible', 'active');
        }

        input.addEventListener('focus', abrirListaCompleta);
        input.addEventListener('click', abrirListaCompleta);

        input.addEventListener('input', () => {
          renderLista(input.value);
          dropdown.classList.add('visible', 'active');
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            dropdown.classList.remove('visible', 'active');
            consultarPecas();
          }
          if (e.key === 'Escape') {
            dropdown.classList.remove('visible', 'active');
          }
        });

        document.addEventListener('click', (e) => {
          if (!wrapper.contains(e.target)) {
            dropdown.classList.remove('visible', 'active');
          }
        });
      }

      // ===== FORMATAÇÃO =====
      function formatarValor(v) {
        if (v == null || v === '') return 'R$ 0,00';
        const num = Number(v);
        return isNaN(num) ? v : num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      }

      function formatarGarantia(g) {
        const map = { ativa: 'Ativa', vencida: 'Vencida', vencendo: 'Vencendo' };
        return map[String(g).toLowerCase()] || g || '-';
      }

      function escapeHtml(s) {
        if (s == null) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // ===== ORDENAÇÃO =====
      function ordenar(coluna) {
        if (sortState.coluna === coluna) {
          sortState.direcao = sortState.direcao === 'asc' ? 'desc' : 'asc';
        } else {
          sortState.coluna = coluna;
          sortState.direcao = 'asc';
        }
        atualizarIndicadores();
        filtrar();
      }

      function atualizarIndicadores() {
        document.querySelectorAll('.data-table th').forEach(th => {
          th.classList.remove('sorted');
          const span = th.querySelector('.sort-arrow');
          if (span) span.textContent = '';
        });
        const ths = document.querySelectorAll('.data-table th');
        const indices = { nome: 0, marca: 1, modelo: 2, fornecedor: 3, localizacao: 4, valor: 5, garantia: 6 };
        const idx = indices[sortState.coluna];
        if (idx !== undefined && ths[idx]) {
          ths[idx].classList.add('sorted');
          const span = ths[idx].querySelector('.sort-arrow');
          if (span) span.textContent = sortState.direcao === 'asc' ? '▲' : '▼';
        }
      }

      function aplicarOrdenacao(lista) {
        if (!sortState.coluna || !Array.isArray(lista)) return lista;
        const col = sortState.coluna;
        const dir = sortState.direcao === 'asc' ? 1 : -1;
        const arr = lista.slice();
        arr.sort((a, b) => {
          let va = a[col], vb = b[col];
          if (col === 'garantia') {
            va = garantiaOrdem[String(va).toLowerCase()] || 99;
            vb = garantiaOrdem[String(vb).toLowerCase()] || 99;
            return (va - vb) * dir;
          }
          if (col === 'valor') return (Number(va || 0) - Number(vb || 0)) * dir;
          va = String(va || '').toLowerCase();
          vb = String(vb || '').toLowerCase();
          return va < vb ? -1 * dir : va > vb ? 1 * dir : 0;
        });
        return arr;
      }

      // ===== CONSULTAR, FILTRAR E RENDERIZAR =====
      function consultarPecas() {
        const nome = document.getElementById('filtro-nome')?.value.trim() || '';
        const marca = document.getElementById('pecaMarcaSearch')?.value.trim() || '';
        const localizacao = document.getElementById('pecaLocalizacaoSearch')?.value.trim() || '';
        const fornecedor = document.getElementById('pecaFornecedorSearch')?.value.trim() || '';
        const garantia = document.getElementById('filtro-garantia')?.value || '';

        const criterios = { nome, marca, localizacao, fornecedor, garantia };
        console.log('📤 [consultarPecas] Critérios enviados:', criterios);

        mostrarCarregandoPecas(true);

        google.script.run
          .withSuccessHandler((objPecas) => {
            mostrarCarregandoPecas(false);
            ReturnPecas(objPecas);
          })
          .withFailureHandler((err) => {
            mostrarCarregandoPecas(false);
            console.error('❌ [consultarPecas] Erro ao consultar peças no servidor:', err);
            alert('Erro ao consultar peças: ' + (err.message || err));
          })
          .FiltrarPecas(criterios);
      }

      function mostrarCarregandoPecas(carregando) {
        const btn = document.getElementById('btnConsultarPecas');
        if (btn) btn.disabled = carregando;

        if (carregando) {
          const tbody = document.getElementById('bodyPecasView');
          if (tbody) {
            tbody.innerHTML = '<tr class="loading-row"><td colspan="10"><span class="spinner"></span>Buscando peças...</td></tr>';
          }
        }
      }

      function ReturnPecas(objPecas) {
        console.log('📥 [ReturnPecas] Resposta bruta do servidor:', objPecas);

        if (objPecas === "NoData" || !Array.isArray(objPecas)) {
          pecas = [];
          renderTabela([]);
          return;
        }

        pecas = ordenarDesativadasPorUltimo(aplicarOrdenacao(objPecas));
        renderTabela(pecas);
      }

      // Peças desativadas sempre por último, independente da ordenação de coluna
      // ativa no momento. Array.sort é estável, então preserva a ordem interna
      // de cada grupo (ativas / desativadas).
      function ordenarDesativadasPorUltimo(lista) {
        if (!Array.isArray(lista)) return lista;
        return lista.slice().sort((a, b) => (a.desativada ? 1 : 0) - (b.desativada ? 1 : 0));
      }

      function filtrar() {
        const nome = document.getElementById('filtro-nome')?.value.trim().toLowerCase() || '';
        const marca = document.getElementById('pecaMarcaSearch')?.value.trim().toLowerCase() || '';
        const localizacao = document.getElementById('pecaLocalizacaoSearch')?.value.trim().toLowerCase() || '';
        const fornecedor = document.getElementById('pecaFornecedorSearch')?.value.trim().toLowerCase() || '';
        const garantia = document.getElementById('filtro-garantia')?.value || '';

        let listaFiltrada = pecas.filter(p => {
          if (nome && !String(p.nome || '').toLowerCase().includes(nome)) return false;
          if (marca && !String(p.marca || '').toLowerCase().includes(marca)) return false;
          if (localizacao && !String(p.localizacao || '').toLowerCase().includes(localizacao)) return false;
          if (fornecedor && !String(p.fornecedor || '').toLowerCase().includes(fornecedor)) return false;
          if (garantia && String(p.garantia).toLowerCase() !== garantia.toLowerCase()) return false;
          return true;
        });

        listaFiltrada = ordenarDesativadasPorUltimo(aplicarOrdenacao(listaFiltrada));
        renderTabela(listaFiltrada);
      }

      function renderTabela(lista) {
        const tbody = document.getElementById('bodyPecasView');
        if (!tbody) return;

        tbody.innerHTML = '';

        if (!lista || lista.length === 0) {
          tbody.innerHTML = '<tr class="empty-row"><td colspan="10">Nenhuma peça encontrada com os filtros informados.</td></tr>';
          return;
        }

        lista.forEach(p => {
          const tr = document.createElement('tr');
          if (p.desativada) tr.classList.add('linha-desativada');

          const btnEditar = p.desativada
            ? '<button class="btn-acao btn-editar-linha" title="Editar" disabled style="opacity:0.3; cursor:not-allowed;">✏️</button>'
            : `<button class="btn-acao btn-editar-linha" title="Editar" onclick="editarPeca('${p.id}')">✏️</button>`;

          const btnExcluir = p.desativada
            ? '<button class="btn-acao btn-excluir-linha" title="Desativar" disabled style="opacity:0.3; cursor:not-allowed;">🗑️</button>'
            : `<button class="btn-acao btn-excluir-linha" title="Desativar" onclick="abrirModalExclusao('${p.id}')">🗑️</button>`;

          tr.innerHTML = `
            <td>${escapeHtml(p.nome)} ${p.desativada ? '<span class="status-desativado">(Desativado)</span>' : ''}</td>
            <td>${escapeHtml(p.marca)}</td>
            <td>${escapeHtml(p.modelo)}</td>
            <td>${escapeHtml(p.fornecedor)}</td>
            <td>${escapeHtml(p.localizacao)}</td>
            <td>${formatarValor(p.valor)}</td>
            <td><span class="garantia-badge ${escapeHtml(p.garantia)}">${formatarGarantia(p.garantia)}</span></td>
            <td>${escapeHtml(p.dt_garantia)}</td>
            <td>${escapeHtml(p.sei_num)}</td>
            <td>
              ${btnEditar}
              ${btnExcluir}
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      // ===== AÇÕES DA INTERFACE =====
      function limparFiltros() {
        if (document.getElementById('filtro-nome')) document.getElementById('filtro-nome').value = '';
        if (document.getElementById('pecaMarcaSearch')) document.getElementById('pecaMarcaSearch').value = '';
        if (document.getElementById('pecaLocalizacaoSearch')) document.getElementById('pecaLocalizacaoSearch').value = '';
        if (document.getElementById('pecaFornecedorSearch')) document.getElementById('pecaFornecedorSearch').value = '';
        if (document.getElementById('filtro-garantia')) document.getElementById('filtro-garantia').value = '';

        sortState = { coluna: null, direcao: 'asc' };
        atualizarIndicadores();
        consultarPecas();

        const inputNome = document.getElementById('filtro-nome');
        if (inputNome) inputNome.focus();
      }

      function editarPeca(id) {
        if (typeof trocarPagina === 'function') {
          trocarPagina('pecas-form', id);
        }
      }

      // abrirModalExclusao/fecharModal (genéricos) vivem em apps/Modal/ModalJS.html.
      async function executarExclusaoPeca() {
        if (idExclusao === null) return;

        if (typeof exibirModal === 'function') exibirModal('processando');

        try {
          const resposta = await runServerFunction('desativarPeca', idExclusao);

          if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
          }

          // Não remove da lista -- só marca como desativada, pra continuar
          // aparecendo opaca na consulta (mesmo padrão da Marca).
          const peca = pecas.find(p => String(p.id) === String(idExclusao));
          if (peca) peca.desativada = true;

          idExclusao = null;
          fecharModal('modalExclusao');
          filtrar();
        } catch (err) {
          console.error('Erro ao desativar peça:', err);
          alert('Erro ao conectar com o servidor.');
        } finally {
          if (typeof fecharModal === 'function') fecharModal('processando');
        }
      }

      // ===== INICIALIZAÇÃO ASSÍNCRONA =====
      async function inicializarPecas() {
        console.log('inicializa Peças')
        const [opcoesMarca, opcoesLocalizacao, opcoesFornecedor] = await Promise.all([
          loadBrandsPecasConsulta(),
          loadLocationsPecasConsulta(),
          loadSuppliersPecasConsulta()
        ]);

        initSearchPecas('pecaMarcaSearch', 'pecaMarcaDropdown', 'pecaMarcaWrapper', opcoesMarca);
        initSearchPecas('pecaLocalizacaoSearch', 'pecaLocalizacaoDropdown', 'pecaLocalizacaoWrapper', opcoesLocalizacao);
        initSearchPecas('pecaFornecedorSearch', 'pecaFornecedorDropdown', 'pecaFornecedorWrapper', opcoesFornecedor);

        const filtroNome = document.getElementById('filtro-nome');
        if (filtroNome) {
          filtroNome.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              consultarPecas();
            }
          });
        }

        const modalExclusao = document.getElementById('modalExclusao');
        if (modalExclusao) {
          modalExclusao.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) fecharModal('modalExclusao');
          });
        }

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') fecharModal('modalExclusao');
        });
      }
</script>
