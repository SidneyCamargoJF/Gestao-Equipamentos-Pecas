<section id="page-contratos-view" class="spa-page">

<div class="page-header">
    <div class="actions-bar">
        <h1>✒️ Contratos</h1>
    </div>
    <div class="actions-bar">
        <button type="button" class="btn-secondary" onclick="limparFiltrosContrato()">Limpar</button>
        <button type="button" class="btn-success" onclick="trocarPagina('contratos-form')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Adicionar
        </button>
        <button type="button" id="btnConsultarContratos" class="btn-primary"
            onclick="consultarContratos()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            Consultar
        </button>
    </div>
</div>

    <div class="panel">
        <!-- FILTROS -->
        <form autocomplete="off" onsubmit="return false;">
            <div class="filters-primary">
                <div class="field">
                    <label class="field__label" for="filtro-contrato-numero">Número</label>
                    <input class="field__input" type="text" id="filtro-contrato-numero" placeholder="Nº do contrato">
                </div>

                <div class="field">
                    <label class="field__label" for="filtro-contrato-nome">Contrato</label>
                    <input class="field__input" type="text" id="filtro-contrato-nome" placeholder="Nome do contrato">
                </div>

                <div class="field">
                    <label class="field__label" for="filtro-contrato-sei">SEI</label>
                    <input class="field__input" type="text" id="filtro-contrato-sei" placeholder="Nº do SEI">
                </div>

                <div class="field">
                    <label class="field__label">Empresa</label>
                    <div class="search-wrapper" id="empresaContratoWrapper">
                        <span class="search-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                        </span>
                        <input class="search-input" type="text" id="empresaContratoSearch" placeholder="Selecione a empresa..." autocomplete="off">
                        <div class="search-dropdown" id="empresaContratoDropdown"></div>
                    </div>
                </div>

                <div class="field">
                    <label class="field__label" for="filtro-contrato-situacao">Situação</label>
                    <select class="field__select" id="filtro-contrato-situacao" onchange="consultarContratos()">
                        <option value="">Todas</option>
                        <option value="ativo">Ativo</option>
                        <option value="vencendo">Vencendo</option>
                        <option value="vencido">Vencido</option>
                        <option value="encerrado">Encerrado</option>
                    </select>
                </div>
            </div>
        </form>

        <div id="resumoContratos" style="margin-bottom:0.75rem; font-size:0.875rem; font-weight:600; color:var(--color-slate-600,#475569);"></div>

        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th onclick="ordenarContrato('numero')">Número <span class="sort-arrow"></span></th>
                        <th onclick="ordenarContrato('contrato')">Contrato <span class="sort-arrow"></span></th>
                        <th onclick="ordenarContrato('sei')">SEI <span class="sort-arrow"></span></th>
                        <th onclick="ordenarContrato('empresa')">Empresa <span class="sort-arrow"></span></th>
                        <th onclick="ordenarContrato('valor')">Valor <span class="sort-arrow"></span></th>
                        <th onclick="ordenarContrato('dataInicial')">Dt Inicial <span class="sort-arrow"></span></th>
                        <th onclick="ordenarContrato('dataFinal')">Dt Final <span class="sort-arrow"></span></th>
                        <th onclick="ordenarContrato('situacao')">Situação <span class="sort-arrow"></span></th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="contratosTableBody">
                    <!-- Linhas da tabela serão preenchidas dinamicamente via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</section>
