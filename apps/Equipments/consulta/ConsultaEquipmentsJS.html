<!-- JAVASCRIPT ORIENTADO A OBJETOS -->
<script>
class EquipmentViewController extends SearchOOP {

  // ===== INICIALIZAÇÃO =====

  bindEvents() {
    const inputEquipment = document.getElementById('equipmentSearch');
    if (inputEquipment) inputEquipment.focus();

    // Eventos de overlay e esc
    const modais = ['modalExclusaoEquipment', 'modalEdicaoEquipment', 'modalCadastroEquipment'];
    modais.forEach(idModal => {
      const elModal = document.getElementById(idModal);
      if (elModal) {
        elModal.addEventListener('click', (e) => {
          if (e.target.classList.contains('modal-overlay')) {
            this.fecharTodosModais();
          }
        });
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        this.fecharTodosModais();
      }
    });
  }

  fecharTodosModais() {
    if (typeof fecharModal === 'function') {
      fecharModal('modalCadastroEquipment');
      fecharModal('modalEdicaoEquipment');
      fecharModal('modalExclusaoEquipment');
    }
  }

  // ===== CONSULTA E FILTROS =====
  consultar() {
    const equipmentInput = document.getElementById('equipmentSearch');
    const equipment = equipmentInput ? equipmentInput.value.trim().toLowerCase() : '';
    console.log('EquipmentController.consultar')
    console.log(equipment)
    const criterios = { equipment };

    google.script.run
      .withSuccessHandler(objEquipments => this.retorno(objEquipments))
      .withFailureHandler(err => console.error('Erro ao consultar: ', err))
      .filtrarEquipamentos(criterios);
  }

  retorno(objectList) {
    console.log( 'retorno: ')
    console.log(objectList)
    this.list = Array.isArray(objectList) ? objectList : [];
    // console.log( 'list: ' + this.list)
    this.listaFiltrada = typeof this.aplicarOrdenacao === 'function' ? this.aplicarOrdenacao(this.list) : this.list;
console.log('listaFiltrada: ' + this.listaFiltrada)
    const opcoesEquipment = [...new Set(this.list.map(it => it.Equipment).filter(Boolean))];
    if (typeof initSearch === 'function') {
      console.log('if typeof initSearch')
      initSearch('equipmentSearch', 'equipmentDropdown', 'equipmentWrapper', opcoesEquipment);
    }

    console.log('retorno - Lista Filtrada: ')
    console.log(this.listaFiltrada)

    this.render(this.listaFiltrada);
  }

  filtrar() {
    const equipmentInput = document.getElementById('equipmentSearch');
    const equipment = equipmentInput ? equipmentInput.value.trim().toLowerCase() : '';

    this.listaFiltrada = this.list.filter(it => {
      if (equipment && !(it.equipment || '').toLowerCase().includes(equipment)) return false;
      return true;
    });

    if (typeof aplicarOrdenacao === 'function') {
      this.listaFiltrada = this.aplicarOrdenacao(this.listaFiltrada);
    }
    this.render(this.listaFiltrada);
  }

  limparFiltros() {
    const inputEquipment = document.getElementById('equipmentSearch');
    if (inputEquipment) inputEquipment.value = '';

    this.sortState = { coluna: null, direcao: 'asc' };
    if (typeof atualizarIndicadores === 'function') atualizarIndicadores();
    this.consultar();

    if (inputEquipment) inputEquipment.focus();
  }

  // ===== RENDERIZAÇÃO DE TABELA =====
  render(lista) {
    const tbody = document.getElementById('tabelaBodyEquipment');
    if (!tbody) return;

    tbody.innerHTML = '';

    if (!lista || lista.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="2">Nenhum registro encontrado.</td></tr>';
      return;
    }

    console.log(lista)

    lista.forEach(it => {
      const tr = document.createElement('tr');
      if (it.desativada) tr.classList.add('linha-desativada');

      const btnEditar = it.desativada
        ? '<button class="btn-acao btn-editar-linha" title="Editar" disabled style="opacity:0.3; cursor:not-allowed;">✏️</button>'
        : `<button class="btn-acao btn-editar-linha" title="Editar" onclick="equipmentViewController.edit('${it.id}')">✏️</button>`;

      const btnExcluir = it.desativada
        ? `<button class="btn-acao btn-reativar-linha" title="Reativar" onclick="equipmentViewController.reativar('${it.id}')">♻️</button>`
        : `<button class="btn-acao btn-excluir-linha" title="Desativar" onclick="equipmentViewController.confirmaExclusao('${it.id}')">🗑️</button>`;

      tr.innerHTML = `
        <td>${escapeHtml(it.patrimonio)} ${it.desativada ? '<span class="status-desativado">(Desativado)</span>' : ''}</td>
        <td>${escapeHtml(it.nome)}</td>
        <td>${escapeHtml(it.marca)}</td>
        <td>${escapeHtml(it.modelo)}</td>
        <td>${escapeHtml(it.localizacao)}</td>
        <td>
          ${btnEditar}
          ${btnExcluir}
        </td>
      `;
      tbody.appendChild(tr);

    });
  }

  // ===== MODAL DE CADASTRO =====
  abrirModalCadastro() {
    console.log('equipmentViewController.abrirModalCadastro()')
    const input = document.getElementById('equipmentSearch');
    if (input) input.value = '';

    trocarPagina('equipments-form', 0)

    const modal = document.getElementById('modalCadastroEquipment');
    if (modal) {
      modal.classList.add('aberto');
      setTimeout(() => input && input.focus(), 100);
    }
  }

  salvarNovoEquipment() {
    const input = document.getElementById('novoEquipmentNome');
    const nomeEquipment = input ? input.value.trim() : '';

    if (!nomeEquipment) {
      alert('Por favor, digite o nome do Equipamento.');
      return;
    }

    google.script.run
      .withSuccessHandler((resposta) => {
        if (resposta && resposta.sucesso) {
          this.consultar();
          if (typeof fecharModal === 'function') fecharModal('modalCadastroEquipment');
        } else {
          alert(resposta ? resposta.mensagem : 'Erro ao cadastrar.');
        }
      })
      .withFailureHandler((err) => {
        console.error('Erro ao cadastrar:', err);
        alert('Ocorreu um erro no script: ' + (err.message || err));
      })
      .saveEquipment(nomeEquipment);
  }

  // ===== MODAL DE EDIÇÃO =====
  abrirModalEdicao(id) {
    const equipmentEncontrada = this.list.find(it => String(it.id) === String(id));

    document.getElementById('editEquipmentId').value = id;
    document.getElementById('editEquipmentNome').value = equipmentEncontrada ? equipmentEncontrada.equipment : '';

    const modal = document.getElementById('modalEdicaoEquipment');
    if (modal) modal.classList.add('aberto');
  }

  edit(id) {
console.log('edit')
console.log('id: ' + id)
    
    document.getElementById('cadEquipId').value = String(id);

    trocarPagina('equipments-form', id)

    return
  }

  reativar(id) {
    return;
  }

  // ===== MODAL DE EXCLUSÃO =====
  confirmaExclusao(id) {
    const btnDelete = document.getElementById('btn-delete');

    if (!id) {
      alert("Erro: Nenhum registro selecionado.");
      return;
    }
console.log('confirmaExclusao')
console.log(btnDelete)
console.log(id)
    btnDelete.onclick = () => this.excluir(id);

    exibirModal('modalExclusao');
  }


  async excluir(id) {
    console.log('excluir(id) de equipmentViewController')
    if (typeof executarExclusao === 'function') {
      executarExclusao('tbl_equipment', id);
    }
    this.consultar();
    if (typeof fecharModal === 'function') fecharModal('modalExclusaoEquipment');
  }
}

// Instanciação da Controller
const equipmentViewController = new EquipmentViewController();

document.addEventListener('DOMContentLoaded', () => {
  equipmentViewController.init();
});

</script>
