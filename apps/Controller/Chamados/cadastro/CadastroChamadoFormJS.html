<script>
  // =====================================================
  // CADASTRO DE CHAMADO
  // Pelo menos um equipamento é obrigatório. A lista aceita vários,
  // adicionados pelo Patrimônio, pela Localização (um ou todos dela) ou
  // automaticamente ao escolher o contrato (todos os equipamentos dele).
  // Gravada em tbl_chamado_equipamentos; o 1º vai também em ID_EQUIPAMENTO.
  // =====================================================


  // ===== RENDERIZAÇÃO INICIAL DA PÁGINA =====
  // "id" só vem preenchido quando chega pela Consulta (botão editar), via
  // trocarPagina('chamado-form', id) -- ver editarChamado() na Consulta.
  async function renderChamadoForm(id) {

    const idEl = document.getElementById('chamadoId');
    if (idEl) idEl.value = id || '';

    // Abas (Vínculo / Equipamentos / Serviço): sempre abre na primeira.
    if (typeof initTabs === 'function') initTabs();
    if (typeof ativarAba === 'function') ativarAba('chamado-vinculo');

    const tituloEl = document.getElementById('chamadoFormTitulo');
    if (tituloEl) tituloEl.textContent = id ? '✏️ Editar Chamado' : '📩 Abrir Chamado';

    const btnSalvarEl = document.getElementById('chamadoBtnSalvar');
    if (btnSalvarEl) btnSalvarEl.textContent = id ? 'Salvar Alterações' : 'Salvar Chamado';

    // Anexos já enviados (de edições anteriores) são geridos na tela de
    // Consulta (modal de detalhes) -- aqui só dá pra adicionar novos.
    const avisoAnexosEl = document.getElementById('chamadoEditandoAnexosAviso');
    if (avisoAnexosEl) avisoAnexosEl.style.display = id ? 'inline' : 'none';

    const motivoOutroEl = document.getElementById('chamadoMotivoOutro');
    if (motivoOutroEl) {
      motivoOutroEl.value = '';
      motivoOutroEl.style.display = 'none';
    }
    const motivoEl = document.getElementById('chamadoMotivo');
    if (motivoEl) motivoEl.value = '';
    const descricaoEl = document.getElementById('chamadoDescricao');
    if (descricaoEl) descricaoEl.value = '';
    const tipoEl = document.getElementById('chamadoTipo');
    if (tipoEl) tipoEl.value = '';
    atualizarHabilitacaoDetalhamentoChamado();
    const atribuidoEl = document.getElementById('chamadoAtribuidoA');
    if (atribuidoEl) atribuidoEl.value = '';
    atribuidoAutoChamado = '';
        const abertoPorEl = document.getElementById('chamadoAbertoPor');
    if (abertoPorEl) abertoPorEl.value = '';
    ['chamadoEquipPatrimonio', 'chamadoEquipLocalizacao', 'chamadoRelatorioArquivo', 'chamadoNotaFiscalArquivo'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    registrarCampoAnexoCadastro('chamadoRelatorioArquivo', 'chamadoRelatorioLista');
    registrarCampoAnexoCadastro('chamadoNotaFiscalArquivo', 'chamadoNotaFiscalLista');
    limparAnexosCadastroSelecionados(['chamadoRelatorioArquivo', 'chamadoNotaFiscalArquivo']);

    const statusEl = document.getElementById('chamadoPatrimonioStatus');
    if (statusEl) { statusEl.textContent = ''; statusEl.className = 'chamado-patrimonio-status'; }
    const statusLocalEl = document.getElementById('chamadoLocalizacaoStatus');
    if (statusLocalEl) { statusLocalEl.textContent = ''; statusLocalEl.className = 'chamado-patrimonio-status'; }
    ultimoPatrimonioVerificadoChamado = '';
    ultimaLocalizacaoBuscadaChamado = '';
    equipamentosChamado = [];
    contratoEquipIncluidoChamado = '';
    definirPatrimonioEncontradoChamado(null);
    renderizarEquipamentosChamado();
    ['chamadoContratoSearch', 'chamadoContratoIdSelecionado', 'chamadoContratoEmpresa', 'chamadoContratoNumeroExibicao', 'chamadoCompetencia', 'chamadoDataPrevista', 'chamadoPrazoAtendimentoPreview', 'chamadoPrazoSolucaoPreview'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    contratoChamadoAutoValor = '';
    exibirContratoChamado(null, '');
    esconderEscolhaEquipamentoChamado();

    atualizarContadorDescricaoChamado();

    travarCampoCarregandoChamado('chamadoEquipLocalizacao', 'Resgatando localizações...');
    travarCampoCarregandoChamado('chamadoAtribuidoA', 'Resgatando prestadores de serviço...');
    travarCampoCarregandoChamado('chamadoAbertoPor', 'Identificando usuário...');

    const [locais, fornecedoresPrestadores, usuarioLogado] = await Promise.all([
      carregarLocaisChamado(),
      carregarFornecedoresPrestadoresChamado(),
      runServerFunction('buscarUsuarioLogado').catch(() => null),
      carregarContratosParaVinculoChamado()
    ]);

    destravarCampoCarregandoChamado('chamadoEquipLocalizacao', 'Selecione a localização...');
    locaisChamado = locais || [];
    initSearchChamado('chamadoEquipLocalizacao', 'chamadoEquipLocalizacaoDropdown', 'chamadoEquipLocalizacaoWrapper', locais);

    destravarCampoCarregandoChamado('chamadoAtribuidoA', 'Técnico interno ou fornecedor prestador de serviço...');
    initSearchChamado('chamadoAtribuidoA', 'chamadoAtribuidoDropdown', 'chamadoAtribuidoWrapper', fornecedoresPrestadores);

    destravarCampoCarregandoChamado('chamadoAbertoPor', 'Usuário logado');
    if (abertoPorEl) {
      abertoPorEl.value = (usuarioLogado && usuarioLogado.nome) || '';
      abertoPorEl.title = (usuarioLogado && usuarioLogado.encontrado === false)
        ? 'Seu login (' + usuarioLogado.email + ') não está cadastrado em Configurações > Usuários'
        : 'Preenchido com o usuário logado';
    }

    // Mesmas referências de função a cada abertura: addEventListener ignora
    // duplicadas, então não empilha handlers.
    const patrimonioEl = document.getElementById('chamadoEquipPatrimonio');
    if (patrimonioEl) {
      patrimonioEl.addEventListener('blur', verificarPatrimonioAoSairChamado);
      patrimonioEl.addEventListener('input', verificarPatrimonioDigitandoChamado);
      patrimonioEl.addEventListener('keydown', teclaPatrimonioChamado);
    }
    const localizacaoInputEl = document.getElementById('chamadoEquipLocalizacao');
    if (localizacaoInputEl) localizacaoInputEl.addEventListener('input', verificarLocalizacaoDigitandoChamado);

    const contratoSearchEl = document.getElementById('chamadoContratoSearch');
    if (contratoSearchEl) {
      contratoSearchEl.addEventListener('input', resolverContratoDigitadoChamado);
      contratoSearchEl.addEventListener('blur', limparContratoChamadoSeNaoResolvido);
    }

    const classificacaoEl = document.getElementById('chamadoClassificacao');
    if (classificacaoEl) classificacaoEl.addEventListener('change', atualizarPreviewPrazosChamado);

    if (id) {
      if (typeof exibirModal === 'function') exibirModal('processando');
      try {
        await preencherFormularioChamadoParaEdicao(id);
      } finally {
        if (typeof fecharModal === 'function') fecharModal('processando');
      }
    } else {
      const inputMotivo = document.getElementById('chamadoMotivo');
    }
  }

  function limparChamado() {
    renderChamadoForm();
  }

  // ===== CARREGAR CHAMADO EXISTENTE PARA EDIÇÃO =====
  async function preencherFormularioChamadoParaEdicao(id) {
    try {
      const dados = await runServerFunction('buscarChamadoParaEdicao', id);
      if (!dados) {
        alert('Não foi possível carregar esse chamado para edição.');
        return;
      }

      const motivoSelect = document.getElementById('chamadoMotivo');
      const motivoOutroEl = document.getElementById('chamadoMotivoOutro');
      const opcoesFixas = motivoSelect ? Array.from(motivoSelect.options).map(o => o.value) : [];

      if (motivoSelect) {
        if (dados.motivo && opcoesFixas.includes(dados.motivo)) {
          motivoSelect.value = dados.motivo;
          if (motivoOutroEl) { motivoOutroEl.value = ''; motivoOutroEl.style.display = 'none'; }
        } else {
          motivoSelect.value = 'outro';
          if (motivoOutroEl) {
            motivoOutroEl.value = dados.motivo || '';
            motivoOutroEl.style.display = 'block';
          }
        }
      }

      const tipoEl = document.getElementById('chamadoTipo');
      if (tipoEl) tipoEl.value = dados.tipo || '';
      atualizarHabilitacaoDetalhamentoChamado();

      const classificacaoEl = document.getElementById('chamadoClassificacao');
      if (classificacaoEl) classificacaoEl.value = dados.classificacao || '';

      const abertoPorEl = document.getElementById('chamadoAbertoPor');
      if (abertoPorEl) abertoPorEl.value = dados.abertoPor || '';

      const atribuidoEl = document.getElementById('chamadoAtribuidoA');
      if (atribuidoEl) atribuidoEl.value = dados.atribuidoA || '';

      const descricaoEl = document.getElementById('chamadoDescricao');
      if (descricaoEl) descricaoEl.value = dados.descricao || '';
      atualizarContadorDescricaoChamado();

      equipamentosChamado = [];
      (dados.equipamentos || []).forEach(e => adicionarEquipamentoNaListaChamado(e, ''));
      renderizarEquipamentosChamado();

      exibirContratoChamado(dados.contrato || null, '');
      atribuidoAutoChamado = (dados.contrato && dados.atribuidoA === dados.contrato.empresa) ? dados.atribuidoA : '';
      // o contrato já gravado não reinclui os equipamentos dele ao abrir
      contratoEquipIncluidoChamado = dados.contrato ? String(dados.contrato.id) : '';

      const competenciaEl = document.getElementById('chamadoCompetencia');
      if (competenciaEl) competenciaEl.value = dados.competencia || '';

      const dataPrevistaEl = document.getElementById('chamadoDataPrevista');
      if (dataPrevistaEl) dataPrevistaEl.value = dados.dataPrevista || '';

      const atendPreviewEl = document.getElementById('chamadoPrazoAtendimentoPreview');
      if (atendPreviewEl) atendPreviewEl.value = dados.prazoAtendimento || '';
      const solPreviewEl = document.getElementById('chamadoPrazoSolucaoPreview');
      if (solPreviewEl) solPreviewEl.value = dados.prazoSolucao || '';
    } catch (error) {
      console.error('Erro ao carregar chamado para edição:', error);
      alert('Erro ao carregar chamado para edição.');
    }
  }

  // ===== TRAVA VISUAL ENQUANTO OS DROPDOWNS DE BUSCA CARREGAM (Localização /
  // Atribuído a demoram porque dependem de consultas no servidor) =====
  function travarCampoCarregandoChamado(inputId, mensagem) {
    const input = document.getElementById(inputId);
    if (!input) return;
    input.disabled = true;
    input.placeholder = mensagem;
    input.value = '';
  }

  function destravarCampoCarregandoChamado(inputId, placeholderNormal) {
    const input = document.getElementById(inputId);
    if (!input) return;
    input.disabled = false;
    input.placeholder = placeholderNormal;
  }

  // ===== CONTADOR DE CARACTERES DA DESCRIÇÃO =====
  const CHAMADO_DESCRICAO_MAX = 300;

  function atualizarContadorDescricaoChamado() {
    const descricaoEl = document.getElementById('chamadoDescricao');
    const contadorEl = document.getElementById('chamadoDescricaoContador');
    if (!descricaoEl || !contadorEl) return;

    const restantes = CHAMADO_DESCRICAO_MAX - descricaoEl.value.length;
    contadorEl.textContent = restantes + ' caracteres restantes';
  }

  document.addEventListener('input', (e) => {
    if (e.target && e.target.id === 'chamadoDescricao') {
      atualizarContadorDescricaoChamado();
    }
  });

  // ===== PATRIMÔNIO: verificação ao sair do campo (igual verificarCnpjAoSair
  // do Cadastro de Fornecedor) -- só avisa se achou ou não, nunca bloqueia. =====
  async function verificarPatrimonioAoSairChamado() {
    const patrimonioEl = document.getElementById('chamadoEquipPatrimonio');
    const statusEl = document.getElementById('chamadoPatrimonioStatus');
    if (!patrimonioEl || !statusEl) return;

    const patrimonio = patrimonioEl.value.trim();
    if (!patrimonio) {
      statusEl.textContent = '';
      statusEl.className = 'chamado-patrimonio-status';
      ultimoPatrimonioVerificadoChamado = '';
      definirPatrimonioEncontradoChamado(null);
      return;
    }

    if (patrimonio === ultimoPatrimonioVerificadoChamado) return;
    ultimoPatrimonioVerificadoChamado = patrimonio;

    statusEl.textContent = 'Buscando...';
    statusEl.className = 'chamado-patrimonio-status';
    definirPatrimonioEncontradoChamado(null);

    try {
      const resposta = await runServerFunction('verificarPatrimonioChamado', patrimonio);
      // a pessoa continuou digitando enquanto a busca rodava: descarta
      if (patrimonioEl.value.trim() !== patrimonio) return;
      if (resposta && resposta.existe) {
        const resultado = resposta.equipamento;
        const detalheEquipamento = (resultado.marca ? ' - ' + resultado.marca : '') + (resultado.modelo ? ' - ' + resultado.modelo : '');
        const jaNaLista = equipamentosChamado.some(e => Number(e.id) === Number(resultado.id));
        statusEl.textContent = (jaNaLista ? 'Já está na lista' : 'Equipamento encontrado -- clique em Adicionar') +
          (resultado.nome ? ' (' + resultado.nome + detalheEquipamento + ')' : '');
        statusEl.className = 'chamado-patrimonio-status encontrado';
        definirPatrimonioEncontradoChamado(jaNaLista ? null : Object.assign({ patrimonio: patrimonio }, resultado));
        // sugere o contrato do equipamento só se ainda não há contrato escolhido
        exibirContratoChamado(resposta.contrato, resposta.aviso);
      } else {
        statusEl.textContent = 'Patrimônio não encontrado no cadastro de equipamentos';
        statusEl.className = 'chamado-patrimonio-status nao-encontrado';
      }
    } catch (error) {
      ultimoPatrimonioVerificadoChamado = '';
      statusEl.textContent = '';
      statusEl.className = 'chamado-patrimonio-status';
    }
  }

  let ultimoPatrimonioVerificadoChamado = '';
  let timerPatrimonioChamado = null;

  // Busca assim que a pessoa para de digitar (além do blur).
  function verificarPatrimonioDigitandoChamado() {
    clearTimeout(timerPatrimonioChamado);
    timerPatrimonioChamado = setTimeout(verificarPatrimonioAoSairChamado, 700);
  }

  //CONTRATO VINCULADO

  function rotuloContratoChamado(c) {
    return c.numero + (c.empresa ? ' — ' + c.empresa : '') + (c.sei ? ' (SEI ' + c.sei + ')' : '');
  }

  let contratosDisponiveisChamado = [];
  let mapaContratoChamadoPorRotulo = {};

  async function carregarContratosParaVinculoChamado() {
    try {
      contratosDisponiveisChamado = await runServerFunction('listarContratosParaFiltro');
    } catch (e) {
      contratosDisponiveisChamado = [];
    }
    mapaContratoChamadoPorRotulo = {};
    const opcoes = (contratosDisponiveisChamado || []).map(c => {
      const rotulo = rotuloContratoChamado(c);
      mapaContratoChamadoPorRotulo[rotulo] = c;
      return rotulo;
    });
    initSearchChamado('chamadoContratoSearch', 'chamadoContratoDropdown', 'chamadoContratoWrapper', opcoes);
  }

  let contratoChamadoAutoValor = '';

  function exibirContratoChamado(contrato, aviso) {
    const avisoEl = document.getElementById('chamadoContratoAviso');
    if (avisoEl) avisoEl.textContent = aviso || '';

    const inputEl = document.getElementById('chamadoContratoSearch');
    const idEl = document.getElementById('chamadoContratoIdSelecionado');
    if (!inputEl || !idEl) return;

    const intocado = !inputEl.value.trim() || inputEl.value === contratoChamadoAutoValor;
    if (!intocado) return;

    const empresaEl = document.getElementById('chamadoContratoEmpresa');
    const numeroEl = document.getElementById('chamadoContratoNumeroExibicao');
    const texto = contrato ? rotuloContratoChamado(contrato) : '';
    inputEl.value = texto;
    idEl.value = contrato ? contrato.id : '';
    if (empresaEl) empresaEl.value = contrato ? contrato.empresa : '';
    if (numeroEl) numeroEl.value = contrato ? contrato.numero : '';
    contratoChamadoAutoValor = texto;
    preencherAtribuidoComContratoChamado(contrato);
    atualizarPreviewPrazosChamado();
  }

  // "Atribuído a" recebe a empresa do contrato. Só substitui o que estiver
  // vazio ou o que foi preenchido automaticamente por um contrato anterior
  // -- o que a pessoa digitou à mão fica.
  let atribuidoAutoChamado = '';

  function preencherAtribuidoComContratoChamado(contrato) {
    const atribuidoEl = document.getElementById('chamadoAtribuidoA');
    if (!atribuidoEl) return;
    const atual = atribuidoEl.value.trim();
    if (atual && atual !== atribuidoAutoChamado) return;
    const empresa = contrato ? String(contrato.empresa || '').trim() : '';
    atribuidoEl.value = empresa;
    atribuidoAutoChamado = empresa;
  }

  function resolverContratoDigitadoChamado() {
    const inputEl = document.getElementById('chamadoContratoSearch');
    const idEl = document.getElementById('chamadoContratoIdSelecionado');
    if (!inputEl || !idEl) return;
    const texto = inputEl.value.trim();
    const achado = texto ? mapaContratoChamadoPorRotulo[texto] : null;
    idEl.value = achado ? achado.id : '';
    const empresaEl = document.getElementById('chamadoContratoEmpresa');
    if (empresaEl) empresaEl.value = achado ? achado.empresa : '';
    const numeroEl = document.getElementById('chamadoContratoNumeroExibicao');
    if (numeroEl) numeroEl.value = achado ? achado.numero : '';
    preencherAtribuidoComContratoChamado(achado);
    atualizarPreviewPrazosChamado();
    if (achado) incluirEquipamentosDoContratoChamado(achado);
  }

  function limparContratoChamadoSeNaoResolvido() {
    const inputEl = document.getElementById('chamadoContratoSearch');
    const idEl = document.getElementById('chamadoContratoIdSelecionado');
    if (!inputEl || !idEl) return;
    if (inputEl.value.trim() && !idEl.value) {
      inputEl.value = '';
      const empresaEl = document.getElementById('chamadoContratoEmpresa');
      if (empresaEl) empresaEl.value = '';
      const numeroEl = document.getElementById('chamadoContratoNumeroExibicao');
      if (numeroEl) numeroEl.value = '';
      preencherAtribuidoComContratoChamado(null);
      atualizarPreviewPrazosChamado();
    }
  }

  //PREVIEW DO PRAZO DE SLA 
  async function atualizarPreviewPrazosChamado() {
    const idEl = document.getElementById('chamadoContratoIdSelecionado');
    const prioridadeEl = document.getElementById('chamadoClassificacao');
    const atendEl = document.getElementById('chamadoPrazoAtendimentoPreview');
    const solEl = document.getElementById('chamadoPrazoSolucaoPreview');
    if (!atendEl || !solEl) return;

    const contratoId = idEl ? idEl.value : '';
    const prioridade = prioridadeEl ? prioridadeEl.value : '';
    if (!contratoId || !prioridade) {
      atendEl.value = '';
      solEl.value = '';
      return;
    }

    try {
      const prazos = await runServerFunction('previewPrazosChamado', contratoId, prioridade);
      atendEl.value = (prazos && prazos.prazoAtendimento) || 'Sem prazo definido no SLA pra essa prioridade';
      solEl.value = (prazos && prazos.prazoSolucao) || 'Sem prazo definido no SLA pra essa prioridade';
    } catch (e) {
      atendEl.value = '';
      solEl.value = '';
    }
  }

  // ===== LISTA DE EQUIPAMENTOS DO CHAMADO (um ou mais) =====
  // Cada item: { id, patrimonio, nome, marca, modelo, capacidade, localizacao,
  // doContrato } -- doContrato = ID do contrato que incluiu o item
  // automaticamente ('' quando a pessoa adicionou à mão).
  let equipamentosChamado = [];
  let equipamentoPatrimonioEncontradoChamado = null;
  let contratoEquipIncluidoChamado = '';
  let locaisChamado = [];
  let equipamentosLocalizacaoChamado = [];

  function rotuloEquipamentoChamado(e) {
    const partes = [];
    if (e.patrimonio) partes.push('Patrimônio ' + e.patrimonio);
    partes.push(e.nome + (e.modelo ? '/' + e.modelo : '') + (e.capacidade ? ' ' + e.capacidade : ''));
    if (e.marca) partes.push(e.marca);
    return partes.join(' - ');
  }

  // Devolve true se entrou (false se já estava na lista).
  function adicionarEquipamentoNaListaChamado(e, doContrato) {
    if (!e || !e.id) return false;
    if (equipamentosChamado.some(x => Number(x.id) === Number(e.id))) return false;
    equipamentosChamado.push({
      id: Number(e.id),
      patrimonio: e.patrimonio || '',
      nome: e.nome || '',
      marca: e.marca || '',
      modelo: e.modelo || '',
      capacidade: e.capacidade || '',
      localizacao: e.localizacao || '',
      estado: e.estado || '',
      doContrato: doContrato || ''
    });
    return true;
  }

  function renderizarEquipamentosChamado() {
    const tbody = document.getElementById('chamadoEquipLista');
    const wrapper = document.getElementById('chamadoEquipTabelaWrapper');
    const contador = document.getElementById('chamadoEquipContador');
    const btnLimpar = document.getElementById('chamadoEquipBtnLimpar');
    if (!tbody) return;

    const qtd = equipamentosChamado.length;
    if (contador) contador.textContent = qtd ? qtd + ' equipamento(s) no chamado.' : 'Nenhum equipamento adicionado.';
    const contadorAba = document.getElementById('chamadoEquipAbaContador');
    if (contadorAba) contadorAba.textContent = qtd ? '(' + qtd + ')' : '';
    if (wrapper) wrapper.style.display = qtd ? '' : 'none';
    if (btnLimpar) btnLimpar.style.display = qtd > 1 ? '' : 'none';

    tbody.innerHTML = equipamentosChamado.map(e =>
      '<tr>' +
        '<td>' + escapeHtml(e.patrimonio || '—') + '</td>' +
        '<td>' + escapeHtml(e.nome) + '</td>' +
        '<td>' + escapeHtml(e.marca) + '</td>' +
        '<td>' + escapeHtml(e.modelo) + '</td>' +
        '<td>' + escapeHtml(e.capacidade) + '</td>' +
        '<td>' + escapeHtml(e.localizacao) + '</td>' +
        '<td>' + escapeHtml(e.estado || '—') + '</td>' +
        '<td class="chamado-equip-acoes">' +
          '<button type="button" class="btn-acao btn-excluir-linha" title="Remover do chamado" onclick="removerEquipamentoChamado(' + Number(e.id) + ')">' +
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>' +
            '</svg>' +
          '</button>' +
        '</td>' +
      '</tr>'
    ).join('');
  }

  function removerEquipamentoChamado(id) {
    equipamentosChamado = equipamentosChamado.filter(e => Number(e.id) !== Number(id));
    renderizarEquipamentosChamado();
  }

  function removerTodosEquipamentosChamado() {
    if (!equipamentosChamado.length) return;
    if (!confirm('Remover todos os ' + equipamentosChamado.length + ' equipamentos do chamado?')) return;
    equipamentosChamado = [];
    renderizarEquipamentosChamado();
  }

  // Patrimônio: o botão "Adicionar" só habilita quando a busca achou.
  function adicionarEquipamentoPorPatrimonioChamado() {
    const statusEl = document.getElementById('chamadoPatrimonioStatus');
    const patrimonioEl = document.getElementById('chamadoEquipPatrimonio');
    const e = equipamentoPatrimonioEncontradoChamado;
    if (!e) return;
    const entrou = adicionarEquipamentoNaListaChamado(e, '');
    renderizarEquipamentosChamado();
    if (statusEl) {
      statusEl.textContent = entrou ? 'Patrimônio ' + e.patrimonio + ' adicionado.' : 'Patrimônio ' + e.patrimonio + ' já está na lista.';
      statusEl.className = 'chamado-patrimonio-status ' + (entrou ? 'encontrado' : 'nao-encontrado');
    }
    if (patrimonioEl) { patrimonioEl.value = ''; patrimonioEl.focus(); }
    ultimoPatrimonioVerificadoChamado = '';
    definirPatrimonioEncontradoChamado(null);
  }

  function definirPatrimonioEncontradoChamado(e) {
    equipamentoPatrimonioEncontradoChamado = e;
    const btn = document.getElementById('chamadoEquipBtnAdicionarPatrimonio');
    if (btn) btn.disabled = !e;
  }

  function teclaPatrimonioChamado(ev) {
    if (ev.key === 'Enter' && equipamentoPatrimonioEncontradoChamado) {
      ev.preventDefault();
      adicionarEquipamentoPorPatrimonioChamado();
    }
  }

  // Localização: ao escolher uma localização da lista, mostra os
  // equipamentos dela pra adicionar um ou todos.
  let timerLocalizacaoChamado = null;
  let ultimaLocalizacaoBuscadaChamado = '';

  function verificarLocalizacaoDigitandoChamado() {
    clearTimeout(timerLocalizacaoChamado);
    timerLocalizacaoChamado = setTimeout(buscarEquipamentosDaLocalizacaoChamado, 400);
  }

  async function buscarEquipamentosDaLocalizacaoChamado() {
    const localEl = document.getElementById('chamadoEquipLocalizacao');
    const statusEl = document.getElementById('chamadoLocalizacaoStatus');
    if (!localEl) return;
    const local = localEl.value.trim();
    const valido = local && locaisChamado.some(l => String(l).trim().toLowerCase() === local.toLowerCase());
    if (!valido) {
      ultimaLocalizacaoBuscadaChamado = '';
      esconderEscolhaEquipamentoChamado();
      if (statusEl) statusEl.textContent = '';
      return;
    }
    if (local === ultimaLocalizacaoBuscadaChamado) return;
    ultimaLocalizacaoBuscadaChamado = local;
    if (statusEl) { statusEl.textContent = 'Buscando equipamentos...'; statusEl.className = 'chamado-patrimonio-status'; }
    try {
      const lista = await runServerFunction('listarEquipamentosPorLocalizacao', local);
      if (localEl.value.trim() !== local) return;
      equipamentosLocalizacaoChamado = lista || [];
      if (!equipamentosLocalizacaoChamado.length) {
        esconderEscolhaEquipamentoChamado();
        if (statusEl) { statusEl.textContent = 'Nenhum equipamento cadastrado nesta localização.'; statusEl.className = 'chamado-patrimonio-status nao-encontrado'; }
        return;
      }
      if (statusEl) { statusEl.textContent = equipamentosLocalizacaoChamado.length + ' equipamento(s) nesta localização.'; statusEl.className = 'chamado-patrimonio-status encontrado'; }
      mostrarEscolhaEquipamentoChamado(equipamentosLocalizacaoChamado);
    } catch (e) {
      ultimaLocalizacaoBuscadaChamado = '';
      if (statusEl) statusEl.textContent = '';
    }
  }

  function mostrarEscolhaEquipamentoChamado(opcoes) {
    const bloco = document.getElementById('chamadoEquipEscolhaBloco');
    const select = document.getElementById('chamadoEquipEscolha');
    if (!bloco || !select) return;
    select.innerHTML = (opcoes || []).map(e =>
      '<option value="' + escapeHtml(String(e.id)) + '">' + escapeHtml(rotuloEquipamentoChamado(e)) + '</option>'
    ).join('');
    bloco.style.display = '';
  }

  function esconderEscolhaEquipamentoChamado() {
    const bloco = document.getElementById('chamadoEquipEscolhaBloco');
    const select = document.getElementById('chamadoEquipEscolha');
    if (bloco) bloco.style.display = 'none';
    if (select) select.innerHTML = '';
    equipamentosLocalizacaoChamado = [];
  }

  function adicionarEquipamentoEscolhidoChamado() {
    const select = document.getElementById('chamadoEquipEscolha');
    if (!select || !select.value) return;
    const e = equipamentosLocalizacaoChamado.find(x => String(x.id) === select.value);
    if (!adicionarEquipamentoNaListaChamado(e, '')) alert('Esse equipamento já está na lista.');
    renderizarEquipamentosChamado();
  }

  function adicionarTodosDaLocalizacaoChamado() {
    let qtd = 0;
    equipamentosLocalizacaoChamado.forEach(e => { if (adicionarEquipamentoNaListaChamado(e, '')) qtd++; });
    renderizarEquipamentosChamado();
    if (!qtd) alert('Todos os equipamentos desta localização já estão na lista.');
  }

  // Contrato escolhido pela pessoa: inclui todos os equipamentos dele. Ao
  // trocar de contrato, os itens que o contrato anterior incluiu sozinho
  // saem (os adicionados à mão ficam).
  async function incluirEquipamentosDoContratoChamado(contrato) {
    if (!ehPreventivaChamado()) return;
    if (!contrato || String(contrato.id) === String(contratoEquipIncluidoChamado)) return;
    const anterior = contratoEquipIncluidoChamado;
    contratoEquipIncluidoChamado = String(contrato.id);
    if (anterior) equipamentosChamado = equipamentosChamado.filter(e => !e.doContrato || String(e.doContrato) !== String(anterior));

    const contador = document.getElementById('chamadoEquipContador');
    if (contador) contador.textContent = 'Incluindo os equipamentos do contrato ' + contrato.numero + '...';
    try {
      const lista = await runServerFunction('listarEquipamentosDoContrato', contrato.id);
      if (contratoEquipIncluidoChamado !== String(contrato.id)) return; // trocou de novo no meio
      let qtd = 0;
      (lista || []).forEach(e => { if (adicionarEquipamentoNaListaChamado(e, contrato.id)) qtd++; });
      renderizarEquipamentosChamado();
      if (!(lista || []).length && contador) contador.textContent = 'O contrato ' + contrato.numero + ' não tem equipamentos vinculados. ' + contador.textContent;
    } catch (e) {
      contratoEquipIncluidoChamado = anterior;
      renderizarEquipamentosChamado();
      alert('Não foi possível incluir os equipamentos do contrato.');
    }
  }

  // ===== TIPO DO CHAMADO =====
  // Sem tipo, o bloco Detalhamento (Vínculo / Equipamentos / Serviço) fica
  // desabilitado. Só a preventiva recebe automaticamente todos os
  // equipamentos do contrato; ao sair de preventiva, esses saem da lista.
  function ehPreventivaChamado() {
    const tipoEl = document.getElementById('chamadoTipo');
    return !!tipoEl && tipoEl.value === 'preventiva';
  }

  function atualizarHabilitacaoDetalhamentoChamado() {
    const tipoEl = document.getElementById('chamadoTipo');
    const bloco = document.getElementById('chamadoDetalhamento');
    const aviso = document.getElementById('chamadoDetalhamentoAviso');
    const liberado = !!(tipoEl && tipoEl.value);
    if (bloco) {
      bloco.disabled = !liberado;
      bloco.classList.toggle('chamado-detalhamento-bloqueado', !liberado);
    }
    if (aviso) aviso.style.display = liberado ? 'none' : '';
  }

  function alterarTipoChamado() {
    atualizarHabilitacaoDetalhamentoChamado();
    if (ehPreventivaChamado()) {
      const idContrato = document.getElementById('chamadoContratoIdSelecionado')?.value || '';
      const contrato = idContrato ? (contratosDisponiveisChamado || []).find(c => String(c.id) === String(idContrato)) : null;
      if (contrato) incluirEquipamentosDoContratoChamado(contrato);
    } else if (contratoEquipIncluidoChamado) {
      const anterior = contratoEquipIncluidoChamado;
      equipamentosChamado = equipamentosChamado.filter(e => !e.doContrato || String(e.doContrato) !== String(anterior));
      contratoEquipIncluidoChamado = '';
      renderizarEquipamentosChamado();
    }
  }

  // mostrar o campo para digitar o motivo quando a opção "outro" for selecionada
  function alterarMotivoOutro(){
    const select = document.getElementById('chamadoMotivo');
    const campoOutro = document.getElementById('chamadoMotivoOutro');
    const mostrarCampo = select.value === 'outro';

    // o none esconde o elemento e o block mostra o elemento (bloco)
    campoOutro.style.display = mostrarCampo ? 'block' : 'none';
    if (mostrarCampo) {
        campoOutro.focus();
    }
  }

  // ===== LOCALIZAÇÃO: BUSCA REAL EM tbl_localizacao =====
  async function carregarLocaisChamado() {
    try {
      const res = await runServerFunction('ReadLocations');
      if (!Array.isArray(res)) {
        return [];
      }
      const locais = res.map(line => line[1]).filter(Boolean);
      return locais;
    } catch (error) {
      console.error('❌ [renderLocalização] Erro ao buscar localizações:', error);
      return [];
    }
  }

  // ===== "ATRIBUÍDO A": BUSCA COM SUGESTÃO DE FORNECEDORES PRESTADORES DE
  // SERVIÇO, MAS ACEITA QUALQUER TEXTO DIGITADO (técnico interno, etc.) =====
  async function carregarFornecedoresPrestadoresChamado() {
    try {
      const res = await runServerFunction('filtrarFornecedores', { tipo: 'prestador' });
      if (!Array.isArray(res)) {
        return [];
      }
      const nomes = res.map(f => f.nomeFantasia || f.razaoSocial).filter(Boolean);
      return nomes;
    } catch (error) {
      console.error('❌ [renderPrestadoresDeServiço] Erro ao buscar fornecedores prestadores de serviço:', error);
      return [];
    }
  }

  async function carregarFuncionariosChamado() {
    try {
      const res = await runServerFunction('filtrarFuncionarios');
      if (!Array.isArray(res)) {
        return [];
      }
      const nomes = res.map(f => f.nome).filter(Boolean);
      return nomes;
    } catch (error) {
      console.error('❌ [renderFuncionarios] Erro ao buscar funcionários:', error);
      return [];
    }
  }

  function initSearchChamado(inputId, dropdownId, wrapperId, opcoes) {
    const input = document.getElementById(inputId);
    const dropdown = document.getElementById(dropdownId);
    const wrapper = document.getElementById(wrapperId);

    if (!input || !dropdown || !wrapper) return;

    const listaOpcoes = Array.isArray(opcoes) ? opcoes : [];

    function renderLista(filtro) {
      const f = (filtro || '').toLowerCase().trim();

      const itens = (f === '')
        ? listaOpcoes
        : listaOpcoes.filter(o => String(o).toLowerCase().includes(f));

      dropdown.innerHTML = '';

      if (itens.length === 0) {
        dropdown.innerHTML = '<div class="search-no-result" style="padding: 8px; color: #888;">Nenhum resultado -- pode digitar livremente</div>';
      } else {
        itens.forEach(o => {
          const div = document.createElement('div');
          div.className = 'search-option';
          div.textContent = o;

          div.addEventListener('mousedown', (e) => {
            e.preventDefault();
            input.value = o;
            input.dispatchEvent(new Event('input', { bubbles: true }));
            dropdown.classList.remove('visible', 'active');
          });
          dropdown.appendChild(div);
        });
      }
    }

    function abrirListaCompleta() {
      renderLista('');
      dropdown.classList.add('visible', 'active');
    }

    input.addEventListener('focus', abrirListaCompleta);
    input.addEventListener('click', abrirListaCompleta);

    input.addEventListener('input', () => {
      renderLista(input.value);
      dropdown.classList.add('visible', 'active');
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === 'Escape') {
        dropdown.classList.remove('visible', 'active');
      }
    });

    document.addEventListener('click', (e) => {
      if (!wrapper.contains(e.target)) {
        dropdown.classList.remove('visible', 'active');
      }
    });
  }

  let salvandoChamado = false;

  async function salvarChamado() {
    if (salvandoChamado) return;
    salvandoChamado = true;
    const btnSalvarEl = document.getElementById('chamadoBtnSalvar');
    if (btnSalvarEl) btnSalvarEl.disabled = true;

    try {
      const selectMotivo = document.getElementById('chamadoMotivo')?.value || '';
      const motivo = selectMotivo === 'outro'
        ? document.getElementById('chamadoMotivoOutro')?.value.trim() || ''
        : selectMotivo;
      if (!motivo) {
        alert('Preencha o assunto do chamado.');
        return;
      }

      const tipo = document.getElementById('chamadoTipo')?.value || '';
      if (!tipo) {
        alert('Preencha o tipo do chamado.');
        return;
      }

      if (!equipamentosChamado.length) {
        if (typeof ativarAba === 'function') ativarAba('chamado-equipamentos');
        alert('Adicione pelo menos um equipamento ao chamado (pelo Patrimônio, pela Localização ou escolhendo o contrato).');
        return;
      }

      let relatorioArquivos = [], notaFiscalArquivos = [];
      try {
        relatorioArquivos = await lerArquivosComoBase64(anexosCadastroSelecionados.chamadoRelatorioArquivo);
        notaFiscalArquivos = await lerArquivosComoBase64(anexosCadastroSelecionados.chamadoNotaFiscalArquivo);
      } catch (erroArquivo) {
        alert(erroArquivo.message);
        return;
      }

      const dadosChamado = {
        id: document.getElementById('chamadoId')?.value || '',
        motivo: motivo,
        tipo: document.getElementById('chamadoTipo')?.value || '',
        classificacao: document.getElementById('chamadoClassificacao')?.value || '',
        abertoPor: document.getElementById('chamadoAbertoPor')?.value.trim() || '',
        atribuidoA: document.getElementById('chamadoAtribuidoA')?.value.trim() || '',
        descricao: document.getElementById('chamadoDescricao')?.value.trim() || '',
        equipamentoIds: equipamentosChamado.map(e => e.id),
        contratoId: document.getElementById('chamadoContratoIdSelecionado')?.value || '',
        competencia: document.getElementById('chamadoCompetencia')?.value || '',
        dataPrevista: document.getElementById('chamadoDataPrevista')?.value || '',
        relatorios: relatorioArquivos,
        notasFiscais: notaFiscalArquivos
      };

      if (typeof exibirModal === 'function') exibirModal('processando');

      try {
        const resposta = await runServerFunction('salvarChamadoBackend', dadosChamado);

        if (resposta && resposta.sucesso === false) {
          alert(resposta.mensagem);
          return;
        }

        alert(resposta.mensagem);

        if (resposta && resposta.duplicado) {
          exibirAvisoAnexoDuplicado('Você anexou dois ou mais documentos idênticos.');
        }

        if (typeof marcarFormularioSalvo === 'function') marcarFormularioSalvo();
        trocarPagina('chamado-view');
      } catch (err) {
        console.error('Erro ao salvar chamado:', err);
        alert('Erro ao conectar com o servidor.');
      } finally {
        if (typeof fecharModal === 'function') fecharModal('processando');
      }
    } finally {
      salvandoChamado = false;
      if (btnSalvarEl) btnSalvarEl.disabled = false;
    }
  }

  function lerArquivoComoBase64(inputEl) {
    return new Promise((resolve, reject) => {
      if (!inputEl || !inputEl.files || inputEl.files.length === 0) {
        resolve(null);
        return;
      }
      const arquivo = inputEl.files[0];
      if (arquivo.size > ANEXO_CADASTRO_TAMANHO_MAX) {
        reject(new Error('O arquivo "' + arquivo.name + '" passa de 3MB.'));
        return;
      }
      const leitor = new FileReader();
      leitor.onload = () => {
        const base64 = String(leitor.result).split(',')[1] || '';
        resolve({ nome: arquivo.name, tipo: arquivo.type || 'application/octet-stream', base64: base64 });
      };
      leitor.onerror = () => reject(new Error('Erro ao ler o arquivo "' + arquivo.name + '".'));
      leitor.readAsDataURL(arquivo);
    });
  }

</script>
