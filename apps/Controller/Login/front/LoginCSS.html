<style>
/* ===== TELA DE LOGIN (apps/Controller/Login) ===== */

body.sem-sessao .main-container,
body.sem-sessao #btnVoltarGlobal { display: none !important; }

.login-tela {

  inset: 0;
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
  overflow-y: auto;
}
.login-tela[hidden] { display: none; }

.login-cartao {
  width: 100%;
  max-width: 28rem;
  background: #fff;
  border-radius: 0.875rem;
  box-shadow: 0 25px 50px rgba(15, 23, 42, 0.35);
  padding: 1.75rem;
  margin: auto;
}
.login-cartao:has(.login-vista[data-vista="cadastro"]:not([hidden])) { max-width: 34rem; }

.menu-user-sair {
