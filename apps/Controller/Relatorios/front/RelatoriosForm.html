<section id="page-relatorios" class="spa-page">

<div class="page-header">
<div class="actions-bar">
    <h1>📊 Relatórios</h1>
</div>
<div class="actions-bar">
    <button type="button" class="btn-secondary" onclick="limparFiltrosRelatorio()">Limpar</button>
    <button type="button" class="btn-secondary" onclick="window.print()">

</div>

    <div class="field">
        <label class="field__label" for="relatorioTipo">Tipo de Relatório</label>
        <select class="field__select" id="relatorioTipo">
            <option value="checklist">Checklist</option>
        </select>
    </div>

    <div class="field">
        <label class="field__label" for="relatorioContratoId">Contrato</label>
        <select class="field__select" id="relatorioContratoId">
            <option value="">Selecione um contrato</option>
        </select>
    </div>

    <button type="button" class="btn-primary" id="btnGerarRelatorio" onclick="gerarRelatorioChecklist()">
        Gerar Relatório
    </button>

    <div id="relatorioResultado">
        <!-- aqui o JS vai desenhar a tabela/resultado -->
    </div>

</div>

</section>
