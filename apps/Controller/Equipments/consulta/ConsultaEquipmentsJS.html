<script>
  // Mesmo padrão do badge de Garantia já usado em Peças (.garantia-badge +
  // .ativa/.vencida/.vencendo, definidos em ConsultaPecasFormCSS.html --
  // classes genéricas, sem escopo de página, reaproveitadas aqui).
  function formatarGarantiaEquip(g) {
    const map = { ativa: 'Ativa', vencida: 'Vencida', vencendo: 'Vencendo' };
    return map[String(g || '').toLowerCase()] || '--';
  }

  let listaEquipamentosConsulta = [];
  let sortStateEquipamento = { coluna: null, direcao: 'asc' };

  async function renderEquipamentos() {
    const inputBusca = document.getElementById('equipmentSearch');
    if (inputBusca) inputBusca.focus();
    consultarEquipamentos();
  }

  function consultarEquipamentos() {
    const criterios = {
      nome: document.getElementById('equipmentSearch')?.value.trim() || '',
      capacidade: document.getElementById('filtroEquipCapacidade')?.value.trim() || '',
      marca: document.getElementById('filtroEquipMarca')?.value.trim() || '',
      localizacao: document.getElementById('filtroEquipLocalizacao')?.value.trim() || '',
      sei: document.getElementById('filtroEquipSei')?.value.trim() || ''
    };


    mostrarCarregandoEquipamentos(true);

    google.script.run
      .withSuccessHandler((objEquipamentos) => {
        mostrarCarregandoEquipamentos(false);
        listaEquipamentosConsulta = Array.isArray(objEquipamentos) ? objEquipamentos : [];
        renderTabelaEquipamentos(ordenarDesativadosPorUltimoEquip(aplicarOrdenacaoEquipamento(listaEquipamentosConsulta)));
      })
      .withFailureHandler((err) => {
        mostrarCarregandoEquipamentos(false);
        console.error('Erro ao consultar equipamentos:', err);
        alert('Erro ao consultar equipamentos: ' + (err.message || err));
      })
      .filtrarEquipamentos(criterios);
  }

  function mostrarCarregandoEquipamentos(carregando) {
    if (!carregando) return;
    const tbody = document.getElementById('tabelaBodyEquipment');
    if (tbody) {
      tbody.innerHTML = '<tr class="loading-row"><td colspan="10"><span class="spinner"></span>Buscando equipamentos...</td></tr>';
    }
  }

  function ordenarDesativadosPorUltimoEquip(lista) {
    if (!Array.isArray(lista)) return lista;
    return lista.slice().sort((a, b) => (a.desativada ? 1 : 0) - (b.desativada ? 1 : 0));
  }

  // ===== ORDENAÇÃO =====
  function ordenarEquipamento(coluna) {
    if (sortStateEquipamento.coluna === coluna) {
      sortStateEquipamento.direcao = sortStateEquipamento.direcao === 'asc' ? 'desc' : 'asc';
    } else {
      sortStateEquipamento.coluna = coluna;
      sortStateEquipamento.direcao = 'asc';
    }
    atualizarIndicadoresEquipamento();
    renderTabelaEquipamentos(ordenarDesativadosPorUltimoEquip(aplicarOrdenacaoEquipamento(listaEquipamentosConsulta)));
  }

  function atualizarIndicadoresEquipamento() {
    const ths = document.querySelectorAll('#page-equipments-view .data-table th');
    ths.forEach(th => {
      th.classList.remove('sorted');
      const span = th.querySelector('.sort-arrow');
      if (span) span.textContent = '';
    });

    const indices = { patrimonio: 1, nome: 2, capacidade: 3, marca: 4, modelo: 5, localizacao: 6, sei: 7, garantia: 8 };
    const idx = indices[sortStateEquipamento.coluna];
    if (idx !== undefined && ths[idx]) {
      ths[idx].classList.add('sorted');
      const span = ths[idx].querySelector('.sort-arrow');
      if (span) span.textContent = sortStateEquipamento.direcao === 'asc' ? '▲' : '▼';
    }
  }

  function aplicarOrdenacaoEquipamento(lista) {
    if (!sortStateEquipamento.coluna || !Array.isArray(lista)) return lista;
    const col = sortStateEquipamento.coluna;
    const dir = sortStateEquipamento.direcao === 'asc' ? 1 : -1;
    const arr = lista.slice();
    arr.sort((a, b) => {
      const va = String(a[col] || '').toLowerCase();
      const vb = String(b[col] || '').toLowerCase();
      return va < vb ? -1 * dir : va > vb ? 1 * dir : 0;
    });
    return arr;
  }

  // ===== RENDERIZAÇÃO DA TABELA =====
  function renderTabelaEquipamentos(lista) {
    const tbody = document.getElementById('tabelaBodyEquipment');
    if (!tbody) return;

    tbody.innerHTML = '';

    if (!lista || lista.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="10">Nenhum equipamento encontrado.</td></tr>';
      return;
    }

    lista.forEach(eq => {
      const tr = document.createElement('tr');
      if (eq.desativada) tr.classList.add('linha-desativada');

      const btnEditar = eq.desativada
        ? '<button class="btn-acao btn-editar-linha" title="Editar" disabled style="opacity:0.3; cursor:not-allowed;">✏️</button>'
        : `<button class="btn-acao btn-editar-linha" title="Editar" onclick="editarEquipamento('${eq.id}')">✏️</button>`;

      const btnExcluir = eq.desativada
        ? `<button class="btn-acao btn-reativar-linha" title="Reativar" onclick="reativarEquipamentoUI('${eq.id}')">♻️</button>`
        : `<button class="btn-acao btn-excluir-linha" title="Desativar" onclick="abrirModalExclusaoEquipamento('${eq.id}')">🗑️</button>`;

      const btnVer = `<button class="btn-acao" title="Ver detalhes" onclick="abrirDetalhesEquipamento('${eq.id}')">👁️</button>`;

      const garantiaHtml = eq.garantia
        ? `<span class="garantia-badge ${escapeHtml(eq.garantia)}">${formatarGarantiaEquip(eq.garantia)}</span>`
        : '--';

      tr.innerHTML = `
        <td class="acao-cell">${btnVer}</td>
        <td>${escapeHtml(eq.patrimonio)} ${eq.desativada ? '<span class="status-desativado">(Desativado)</span>' : ''}</td>
        <td>${escapeHtml(eq.nome)}</td>
        <td>${escapeHtml(eq.capacidade)}</td>
        <td>${escapeHtml(eq.marca)}</td>
        <td>${escapeHtml(eq.modelo)}</td>
        <td>${escapeHtml(eq.localizacao)}</td>
        <td>${escapeHtml(eq.sei)}</td>
        <td>${garantiaHtml}</td>
        <td class="acao-cell">
          ${btnEditar}
          ${btnExcluir}
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // ===== VER DETALHES =====
  async function abrirDetalhesEquipamento(id) {
    const conteudo = document.getElementById('detalhesEquipamentoConteudo');
    if (conteudo) conteudo.innerHTML = '<p>Carregando...</p>';
    if (typeof exibirModal === 'function') exibirModal('modalDetalhesEquipamento');

    try {
      const resposta = await runServerFunction('buscarEquipamentoDetalhado', id);
      if (!resposta || resposta.sucesso === false) {
        if (conteudo) conteudo.innerHTML = `<p>${escapeHtml(resposta ? resposta.mensagem : 'Equipamento não encontrado.')}</p>`;
        return;
      }
      if (conteudo) conteudo.innerHTML = montarDetalheEquipamentoHtml(resposta.equipamento);
    } catch (error) {
      console.error('Erro ao buscar detalhes do equipamento:', error);
      if (conteudo) conteudo.innerHTML = '<p>Erro ao buscar detalhes do equipamento.</p>';
    }
  }

  function montarDetalheEquipamentoHtml(eq) {
    const linha = (rotulo, valor) => `
        <div class="detalhe-contrato-linha">
            <span class="detalhe-contrato-rotulo">${rotulo}</span>
            <span class="detalhe-contrato-valor">${valor && String(valor).trim() ? escapeHtml(valor) : '--'}</span>
        </div>`;

    const secao = (titulo, conteudoHtml) => `
        <div class="detalhe-contrato-secao">
            <h4 class="detalhe-contrato-secao-titulo">${titulo}</h4>
            ${conteudoHtml}
        </div>`;

    const principaisHtml = `
        ${linha('Patrimônio', eq.patrimonio)}
        ${linha('Nome', eq.nome)}
        ${linha('Marca', eq.marca)}
        ${linha('Capacidade', eq.capacidade)}
        ${linha('Modelo', eq.modelo)}
        ${linha('Sequência', eq.sequencia)}
        ${linha('Localização', eq.localizacao)}
        ${linha('Fornecedor', eq.fornecedor)}
        <div class="detalhe-contrato-linha">
            <span class="detalhe-contrato-rotulo">Status</span>
            <span class="detalhe-contrato-valor">${eq.desativado ? '<span class="status-desativado">Desativado</span>' : 'Ativo'}</span>
        </div>
    `;

    const complementaresHtml = `
        ${linha('Data de Entrada', eq.dataEntrada)}
        ${linha('Nota Fiscal', eq.notaFiscal)}
        ${linha('Número do SEI', eq.sei)}
        ${linha('Data da Garantia (Vencimento)', eq.dataGarantia)}
        ${linha('Valor de Aquisição', eq.valorAquisicao)}
        ${linha('Observações', eq.observacoes)}
        ${linha('Cadastrado em', eq.dtCadastro)}
        ${linha('Última Alteração', eq.dtAlteracao)}
    `;

    return secao('Informações Principais', principaisHtml) + secao('Complementares', complementaresHtml);
  }

  // ===== AÇÕES DA INTERFACE =====
  function limparFiltrosEquipamento() {
    const inputBusca = document.getElementById('equipmentSearch');
    if (inputBusca) inputBusca.value = '';
    ['filtroEquipCapacidade', 'filtroEquipMarca', 'filtroEquipLocalizacao', 'filtroEquipSei'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });

    sortStateEquipamento = { coluna: null, direcao: 'asc' };
    atualizarIndicadoresEquipamento();
    consultarEquipamentos();

    if (inputBusca) inputBusca.focus();
  }

  function editarEquipamento(id) {
    if (typeof trocarPagina === 'function') {
      trocarPagina('equipments-form', id);
    }
  }

  let idExclusaoEquipamento = null;

  function abrirModalExclusaoEquipamento(id) {
    if (!id) {
      alert('Erro: Nenhum registro selecionado.');
      return;
    }
    idExclusaoEquipamento = id;
    if (typeof exibirModal === 'function') exibirModal('modalExclusao');

    const btnDelete = document.getElementById('btn-delete');
    if (btnDelete) btnDelete.onclick = () => executarExclusaoEquipamento();
  }

  async function executarExclusaoEquipamento() {
    if (!idExclusaoEquipamento) return;

    try {
      const resposta = await runServerFunction('desativarEquipamento', idExclusaoEquipamento);
      if (resposta && resposta.sucesso === false) {
        alert(resposta.mensagem);
        return;
      }

      const eq = listaEquipamentosConsulta.find(e => String(e.id) === String(idExclusaoEquipamento));
      if (eq) eq.desativada = true;

      idExclusaoEquipamento = null;
      if (typeof fecharModal === 'function') fecharModal('modalExclusao');
      renderTabelaEquipamentos(ordenarDesativadosPorUltimoEquip(aplicarOrdenacaoEquipamento(listaEquipamentosConsulta)));
    } catch (err) {
      console.error('Erro ao desativar equipamento:', err);
      alert('Erro ao conectar com o servidor.');
    }
  }

  async function reativarEquipamentoUI(id) {
    if (!id) return;
    if (!confirm('Deseja reativar este equipamento?')) return;

    try {
      const resposta = await runServerFunction('reativarEquipamento', id);
      if (resposta && resposta.sucesso === false) {
        alert(resposta.mensagem);
        return;
      }

      const eq = listaEquipamentosConsulta.find(e => String(e.id) === String(id));
      if (eq) eq.desativada = false;

      renderTabelaEquipamentos(ordenarDesativadosPorUltimoEquip(aplicarOrdenacaoEquipamento(listaEquipamentosConsulta)));
    } catch (err) {
      console.error('Erro ao reativar equipamento:', err);
      alert('Erro ao conectar com o servidor.');
    }
  }

</script>
