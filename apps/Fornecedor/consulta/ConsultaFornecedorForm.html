<section id="page-fornecedor-view" class="spa-page">

  <div class="page-header">
    <div class="actions-bar">
      <h1>🚚 Fornecedores</h1>
    </div>
    <div class="actions-bar">
      <button type="button" class="btn-secondary" onclick="limparFiltrosFornecedor()">Limpar</button>
      <button type="button" class="btn-success" onclick="trocarPagina('fornecedor-form')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        Adicionar
      </button>
      <button type="button" id="btnConsultarFornecedores" class="btn-primary" onclick="consultarFornecedores()">
        <!-- filtrar() -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        Consultar
      </button>
    </div>
  </div>

  <div class="panel">

    <!-- FILTROS -->
    <form autocomplete="off" onsubmit="return false;">
      <div class="filters-primary">
        <div class="field">
          <label class="field__label" for="filtro-fornecedor-nome">Razão Social / Nome Fantasia</label>
          <input class="field__input" type="text" id="filtro-fornecedor-nome" placeholder="Digite o nome..." autofocus>
        </div>

        <div class="field">
          <label class="field__label" for="filtro-fornecedor-cnpj">CNPJ</label>
          <input class="field__input" type="text" id="filtro-fornecedor-cnpj" placeholder="00.000.000/0000-00">
        </div>

        <div class="field">
          <label class="field__label" for="filtro-fornecedor-estado">Estado</label>
          <select class="field__select" id="filtro-fornecedor-estado" onchange="atualizarCidadesPorEstado()">
            <option value="">Todos</option>
          </select>
        </div>

        <div class="field">
          <label class="field__label" for="filtro-fornecedor-cidade">Cidade</label>
          <select class="field__select" id="filtro-fornecedor-cidade">
            <option value="">Todas</option>
          </select>
        </div>
      </div>

    </form>

    <!-- TABELA -->
    <div class="table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th onclick="ordenarFornecedor('razaoSocial')">RAZÃO SOCIAL <span class="sort-arrow"></span></th>
            <th onclick="ordenarFornecedor('nomeFantasia')">NOME FANTASIA <span class="sort-arrow"></span></th>
            <th onclick="ordenarFornecedor('cnpj')">CNPJ <span class="sort-arrow"></span></th>
            <th onclick="ordenarFornecedor('telefone')">TELEFONE <span class="sort-arrow"></span></th>
            <th onclick="ordenarFornecedor('email')">E-MAIL <span class="sort-arrow"></span></th>
            <th onclick="ordenarFornecedor('cidade')">CIDADE/UF <span class="sort-arrow"></span></th>
            <th style="cursor:default;">AÇÕES</th>
          </tr>
        </thead>
        <tbody id="bodyFornecedoresView"></tbody>
      </table>
    </div>


  </div>

</section>
