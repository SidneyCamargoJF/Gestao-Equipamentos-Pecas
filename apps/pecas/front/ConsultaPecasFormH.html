      <section id="page-pecas-view" class="spa-page">

      <div class="page-header">
        <div class="actions-bar">
          <h1>⚙️ Peças & Estoque</h1>
        </div>
        <div class="actions-bar">
          <button type="button" class="btn-secondary" onclick="limparFiltros()">Limpar</button>
          <button type="button" class="btn-success" onclick="trocarPagina('pecas-form')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Adicionar
          </button>
          <button type="button" class="btn-primary" onclick="consultarPecas()"> <!-- filtrar() -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            Consultar
          </button>
        </div>   
      </div>

      <div class="panel">

        <!-- FILTROS -->
        <form autocomplete="off" onsubmit="return false;">
          <div class="filters-primary">
            <div class="field">
              <label class="field__label" for="filtro-nome">Nome da Peça</label>
              <input class="field__input" type="text" id="filtro-nome" placeholder="Digite o nome..." autofocus>
            </div>

            <div class="field">
              <label class="field__label">Marca</label>
              <div class="search-wrapper" id="marcaWrapper">
                <span class="search-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                </span>
                <input class="search-input" type="text" id="marcaSearch" placeholder="Selecione a marca..." autocomplete="off">
                <div class="search-dropdown" id="marcaDropdown"></div>
              </div>
            </div>

            <div class="field">
              <label class="field__label">Localização</label>
              <div class="search-wrapper" id="localizacaoWrapper">
                <span class="search-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                </span>
                <input class="search-input" type="text" id="localizacaoSearch" placeholder="Selecione a localização..." autocomplete="off">
                <div class="search-dropdown" id="localizacaoDropdown"></div>
              </div>
            </div>

            <div class="field">
              <label class="field__label">Fornecedor</label>
              <div class="search-wrapper" id="fornecedorWrapper">
                <span class="search-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                </span>
                <input class="search-input" type="text" id="fornecedorSearch" placeholder="Selecione o fornecedor..." autocomplete="off">
                <div class="search-dropdown" id="fornecedorDropdown"></div>
              </div>
            </div>

            <div class="field">
              <label class="field__label" for="filtro-garantia">Garantia</label>
              <select class="field__select" id="filtro-garantia">
                <option value="">Todas</option>
                <option value="ativa">Ativa</option>
                <option value="vencida">Vencida</option>
                <option value="vencendo">Vencendo</option>
              </select>
            </div>
          </div>
   
        </form>

        <!-- TABELA -->
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th onclick="ordenar('nome')">NOME <span class="sort-arrow"></span></th>
                <th onclick="ordenar('marca')">MARCA <span class="sort-arrow"></span></th>
                <th onclick="ordenar('modelo')">MODELO <span class="sort-arrow"></span></th>
                <th onclick="ordenar('fornecedor')">FORNECEDOR <span class="sort-arrow"></span></th>
                <th onclick="ordenar('localizacao')">LOCALIZAÇÃO <span class="sort-arrow"></span></th>
                <th onclick="ordenar('valor')">VALOR <span class="sort-arrow"></span></th>
                <th onclick="ordenar('garantia')">GARANTIA <span class="sort-arrow"></span></th>
                <th onclick="ordenar('dtgarantia')">DATA GARANTIA<span class="sort-arrow"></span></th>
                <th onclick="ordenar('seinumero')">SEI Nº<span class="sort-arrow"></span></th>
                <th style="cursor:default;">AÇÕES</th>
              </tr>
            </thead>
            <tbody id="bodyPecasView"></tbody>
          </table>
        </div>


      </div>


      </section>
