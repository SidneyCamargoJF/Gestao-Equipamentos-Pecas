<script>
  //=== CARREGAR DADOS DO SERVIDOR ===
  async function loadSuppliersNames() {
    try {
      const res = await runServerFunction("ReadSuppliers");
      if (!Array.isArray(res)) return [];

      return res.map(line => line[1]).filter(Boolean);
    } catch (error) {
      console.error("Erro ao carregar lista de fornecedores:", error);
      return [];
    }
  }

  //=== SEARCH ===
  function initSearch(inputId, dropdownId, wrapperId, opcoes) {
    const input = document.getElementById(inputId);
    const dropdown = document.getElementById(dropdownId);
    const wrapper = document.getElementById(wrapperId);

    if (!input || !dropdown || !wrapper) {
      console.warn("initSearch: Elementos do DOM não encontrados.", { inputId, dropdownId, wrapperId });
      return;
    }

    function renderLista(filtro) {
      const f = (filtro || '').toLowerCase();

      // Filtra o array de strings que foi passado
      const itens = (opcoes || []).filter(o => String(o).toLowerCase().includes(f));

      dropdown.innerHTML = '';
      if (itens.length === 0) {
        dropdown.innerHTML = '<div class="search-no-result">Nenhum resultado</div>';
      } else {
        itens.forEach(o => {
          const div = document.createElement('div');
          div.className = 'search-option';
          div.textContent = o;
          div.addEventListener('click', () => {
            input.value = o;
            dropdown.classList.remove('visible');
            filtrar();
          });
          dropdown.appendChild(div);
        });
      }
    }

    input.addEventListener('focus', () => {
      renderLista(input.value);
      dropdown.classList.add('visible');
    });

    input.addEventListener('input', () => {
      renderLista(input.value);
      if (!dropdown.classList.contains('visible')) {
        dropdown.classList.add('visible');
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { 
        e.preventDefault(); 
        if (typeof consultar === 'function') consultar(); 
        dropdown.classList.remove('visible'); 
      }
      if (e.key === 'Escape') dropdown.classList.remove('visible');
    });

    document.addEventListener('click', (e) => {
      if (!wrapper.contains(e.target)) dropdown.classList.remove('visible');
    });
  }

  //=== CONSULTAR ===
  function consultar() {
    const cnpj = document.getElementById('CNPJSearch') ? document.getElementById('CNPJSearch').value.trim().toLowerCase() : '';
    const razaoSocial = document.getElementById('razaoSocialSearch') ? document.getElementById('razaoSocialSearch').value.trim().toLowerCase() : '';
    const nomeFantasia = document.getElementById('nomeFantasiaSearch') ? document.getElementById('nomeFantasiaSearch').value.trim().toLowerCase() : '';
    const cidade = document.getElementById('cidadeSearch') ? document.getElementById('cidadeSearch').value.trim().toLowerCase() : '';

    const criterios = {
      cnpj: cnpj,
      razaoSocial: razaoSocial,
      nomeFantasia: nomeFantasia,
      cidade: cidade
    };

    google.script.run.withSuccessHandler(Retorno).withFailureHandler(function(err) {
      console.error('Erro ao consultar fornecedores: ', err);
    })
    .filtrarFornecedores(criterios);
  }

  function Retorno(objfornecedores) {
    if (!Array.isArray(objfornecedores)) {
      fornecedores = [];
    } else {
      fornecedores = aplicarOrdenacao(objfornecedores);
    }
    console.log('Ordenação Aplicada: ', fornecedores);
    renderTabela(fornecedores);
  }

  function filtrar() {
    const cnpj = document.getElementById('CNPJSearch') ? document.getElementById('CNPJSearch').value.trim().toLowerCase() : '';
    const razaoSocial = document.getElementById('razaoSocialSearch') ? document.getElementById('razaoSocialSearch').value.trim().toLowerCase() : '';
    const nomeFantasia = document.getElementById('nomeFantasiaSearch') ? document.getElementById('nomeFantasiaSearch').value.trim().toLowerCase() : '';
    const cidade = document.getElementById('cidadeSearch') ? document.getElementById('cidadeSearch').value.trim().toLowerCase() : '';

    listaFiltrada = fornecedores.filter(f => {
      const fCnpj = f.cnpj ? String(f.cnpj).toLowerCase() : '';
      const fRazao = f.razaoSocial ? String(f.razaoSocial).toLowerCase() : '';
      const fFantasia = f.nomeFantasia ? String(f.nomeFantasia).toLowerCase() : '';
      const fCidade = f.cidade ? String(f.cidade).toLowerCase() : '';

      if (cnpj && !fCnpj.includes(cnpj)) return false;
      if (razaoSocial && !fRazao.includes(razaoSocial)) return false;
      if (nomeFantasia && !fFantasia.includes(nomeFantasia)) return false;
      if (cidade && !fCidade.includes(cidade)) return false;
      return true;
    });

    listaFiltrada = aplicarOrdenacao(listaFiltrada);
    renderTabela(listaFiltrada);
  }

  function renderTabela(lista) {
    const tbody = document.getElementById('tabelaBody');
    if(!tbody) return;

    tbody.innerHTML = '';
    if (!lista || lista.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="5">Nenhum fornecedor encontrado com os filtros informados.</td></tr>';
      return;
    }
    
    lista.forEach(f => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
          <td>${escapeHtml(f.cnpj)}</td>
          <td>${escapeHtml(f.razaoSocial)}</td>
          <td>${escapeHtml(f.nomeFantasia)}</td>
          <td>${escapeHtml(f.cidade)}</td>        
          <td>
          <button class="btn-acao btn-editar-linha" title="Editar" onclick="editarFornecedor(${f.id})">✏️</button>
          <button class="btn-acao btn-excluir-linha" title="Excluir" onclick="confirmarExclusao(${f.id})">🗑️</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function limparFiltros() {
    document.getElementById('CNPJSearch').value = '';
    document.getElementById('razaoSocialSearch').value = '';
    document.getElementById('nomeFantasiaSearch').value = '';
    document.getElementById('cidadeSearch').value = '';
    sortState = { coluna: null, direcao: 'asc' };
    atualizarIndicadores();
    filtrar();
    document.getElementById('CNPJSearch').focus();
  }

  function editarFornecedor(id) {
    window.location.href = 'cadastro-fornecedores.html?id=' + encodeURIComponent(id);
  }

  function confirmarExclusao(id) {
    idExclusao = id;
    document.getElementById('modalExclusao').classList.add('aberto');
  }

  function fecharModalExclusao() {
    idExclusao = null;
    document.getElementById('modalExclusao').classList.remove('aberto');
  }

  function executarExclusao() {
    if (idExclusao !== null) {
      const idx = fornecedores.findIndex(f => f.id === idExclusao);
      if (idx >= 0) fornecedores.splice(idx, 1);
      fecharModalExclusao();
      filtrar();
    }
  }

  // ==== INICIALIZAÇÃO ====
  document.addEventListener('DOMContentLoaded', () => {
    google.script.run
    .withSuccessHandler((respostaDeServidor) => {
      // Atribuir o retorno do servidor na variável fornecedores
      fornecedores = respostaDeServidor || [];

      // Aplica a ordenação inicial, se houver
      fornecedores = aplicarOrdenacao(fornecedores);

      // 1. Renderiza os dados na tabela HTML
      renderTabela(fornecedores);

      // 2. Extrai os valores únicos criando os Arrays para os dropdowns de filtro
      const cnpjs = [...new Set(fornecedores.map(f => f.cnpj).filter(Boolean))];
      const razoes = [...new Set(fornecedores.map(f => f.razaoSocial).filter(Boolean))];
      const fantasias = [...new Set(fornecedores.map(f => f.nomeFantasia).filter(Boolean))];
      const cidades = [...new Set(fornecedores.map(f => f.cidade).filter(Boolean))];

      // 3. Inicializa o initSearch com os IDs EXATOS do HTML
      initSearch('CNPJSearch', 'CNPJDropdown', 'CNPJWrapper', cnpjs);
      initSearch('razaoSocialSearch', 'razaoSocialDropdown', 'razaoSocialWrapper', razoes);
      initSearch('nomeFantasiaSearch', 'nomeFantasiaDropdown', 'nomeFantasiaWrapper', fantasias);
      initSearch('cidadeSearch', 'cidadeDropdown', 'cidadeWrapper', cidades);
    })
    .withFailureHandler((err) => {
      console.error("Erro ao carregar lista de fornecedores: ", err);
    })
    .filtrarFornecedores();

    // Fechar modal ao clicar fora
    const modalExclusao = document.getElementById('modalExclusao');
    if (modalExclusao) {
      modalExclusao.addEventListener('click', (e) => {
        if (e.target.classList.contains('modal-overlay')) fecharModalExclusao();
      });
    }

    // Fechar modal com tecla ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') fecharModalExclusao();
    });
  });

</script>
