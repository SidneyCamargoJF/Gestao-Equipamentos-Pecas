      <section id="page-marcas-view" class="spa-page">

        
        <!-- FILTRO -->
        <form autocomplete="off" onsubmit="return false;">
          <div class="filters-primary">
            <div class="field">
              <label class="field__label">Marca</label>
              <div class="search-wrapper" id="marcaWrapper">
                <span class="search-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                </span>
                <input class="search-input" type="text" id="marcaSearch" placeholder="Selecione a marca..." autocomplete="off">
                <div class="search-dropdown" id="marcaDropdown"></div>
              </div>
            </div>
          </div> 

          <!-- Botoes de limpar e adicionar -->
          <div class="actions-bar">
            <button type="button" class="btn-secondary" onclick="limparFiltros()">Limpar</button>
            <button type="button" class="btn-success" onclick="abrirModalCadastro()">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              Adicionar
            </button>
            <button type="button" class="btn-primary" onclick="consultarMarcas()"> <!-- filtrar() -->
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              Consultar
            </button>
          </div>  
        </form>

        <!-- TABELA -->
        <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th onclick="ordenar('marca')">MARCA <span class="sort-arrow"></span></th>
              <th>AÇÕES</th>
            </tr>
          </thead>
          <tbody id="tabelaBody"></tbody>
        </table>
        </div>

      </section>
