<script>
  // =====================================================
  // CADASTRO DE CHAMADO
  // Equipamento é obrigatório (Patrimônio e/ou Localização, achado em
  // tbl_equipamentos -- ao achar pelo Patrimônio, preenche os demais campos
  // sozinho). Peças são opcionais e podem ser várias -- por enquanto são
  // texto livre (Nome + opcionais), já que peça ainda não tem identificador
  // único; o servidor tenta linkar por Nome ao salvar.
  // =====================================================


  // ===== RENDERIZAÇÃO INICIAL DA PÁGINA =====
  async function renderChamadoForm() {

    const motivoOutroEl = document.getElementById('chamadoMotivoOutro');
    if (motivoOutroEl) {
      motivoOutroEl.value = '';
      motivoOutroEl.style.display = 'none';
    }    
    const motivoEl = document.getElementById('chamadoMotivo');
    if (motivoEl) motivoEl.value = '';
    const descricaoEl = document.getElementById('chamadoDescricao');
    if (descricaoEl) descricaoEl.value = '';
    const tipoEl = document.getElementById('chamadoTipo');
    if (tipoEl) tipoEl.value = '';
    const atribuidoEl = document.getElementById('chamadoAtribuidoA');
    if (atribuidoEl) atribuidoEl.value = '';
        const abertoPorEl = document.getElementById('chamadoAbertoPor');
    if (abertoPorEl) abertoPorEl.value = '';
    ['chamadoEquipPatrimonio', 'chamadoEquipLocalizacao', 'chamadoEquipMarca', 'chamadoEquipModelo', 'chamadoEquipBtus', 'chamadoRelatorioArquivo', 'chamadoNotaFiscalArquivo'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });

    const statusEl = document.getElementById('chamadoPatrimonioStatus');
    if (statusEl) { statusEl.textContent = ''; statusEl.className = 'chamado-patrimonio-status'; }

    atualizarContadorDescricaoChamado();

    travarCampoCarregandoChamado('chamadoEquipLocalizacao', 'Resgatando localizações...');
    travarCampoCarregandoChamado('chamadoAtribuidoA', 'Resgatando prestadores de serviço...');
    travarCampoCarregandoChamado('chamadoAbertoPor', 'Resgatando funcionários...');

    const [locais, fornecedoresPrestadores, funcionarios] = await Promise.all([
      carregarLocaisChamado(),
      carregarFornecedoresPrestadoresChamado(),
      carregarFuncionariosChamado()
    ]);

    destravarCampoCarregandoChamado('chamadoEquipLocalizacao', 'Selecione a localização...');
    initSearchChamado('chamadoEquipLocalizacao', 'chamadoEquipLocalizacaoDropdown', 'chamadoEquipLocalizacaoWrapper', locais);

    destravarCampoCarregandoChamado('chamadoAtribuidoA', 'Técnico interno ou fornecedor prestador de serviço...');
    initSearchChamado('chamadoAtribuidoA', 'chamadoAtribuidoDropdown', 'chamadoAtribuidoWrapper', fornecedoresPrestadores);    
    
    destravarCampoCarregandoChamado('chamadoAbertoPor', 'Funcionário ou servidor...');
    initSearchChamado('chamadoAbertoPor', 'chamadoAbertoPorDropdown', 'chamadoAbertoPorWrapper', funcionarios);    
    
    const patrimonioEl = document.getElementById('chamadoEquipPatrimonio');
    if (patrimonioEl) patrimonioEl.addEventListener('blur', verificarPatrimonioAoSairChamado);

    const inputMotivo = document.getElementById('chamadoMotivo');
    if (inputMotivo) inputMotivo.focus();
  }

  function limparChamado() {
    renderChamadoForm();
  }

  // ===== TRAVA VISUAL ENQUANTO OS DROPDOWNS DE BUSCA CARREGAM (Localização /
  // Atribuído a demoram porque dependem de consultas no servidor) =====
  function travarCampoCarregandoChamado(inputId, mensagem) {
    const input = document.getElementById(inputId);
    if (!input) return;
    input.disabled = true;
    input.placeholder = mensagem;
    input.value = '';
  }

  function destravarCampoCarregandoChamado(inputId, placeholderNormal) {
    const input = document.getElementById(inputId);
    if (!input) return;
    input.disabled = false;
    input.placeholder = placeholderNormal;
  }

  // ===== CONTADOR DE CARACTERES DA DESCRIÇÃO =====
  const CHAMADO_DESCRICAO_MAX = 300;

  function atualizarContadorDescricaoChamado() {
    const descricaoEl = document.getElementById('chamadoDescricao');
    const contadorEl = document.getElementById('chamadoDescricaoContador');
    if (!descricaoEl || !contadorEl) return;

    const restantes = CHAMADO_DESCRICAO_MAX - descricaoEl.value.length;
    contadorEl.textContent = restantes + ' caracteres restantes';
  }

  document.addEventListener('input', (e) => {
    if (e.target && e.target.id === 'chamadoDescricao') {
      atualizarContadorDescricaoChamado();
    }
  });

  // ===== PATRIMÔNIO: verificação ao sair do campo (igual verificarCnpjAoSair
  // do Cadastro de Fornecedor) -- só avisa se achou ou não, nunca bloqueia. =====
  async function verificarPatrimonioAoSairChamado() {
    const patrimonioEl = document.getElementById('chamadoEquipPatrimonio');
    const statusEl = document.getElementById('chamadoPatrimonioStatus');
    if (!patrimonioEl || !statusEl) return;

    const patrimonio = patrimonioEl.value.trim();
    if (!patrimonio) {
      statusEl.textContent = '';
      statusEl.className = 'chamado-patrimonio-status';
      return;
    }

    statusEl.textContent = 'Buscando...';
    statusEl.className = 'chamado-patrimonio-status';

    try {
      const resultado = await runServerFunction('verificarPatrimonioChamado', patrimonio);
      if (resultado && resultado.existe) {
        statusEl.textContent = 'Equipamento encontrado' + (resultado.marca ? ' (' + resultado.marca + (resultado.modelo ? ' - ' + resultado.modelo : '') + ')' : '');
        statusEl.className = 'chamado-patrimonio-status encontrado';
        preencherCamposEquipamentoChamado(resultado);
      } else {
        statusEl.textContent = 'Patrimônio não encontrado -- pode continuar, o chamado ainda é salvo';
        statusEl.className = 'chamado-patrimonio-status nao-encontrado';
      }
    } catch (error) {
      statusEl.textContent = '';
      statusEl.className = 'chamado-patrimonio-status';
    }
  }

  // mostrar o campo para digitar o motivo quando a opção "outro" for selecionada
  function alterarMotivoOutro(){
    const select = document.getElementById('chamadoMotivo');
    const campoOutro = document.getElementById('chamadoMotivoOutro');
    const mostrarCampo = select.value === 'outro';

    // o none esconde o elemento e o block mostra o elemento (bloco)
    campoOutro.style.display = mostrarCampo ? 'block' : 'none';
    if (mostrarCampo) {
        campoOutro.focus();
    }
  }

  // Preenche os demais campos do equipamento de acordo com o que está
  // cadastrado em tbl_equipamentos, quando o Patrimônio bate com um real.
  function preencherCamposEquipamentoChamado(dados) {
    const localizacaoEl = document.getElementById('chamadoEquipLocalizacao');
    if (localizacaoEl && dados.localizacao) localizacaoEl.value = dados.localizacao;

    const marcaEl = document.getElementById('chamadoEquipMarca');
    if (marcaEl && dados.marca) marcaEl.value = dados.marca;

    const modeloEl = document.getElementById('chamadoEquipModelo');
    if (modeloEl && dados.modelo) modeloEl.value = dados.modelo;

    const btusEl = document.getElementById('chamadoEquipBtus');
    if (btusEl && dados.btus) btusEl.value = dados.btus;
  }

  // ===== LOCALIZAÇÃO: BUSCA REAL EM tbl_localizacao =====
  async function carregarLocaisChamado() {
    console.log('⏳ [renderLocalização] Buscando localizações em tbl_localizacao...');
    try {
      const res = await runServerFunction('ReadLocations');
      if (!Array.isArray(res)) {
        console.log('⚠️ [renderLocalização] Resposta não é array:', res);
        return [];
      }
      const locais = res.map(line => line[1]).filter(Boolean);
      console.log('✅ [renderLocalização] ' + locais.length + ' localização(ões) carregada(s):', locais);
      return locais;
    } catch (error) {
      console.error('❌ [renderLocalização] Erro ao buscar localizações:', error);
      return [];
    }
  }

  // ===== "ATRIBUÍDO A": BUSCA COM SUGESTÃO DE FORNECEDORES PRESTADORES DE
  // SERVIÇO, MAS ACEITA QUALQUER TEXTO DIGITADO (técnico interno, etc.) =====
  async function carregarFornecedoresPrestadoresChamado() {
    console.log('⏳ [renderPrestadoresDeServiço] Buscando fornecedores prestadores de serviço...');
    try {
      const res = await runServerFunction('filtrarFornecedores', { tipo: 'prestador' });
      if (!Array.isArray(res)) {
        console.log('⚠️ [renderPrestadoresDeServiço] Resposta não é array:', res);
        return [];
      }
      const nomes = res.map(f => f.nomeFantasia || f.razaoSocial).filter(Boolean);
      console.log('✅ [renderPrestadoresDeServiço] ' + nomes.length + ' prestador(es) carregado(s):', nomes);
      return nomes;
    } catch (error) {
      console.error('❌ [renderPrestadoresDeServiço] Erro ao buscar fornecedores prestadores de serviço:', error);
      return [];
    }
  }

  async function carregarFuncionariosChamado() {
    console.log('⏳ [renderFuncionarios] Buscando funcionários...');
    try {
      const res = await runServerFunction('filtrarFuncionarios');
      if (!Array.isArray(res)) {
        console.log('⚠️ [renderFuncionarios] Resposta não é array:', res);
        return [];
      }
      const nomes = res.map(f => f.nome).filter(Boolean);
      console.log('✅ [renderFuncionarios] ' + nomes.length + ' funcionário(s) carregado(s):', nomes);
      return nomes;
    } catch (error) {
      console.error('❌ [renderFuncionarios] Erro ao buscar funcionários:', error);
      return [];
    }
  }

  function initSearchChamado(inputId, dropdownId, wrapperId, opcoes) {
    const input = document.getElementById(inputId);
    const dropdown = document.getElementById(dropdownId);
    const wrapper = document.getElementById(wrapperId);

    if (!input || !dropdown || !wrapper) return;

    const listaOpcoes = Array.isArray(opcoes) ? opcoes : [];

    function renderLista(filtro) {
      const f = (filtro || '').toLowerCase().trim();

      const itens = (f === '')
        ? listaOpcoes
        : listaOpcoes.filter(o => String(o).toLowerCase().includes(f));

      dropdown.innerHTML = '';

      if (itens.length === 0) {
        dropdown.innerHTML = '<div class="search-no-result" style="padding: 8px; color: #888;">Nenhum resultado -- pode digitar livremente</div>';
      } else {
        itens.forEach(o => {
          const div = document.createElement('div');
          div.className = 'search-option';
          div.textContent = o;

          div.addEventListener('mousedown', (e) => {
            e.preventDefault();
            input.value = o;
            input.dispatchEvent(new Event('input', { bubbles: true }));
            dropdown.classList.remove('visible', 'active');
          });
          dropdown.appendChild(div);
        });
      }
    }

    function abrirListaCompleta() {
      renderLista('');
      dropdown.classList.add('visible', 'active');
    }

    input.addEventListener('focus', abrirListaCompleta);
    input.addEventListener('click', abrirListaCompleta);

    input.addEventListener('input', () => {
      renderLista(input.value);
      dropdown.classList.add('visible', 'active');
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === 'Escape') {
        dropdown.classList.remove('visible', 'active');
      }
    });

    document.addEventListener('click', (e) => {
      if (!wrapper.contains(e.target)) {
        dropdown.classList.remove('visible', 'active');
      }
    });
  }

  // ===== SALVAR =====
  async function salvarChamado() {
    const selectMotivo = document.getElementById('chamadoMotivo')?.value || '';
    const motivo = selectMotivo === 'outro'
      ? document.getElementById('chamadoMotivoOutro')?.value.trim() || ''
      : selectMotivo;
    if (!motivo) {
      alert('Preencha o motivo do chamado.');
      return;
    }

    const tipo = document.getElementById('chamadoTipo')?.value || '';
    if (!tipo) {
      alert('Preencha o tipo do chamado.');
      return;
    }

    const patrimonio = document.getElementById('chamadoEquipPatrimonio')?.value.trim() || '';
    const localizacao = document.getElementById('chamadoEquipLocalizacao')?.value.trim() || '';

    if (!patrimonio && !localizacao) {
      alert('Informe pelo menos o Patrimônio ou a Localização do equipamento -- é o mínimo pra saber sobre qual equipamento é o chamado.');
      return;
    }


    let relatorioArquivo, notaFiscalArquivo;
    try {
      relatorioArquivo = await lerArquivoComoBase64(document.getElementById('chamadoRelatorioArquivo'));
      notaFiscalArquivo = await lerArquivoComoBase64(document.getElementById('chamadoNotaFiscalArquivo'));
    } catch (erroArquivo) {
      alert(erroArquivo.message);
      return;
    }

    const dadosChamado = {
      motivo: motivo,
      tipo: document.getElementById('chamadoTipo')?.value || '',
      classificacao: document.getElementById('chamadoClassificacao')?.value || '',
      abertoPor: document.getElementById('chamadoAbertoPor')?.value.trim() || '',
      atribuidoA: document.getElementById('chamadoAtribuidoA')?.value.trim() || '',
      descricao: document.getElementById('chamadoDescricao')?.value.trim() || '',
      patrimonio: patrimonio,
      localizacao: localizacao,
      marcaEquipamento: document.getElementById('chamadoEquipMarca')?.value.trim() || '',
      modelo: document.getElementById('chamadoEquipModelo')?.value.trim() || '',
      btus: document.getElementById('chamadoEquipBtus')?.value.trim() || '',
      relatorio: relatorioArquivo,
      notaFiscal: notaFiscalArquivo
    };

    if (typeof exibirModal === 'function') exibirModal('processando');

    try {
      const resposta = await runServerFunction('salvarChamadoBackend', dadosChamado);

      if (resposta && resposta.sucesso === false) {
        alert(resposta.mensagem);
        return;
      }

      alert(resposta.mensagem);
      trocarPagina('chamado-view');
    } catch (err) {
      console.error('Erro ao salvar chamado:', err);
      alert('Erro ao conectar com o servidor.');
    } finally {
      if (typeof fecharModal === 'function') fecharModal('processando');
    }
  }

  // ===== ANEXOS: lê um <input type="file"> e devolve {nome, tipo, base64}
  // pronto pra mandar pro servidor (google.script.run não aceita objetos
  // File/Blob do navegador direto -- só base64 como string mesmo). =====
  const CHAMADO_ANEXO_TAMANHO_MAX = 3 * 1024 * 1024; // 3MB -- acima disso o google.script.run fica instável pra mandar o base64 de uma vez só

  function removerAnexoChamado(inputId) {
    const input = document.getElementById(inputId);
    if (input) input.value = '';
  }

  function lerArquivoComoBase64(inputEl) {
    return new Promise((resolve, reject) => {
      if (!inputEl || !inputEl.files || inputEl.files.length === 0) {
        resolve(null);
        return;
      }
      const arquivo = inputEl.files[0];
      if (arquivo.size > CHAMADO_ANEXO_TAMANHO_MAX) {
        reject(new Error('O arquivo "' + arquivo.name + '" passa de 3MB.'));
        return;
      }
      const leitor = new FileReader();
      leitor.onload = () => {
        const base64 = String(leitor.result).split(',')[1] || '';
        resolve({ nome: arquivo.name, tipo: arquivo.type || 'application/octet-stream', base64: base64 });
      };
      leitor.onerror = () => reject(new Error('Erro ao ler o arquivo "' + arquivo.name + '".'));
      leitor.readAsDataURL(arquivo);
    });
  }

  function escapeHtmlChamado(s) {
    if (s == null) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
</script>
