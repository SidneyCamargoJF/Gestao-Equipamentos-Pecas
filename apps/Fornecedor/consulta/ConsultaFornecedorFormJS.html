<script>
  // Estado de ordenação exclusivo desta tela.
  let sortStateFornecedor = { coluna: null, direcao: 'asc' };

  // ===== RENDERIZAÇÃO INICIAL DA PÁGINA =====
  // Nome exigido pelo roteador da SPA (js/IndexSPAJS.html: trocarPagina).
  async function renderFornecedorView() {
    consultarFornecedores();

    const inputNome = document.getElementById('filtro-fornecedor-nome');
    if (inputNome) inputNome.focus();
  }

  // ===== CONSULTAR, FILTRAR E RENDERIZAR =====
  function consultarFornecedores() {
    const nome = document.getElementById('filtro-fornecedor-nome')?.value.trim() || '';
    const cnpj = document.getElementById('filtro-fornecedor-cnpj')?.value.trim() || '';
    const estado = document.getElementById('filtro-fornecedor-estado')?.value || '';
    const cidade = document.getElementById('filtro-fornecedor-cidade')?.value || '';

    // Um único campo de nome busca tanto em Razão Social quanto Nome Fantasia
    // (o backend filtra os dois com o mesmo texto e junta o resultado).
    const criterios = { cnpj, razaoSocial: nome, nomeFantasia: nome, estado, cidade };

    console.log('📤 [consultarFornecedores] Critérios enviados:', criterios);

    mostrarCarregandoFornecedores(true);

    google.script.run
      .withSuccessHandler((objFornecedores) => {
        mostrarCarregandoFornecedores(false);
        console.log('📥 [consultarFornecedores] Resposta bruta do servidor:', objFornecedores);
        console.log('📥 [consultarFornecedores] Quantidade recebida:', Array.isArray(objFornecedores) ? objFornecedores.length : 'não é array');
        ReturnFornecedores(objFornecedores);
      })
      .withFailureHandler((err) => {
        mostrarCarregandoFornecedores(false);
        console.error('❌ [consultarFornecedores] Erro ao consultar fornecedores:', err);
        alert('Erro ao consultar fornecedores: ' + (err.message || err));
      })
      .filtrarFornecedores(criterios);
  }

  function mostrarCarregandoFornecedores(carregando) {
    const btn = document.getElementById('btnConsultarFornecedores');
    if (btn) btn.disabled = carregando;

    if (carregando) {
      const tbody = document.getElementById('bodyFornecedoresView');
      if (tbody) {
        tbody.innerHTML = '<tr class="loading-row"><td colspan="7"><span class="spinner"></span>Buscando fornecedores...</td></tr>';
      }
    }
  }

  function ReturnFornecedores(objFornecedores) {
    fornecedores = Array.isArray(objFornecedores) ? objFornecedores : [];

    // O select de Estado só é populado uma vez, com a 1ª resposta (sem filtros
    // aplicados = dataset completo). Assim ele nunca fica refém do que o
    // usuário já filtrou, e só mostra estados que realmente existem na base.
    if (!estadosFornecedorCarregados) {
      popularSelectEstados(fornecedores);
      estadosFornecedorCarregados = true;
    }

    const estadoAtual = document.getElementById('filtro-fornecedor-estado')?.value || '';
    popularSelectCidades(estadoAtual);

    const listaOrdenada = aplicarOrdenacaoFornecedor(fornecedores);
    renderTabelaFornecedor(listaOrdenada);
  }

  // ===== SELECT DE ESTADO (apenas estados com fornecedor cadastrado) =====
  let estadosFornecedorCarregados = false;

  function popularSelectEstados(lista) {
    const selectEstado = document.getElementById('filtro-fornecedor-estado');
    if (!selectEstado) return;

    const estadoAtual = selectEstado.value;

    const estadosUnicos = Array.from(new Set(
      (lista || []).map(f => f.estado).filter(Boolean)
    )).sort((a, b) => a.localeCompare(b, 'pt-BR'));

    selectEstado.innerHTML = '<option value="">Todos</option>';
    estadosUnicos.forEach(estado => {
      const opt = document.createElement('option');
      opt.value = estado;
      opt.textContent = estado;
      selectEstado.appendChild(opt);
    });

    if (estadoAtual && estadosUnicos.includes(estadoAtual)) {
      selectEstado.value = estadoAtual;
    }
  }

  // ===== SELECT DE CIDADE EM CASCATA (depende do Estado escolhido) =====
  function atualizarCidadesPorEstado() {
    const estado = document.getElementById('filtro-fornecedor-estado')?.value || '';
    popularSelectCidades(estado);
    consultarFornecedores();
  }

  function popularSelectCidades(estado) {
    const selectCidade = document.getElementById('filtro-fornecedor-cidade');
    if (!selectCidade) return;

    const cidadeAtual = selectCidade.value;

    const cidadesDisponiveis = fornecedores
      .filter(f => !estado || String(f.estado || '').toUpperCase() === estado.toUpperCase())
      .map(f => f.cidade)
      .filter(Boolean);

    const cidadesUnicas = Array.from(new Set(cidadesDisponiveis)).sort((a, b) => a.localeCompare(b, 'pt-BR'));

    selectCidade.innerHTML = '<option value="">Todas</option>';
    cidadesUnicas.forEach(cidade => {
      const opt = document.createElement('option');
      opt.value = cidade;
      opt.textContent = cidade;
      selectCidade.appendChild(opt);
    });

    // Mantém a cidade selecionada se ela continuar disponível na lista nova.
    if (cidadeAtual && cidadesUnicas.includes(cidadeAtual)) {
      selectCidade.value = cidadeAtual;
    }
  }

  // ===== ORDENAÇÃO (própria, pra não colidir com a de Peças/Marca) =====
  function ordenarFornecedor(coluna) {
    if (sortStateFornecedor.coluna === coluna) {
      sortStateFornecedor.direcao = sortStateFornecedor.direcao === 'asc' ? 'desc' : 'asc';
    } else {
      sortStateFornecedor.coluna = coluna;
      sortStateFornecedor.direcao = 'asc';
    }
    atualizarIndicadoresFornecedor();
    renderTabelaFornecedor(aplicarOrdenacaoFornecedor(fornecedores));
  }

  function atualizarIndicadoresFornecedor() {
    const ths = document.querySelectorAll('#page-fornecedor-view .data-table th');
    ths.forEach(th => {
      th.classList.remove('sorted');
      const span = th.querySelector('.sort-arrow');
      if (span) span.textContent = '';
    });

    const indices = { razaoSocial: 0, nomeFantasia: 1, cnpj: 2, telefone: 3, email: 4, cidade: 5 };
    const idx = indices[sortStateFornecedor.coluna];
    if (idx !== undefined && ths[idx]) {
      ths[idx].classList.add('sorted');
      const span = ths[idx].querySelector('.sort-arrow');
      if (span) span.textContent = sortStateFornecedor.direcao === 'asc' ? '▲' : '▼';
    }
  }

  function aplicarOrdenacaoFornecedor(lista) {
    if (!sortStateFornecedor.coluna || !Array.isArray(lista)) return lista;
    const col = sortStateFornecedor.coluna;
    const dir = sortStateFornecedor.direcao === 'asc' ? 1 : -1;
    const arr = lista.slice();
    arr.sort((a, b) => {
      const va = String(a[col] || '').toLowerCase();
      const vb = String(b[col] || '').toLowerCase();
      return va < vb ? -1 * dir : va > vb ? 1 * dir : 0;
    });
    return arr;
  }

  // ===== RENDERIZAÇÃO DA TABELA =====
  function renderTabelaFornecedor(lista) {
    const tbody = document.getElementById('bodyFornecedoresView');
    if (!tbody) return;

    tbody.innerHTML = '';

    if (!lista || lista.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="7">Nenhum fornecedor encontrado com os filtros informados.</td></tr>';
      return;
    }

    lista.forEach(f => {
      const tr = document.createElement('tr');
      if (f.desativado) tr.classList.add('linha-desativada');

      const btnEditar = f.desativado
        ? '<button class="btn-acao btn-editar-linha" title="Editar" disabled style="opacity:0.3; cursor:not-allowed;">✏️</button>'
        : `<button class="btn-acao btn-editar-linha" title="Editar" onclick="editarFornecedor('${f.id}')">✏️</button>`;

      const btnExcluir = f.desativado
        ? '<button class="btn-acao btn-excluir-linha" title="Desativar" disabled style="opacity:0.3; cursor:not-allowed;">🗑️</button>'
        : `<button class="btn-acao btn-excluir-linha" title="Desativar" onclick="confirmarExclusaoFornecedor('${f.id}')">🗑️</button>`;

      tr.innerHTML = `
        <td>${escapeHtml(f.razaoSocial)} ${f.desativado ? '<span class="status-desativado">(Desativado)</span>' : ''}</td>
        <td>${escapeHtml(f.nomeFantasia)}</td>
        <td>${escapeHtml(f.cnpj)}</td>
        <td>${escapeHtml(f.telefone)}</td>
        <td>${escapeHtml(f.email)}</td>
        <td>${escapeHtml(f.cidade)}${f.estado ? '/' + escapeHtml(f.estado) : ''}</td>
        <td>
          ${btnEditar}
          ${btnExcluir}
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // ===== AÇÕES DA INTERFACE =====
  function limparFiltrosFornecedor() {
    if (document.getElementById('filtro-fornecedor-nome')) document.getElementById('filtro-fornecedor-nome').value = '';
    if (document.getElementById('filtro-fornecedor-cnpj')) document.getElementById('filtro-fornecedor-cnpj').value = '';
    if (document.getElementById('filtro-fornecedor-estado')) document.getElementById('filtro-fornecedor-estado').value = '';

    sortStateFornecedor = { coluna: null, direcao: 'asc' };
    atualizarIndicadoresFornecedor();
    consultarFornecedores();

    const inputNome = document.getElementById('filtro-fornecedor-nome');
    if (inputNome) inputNome.focus();
  }

  function editarFornecedor(id) {
    if (typeof trocarPagina === 'function') {
      trocarPagina('fornecedor-form', id);
    }
  }

  // ==== MODAL DE EXCLUSÃO (próprio de Fornecedor, ver apps/Modal/Modal.html) ====
  // Desativação persistente (soft-delete), mesmo padrão de desativarPeca().
  function confirmarExclusaoFornecedor(id) {
    if (!id) {
      alert('Erro: Nenhum registro selecionado.');
      return;
    }
    idExclusao = id;
    if (typeof exibirModal === 'function') exibirModal('modalExclusaoFornecedor');
  }

  async function executarExclusaoFornecedor() {
    if (idExclusao === null) return;

    if (typeof exibirModal === 'function') exibirModal('processando');

    try {
      const resposta = await runServerFunction('desativarFornecedor', idExclusao);

      if (resposta && resposta.sucesso === false) {
        alert(resposta.mensagem);
        return;
      }

      const fornecedor = fornecedores.find(f => String(f.id) === String(idExclusao));
      if (fornecedor) fornecedor.desativado = true;

      idExclusao = null;
      fecharModal('modalExclusaoFornecedor');
      renderTabelaFornecedor(aplicarOrdenacaoFornecedor(fornecedores));
    } catch (err) {
      console.error('Erro ao desativar fornecedor:', err);
      alert('Erro ao conectar com o servidor.');
    } finally {
      if (typeof fecharModal === 'function') fecharModal('processando');
    }
  }
</script>
