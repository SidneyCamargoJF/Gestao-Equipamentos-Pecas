<script>

function renderConsultaContratos() {
    consultarContratos();
}

let contratos = [];
let sortStateContrato = { coluna: null, direcao: 'asc' };

function consultarContratos() {
    const numero = document.getElementById('filtro-contrato-numero').value.trim();
    const contrato = document.getElementById('filtro-contrato-nome').value.trim();
    const sei = document.getElementById('filtro-contrato-sei').value.trim();
    const empresa = document.getElementById('empresaContratoSearch').value.trim();
    const situacao = document.getElementById('filtro-contrato-situacao').value.trim();

    const criterios = { numero, contrato, sei, empresa, situacao };

    mostrarCarregandoContratos(true);

    google.script.run
        .withSuccessHandler((objContratos) => {
            mostrarCarregandoContratos(false);
            ReturnContratos(objContratos);
        })
        .withFailureHandler((error) => {
            mostrarCarregandoContratos(false);
            console.error('Erro ao consultar contratos:', error);
            alert('Erro ao consultar contratos: ' + (error.message || error));
        })
        .filtrarContratos(criterios);
}

function mostrarCarregandoContratos(carregando) {
    const btn = document.getElementById('btnConsultarContratos');
    if (btn) btn.disabled = carregando;

    if (carregando) {
        const tbody = document.getElementById('contratosTableBody');
        if (tbody) {
            tbody.innerHTML = '<tr class="loading-row"><td colspan="10"><span class="spinner"></span>Buscando contratos...</td></tr>';
        }
    }
}

function ReturnContratos(objContratos) {
    contratos = Array.isArray(objContratos) ? objContratos : [];
    renderTabelaContrato(aplicarOrdenacaoContrato(contratos));
    atualizarResumoContratos(contratos);
}

function atualizarResumoContratos(lista) {
    const resumo = document.getElementById('resumoContratos');
    if (!resumo) return;

    if (!Array.isArray(lista) || lista.length === 0) {
        resumo.textContent = 'Nenhum contrato encontrado.';
        return;
    }

    let vencidos = 0, vencendo = 0;
    lista.forEach(c => {
        if (c.situacao === 'vencido') vencidos++;
        else if (c.situacao === 'vencendo') vencendo++;
    });

    resumo.textContent = `${lista.length} contrato${lista.length === 1 ? '' : 's'} encontrado${lista.length === 1 ? '' : 's'} — ${vencendo} vencendo, ${vencidos} vencido${vencidos === 1 ? '' : 's'}`;
}

function ordenarContrato(coluna) {
    if (sortStateContrato.coluna === coluna) {
        sortStateContrato.direcao = sortStateContrato.direcao === 'asc' ? 'desc' : 'asc';
    } else {
        sortStateContrato.coluna = coluna;
        sortStateContrato.direcao = 'asc';
    }
    atualizarIndicadoresContrato();
    renderTabelaContrato(aplicarOrdenacaoContrato(contratos));
}

function atualizarIndicadoresContrato() {
    const ths = document.querySelectorAll('#page-contratos-view .data-table th');
    ths.forEach(th => {
        th.classList.remove('sorted');
        const span = th.querySelector('.sort-arrow');
        if (span) span.textContent = '';
    });

    const indices = { numero: 1, contrato: 2, sei: 3, empresa: 4, valor: 5, dataInicial: 6, dataFinal: 7, situacao: 8 };
    const idx = indices[sortStateContrato.coluna];
    if (idx !== undefined && ths[idx]) {
        ths[idx].classList.add('sorted');
        const span = ths[idx].querySelector('.sort-arrow');
        if (span) span.textContent = sortStateContrato.direcao === 'asc' ? '▲' : '▼';
    }
}

const CONTRATO_SITUACAO_RANK = { vencido: 1, vencendo: 2, ativo: 3, encerrado: 4 };

function grupoOrdenacaoContrato(c) {
    return (c.desativado || c.situacao === 'encerrado') ? 1 : 0;
}

function aplicarOrdenacaoContrato(lista) {
    if (!Array.isArray(lista)) return lista;
    const col = sortStateContrato.coluna;
    const dir = sortStateContrato.direcao === 'asc' ? 1 : -1;
    const arr = lista.slice();
    arr.sort((a, b) => {
        const grupoA = grupoOrdenacaoContrato(a);
        const grupoB = grupoOrdenacaoContrato(b);
        if (grupoA !== grupoB) return grupoA - grupoB;

        if (!col) return 0; 

        let va, vb;
        if (col === 'situacao') {
            va = CONTRATO_SITUACAO_RANK[a.situacao] || 99;
            vb = CONTRATO_SITUACAO_RANK[b.situacao] || 99;
        } else if (col === 'valor') {
            va = Number(a.valor) || 0;
            vb = Number(b.valor) || 0;
            return (va - vb) * dir;
        } else if (col === 'dataInicial' || col === 'dataFinal') {
            va = a[col] ? new Date(a[col]).getTime() : 0;
            vb = b[col] ? new Date(b[col]).getTime() : 0;
            return (va - vb) * dir;
        } else {
            va = String(a[col] || '').toLowerCase();
            vb = String(b[col] || '').toLowerCase();
        }
        return va < vb ? -1 * dir : va > vb ? 1 * dir : 0;
    });
    return arr;
}

function limparFiltrosContrato() {
    document.getElementById('filtro-contrato-numero').value = '';
    document.getElementById('filtro-contrato-nome').value = '';
    document.getElementById('filtro-contrato-sei').value = '';
    document.getElementById('empresaContratoSearch').value = '';
    document.getElementById('filtro-contrato-situacao').value = '';
    sortStateContrato = { coluna: null, direcao: 'asc' };
    consultarContratos();
}

function formatarValorContrato(v) {
    const n = Number(v) || 0;
    return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function formatarDataContrato(d) {
    if (!d) return '--';
    const data = new Date(d);
    if (isNaN(data.getTime())) return String(d);
    return data.toLocaleDateString('pt-BR');
}

function formatarSituacaoContrato(s) {
    const map = { ativo: 'Ativo', vencendo: 'Vencendo', vencido: 'Vencido', encerrado: 'Encerrado' };
    return map[s] || s || '--';
}

function renderTabelaContrato(lista) {
    const tbody = document.getElementById('contratosTableBody');
    if (!tbody) return;

    tbody.innerHTML = '';

    if (!lista || lista.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="10">Nenhum contrato encontrado.</td></tr>';
        return;
    }

    lista.forEach(c => {
        const tr = document.createElement('tr');
        if (c.desativado) tr.classList.add('linha-desativada');
        if (c.situacao === 'encerrado') tr.classList.add('linha-contrato-encerrado');

        console.log('[DEBUG] renderTabelaContrato -- c.id:', c.id, '| typeof:', typeof c.id, '| contrato:', c.contrato);

        const btnEditar = c.desativado
            ? '<button class="btn-acao btn-editar-linha" title="Editar" disabled style="opacity:0.3; cursor:not-allowed;">✏️</button>'
            : `<button class="btn-acao btn-editar-linha" title="Editar" onclick="editarContrato('${c.id}')">✏️</button>`;

        const btnExcluir = c.desativado
            ? `<button class="btn-acao btn-reativar-linha" title="Reativar" onclick="reativarContratoUI('${c.id}')">♻️</button>`
            : `<button class="btn-acao btn-excluir-linha" title="Excluir" onclick="confirmarExclusaoContrato('${c.id}')">🗑️</button>`;

        tr.innerHTML = `
        <td class="acao-cell"><button class="btn-acao btn-ver-linha" title="Ver detalhes" onclick="abrirDetalhesContrato('${c.id}', '${c.situacao}')">👁️</button></td>
        <td>${escapeHtml(c.numero)}</td>
        <td>${c.contrato ? escapeHtml(c.contrato) : '--'}</td>
        <td>${c.sei ? escapeHtml(c.sei) : '--'}</td>
        <td>${c.empresa ? escapeHtml(c.empresa) : '--'}</td>
        <td>${formatarValorContrato(c.valor)}</td>
        <td>${formatarDataContrato(c.dataInicial)}</td>
        <td>${formatarDataContrato(c.dataFinal)}</td>
        <td><span class="situacao-badge ${c.situacao}">${formatarSituacaoContrato(c.situacao)}</span></td>
        <td class="acao-cell">
            ${btnEditar}
            ${btnExcluir}
        </td>
        `;
        tbody.appendChild(tr);
    });
}

function editarContrato(id) {
    console.log('[DEBUG] editarContrato recebeu id:', id, '| typeof:', typeof id);
    trocarPagina('contratos-form', id);
}

async function reativarContratoUI(id) {
    try {
        const resposta = await runServerFunction('reativarContrato', id);
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        consultarContratos();
    } catch (error) {
        console.error('Erro ao reativar contrato:', error);
        alert('Erro ao reativar contrato.');
    }
}

let contratoIdAtualModal = null;

async function abrirDetalhesContrato(contratoId, situacao) {
    contratoIdAtualModal = contratoId;

    const conteudo = document.getElementById('detalhesConteudo');
    if (conteudo) conteudo.innerHTML = '<p>Carregando...</p>';

    exibirModal('modalDetalhesContrato');

    try {
        const dados = await runServerFunction('buscarContratoParaEdicao', contratoId);
        conteudo.innerHTML = montarDetalheContratoHtml(dados, situacao);
        trocarSecaoDetalheContrato('complementares');
    } catch (error) {
        console.error('Erro em buscarContratoParaEdicao: ' + error.message);
        if (conteudo) conteudo.innerHTML = '<p>Erro ao carregar os detalhes do contrato.</p>';
    }
}

function montarDetalheContratoHtml(c, situacao) {
    const linha = (rotulo, valor) => `
        <div class="detalhe-contrato-linha">
            <span class="detalhe-contrato-rotulo">${rotulo}</span>
            <span class="detalhe-contrato-valor">${valor && String(valor).trim() ? escapeHtml(valor) : '--'}</span>
        </div>`;

    const secao = (titulo, conteudoHtml) => `
        <div class="detalhe-contrato-secao">
            <h4 class="detalhe-contrato-secao-titulo">${titulo}</h4>
            ${conteudoHtml}
        </div>`;

    // Lista de <li> ou, se vazia, um texto "nenhum item" -- usado pelos
    // blocos de Serviço/Equipamentos/Produtos/Checklist, que são sempre
    // arrays (às vezes vazios) vindos de buscarContratoParaEdicao.
    const lista = (itens, textoVazio, montarItem) =>
        (itens && itens.length)
            ? '<ul class="detalhe-contrato-lista">' + itens.map(montarItem).join('') + '</ul>'
            : `<p class="detalhe-contrato-vazio">${textoVazio}</p>`;

    const infoContrato = `
        ${linha('Número', c.numero)}
        ${linha('Empresa', c.empresa)}
        ${linha('Objeto', c.objeto)}
        <div class="detalhe-contrato-linha">
            <span class="detalhe-contrato-rotulo">Situação</span>
            <span class="detalhe-contrato-valor"><span class="situacao-badge ${situacao}">${formatarSituacaoContrato(situacao)}</span></span>
        </div>
    `;

    const complementaresHtml = `
        ${linha('SEI', c.sei)}
        ${linha('Gestor do Contrato', c.gestor)}
        ${linha('Contato na Empresa', c.contatoEmpresa)}
        ${linha('Telefone', c.telefone)}
        ${linha('E-mail', c.email)}
        ${linha('Data Inicial', formatarDataContrato(c.dataInicial))}
        ${linha('Data Final Prevista', formatarDataContrato(c.dataFinal))}
        ${linha('Data de Encerramento', formatarDataContrato(c.dataEncerramento))}
        ${linha('Valor', formatarValorContrato(c.valor))}
        ${linha('Observações', c.observacoes)}
    `;

    const servicosHtml = lista(c.servicos, 'Nenhum serviço cadastrado.', s => `
        <li><strong>${escapeHtml(s.servico)}</strong><br>Periodicidade: ${escapeHtml(s.periodicidade)}</li>`);

    const equipamentosHtml = lista(c.equipamentos, 'Nenhum equipamento vinculado.', e => `
        <li>
            <strong>${escapeHtml(e.equipamento)}</strong> — ${escapeHtml(e.marca)} ${escapeHtml(e.modelo)} (${escapeHtml(e.capacidade)})<br>
            Patrimônio: ${escapeHtml(e.patrimonio)} · Local: ${escapeHtml(e.localizacao)}
        </li>`);

    const produtosHtml = lista(c.produtos, 'Nenhum produto vinculado.', p => `<li>${escapeHtml(p.nome)}</li>`);

    const checklistMensal = (c.checklist || []).filter(i => i.periodo === 'mensal');
    const checklistAnual = (c.checklist || []).filter(i => i.periodo === 'anual');
    const itemChecklist = i => `<li>${escapeHtml(i.descricao)}</li>`;
    const checklistHtml = `
        <h5 class="detalhe-contrato-subtitulo">Mensal</h5>
        ${lista(checklistMensal, 'Nenhum item mensal.', itemChecklist)}
        <h5 class="detalhe-contrato-subtitulo">Anual</h5>
        ${lista(checklistAnual, 'Nenhum item anual.', itemChecklist)}
    `;

    console.log('[DEBUG] montarDetalheContratoHtml -- c.id:', c.id, '| typeof:', typeof c.id);

    const infoComEditar = `
        <div class="detalhe-contrato-secao">
            <div class="detalhe-contrato-secao-cabecalho">
                <h4 class="detalhe-contrato-secao-titulo">Informações Principais do Contrato</h4>
                <button type="button" class="btn-acao btn-editar-linha" title="Editar" onclick="fecharModal('modalDetalhesContrato'); editarContrato('${c.id}')">✏️</button>
            </div>
            ${infoContrato}
        </div>`;

    return (
        infoComEditar +
        '<div class="dock-detalhe">' +
            '<button type="button" class="dock-detalhe-btn" data-secao="complementares" onclick="trocarSecaoDetalheContrato(\'complementares\')">Complementares</button>' +
            '<button type="button" class="dock-detalhe-btn" data-secao="servicos" onclick="trocarSecaoDetalheContrato(\'servicos\')">Serviços</button>' +
            '<button type="button" class="dock-detalhe-btn" data-secao="equipamentos" onclick="trocarSecaoDetalheContrato(\'equipamentos\')">Equipamentos</button>' +
            '<button type="button" class="dock-detalhe-btn" data-secao="produtos" onclick="trocarSecaoDetalheContrato(\'produtos\')">Produtos</button>' +
            '<button type="button" class="dock-detalhe-btn" data-secao="checklist" onclick="trocarSecaoDetalheContrato(\'checklist\')">Checklist</button>' +
        '</div>' +
        `<div id="detalheSecao-complementares">${secao('Complementares', complementaresHtml)}</div>` +
        `<div id="detalheSecao-servicos">${secao('Serviço do Contrato', servicosHtml)}</div>` +
        `<div id="detalheSecao-equipamentos">${secao('Equipamentos Vinculados', equipamentosHtml)}</div>` +
        `<div id="detalheSecao-produtos">${secao('Produtos Vinculados', produtosHtml)}</div>` +
        `<div id="detalheSecao-checklist">${secao('Checklist', checklistHtml)}</div>`
    );
}

const SECOES_DETALHE_CONTRATO = ['complementares', 'servicos', 'equipamentos', 'produtos', 'checklist'];

function trocarSecaoDetalheContrato(nome) {
    SECOES_DETALHE_CONTRATO.forEach(s => {
        const div = document.getElementById('detalheSecao-' + s);
        if (div) div.classList.toggle('detalhe-secao-oculta', s !== nome);
    });

    document.querySelectorAll('.dock-detalhe-btn').forEach(btn => {
        btn.classList.toggle('dock-detalhe-btn-ativo', btn.dataset.secao === nome);
    });
}

let idContratoExclusao = null;

function confirmarExclusaoContrato(id) {
    idContratoExclusao = id;
    if (typeof exibirModal === 'function') exibirModal('modalExclusaoContrato');
}

async function executarExclusaoContrato() {
    if (!idContratoExclusao) return;
    try {
        const resposta = await runServerFunction('desativarContrato', idContratoExclusao);
        if (typeof fecharModal === 'function') fecharModal('modalExclusaoContrato');
        if (resposta && resposta.sucesso === false) {
            alert(resposta.mensagem);
            return;
        }
        consultarContratos();
    } catch (error) {
        console.error('Erro ao excluir contrato:', error);
        alert('Erro ao excluir contrato.');
    }
}

</script>
