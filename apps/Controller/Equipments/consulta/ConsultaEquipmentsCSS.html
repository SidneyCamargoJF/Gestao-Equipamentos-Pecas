<style>
  /* Reconstruída em grid (igual Chamados/Contrato) -- a versão anterior
     usava table-layout:fixed com largura por nth-child, calculada pra uma
     ordem de colunas antiga (quando "Ver" ainda era a 1ª coluna). Depois
     que "Ver" virou botão dentro de Ações e "Pat. Anterior" entrou, as
     colunas deslocaram e os nth-child passaram a mirar a coluna errada --
     daí o espremido/estourado. Com .gtable-* a largura é só uma lista na
     ordem de verdade, sem index mágico pra manter sincronizado.
     Larguras de coluna -- o resto (grid, hover, cantos arredondados,
     cabeçalho, linha vazia) vem das classes .gtable-* compartilhadas em
     css/tableCSS.html. */
  #tabelaEquipamentos {
    /* Patrimônio anterior saiu daqui -- só aparece no "Ver detalhes" agora. */
    grid-template-columns: 6rem 1.5fr 0.8fr 0.9fr 1fr 1.1fr 1.1fr 0.8fr 0.9fr 10rem;
    min-width: 74rem;
  }

  #tabelaEquipamentos .gtable-cell-end {
    gap: 0.5rem;
  }

  /* Estado/Garantia são badges -- centraliza pra ficar alinhado com o
     cabeçalho em vez de grudado na esquerda da coluna estreita. */
  #tabelaEquipamentos .gtable-row > .gtable-cell:nth-child(8),
  #tabelaEquipamentos .gtable-row > .gtable-cell:nth-child(9) {
    justify-content: center;
    text-align: center;
  }
</style>
