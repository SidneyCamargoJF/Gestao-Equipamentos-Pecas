<section id="page-equipments-form" class="spa-page">


  <div class="page-header">
    <div class="actions-bar">
      <h1 class="page-title" id="equipmentsFormTitulo">⚙️ Equipmentos</h1>
    </div>

      <!-- ============================================= -->
      <!-- BOTÕES DE AÇÃO                                -->
      <!-- ============================================= -->
    <div class="form-actions">
      <button type="button" class="btn-secondary"  onclick="trocarPagina('equipments-view')">Cancelar</button>
      <button type="button" class="btn btn-danger" onclick="limparFormularioEquipamento()">Limpar</button>
      <button type="button" class="btn-success"    onclick="salvarEquipamentoUI()" id="cadEquipSave">Salvar</button>
    </div>
  </div>

  <div class="card">
    <!-- HEADER -->
    <div class="form-header">
      <h2 class="form-titulo" id="formTitulo">Novo</h2>
      <!-- <span class="form-status" id="formStatus">Rascunho</span> --> 
    </div>

    <form autocomplete="off" onsubmit="return false;">
      <input type="text" id="cadEquipId" hidden value="0">

      <!-- ============================================= -->
      <!-- PARTE 1: INFORMAÇÕES PRINCIPAIS               -->
      <!-- ============================================= -->
      <fieldset class="fieldset-principal">
        <legend class="fieldset-legend">Informações Principais</legend>

        <div class="form-grid-3">

          <div class="field">
            <label class="field__label" for="cadEquipPatrimonio">Patrimonio</label>
            <input class="field__input" type="text" id="cadEquipPatrimonio" placeholder="patrimonio" required>
          </div>
        </div>

        <div class="form-grid-3">

          <div class="field">
            <label class="field__label" for="cadEquipNome">Nome *</label>
            <div class="search-wrapper" id="cadEquipNomeWrapper">
              <span class="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
              </span>
              <input class="search-input" type="text" id="cadEquipNome" placeholder="Ex: Ar-condicionado..." autocomplete="off" required oninput="atualizarUnidadeCapacidadeEquip()">
              <div class="search-dropdown" id="cadEquipNomeDropdown"></div>
            </div>
          </div>

          <div class="field-with-plus">
            <div class="field">
              <label class="field__label" for="cadEquipMarca">Marca *</label>
              <select id="cadEquipMarca" class="field__input field__select">
                <option value="">Carregando marcas...</option>
              </select>
            </div>
            <button type="button" class="btn-plus" title="Cadastrar nova marca" onclick="abrirModalCadastroMarca('equipamentos')">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>
          </div>

          <div class="field">
            <label class="field__label" for="cadEquipCapacidade">Capacidade <span id="cadEquipCapacidadeUnidade" style="font-weight:400; color:var(--color-slate-500,#64748b);"></span></label>
            <input class="field__input" type="text" id="cadEquipCapacidade" inputmode="numeric" oninput="this.value = aplicarMascaraMilharEquip(this.value)" required>
          </div>

        </div>

        <div class="form-grid-3">

          <div class="field">
            <label class="field__label" for="cadEquipModelo">Modelo</label>
            <input class="field__input" type="text" id="cadEquipModelo" placeholder="modelo" >
          </div>

          <div class="field">
            <label class="field__label" for="cadEquipSequencia">Sequencia</label>
            <input class="field__input" type="text" id="cadEquipSequencia" placeholder="55" >
          </div>

          <div class="field-with-plus">
            <div class="field">
              <label class="field__label" for="cadEquipLocalizacao">Localização</label>
              <select id="cadEquipLocalizacao" class="field__input field__select">
                <option value="">Carregando localizações...</option>
              </select>
            </div>
            <button type="button" class="btn-plus" title="Cadastrar nova localização" onclick="abrirModalCadastroLocalizacao('equipamentos')">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>
          </div>

        </div>

        <div class="form-grid-3">

          <div class="field-with-plus">
            <div class="field">
              <label class="field__label" for="cadEquipFornecedor">Fornecedor</label>
              <select id="cadEquipFornecedor" class="field__input field__select">
                <option value="">Carregando fornecedores...</option>
              </select>
            </div>
            <button type="button" class="btn-plus" title="Cadastrar novo fornecedor" onclick="abrirModalCadastroFornecedor('equipamentos')">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>
          </div>

        </div>

      </fieldset>

      <!-- ============================================= -->
      <!-- PARTE 2: INFORMAÇÕES COMPLEMENTARES           -->
      <!-- ============================================= -->
      <fieldset class="fieldset-principal">
        <legend class="fieldset-legend">Informações Complementares</legend>

        <div class="form-grid-3">

          <div class="field">
            <label class="field__label" for="cadEquipDataEntrada">Data de Entrada</label>
            <input class="field__input" type="date" id="cadEquipDataEntrada">
          </div>

          <div class="field">
            <label class="field__label" for="cadEquipNotaFiscal">Nota Fiscal</label>
            <input class="field__input" type="text" id="cadEquipNotaFiscal" placeholder="Ex: NF-12345">
          </div>

          <div class="field">
            <label class="field__label" for="cadEquipValorAquisicao">Valor de Aquisição (R$)</label>
            <input class="field__input" type="text" id="cadEquipValorAquisicao" placeholder="0,00" inputmode="numeric" oninput="this.value = aplicarMascaraMoedaEquip(this.value)">
          </div>

        </div>

        <div class="form-grid-3">

          <div class="field" style="grid-column: 1 / -1;">
            <label class="field__label" for="cadEquipObservacoes">Observações</label>
            <textarea class="field__input" id="cadEquipObservacoes" rows="3" placeholder="Observações gerais sobre o equipamento..."></textarea>
          </div>

        </div>
      </fieldset>

      <!-- ============================================= -->
      <!-- BOTÕES DE AÇÃO                                -->
      <!-- ============================================= -->
    <div class="form-actions">
      <button type="button" class="btn-secondary"  onclick="trocarPagina('equipments-view')">Cancelar</button>
      <button type="button" class="btn btn-danger" onclick="limparFormularioEquipamento()">Limpar</button>
      <button type="button" class="btn-success"    onclick="salvarEquipamentoUI()" id="cadEquipSave">Salvar</button>
    </div>
    </form>
  </div>
</section>
